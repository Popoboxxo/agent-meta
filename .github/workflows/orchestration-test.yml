name: Orchestration Tests

# Validiert Orchestrator-/Runtime-Verhalten und Template-Konsistenz.
# Konzept: docs/concepts/orchestrator-first-architecture.md (L3 — CI/CD Orchestration Tests)
#
# Measured baseline (run 40245389770, base main c858d18d):
#   - suite size: 6575 tests / 362 modules.
#   - the old `subprocess-serial` job was the critical path: 1864 s on 3.9 and
#     824 s on 3.12 for one 451-test list run under `-n 0`.
#   - the old three `test` shards measured 1007/501/102 s (3.9) and
#     1000/887/89 s (3.12). The imbalance is NOT test-count driven: 17 files
#     are setup-dominated by repo-copy fixtures. Those fixtures are
#     module-scoped, so pytest attributes their setup to the first test that
#     instantiates them; the measured 40-260 s is per fixture instantiation
#     (per module), not per test. Placement weights are per file.
#
# Structure now:
#   - `test` job: compatibility ceiling 3.12 x 3 shards, compatibility floor
#     3.9 x 1 shard. Each shard first runs its explicit
#     `HEAVY_FIXTURE_SHARD_<n>` slice (the 17 measured setup-dominated files,
#     disjoint per shard), then the remainder (`--splits 3`) with all 32
#     explicitly placed files (15 subprocess + 17 heavy-fixture) ignored.
#     The remainder is split by measured duration when `.test_durations` is
#     committed (`--splitting-algorithm=least_duration`) and by test count
#     otherwise.
#   - `subprocess-shard` job: the 15 sync.py-driving modules split into three
#     disjoint groups (78 / 183 / 190 tests), still `-n 0`, 3 parallel groups
#     per endpoint (3.9 and 3.12). The groups are module-disjoint, so no module
#     is spread across jobs and their subprocesses cannot stack up inside one
#     job. This is where the 3.9 floor is fully exercised.
#   - `refresh-durations`: manual (`workflow_dispatch`) producer of the
#     `.test_durations` baseline; uploads an artifact, never pushes.
#
# Runner-minute budget (measured on run 42488240635, main, 2026-11-08):
#   before: 15 jobs / 245 runner-minutes / 32.5 min wall. Long pole was
#   `test (3.12, 3)`, 32.2 min, against 20.4 min for shard 1 -- a count-split
#   artefact, not a work artefact. The 3.9 legs duplicated all six jobs
#   (106 runner-minutes) and `compat-311` spent 9.6 minutes on nine files.
#   This change: 3.9 keeps the subprocess groups + one test shard, the
#   `compat-311` nine-file set moves into the 3.9 `subprocess-shard` leg (the
#   TOML boundary that matters is `tomli` BELOW 3.11, so it is covered where it
#   can actually regress; 3.12 already exercises the `tomllib` branch), and the
#   shard split becomes duration-based once the baseline is present.
#
# Timeout budget (`timeout-minutes` is only a backstop; the per-subprocess
# timeouts in tests/timeouts.py are the real guard):
#   - `test` and `subprocess-shard`: 45. Both reached ~30 m 20 s at 97-99 % on
#     a loaded 3.12 runner (runs 41381909910 / 41491331808 / PR #1112), so the
#     old 30 min cancelled healthy runs. The shard job proved 45 works; the
#     `test` job hit the same wall at 97 % of shard 3/3 and gets the same room.
#   - `refresh-durations`: 120 (one full suite run, unserialised; the first
#     dispatch, run 42493197179, was cancelled at the old 60-minute ceiling).
#   - `changes` and `orchestration-gate`: 5.
#
# Why the heavy-fixture placement is explicit instead of duration-based:
#   no `.test_durations` baseline is committed, so `--splitting-algorithm
#   least_duration` would have nothing to learn from on a cold runner. The 17
#   files are placed by their measured setup bracket; everything else is still
#   split by test count (`--splits`, pytest-split default). Follow-up (not part
#   of this change): an optional `workflow_dispatch` job with
#   `--store-durations`, then switch to `--splitting-algorithm least_duration`
#   once the file is fresh.
#
# `-n auto` is banned everywhere: each worker copy spawns its own `sync.py`
# children and `sync.py --validate` runs the full repo-wide consistency suite,
# so `-n auto` multiplies concurrent sync.py runs with the host core count.
# CI uses `-n 2 --dist loadfile` (runner treated as 2 cores); `loadfile` keeps
# one test module per worker, so a module's subprocesses never interleave
# across workers mid-file. Workstation/shared-host runs cap at
# `-n 8 --dist loadfile`. Note: `loadfile` only guarantees this WITHIN one
# shard/job. The 32 explicitly placed files (15 subprocess + 17 heavy-fixture)
# are module-atomic: each runs in exactly one job. The count-based remainder
# can still spread one module across the three `test` shards (pytest-split
# splits items, not files), which duplicates its repo-copy fixtures per shard
# -- extra fixture work, no correctness impact.
#
# `sync.py --validate` deliberately runs in BOTH workflows:
#   - here in the `test` job ("Validate agent templates") on 3.9 and 3.12,
#     measured 12-38 s per call, covering the cross-version delta;
#   - in `validate.yml`'s `validate` job on 3.11 (55 s measured for the whole
#     job) together with the drift gate and the frontmatter lint.
# Neither copy is removed: the added cost is negligible and the cross-version
# coverage is real.

# Single source of truth for the explicit slice placement below. The `test`
# job validates the partition and derives its `--ignore` args from these six
# lists; `subprocess-shard` passes exactly one group as positional arguments.
# Never duplicate any of these lists in a second place.
env:
  SUBPROCESS_SHARD_1: >-
    tests/test_cli_smoke_multi_provider.py
    tests/test_doctor_cli.py
    tests/test_scan_staged.py
    tests/test_cleanup_preview_cli.py
    tests/test_platform_defaults_resolved_file.py
  SUBPROCESS_SHARD_2: >-
    tests/test_provider_matrix_sync.py
    tests/test_sync_validation_gate.py
    tests/test_unread_channels_removed.py
    tests/test_continue_prompts_active_set.py
    tests/test_opencode_positions.py
  SUBPROCESS_SHARD_3: >-
    tests/test_compact_matrix.py
    tests/test_knowledge_engine.py
    tests/test_context_profile_schema.py
    tests/test_provider_reactivation_artifacts.py
    tests/test_sharkord_service_name_migration.py
    tests/test_auto_commit_allowlist_pipeline.py

  HEAVY_FIXTURE_SHARD_1: >-
    tests/test_context_header_noise.py
    tests/test_context_anchors.py
    tests/test_ac01_render_identity.py
    tests/test_dispatch_depth_and_hard_cap.py
    tests/test_context_budget_checks.py
  HEAVY_FIXTURE_SHARD_2: >-
    tests/test_context_budgets.py
    tests/test_active_set_dangling.py
    tests/test_lazy_skills_channel.py
    tests/test_meta_optimizer_credentials.py
  HEAVY_FIXTURE_SHARD_3: >-
    tests/test_meta_optimizer_refill.py
    tests/test_meta_optimizer_runner.py
    tests/test_meta_optimizer_inactive_scope.py
    tests/test_meta_optimizer_applier.py
    tests/test_meta_optimizer_marks.py
    tests/test_meta_optimizer_fanout.py
    tests/test_migration_paths.py
    tests/test_opencode_v2_surface.py

# No trigger-level `paths:` filter: a path-filtered workflow never reports its
# checks on non-matching PRs, which would hang a required check on "Expected".
# The `changes` job decides in-job instead (plan W1-F / W2-D).
on:
  push:
    branches: [main]
  pull_request:
  # Manual refresh of the shard-balance baseline (`.test_durations`): runs the
  # full suite once with `--store-durations` and uploads the file as an
  # artifact. No token write scope is requested, so the file is committed by a
  # maintainer from the artifact/download-URL (see the job comment).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}"
  # Event-scoped groups; only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skips the test jobs only for PRs whose changed files are ALL docs
  # (docs/** or *.md, except CHANGELOG.md and VERSION). Main runs stay full.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant changes
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # A manual dispatch exists to refresh `.test_durations`; the sharded
            # suites would only duplicate that run and burn runner minutes.
            run=false
          elif [ "$EVENT" = "pull_request" ]; then
            files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
            # Fail safe: an empty/failed diff keeps the tests on.
            if [ -n "$files" ]; then
              run=false
              while IFS= read -r f; do
                case "$f" in
                  CHANGELOG.md|VERSION) run=true ;;
                  docs/*|*.md) ;;
                  *) run=true ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "run_tests=$run"
          echo "run_tests=$run" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    # Same backstop as `subprocess-shard`: a loaded 3.12 shard reached 30 m 19 s
    # at 97 % (run 41491331808) and was cancelled by the old 30 min ceiling.
    # Duration, not failure -- see the timeout budget in the header comment.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
        shard: [1, 2, 3]
        # Only the 3.12 leg runs all three shards. The 3.9 leg (compatibility
        # floor) keeps shard 1 of this job plus all three `subprocess-shard`
        # groups, where the runtime-sensitive work lives (sync.py children,
        # TOML/render paths). Measured saving: the two dropped legs were
        # 18.1 / 18.8 min of a 245 runner-minute run (run 42488240635).
        exclude:
          - python-version: '3.9'
            shard: 2
          - python-version: '3.9'
            shard: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      # One step that BOTH validates the explicit six-list partition and emits
      # the pytest args (a heredoc writing to $GITHUB_OUTPUT, no `eval`).
      # It fails the job loudly on a duplicate path, on a wrong union size
      # (15 subprocess / 17 heavy-fixture files) or on a missing file, so the
      # two suites can never silently drift apart.
      - name: Validate slice partition and build pytest args
        id: partition
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys

          shard = os.environ["SHARD"]

          subprocess_groups = [
              ("SUBPROCESS_SHARD_1", os.environ["SUBPROCESS_SHARD_1"].split()),
              ("SUBPROCESS_SHARD_2", os.environ["SUBPROCESS_SHARD_2"].split()),
              ("SUBPROCESS_SHARD_3", os.environ["SUBPROCESS_SHARD_3"].split()),
          ]
          heavy_groups = [
              ("HEAVY_FIXTURE_SHARD_1", os.environ["HEAVY_FIXTURE_SHARD_1"].split()),
              ("HEAVY_FIXTURE_SHARD_2", os.environ["HEAVY_FIXTURE_SHARD_2"].split()),
              ("HEAVY_FIXTURE_SHARD_3", os.environ["HEAVY_FIXTURE_SHARD_3"].split()),
          ]

          errors = []

          # a) collect all paths from the six env lists, b) reject duplicates.
          seen = {}
          for name, paths in subprocess_groups + heavy_groups:
              for path in paths:
                  seen.setdefault(path, []).append(name)
          for path, groups in sorted(seen.items()):
              if len(groups) > 1:
                  errors.append(f"duplicate path {path} in {' + '.join(groups)}")
          all_paths = list(seen)

          # c) the two unions must have the expected, fixed sizes.
          subprocess_union = {p for _n, paths in subprocess_groups for p in paths}
          heavy_union = {p for _n, paths in heavy_groups for p in paths}
          if len(subprocess_union) != 16:
              errors.append(
                  f"subprocess union is {len(subprocess_union)} entries, expected 16"
              )
          if len(heavy_union) != 17:
              errors.append(
                  f"heavy-fixture union is {len(heavy_union)} entries, expected 17"
              )

          # d) every listed path must be an existing file.
          for path in all_paths:
              if not pathlib.Path(path).is_file():
                  errors.append(f"listed path does not exist: {path}")

          heavy_lookup = dict(heavy_groups)
          heavy_key = f"HEAVY_FIXTURE_SHARD_{shard}"
          if heavy_key not in heavy_lookup:
              errors.append(f"unknown shard {shard!r} (expected 1, 2 or 3)")

          if errors:
              for error in errors:
                  print(f"ERROR: {error}", file=sys.stderr)
              sys.exit(1)

          # e) one --ignore per explicitly placed path (subprocess + heavy).
          ignore = " ".join(f"--ignore={path}" for path in all_paths)
          # f) this shard's heavy-fixture slice.
          heavy = " ".join(heavy_lookup[heavy_key])

          print(
              f"validated partition: {len(subprocess_union)} subprocess / "
              f"{len(heavy_union)} heavy-fixture / {len(all_paths)} placed paths"
          )
          print(f"heavy slice for shard {shard}: {heavy}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"ignore={ignore}\n")
              handle.write(f"heavy={heavy}\n")
          PY

      # The 17 measured setup-dominated files run as one explicit slice per
      # shard. Their cost is fixture setup (repo copies), not assertion time, so
      # more workers barely help; the point is that a count split no longer
      # scatters them across shards. The repo-copy/render fixtures are
      # module-scoped, so pytest attributes their setup to the first test that
      # instantiates them: the measured 40-260 s is per fixture instantiation
      # (per module), not per test. Placement weights are per file.
      - name: Run heavy-fixture slice (shard ${{ matrix.shard }}/3)
        run: >-
          python -m pytest ${{ steps.partition.outputs.heavy }}
          -q -n 2 --dist loadfile --durations=10 -ra

      # Everything not explicitly placed is split by measured duration when a
      # `.test_durations` baseline is present, and by test count otherwise
      # (`--splits`, pytest-split default). The baseline removes the count-split
      # imbalance: on run 42488240635 the count split produced 20.4 / 23.8 /
      # 32.2 min (3.12) -- 60 % spread with the long pole defining the whole
      # workflow. Refresh the file with the `refresh-durations` job (workflow
      # dispatch) after suite-size changes; a missing file keeps CI green on the
      # count split instead of failing.
      - name: Run remainder (shard ${{ matrix.shard }}/3, duration-balanced if baseline present)
        shell: bash
        run: |
          durations=()
          if [ -f .test_durations ]; then
            durations=(--durations-path=.test_durations --splitting-algorithm=least_duration)
            echo "Using .test_durations baseline ($(python -c 'import json,sys;print(len(json.load(open(".test_durations"))))') entries)."
          else
            echo "No .test_durations baseline -- falling back to count-based split."
          fi
          python -m pytest tests/ -q -n 2 --dist loadfile \
            ${{ steps.partition.outputs.ignore }} \
            "${durations[@]}" \
            --splits 3 --group ${{ matrix.shard }} \
            --durations=10 -ra

      # Repo-wide and expensive, and shard-independent, so run it once per
      # Python version (2x) instead of in all 6 shard jobs.
      # Measured 12-38 s per call -- negligible next to a shard's runtime, and
      # this is the only place the validate suite sees 3.9/3.12
      # (`validate.yml` runs it on 3.11 only). Keeping both copies is a
      # deliberate decision, not an oversight.
      - name: Validate agent templates
        if: matrix.shard == 1
        run: python scripts/sync.py --validate

  # These 15 modules drive `sync.py` through subprocesses; several run the
  # repo-wide `sync.py --validate` (full consistency suite) and some copy the
  # whole repo tree. `-n 0` keeps exactly one pytest process alive per job, so
  # their sync.py children cannot stack up on the assumed 2-core runner.
  #
  # The old single serial job was the CI critical path (1864 s on 3.9). The
  # three groups are module-disjoint -- the `test` job asserts the union is
  # exactly the same 15 files -- so splitting them across runners adds no
  # worker overlap and keeps the "two fully-tested endpoints" invariant.
  subprocess-shard:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    # 451 tests in total, but strictly serial per job. The timeout is only a
    # backstop -- the per-subprocess timeouts in tests/timeouts.py are the real
    # guard -- and three-way module-disjoint splitting keeps every group below
    # it. The serial whole measured 1864 s on 3.9; on a loaded 3.12 runner a
    # group reached 30 m 29 s at 99 % (runs 41491331808 / 41381909910, the last
    # test passed and the job was cancelled by this backstop), so it is 45 min.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run subprocess-heavy modules (group ${{ matrix.shard }}/3)
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            1) modules="$SUBPROCESS_SHARD_1" ;;
            2) modules="$SUBPROCESS_SHARD_2" ;;
            3) modules="$SUBPROCESS_SHARD_3" ;;
            *) echo "ERROR: unknown shard '$SHARD'" >&2; exit 1 ;;
          esac
          # An empty group would make pytest collect the whole repo (measured
          # 6364 collected / 23 collection errors) and burn the 30-min timeout
          # instead of failing fast.
          [ -n "$modules" ] || { echo "ERROR: empty module list for shard '$SHARD'" >&2; exit 1; }
          # Print the module list up front so a 15-min job is not blind.
          echo "Subprocess group $SHARD/3 on Python ${{ matrix.python-version }}:"
          for module in $modules; do
            echo "  $module"
          done
          python -m pytest $modules -n 0 -v --tb=short -ra --durations=10

      # The TOML boundary + code-hygiene set that used to be its own
      # `compat-311` job (9.6 min of a 245 runner-minute run, for nine files).
      # It belongs on the 3.9 leg: `tomli` is installed BELOW 3.11 and stdlib
      # `tomllib` from 3.11 on, so the branch that can actually regress is the
      # `tomli` one -- and 3.12 already exercises `tomllib` in the `test` job.
      # `-n 0` because two of the nine files launch sync.py repeatedly.
      - name: TOML boundary + code hygiene (3.9 only)
        if: matrix.python-version == '3.9' && matrix.shard == 1
        run: >-
          python -m pytest -q -n 0
          tests/test_toml_writer.py
          tests/test_provider_toml_transform.py
          tests/test_provider_matrix_sync.py
          tests/test_mcp_config.py
          tests/test_read_only_sandbox.py
          tests/test_reference_standards_strip.py
          tests/test_sync_validation_gate.py
          tests/test_python_compat_consistency.py
          tests/test_import_acyclicity.py

  # Shard-balance baseline (`.test_durations`). The `test` job switches to
  # `--splitting-algorithm=least_duration` as soon as this file exists, which is
  # the single biggest wall-clock lever: the count split produced
  # 20.4 / 23.8 / 32.2 min on run 42488240635, so the long pole defined the
  # whole workflow while two runners were already idle.
  #
  # Deliberately a separate, manual (`workflow_dispatch`) job:
  #   * it needs one complete suite run -- exactly the cost the sharded jobs
  #     avoid -- so it must not run per push/PR;
  #   * it uploads the file as an artifact instead of pushing it, keeping this
  #     workflow on `permissions: contents: read` (no write token in CI). Commit
  #     the artifact contents to `.test_durations` on main by hand;
  #   * a stale or missing baseline only affects balance, never pass/fail.
  # Refresh after a suite-size change (test modules added or removed).
  refresh-durations:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # One unserialised full suite on a 2-core runner. The first dispatch
    # (run 42493197179) was cancelled at exactly this ceiling, so 60 was too
    # tight: the same work spread over the three `test` shards already needs
    # ~60 min of runner time. 120 leaves headroom for a loaded runner.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run full suite and record per-test durations
        run: >-
          python -m pytest tests/ -q -n 2 --dist loadfile
          --store-durations --durations-path=.test_durations
          --durations=20 -ra

      - name: Upload baseline
        uses: actions/upload-artifact@v7
        with:
          name: test-durations
          path: .test_durations
          if-no-files-found: error

  # Single required check for this workflow. `if: always()` is mandatory: without
  # it a failed need makes the gate itself `skipped`, which counts as passed.
  orchestration-gate:
    needs: [changes, test, subprocess-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
