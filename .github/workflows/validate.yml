name: Validate Generated Files

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Run scenario suite
        run: bash tests/scenarios/run.sh

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml
      # The reachability checks (context.dangling-pointer, ERROR since task
      # 1.24) resolve lazy-skill pointers against the generated provider
      # directories, which are gitignored on self-hosting -- a fresh checkout
      # has no skills. Generate the output before checking it.
      - name: Generate sync output
        run: python scripts/sync.py
      # Drift gate: the working tree must not change. gitignored provider
      # outputs do not appear; a managed file that the sync regenerates
      # differently (e.g. a forgotten .gitignore or AGENTS.md update) does.
      - name: Check generated files are committed (drift gate)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Generated files are out of sync; run 'python scripts/sync.py' and commit the changes."
            exit 1
          fi
      - name: Validate sync output
        run: python scripts/sync.py --validate
      - name: Lint agent frontmatter
        run: |
          python3 -c "
          import yaml, sys
          from pathlib import Path
          errors = []
          for f in Path('agents').rglob('*.md'):
              txt = f.read_text()
              if txt.startswith('---'):
                  end = txt.find('\n---', 3)
                  if end != -1:
                      try: yaml.safe_load(txt[3:end])
                      except yaml.YAMLError as e: errors.append(f'{f}: {e}')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print(f'OK: {len(list(Path(\"agents\").rglob(\"*.md\")))} files checked')
          "
