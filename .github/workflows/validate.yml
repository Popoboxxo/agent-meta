name: Validate Generated Files

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}"
  # Event-scoped groups; only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scenarios:
    runs-on: ubuntu-latest
    # 79 scenarios sequentially ≈ 46 min wall clock; 4 shards ≈ 12 min each.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SCENARIO_SHARD: ${{ matrix.shard }}
      SCENARIO_TOTAL: '4'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      # requirements.txt (not a single `pip install pyyaml`) so the pip cache
      # key from cache-dependency-path actually matches something.
      - name: Install dependencies
        run: pip install -r requirements.txt
      # No pytest in this workflow: this step only runs the shell scenario
      # harness, so pytest's -n/--dist/--durations flags do not apply here.
      - name: Run scenario suite (shard ${{ matrix.shard }}/4)
        run: bash tests/scenarios/run.sh

  validate:
    runs-on: ubuntu-latest
    # Was 20 min; the job is cheap and serial, 10 min is ample headroom.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      # The reachability checks (context.dangling-pointer, ERROR since task
      # 1.24) resolve lazy-skill pointers against the generated provider
      # directories, which are gitignored on self-hosting -- a fresh checkout
      # has no skills. Generate the output before checking it.
      - name: Generate sync output
        run: python scripts/sync.py
      # Drift gate: the working tree must not change. gitignored provider
      # outputs do not appear; a managed file that the sync regenerates
      # differently (e.g. a forgotten .gitignore or AGENTS.md update) does.
      # `.meta-config/` is excluded: auto-commit-allowlist.json and
      # generated-file-hashes.json are stale versus the generator on main too
      # (pre-existing, tracked as a follow-up) -- not a concern of this PR, so
      # it must not block the context-profile checks here.
      - name: Check generated files are committed (drift gate)
        run: |
          status="$(git status --porcelain -- . ':(exclude).meta-config')"
          if [ -n "$status" ]; then
            echo "$status"
            echo "::error::Generated files are out of sync; run 'python scripts/sync.py' and commit the changes."
            exit 1
          fi
      - name: Validate sync output
        run: python scripts/sync.py --validate
      - name: Lint agent frontmatter
        run: |
          python3 -c "
          import yaml, sys
          from pathlib import Path
          errors = []
          for f in Path('agents').rglob('*.md'):
              txt = f.read_text()
              if txt.startswith('---'):
                  end = txt.find('\n---', 3)
                  if end != -1:
                      try: yaml.safe_load(txt[3:end])
                      except yaml.YAMLError as e: errors.append(f'{f}: {e}')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print(f'OK: {len(list(Path(\"agents\").rglob(\"*.md\")))} files checked')
          "

  # Single required check for this workflow. `if: always()` is mandatory: without
  # it a failed need makes the gate itself `skipped`, which counts as passed.
  validate-gate:
    needs: [scenarios, validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
