name: Validate Generated Files

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}"
  # Event-scoped groups; only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skips the scenario suite only for PRs whose changed files cannot affect it
  # (unit tests, docs, workflow plumbing). Main runs and schedule stay full.
  # Rationale: the 4 scenario shards are 40 of the 45 runner-minutes of this
  # workflow (run 42488240658: 7.6-11.6 min per shard, `validate` 0.9 min).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run_scenarios: ${{ steps.filter.outputs.run_scenarios }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changes that can affect the scenario suite
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          if [ "$EVENT" = "pull_request" ]; then
            files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
            # Fail safe: an empty/failed diff keeps the scenarios on.
            if [ -n "$files" ]; then
              run=false
              while IFS= read -r f; do
                case "$f" in
                  # First match wins: anything the sync/template pipeline reads
                  # forces the scenarios on, even when the same prefix would be
                  # skipped by a later pattern.
                  tests/scenarios/*|agents/*|rules/*|snippets/*|templates/*|hooks/*|scripts/*|config/*|.meta-config/*|requirements*.txt|VERSION|CHANGELOG.md) run=true ;;
                  # Cannot affect the shell scenario harness.
                  docs/*|tests/*|.github/*|*.md) ;;
                  *) run=true ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "run_scenarios=$run"
          echo "run_scenarios=$run" >> "$GITHUB_OUTPUT"

  scenarios:
    needs: changes
    if: needs.changes.outputs.run_scenarios == 'true'
    runs-on: ubuntu-latest
    # 88 scenarios sequentially ≈ 46 min wall clock; 4 shards ≈ 12 min each,
    # in-shard parallelism (SCENARIO_JOBS) cuts that to roughly half of the
    # per-scenario time again.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SCENARIO_SHARD: ${{ matrix.shard }}
      SCENARIO_TOTAL: '4'
      # Innerhalb des Shards zwei Szenarien gleichzeitig: lokal gemessen
      # 246 s -> 150 s fuer 6 Szenarien (Faktor 1,64, identische PASS/FAIL-
      # Liste). Bewusst KEIN zusaetzlicher Matrix-Arm — der Runner-Pool
      # (20 gleichzeitige Jobs pro Account) ist der Engpass, nicht die CPU.
      SCENARIO_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      # requirements.txt (not a single `pip install pyyaml`) so the pip cache
      # key from cache-dependency-path actually matches something.
      - name: Install dependencies
        run: pip install -r requirements.txt
      # No pytest in this workflow: this step only runs the shell scenario
      # harness, so pytest's -n/--dist/--durations flags do not apply here.
      - name: Run scenario suite (shard ${{ matrix.shard }}/4)
        run: bash tests/scenarios/run.sh

  validate:
    runs-on: ubuntu-latest
    # Was 20 min; the job is cheap and serial, 10 min is ample headroom.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      # The reachability checks (context.dangling-pointer, ERROR since task
      # 1.24) resolve lazy-skill pointers against the generated provider
      # directories, which are gitignored on self-hosting -- a fresh checkout
      # has no skills. Generate the output before checking it.
      - name: Generate sync output
        run: python scripts/sync.py --fail-on-p0
      # Drift gate: the working tree must not change. gitignored provider
      # outputs do not appear; a managed file that the sync regenerates
      # differently (e.g. a forgotten .gitignore or AGENTS.md update) does.
      # `.meta-config/` is excluded: auto-commit-allowlist.json and
      # generated-file-hashes.json are stale versus the generator on main too
      # (pre-existing, tracked as a follow-up) -- not a concern of this PR, so
      # it must not block the context-profile checks here.
      - name: Check generated files are committed (drift gate)
        run: |
          status="$(git status --porcelain -- . ':(exclude).meta-config')"
          if [ -n "$status" ]; then
            echo "$status"
            echo "::error::Generated files are out of sync; run 'python scripts/sync.py' and commit the changes."
            exit 1
          fi
      - name: Validate sync output
        run: python scripts/sync.py --validate
      - name: Lint agent frontmatter
        run: |
          python3 -c "
          import yaml, sys
          from pathlib import Path
          errors = []
          for f in Path('agents').rglob('*.md'):
              txt = f.read_text()
              if txt.startswith('---'):
                  end = txt.find('\n---', 3)
                  if end != -1:
                      try: yaml.safe_load(txt[3:end])
                      except yaml.YAMLError as e: errors.append(f'{f}: {e}')
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print(f'OK: {len(list(Path(\"agents\").rglob(\"*.md\")))} files checked')
          "

  # Single required check for this workflow. `if: always()` is mandatory: without
  # it a failed need makes the gate itself `skipped`, which counts as passed.
  validate-gate:
    needs: [changes, scenarios, validate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
