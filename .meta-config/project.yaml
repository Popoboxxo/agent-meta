agent-meta-version: 0.96.0
provider-isolation: disabled
ai-providers:
- Claude
- Opencode
- Mammouth
- Gemini
dod-preset: rapid-prototyping
rules-preset: lazy
systems-engineering:
  enabled: false
knowledge-engine:
  enabled: true
  domain: personal
  bundle-path: knowledge
  okf:
    enforce-frontmatter: true
    allowed-types:
    - note
    - journal
    auto-index: true
    auto-log: true
  operations:
    ingest:
      auto-cross-reference: false
      auto-index-update: true
      batch-mode: false
    query:
      file-back-results: true
    lint:
      schedule: on-demand
      checks:
      - broken-links
      - missing-frontmatter
  migration:
    auto-detect-sources: false
    clean-duplicates: false
    preserve-originals: true
  search:
    engine: index-only
    mcp-server: ''
  sources-dir: sources
  wiki-dir: wiki
  schema-language: auto
platforms:
- agent-meta
mcp-servers:
- honcho
- playwright
- reqogniloom
external-tools:
- graphify
roles:
- orchestrator
- developer
- junior-developer
- senior-developer
- requirements
- documenter
- git
- release
- meta-feedback
- ideation
- planner
- agent-meta-manager
- agent-meta-scout
- log-analyzer
- feedback
- code-reviewer
- concept-reviewer
- ui-ux-designer
- api-specialist
- design-system-architect
- frontend-component-engineer
- devops-engineer
- performance-optimizer
- explorer
- export-manager
- effort-estimator
- bug-feature-analyzer
- claude-expert
- gemini-expert
- opencode-expert
- continue-expert
- copilot-expert
- prompt-engineer
- e2e-tester
- principal-developer
- refactoring-specialist
- technical-writer
- tester
- validator
- accessibility-specialist
- data-engineer
- docker
- mammouth-expert
- knowledge-curator
- knowledge-ingestor
- knowledge-querier
- knowledge-linter
- knowledge-indexer
- knowledge-gardener
- knowledge-migrator
- dependency-auditor
- incident-responder
- intern-developer
project:
  name: agent-meta
  prefix: am
  short: agent-meta
hooks:
  dod-push-check:
    enabled: true
provider-options:
  Claude: {}
  Gemini: {}
  Continue:
    generate-prompts: true
    prompt-mode: slim
  Copilot: {}
  Mammouth: {}
  Opencode: {}
speech-mode: short
variables:
  PROJECT_NAME: agent-meta
  PROJECT_DESCRIPTION: Zentrales Meta-Repository für die Standardisierung und Wiederverwendung
    von Claude-Agenten-Rollen über alle Projekte hinweg.
  PROJECT_GOAL: Generische Agent-Templates bereitstellen, die via sync.py in Zielprojekte
    instanziiert werden. Einmal definieren, überall nutzen.
  PLATFORM: Python CLI (sync.py)
  RUNTIME: Python 3.x
  LANGUAGE: Python 3, Markdown, YAML
  PROJECT_LANGUAGES: Python, Markdown, YAML
  COMMUNICATION_LANGUAGE: Deutsch
  USER_INPUT_LANGUAGE: Deutsch
  DOCS_LANGUAGE: Englisch
  INTERNAL_DOCS_LANGUAGE: Deutsch
  CODE_LANGUAGE: Englisch
  AGENT_META_REPO: Popoboxxo/agent-meta
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/Popoboxxo/agent-meta
  GIT_MAIN_BRANCH: main
  SYSTEM_DEPENDENCIES: '- Python: `>=3.8`'
  SYSTEM_URLS: ''
  BUILD_COMMAND: python scripts/sync.py
  TEST_COMMAND: python3 scripts/sync.py --validate
  TEST_COMMANDS: python scripts/sync.py --dry-run && python scripts/sync.py --validate
  DEV_COMMANDS: 'python scripts/sync.py

    python scripts/sync.py --dry-run

    '
  DEV_STACK_START: (kein Dev-Stack)
  DEV_STACK_RELOAD: (kein Dev-Stack)
  PROJECT_CONTEXT: agent-meta ist ein Git-Repository das als Submodul in Projekte
    eingebunden wird. Es stellt standardisierte Claude-Agenten-Templates bereit (1-generic,
    2-platform, 0-external) und generiert via sync.py projektfertige Agenten-Dateien
    in .claude/agents/. Das Repo verwendet sich selbst — die hier generierten Agenten
    koordinieren die Weiterentwicklung von agent-meta.
  PROJECT_STRUCTURE: "agents/\n  0-external/       # Wrapper-Template für externe\
    \ Skills\n  1-generic/        # Universelle Agent-Templates\n  2-platform/   \
    \    # Plattform-Overrides (z.B. sharkord, homeassistant, agent-meta)\nscripts/\n\
    \  sync.py           # Agent-Generator\n  admin-server.py   # Lokaler Admin-UI\
    \ developer/)\nexternal/           # Git Submodule (externe Skill-Repos)\ndocs/guides/\
    \        # Anleitungen und Beispiel-Config\ndocs/ui/            # UI Assets\n\
    \  architecture/     # Architektur-Diagramme (Mermaid)\n  admin-ui.html     #\
    \ Admin-UI Frontend\ntests/              # Test-Suite (automated, manual, orchestration)\n"
  ENTRY_POINT_PATTERN: scripts/sync.py — Haupt-CLI für Agent-Generierung
  KEY_PATTERNS: '- Agent-Templates haben YAML-Frontmatter (name, version, description,
    tools)

    - Platzhalter {{VARIABLE}} werden von sync.py substituiert

    - Extensions (.claude/3-project/*-ext.md) werden vom Agenten zur Laufzeit gelesen

    - Snippet-Dateien haben eigenes YAML-Frontmatter (snippet, version, language,
    runtime)

    '
  ARCHITECTURE: "agents/\n  0-external/  1-generic/  2-platform/\nscripts/sync.py\
    \  scripts/admin-server.py\nsnippets/tester/ snippets/developer/\nexternal/<repo>/\n\
    tests/  docs/architecture/  docs/ui/admin-ui.html\n"
  CODE_CONVENTIONS: '- Python: PEP 8, snake_case, klare Funktionsnamen

    - Keine externen Python-Dependencies außer Stdlib

    - Markdown-Dateien: GitHub Flavored Markdown

    - YAML Frontmatter in allen Agent-Templates

    - Provider-Unterschiede im Syncer-Code über Config-Keys/Capability-Flags ausdrücken,
    nie über `if provider == "Name"` (siehe `provider-agnostic`-Skill)

    '
  EXTRA_DONTS: '- KEIN manuelles Bearbeiten von .claude/agents/ (generierter Output)

    - KEINE Breaking Changes ohne Major-Version-Bump

    - KEINE neuen Platzhalter ohne Eintrag in CLAUDE.md Variablen-Tabelle

    '
  CODE_QUALITY_RULES: '- sync.py muss nach jeder Änderung mit --dry-run fehlerfrei
    laufen

    - Alle neuen Platzhalter müssen in agent-meta.config.example.yaml dokumentiert
    sein

    - Änderungs-Workflow: Einfacher Wert -> project.yaml, Projektwissen -> 3-project-ext,
    Neue Rolle -> 1-generic, Neuer Skill -> sync.py --add-skill

    '
  TESTER_SNIPPETS_PATH: ''
  DEVELOPER_SNIPPETS_PATH: ''
  BUILD_COMMANDS: python scripts/sync.py
  REQ_CATEGORIES: '- Framework-Features (sync.py, neue Agenten-Rollen, Variablen)

    - Agenten-Templates (Workflows, Sprach-Sektionen, Versionierung)

    - Entwickler-Experience (Howto, Beispiele, Doku)

    '
  SERVICE_NAME: (kein Service)
  CONTAINER_NAME: (kein Container)
  PRIMARY_PORT: ''
  EXTRA_PORTS: ''
  DOCKER_STACKS_OVERVIEW: (kein Docker-Stack)
  EXTRA_VOLUMES: ''
  EXTRA_VOLUME_DEFINITIONS: ''
  EXTRA_ENV_VARS: ''
  EXTRA_STARTUP_INFO: ''
  HOST_LAN_IP: ''
  BUILD_OUTPUT: (kein Build-Artifact — generierter Output liegt im Zielprojekt)
  ARTIFACT_ZIP_CMD: ''
  ARTIFACT_TAR_CMD: ''
  GH_ASSETS: ''
  REQUIRED_BINARIES_SECTION: Keine externen Binaries erforderlich.
  BINARY_INSTALL_STEPS: ''
  ORCHESTRATOR_STRICT: true
  UNKNOWN_FALLBACK_META_FEEDBACK: true
  UNKNOWN_FALLBACK_MAIN_CHAT: true
  UNKNOWN_FALLBACK_ASK_USER: false
  REQUIRED_BINARY_NAMES: (keine)
  BUILD_SYSTEM_NOTES: sync.py generiert .claude/agents/ im Zielprojekt — kein Build-Artifact
    im Meta-Repo selbst.
  VERSION_DIST_BEHAVIOUR: 'Release: 1. version in Frontmatter erhöhen, 2. CHANGELOG.md
    aktualisieren, 3. VERSION + README.md setzen, 4. git commit & tag.'
  SE_MIN_DEPTH: 2
  SE_MAX_DEPTH: 6
  SE_MAX_CELLS: 20
  SE_MAX_CRITIC_ITERATIONS: 3
  SE_MAX_PARALLEL_CELLS: 4
  SE_BASE_DIR: SE
se-export:
  type: markdown
  output_dir: docs/se
se_output:
  base_dir: SE
  per_level_dirs: true
  per_system_dirs: true
test-repo:
  enabled: true
  path: ../agent-meta-test
  env-var: AGENT_META_TEST_REPO
max-parallel-agents: 4
context_file:
  mode: compact
  oversize_acknowledged: true
orchestrator:
  enabled: true
  strict: true
  direct-dispatch-enabled: true
  unknown-fallback:
    meta-feedback: true
    main-chat: true
    ask-user: false
  checkpointing: true
  native-extensions:
    enabled: true
  handoff:
    protocol: a2a-v1
  mode: strict
  provider-overrides:
    Claude:
      mode: main-chat
viz:
  enabled: false
  mode: 'off'
  event_log: .meta-viz/events.jsonl
  server:
    port: 8765
    timeout_sec: 300
  mcp:
    port: 9090
  report:
    retention_days: 7
    session_timeout_min: 5
admin-ui:
  enabled: true
  port: 7420
  auto-sync-on-save: false
  watch-config: false
analysis:
  enabled: false
quality-pipelines:
  overrides:
    se-cascade:
      # Deaktiviert seit 2026-09-03 — bewusste Entscheidung, siehe Issue #652.
      # Reaktivierung/Archivierung nur auf explizite Anfrage.
      enabled: false
  custom-pipelines: {}
model-override-all: {}
model-inherit-main-chat:
  Opencode: true
model-overrides:
  Gemini:
    knowledge-curator: gemini-2.0-flash-lite-preview-02-05
    knowledge-ingestor: gemini-2.0-flash-lite-preview-02-05
    knowledge-querier: gemini-2.0-flash-lite-preview-02-05
    knowledge-linter: gemini-2.0-flash-lite-preview-02-05
    knowledge-indexer: gemini-2.0-flash-lite-preview-02-05
    knowledge-gardener: gemini-2.0-flash-lite-preview-02-05
    knowledge-migrator: gemini-2.0-flash-lite-preview-02-05
reflection-pairs:
  overrides:
    dev-review-loop:
      max_iterations: 5
      enabled: true
tier-preset: Normal
provider-deactivation:
  enabled: false
  mode: all
  backup-dir: .backup/provider-deactivation
backup:
  enabled: true
  dir: .backup/agent-meta
  retention:
    max_backups: 10
    max_age_days: 30
  auto-backup-before-sync: false
environments: {}
model-source-preference:
  Claude: modelsdev
  Opencode: modelsdev
se-focus: false
debug-mode: false
allow-committed-secrets: false
rules: {}
conventions-preset: default
