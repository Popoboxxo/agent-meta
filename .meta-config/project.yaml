# agent-meta verwendet sich selbst — kein Sharkord, kein Docker-Stack, kein Build-System.
# Schema-Validierung: agent-meta.schema.json (JSON Schema bleibt JSON — IDE-Standard)

agent-meta-version: 0.55.1

# agent-meta manages all provider directories itself (1-generic, 2-platform, etc.)
# Provider isolation must be disabled here — the meta-repo intentionally
# reads and writes all provider directories during sync.
provider-isolation: enabled

ai-providers:
  - Claude
  - Continue
  - Gemini
  - Opencode

dod-preset: rapid-prototyping
rules-preset: silent

systems-engineering:
  enabled: true

platforms:
  - agent-meta

roles:
  - orchestrator
  - developer
  - requirements
  - documenter
  - git
  - release
  - meta-feedback
  - ideation
  - agent-meta-manager
  - feature
  - agent-meta-scout
  - log-analyzer
  - feedback
  - se-requirements
  - se-architect
  - se-critic
  - se-interface-mgr
  - se-termination
  - se-orchestrator
  - se-test-engineer
  - se-testreviewer
  - se-verifier
  - se-validator
  - se-integration-and-test-manager
  - code-reviewer
  - ui-ux-designer
  - api-specialist
  - devops-engineer
  - performance-optimizer
  - export-manager
  - bug-feature-analyzer
  - claude-expert
  - gemini-expert
  - opencode-expert
  - continue-expert
  - copilot-expert

# Architektur-Policy: Generische Agenten muessen provider-agnostisch bleiben.
# Siehe rules/1-generic/provider-agnostic.md — Provider-Namen, Tool-Syntax und
# API-Details duerfen NIE in 1-generic/ stehen. Provider-Spezifika gehoehren
# in 2-platform/ oder werden vom Sync-Prozess generiert.
project:
  name: agent-meta
  prefix: am
  short: agent-meta

hooks:
  dod-push-check:
    enabled: true

# Provider-spezifische Optionen — pro Provider konfigurierbar
provider-options:
  Claude: {}
  Gemini: {}
  Continue:
    generate-prompts: true
    prompt-mode: full

# Kommunikationsstil aller Agenten: 'full' (Default), 'short', 'childish', 'caveman', "asozial", "submissive"
speech-mode: short

variables:
  PROJECT_NAME: agent-meta
  PROJECT_DESCRIPTION: >-
    Zentrales Meta-Repository für die Standardisierung und Wiederverwendung von
    Claude-Agenten-Rollen über alle Projekte hinweg.
  PROJECT_GOAL: >-
    Generische Agent-Templates bereitstellen, die via sync.py in Zielprojekte instanziiert werden.
    Einmal definieren, überall nutzen.
  PLATFORM: Python CLI (sync.py)
  RUNTIME: Python 3.x
  LANGUAGE: "Python 3, Markdown, YAML"
  PROJECT_LANGUAGES: "Python, Markdown, YAML"
  COMMUNICATION_LANGUAGE: Deutsch
  USER_INPUT_LANGUAGE: Deutsch
  DOCS_LANGUAGE: Englisch
  INTERNAL_DOCS_LANGUAGE: Deutsch
  CODE_LANGUAGE: Englisch
  AGENT_META_REPO: Popoboxxo/agent-meta
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/Popoboxxo/agent-meta
  GIT_MAIN_BRANCH: main
  SYSTEM_DEPENDENCIES: "- Python: `>=3.8`"
  SYSTEM_URLS: ""
  BUILD_COMMAND: python scripts/sync.py
  TEST_COMMAND: python scripts/sync.py --validate
  TEST_COMMANDS: python scripts/sync.py --dry-run && python scripts/sync.py --validate
  DEV_COMMANDS: |
    python scripts/sync.py
    python scripts/sync.py --dry-run
  DEV_STACK_START: "(kein Dev-Stack)"
  DEV_STACK_RELOAD: "(kein Dev-Stack)"
  PROJECT_CONTEXT: >-
    agent-meta ist ein Git-Repository das als Submodul in Projekte eingebunden wird.
    Es stellt standardisierte Claude-Agenten-Templates bereit (1-generic, 2-platform, 0-external)
    und generiert via sync.py projektfertige Agenten-Dateien in .claude/agents/.
    Das Repo verwendet sich selbst — die hier generierten Agenten koordinieren die
    Weiterentwicklung von agent-meta.
  PROJECT_STRUCTURE: |
    agents/
      0-external/       # Wrapper-Template für externe Skills
      1-generic/        # Universelle Agent-Templates
      2-platform/       # Plattform-Overrides (z.B. sharkord)
    scripts/
      sync.py           # Agent-Generator
    snippets/           # Sprachspezifische Code-Snippets
    external/           # Git Submodule (externe Skill-Repos)
    howto/              # Anleitungen und Beispiel-Config
    docs/architecture/  # Architektur-Diagramme (Mermaid)
  ENTRY_POINT_PATTERN: "scripts/sync.py — Haupt-CLI für Agent-Generierung"
  KEY_PATTERNS: |
    - Agent-Templates haben YAML-Frontmatter (name, version, description, tools)
    - Platzhalter {{VARIABLE}} werden von sync.py substituiert
    - Extensions (.claude/3-project/*-ext.md) werden vom Agenten zur Laufzeit gelesen
    - Snippet-Dateien haben eigenes YAML-Frontmatter (snippet, version, language, runtime)
  ARCHITECTURE: |
    agents/
      0-external/  1-generic/  2-platform/
    scripts/sync.py
    snippets/tester/ snippets/developer/
    external/<repo>/
  CODE_CONVENTIONS: |
    - Python: PEP 8, snake_case, klare Funktionsnamen
    - Keine externen Python-Dependencies außer Stdlib
    - Markdown-Dateien: GitHub Flavored Markdown
    - YAML Frontmatter in allen Agent-Templates
  EXTRA_DONTS: |
    - KEIN manuelles Bearbeiten von .claude/agents/ (generierter Output)
    - KEINE Breaking Changes ohne Major-Version-Bump
    - KEINE neuen Platzhalter ohne Eintrag in CLAUDE.md Variablen-Tabelle
  CODE_QUALITY_RULES: |
    - sync.py muss nach jeder Änderung mit --dry-run fehlerfrei laufen
    - Alle neuen Platzhalter müssen in agent-meta.config.example.yaml dokumentiert sein
  TESTER_SNIPPETS_PATH: ""
  DEVELOPER_SNIPPETS_PATH: ""
  BUILD_COMMANDS: python scripts/sync.py
  REQ_CATEGORIES: |
    - Framework-Features (sync.py, neue Agenten-Rollen, Variablen)
    - Agenten-Templates (Workflows, Sprach-Sektionen, Versionierung)
    - Entwickler-Experience (Howto, Beispiele, Doku)
  SERVICE_NAME: "(kein Service)"
  CONTAINER_NAME: "(kein Container)"
  PRIMARY_PORT: ""
  EXTRA_PORTS: ""
  DOCKER_STACKS_OVERVIEW: "(kein Docker-Stack)"
  EXTRA_VOLUMES: ""
  EXTRA_VOLUME_DEFINITIONS: ""
  EXTRA_ENV_VARS: ""
  EXTRA_STARTUP_INFO: ""
  HOST_LAN_IP: ""
  BUILD_OUTPUT: "(kein Build-Artifact — generierter Output liegt im Zielprojekt)"
  ARTIFACT_ZIP_CMD: ""
  ARTIFACT_TAR_CMD: ""
  GH_ASSETS: ""
  REQUIRED_BINARIES_SECTION: Keine externen Binaries erforderlich.
  BINARY_INSTALL_STEPS: ""
  ORCHESTRATOR_STRICT: true
  UNKNOWN_FALLBACK_META_FEEDBACK: true
  UNKNOWN_FALLBACK_MAIN_CHAT: true
  UNKNOWN_FALLBACK_ASK_USER: false 

  REQUIRED_BINARY_NAMES: "(keine)"
  BUILD_SYSTEM_NOTES: >-
    sync.py generiert .claude/agents/ im Zielprojekt —
    kein Build-Artifact im Meta-Repo selbst.
  VERSION_DIST_BEHAVIOUR: Keine Dist. Releases sind Git-Tags auf main.
  SE_MAX_DEPTH: 5
  SE_MAX_CELLS: 20
  SE_MAX_CRITIC_ITERATIONS: 3
  SE_MAX_PARALLEL_CELLS: 4

se-export:
  type: markdown
  output_dir: docs/se

# Test-Repository — Validierung der generierten Agenten nach Sync
test-repo:
  enabled: true
  path: "../agent-meta-test"
  env-var: "AGENT_META_TEST_REPO"

max-parallel-agents: 4

# Lifecycle-Hooks — getriggert durch Git-Events (Merge, Release-Tag, Version-Bump).
# Der lifecycle-check Hook liest diese Konfiguration und erzeugt .opencode/pending-tasks.md.
#lifecycle-triggers:
#  on-release:
#    - agent: se-validator
#      task: "Post-Release Sanity-Check: Validiere das System (L1) gegen Stakeholder-Bedürfnisse und führe End-to-End User Journeys durch."
#  on-merge:
#    - agent: code-reviewer
#      task: "Post-Merge Blast-Radius-Analyse: Prüfe betroffene Code-Pfade auf Clean-Code-Verletzungen und REQ-Traceability."

# Orchestrator-First Architecture (Beta v3.0.0)
# Steuert das Verhalten des Orchestrator-Delegations-Systems.
orchestrator:
  enabled: true        # true = Orchestrator aktiv, false = Main-Chat-Modus
  strict: true         # true = Immer delegieren, false = Fallback erlaubt
  unknown-fallback:
    meta-feedback: true   # Send anonymized feedback to agent-meta
    main-chat: true       # Allow main chat to handle the task
    ask-user: false       # Ask user for preference

# Visualisierung — Agenten-Mindmap und Session-Tracking
viz:
  enabled: true
  mode: "full"
  event_log: ".meta-viz/events.jsonl"
  report:
    retention_days: 7
    session_timeout_min: 5
  server:
    port: 8765
    timeout_sec: 300

# XML Section Wrapping — wraps Markdown ## sections in XML tags for better LLM parsing
xml-section-wrapping:
  enabled: true

# Critical Rules Footer — appends critical rules to end of generated agent files
critical-rules-footer:
  enabled: true

# Path-based Contextual Rules — inject rules based on file path patterns
pathRules:
  - path: "*.py"
    rule: "python-conventions"
    agents:
      - developer

quality-pipelines:
  overrides:
    standard-feature:
      stages:
        review:
          loop:
            max_iterations: 5
    se-cascade:
      enabled: false
  custom-pipelines:
    security-hotfix:
      stages:
        - id: detect
          agent: security-auditor
          task: "Vulnerability analysieren"
          mode: sequential
        - id: fix
          agent: developer
          task: "Fix implementieren"
          mode: sequential
        - id: verify
          agent: tester
          task: "Regression-Tests"
          mode: sequential

reflection-pairs:
  overrides:
    dev-review-loop:
      max_iterations: 5
      enabled: true