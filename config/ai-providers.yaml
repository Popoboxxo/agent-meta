providers:
  Claude:
    agents_dir: .claude/agents
    agent_ext: .md
    context_file: CLAUDE.md
    context_template: howto/configs/CLAUDE.project-template.md
    has_rules: true
    has_hooks: true
    has_commands: true
    has_settings: true
    settings_file: .claude/settings.json
    isolation-dirs:
      - .claude/
      - CLAUDE.md
    gitignore_entries:
      - .claude/settings.local.json
      - .claude/agent-memory-local/
      - .claude/pending-tasks.md
      - CLAUDE.personal.md
      - sync.log
      - .mcp.json
    mcp-config:
      committed-file: .claude/settings.json
      secrets-file: .claude/settings.local.json
      format: claude-settings
    # Provider-specific directories for multi-provider orchestration
    skills_dir: .claude/skills
    snippets_dir: .claude/snippets
    pending_tasks_file: .claude/pending-tasks.md
    extension_dir: .claude/3-project
    # Model tiers: abstract tier name → provider-specific model ID.
    # Agents use tier names (nano/fast/balanced/powerful/max) in role-defaults.yaml.
    # sync.py maps each tier to the model ID written into agent frontmatter.
    model-tiers:
      nano:     claude-haiku-4-5-20251001   # cheapest, high-throughput tasks
      fast:     claude-haiku-4-5-20251001   # quick ops: git, meta-feedback, docker
      balanced: claude-sonnet-4-6           # default workhorse: dev, docs, review
      powerful: claude-opus-4-7             # complex reasoning: architecture, security
      max:      claude-opus-4-7             # reserved for future ultra-capable models
    # Backward-compat aliases (haiku/sonnet/opus still work in model-overrides)
    model-aliases:
      haiku:  claude-haiku-4-5-20251001
      sonnet: claude-sonnet-4-6
      opus:   claude-opus-4-7

  Gemini:
    agents_dir: .gemini/agents
    agent_ext: .md
    context_file: .gemini/GEMINI.md
    context_template: howto/configs/GEMINI.project-template.md
    has_rules: true
    rules_dir: .gemini/rules
    has_hooks: true
    hooks_dir: .gemini/hooks
    has_commands: true
    commands_dir: .gemini/commands
    commands_ext: .toml
    has_settings: true
    settings_file: .gemini/settings.json
    settings_template: howto/configs/GEMINI.settings-template.json
    isolation-dirs:
      - .gemini/
    gitignore_entries:
      - .gemini/settings.local.json
    mcp-config:
      committed-file: .gemini/settings.json
      secrets-file: .gemini/settings.local.json
      format: gemini-settings
    skills_dir: .gemini/skills
    snippets_dir: .gemini/snippets
    pending_tasks_file: .gemini/pending-tasks.md
    extension_dir: .gemini/3-project
    model-tiers:
      nano:     gemini-2.5-flash            # ultra-fast, low-cost tasks
      fast:     gemini-2.5-flash            # quick ops: git, formatting
      balanced: gemini-2.5-pro              # reasoning + code (default)
      powerful: gemini-2.5-pro              # same model, Gemini has no separate "opus"
      max:      gemini-2.5-pro              # reserved for future Gemini Ultra
    model-aliases: {}

  Opencode:
    agents_dir: .opencode/agents
    agent_ext: .md
    context_file: AGENTS.md
    context_template: howto/configs/OPENCODE.project-template.md
    has_rules: false         # Rules have no native dir in opencode — embedded into AGENTS.md
    has_hooks: false
    has_commands: true
    commands_dir: .opencode/commands
    has_settings: true
    settings_file: opencode.json
    settings_template: howto/configs/OPENCODE.settings-template.json
    isolation-dirs:
      - .opencode/
      - opencode.json
      - AGENTS.md
    gitignore_entries:
      - AGENTS.personal.md
      - .opencode/settings.local.json
    mcp-config:
      committed-file: opencode.json
      secrets-file: .opencode/mcp.local.json
      format: opencode-json
    skills_dir: .opencode/skills
    snippets_dir: .opencode/snippets
    pending_tasks_file: .opencode/pending-tasks.md
    extension_dir: .opencode/3-project
    # opencode-go model IDs — format: opencode-go/<model-id>
    # Full list: https://opencode.ai/docs/go/
    #
    # Tier-to-model rationale (based on strength profiles + cost):
    #   nano/fast → DeepSeek V4 Flash   : fastest+cheapest, ideal for routing & simple ops (31,650 req/5h)
    #   balanced  → Qwen 3.6 Plus       : balanced tool-calling, stable agent loops, low dropout (3,300 req/5h)
    #   powerful  → DeepSeek V4 Pro      : frontier-level reasoning, complex algorithms, architecture (3,450 req/5h)
    #   max       → Kimi K2.6           : surgical code editing, 256k context, strict pattern adherence (1,150 req/5h)
    #
    # Additional models available via model-overrides in project.yaml:
    #   opencode-go/qwen3.5-plus          — budget tool-caller, legacy deployments (10,200 req/5h)
    #   opencode-go/kimi-k2.5             — cost-sensitive RAG pipelines, simpler edits (1,850 req/5h)
    #   opencode-go/glm-5.1               — MIT-licensed, 600+ loop stability, enterprise agents (880 req/5h)
    #   opencode-go/glm-5                 — text-only fallback, not recommended for coding (1,150 req/5h)
    #   opencode-go/mimo-v2.5-pro         — extreme endurance (>1000 tool calls), greenfield apps (1,290 req/5h)
    #   opencode-go/mimo-v2.5             — fast iterations in MiMo ecosystem (2,150 req/5h)
    #   opencode-go/minimax-m2.7          — multi-agent collab, native Office doc generation (3,400 req/5h)
    #   opencode-go/minimax-m2.5          — text-based RAG, cheapest non-flash option (6,300 req/5h)
    model-tiers:
      nano:     opencode-go/deepseek-v4-flash   # fastest & cheapest: routing, batch, throughput
      fast:     opencode-go/deepseek-v4-flash   # quick ops: git, meta-feedback, formatting
      balanced: opencode-go/qwen3.6-plus        # balanced tool-calling: dev execution, review, docs
      powerful: opencode-go/deepseek-v4-pro     # frontier reasoning: architecture, complex algorithms, security
      max:      opencode-go/kimi-k2.6           # surgical code editing: 256k context, strict conventions
    model-aliases:
      flash:  opencode-go/deepseek-v4-flash
      qwen:   opencode-go/qwen3.6-plus
      kimi:   opencode-go/kimi-k2.6
      deepseek-pro: opencode-go/deepseek-v4-pro
      glm:    opencode-go/glm-5.1
      mimo:   opencode-go/mimo-v2.5-pro
      minimax: opencode-go/minimax-m2.7

  Continue:
    agents_dir: .continue/agents
    agent_ext: .md
    context_file: .continue/rules/project-context.md
    context_template: howto/configs/CONTINUE.project-template.md
    has_rules: true
    rules_dir: .continue/rules
    has_hooks: false
    has_commands: true
    has_settings: true
    settings_file: .continue/config.yaml
    settings_template: howto/configs/CONTINUE.config-template.yaml
    isolation-dirs:
      - .continue/
    gitignore_entries:
      - .continue/settings.local.yaml
    mcp-config:
      committed-file: .continue/config.yaml
      secrets-file: .continue/config.local.yaml
      format: continue-yaml
    # Continue supports both local (Ollama) and API models.
    # Tier mapping targets Claude API via Continue's Anthropic provider for cloud tiers,
    # and local Ollama models for nano/fast. Override in project.yaml if needed.
    model-tiers:
      nano:     codellama:7b             # fast & local (Ollama)
      fast:     codellama:7b             # quick ops: git, meta-feedback
      balanced: claude-sonnet-4-6        # default workhorse via Anthropic API
      powerful: claude-opus-4-7          # complex reasoning via Anthropic API
      max:      claude-opus-4-7          # reserved for future ultra-capable models
    model-aliases:
      local:  codellama:7b
      sonnet: claude-sonnet-4-6
      opus:   claude-opus-4-7
    skills_dir: .continue/skills
    snippets_dir: .continue/snippets
    pending_tasks_file: .continue/pending-tasks.md
    extension_dir: .continue/3-project
