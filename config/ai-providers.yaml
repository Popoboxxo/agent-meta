providers:
  Claude:
    agents_dir: .claude/agents
    agent_ext: .md
    # Provider contract (SPEC-PROVIDER-AUDIT-OPENCODE-V2-2026-09-30, Task 4):
    # surface-version selects the generation surface (v1 default, byte-stable),
    # agent-discovery gates the .agents/* discovery surface (default off) and
    # model-format is applied exactly once at emission. Values only — no code
    # branches on a provider name.
    surface-version: "v1"
    agent-discovery: false
    model-format: "{model}"
    context_file: CLAUDE.md
    context_template: templates/configs/CLAUDE.project-template.md
    has_dedicated_context_file: true
    # Context-adapter capability (SPEC-CONTEXT-FILE-MODES-2026-09-13, IC-07):
    # only used in the `context_file.topology: per-provider` mode. Claude reads
    # its native CLAUDE.md adapter, which imports the canonical core. Detection
    # is key-driven — no provider-name branch in scripts/lib/.
    context_adapter: true
    context_adapter_file: CLAUDE.md
    context_adapter_import: "@{core}"
    context_adapter_import_supported: true
    context_adapter_settings: false
    has_rules: true
    has_hooks: true
    hook_protocol: claude-code-json
    # Anchor prefix prepended to every registered hook command (issue #851):
    # without it the generated `bash .claude/hooks/<file>.sh` is resolved
    # relative to the process cwd, so Claude Code hooks silently miss whenever
    # a session starts from a subdirectory. `${CLAUDE_PROJECT_DIR}` is resolved
    # by Claude Code to the project root regardless of cwd. A provider without
    # this key keeps emitting the (legacy) relative command unchanged.
    hook-command-anchor: "${CLAUDE_PROJECT_DIR}"
    has_commands: true
    commands_dir: .claude/commands
    commands_ext: .md
    commands_format: markdown
    has_settings: true
    capabilities:
    - agents
    - rules
    - hooks
    - commands
    - settings
    - snippets
    - skills
    - context-managed-block
    - artifacts
    - checkpoints
    - mcp
    # Claude-only dispatch flags (issue #735) — consumed by providers.py
    # provider_has_capability() so scripts/lib/ never branches on the provider
    # name. `has_dedicated_context_file` above is the equivalent top-level flag
    # for the Claude base-sync path.
    - model-overrides-flat
    - verbose-sync-log
    - mcp-agent-frontmatter-tools
    # channel: skill support (issue #751) — see the rationale comment next
    # to provider_supports_skill_channel() in scripts/lib/skill_channel.py.
    - native-skill-channel
    # Deprecated (R-12, SPEC-STALE-ROLE-CLEANUP-2026-09-13): no consumer remains
    # since the external-skill wrapper union became unconditional (IC-03).
    # Retained for config compatibility; no code branches on this capability.
    - external-skill-agent-files
    artifact_dir: .claude/artifacts
    checkpoint_dir: .meta-viz
    settings_file: .claude/settings.json
    settings_template: templates/configs/CLAUDE.settings-template.json
    settings_local_file: .claude/settings.local.json
    settings_local_template: templates/configs/CLAUDE.settings-local-template.json
    isolation-dirs:
    - .claude/
    - CLAUDE.md
    isolation-mechanism: claude-settings-deny
    isolation-display-name: Claude Code
    bash_tool_name: Bash
    provider_root_dirs:
    - .claude/
    gitignore_entries:
    - .claude/settings.local.json
    - .claude/agent-memory-local/
    - .claude/pending-tasks.md
    - .claude/progress/
    - CLAUDE.local.md
    - CLAUDE.personal.md
    - sync.log
    - '*.sync-backup-*'
    - .mcp.json
    mcp-config:
      committed-file: .mcp.json
      secrets-file: .mcp.json
      format: claude-settings
    skills_dir: .claude/skills
    snippets_dir: .claude/snippets
    pending_tasks_file: .claude/pending-tasks.md
    extension_dir: .claude/3-project
    orchestrator_hint: "- **In Claude Code (CLI):** Startet den `orchestrator`-Agenten\
      \ mit `claude --agent orchestrator` oder w\xE4hlt ihn aus."
    model-tiers:
      nano: claude-haiku-5-5
      fast: claude-haiku-5-5
      balanced: claude-sonnet-5-5
      powerful: claude-opus-5-5
      max: claude-fable-5-1
    model-aliases:
      haiku: claude-haiku-5-5
      sonnet: claude-sonnet-5-5
      opus: claude-opus-5-5
      fable: claude-fable-5-1
    agent-transform:
      model: inject
      model-note-flat: true
      inject-memory: true
      inject-permission-mode: true
      tools: keep
      tools-format: keep
      tool-name-map: {}
      reject-fields: []
  Gemini:
    agents_dir: .gemini/agents
    agent_ext: .md
    # OQ-1/AC-9: flag-gated, default-off. With agent-discovery: false the
    # current .gemini/* discovery paths and the gemini-settings MCP format
    # stay byte-for-byte; true enables the .agents/* discovery surface below.
    surface-version: "v1"
    agent-discovery: false
    model-format: "{model}"
    # OQ-6: Antigravity accepts only inherit|flash|pro — no concrete tier IDs.
    model-literal: inherit
    # Discovery surface (Antigravity): reachable only when agent-discovery: true.
    discovery:
      agents_dir: .agents/agents
      rules_dir: .agents/rules
      skills_dir: .agents/skills
      mcp-config:
        committed-file: .agents/mcp_config.json
        format: antigravity-mcp-json
    context_file: AGENTS.md
    context_template: templates/configs/AGENTS.project-template.md
    # IC-15 Nr. 9 / F-07 (#971): Gemini does not read AGENTS.personal.md, so the
    # sync must not create it. Data-driven key; readers use true (default).
    personal_agents_file: false
    # IC-15 Nr. 8 (F-08/F-07, #975): Gemini CLI reads GEMINI.md by default, so
    # the shared core AGENTS.md is only read when the native settings key
    # `context.fileName` names it. `context_filename_settings_key` (below) makes
    # _adapter_settings_activation write that key -- data-driven, no provider
    # name branch. Rules stay embedded in AGENTS.md; the unread `.gemini/rules`
    # directory is no longer written and a directory from an earlier version is
    # cleaned up through its managed index (foreign files stay).
    has_rules: false
    retired_rules_dirs:
    - .gemini/rules
    context_filename_settings_key: context.fileName
    has_hooks: true
    hook_protocol: antigravity-hooks-json
    hooks_dir: .agents/hooks
    hooks_config_file: .agents/hooks.json
    has_commands: true
    commands_dir: .gemini/commands
    commands_ext: .toml
    commands_format: toml
    has_settings: true
    capabilities:
    - agents
    - rules
    - hooks
    - commands
    - settings
    - snippets
    - skills
    - context-embedded-rules
    - mcp
    artifact_dir: .gemini/artifacts
    checkpoint_dir: .meta-viz
    settings_file: .gemini/settings.json
    settings_template: templates/configs/GEMINI.settings-template.json
    settings_local_file: .gemini/settings.local.json
    isolation-dirs:
    - .gemini/
    isolation-mechanism: gemini-toml-policy
    isolation-display-name: Gemini CLI
    bash_tool_name: code_execution
    provider_root_dirs:
    - .gemini/
    gitignore_entries:
    - .gemini/settings.local.json
    - .gemini/pending-tasks.md
    - AGENTS.personal.md
    mcp-config:
      committed-file: .gemini/settings.json
      secrets-file: .gemini/settings.local.json
      format: gemini-settings
    skills_dir: .gemini/skills
    snippets_dir: .gemini/snippets
    pending_tasks_file: .gemini/pending-tasks.md
    extension_dir: .gemini/3-project
    orchestrator_hint: '- **In Gemini (VS Code):** Nutzt `@orchestrator <Eure Aufgabe>`
      im Chat.'
    planning_mode_hint: "Gemini's `<planning_mode>` hat Vorrang. Wenn der Orchestrator\
      \ aktiv ist, unterdr\xFCckt die Orchestrator-Planning-Phase den nativen Mode.\
      \ Doppelte Planung vermeiden."
    model-tiers:
      nano: gemini-3.5-flash-medium
      fast: gemini-3.5-flash-high
      balanced: gemini-3.1-pro-low
      powerful: gemini-3.1-pro-high
      max: gemini-3.1-pro-high
    model-aliases: {}
    agent-transform:
      model: inject
      tools: filter
      strip-fields:
      - memory
      - permissionMode
      - temperature
      - top_p
      - top_k
      - stop_sequences
      - max_output_tokens
      strip-claude-lines: true
      body-note: gemini-registration
      tools-format: filter
      # G-2: Antigravity subagent tool vocabulary (Claude -> provider name);
      # an unknown source tool name passes through unchanged.
      tool-name-map:
        Read: view_file
        Write: replace_file_content
        Grep: grep_search
        Bash: run_command
      reject-fields: []
  Opencode:
    display-name: OpenCode
    agents_dir: .opencode/agents
    agent_ext: .md
    # OQ-8: v2 is opt-in; v1 stays the default byte shape. surface-version: v2
    # selects frontmatter-mechanism: opencode-native-v2 and
    # mcp-config.format: opencode-json-v2 (consumed by Tasks 6/8, never by a
    # provider-name branch).
    surface-version: "v1"
    agent-discovery: false
    model-format: "{model}"
    # v1 and v2 emit this role as `mode: primary` and write it as
    # `default_agent`; without this key `primary` is never emitted
    # (#1006, OQ-8 amendment A2).
    primary-role: orchestrator
    context_file: AGENTS.md
    context_template: templates/configs/AGENTS.project-template.md
    # Opencode reads the generated AGENTS.personal.md (instructions field).
    personal_agents_file: true
    has_rules: false
    has_hooks: false
    has_commands: true
    commands_dir: .opencode/commands
    commands_ext: .md
    commands_format: markdown
    has_settings: true
    capabilities:
    - agents
    - commands
    - settings
    - snippets
    - skills
    - context-embedded-rules
    - artifacts
    - checkpoints
    - mcp
    artifact_dir: .opencode/artifacts
    checkpoint_dir: .meta-viz
    settings_file: opencode.json
    settings_template: templates/configs/OPENCODE.settings-template.json
    settings_local_file: .opencode/settings.local.json
    isolation-dirs:
    - .opencode/
    - opencode.json
    - AGENTS.md
    isolation-mechanism: opencode-permissions
    # Runtime-gate plugin capability (SPEC-OPENCODE-RUNTIME-GATE-2026-09-13,
    # IC-02). has_plugins stays false until the P6 real-repo verification
    # (Task 9) records that tool.execute.before fires in subagent sessions and
    # that the Main Chat is distinguishable — until then the resolved tier
    # stays `permission` and no plugin artifact is generated. plugin_dir/
    # plugin_ext/plugin_protocol document the capability the generator uses
    # once the flag is unlocked.
    has_plugins: false
    plugin_dir: .opencode/plugins
    plugin_ext: .js
    plugin_protocol: opencode-plugin-js
    runtime_gate-mechanism: opencode-plugin
    bash_tool_name: bash
    provider_root_dirs:
    - .opencode/
    gitignore_entries:
    - AGENTS.personal.md
    - .opencode/settings.local.json
    - .opencode/pending-tasks.md
    - .opencode/mcp.local.json
    mcp-config:
      committed-file: opencode.json
      secrets-file: .opencode/mcp.local.json
      # OQ-8/AC-5: surface-version is data that SELECTS the MCP format; the
      # writer keeps dispatching on `format` only. v1 stays the flat default,
      # v2 selects the nested mcp.servers shape (design §3.1/§3.4, DECISION-7).
      format: opencode-json
      surface-formats:
        v1: opencode-json
        v2: opencode-json-v2
    # SPEC-OPENCODE-V2-SUPPORT-2026-10-22 §3.1 (Task 6): per-surface CLI
    # settings filename. `surface-version` SELECTS it and the loader exposes
    # the flat resolved key `cli_file`; no v1 entry means v1 writes no such
    # file (v1 stays byte-frozen).
    cli-files:
      v2: cli.json
    skills_dir: .opencode/skills
    snippets_dir: .opencode/snippets
    pending_tasks_file: .opencode/pending-tasks.md
    extension_dir: .opencode/3-project
    orchestrator_hint: '- **In Opencode (VS Code):** Der `orchestrator` ist der
      Default-Agent (mit Tab wechseln); eine @-Erwähnung ist nicht mehr nötig.'
    agent-transform:
      frontmatter-mechanism: opencode-native
      # OQ-8/AC-5: surface-version is data that SELECTS the frontmatter
      # mechanism; the transform writer keeps reading the resolved
      # `frontmatter-mechanism` value only. The v1 surface FORMAT is frozen;
      # the entry point (`mode: primary` + `default_agent`) is excluded from
      # that freeze (OQ-8 amendment A2, #1006).
      surface-mechanisms:
        v1: opencode-native
        v2: opencode-native-v2
      # SPEC-OPENCODE-V2-SUPPORT-2026-10-22 §3.1 (Task 6): v2 model ids are
      # `provider/model[#variant]`. `surface-version` SELECTS the pattern;
      # `artifact_validate` reads the resolved `model-pattern` only.
      surface-model-patterns:
        v2: '^[^/#\s]+/[^#\s]+(#[A-Za-z0-9._-]+)?$'
      # Allow-list source for the v2 native frontmatter fields (Spec §3.2, D1).
      surface-v2-fields: [system, permissions, steps, variant]
      tools-format: keep
      tool-name-map: {}
      # §4.3: allow-list turns Opencode v2's silent frontmatter drop into a
      # sync-time finding. Superset of the v1 and v2 emitted keys.
      allowed-fields:
      - name
      - description
      - mode
      - model
      - steps
      - permission
      - permissions
      - temperature
      - max_tokens
      - version
      - generated-from
      # Task 18: `prompt_mode` is emitted verbatim from the template by both
      # surfaces (Opencode declares no strip-fields). Opencode preserves
      # unknown frontmatter keys in its `options` bucket — v1 `debug agent`
      # collects them there and v2's agent `normalize()` explicitly promotes
      # unknown keys into `options` "so they survive the round-trip" — so it
      # is a legitimate emitted key, not a silent drop (runtime evidence
      # docs/analysis/evidence/2026-09-30-runtime-opencode-v{1,2}.md).
      - prompt_mode
      - subagent
      - hidden
      - color
      reject-fields: []
    model-tiers:
      nano: opencode-go/deepseek-v4.1-flash
      fast: opencode-go/deepseek-v4.1-flash
      balanced: opencode-go/deepseek-v4.1-flash
      powerful: opencode-go/deepseek-v4.1-flash
      max: opencode-go/deepseek-v4-pro
    model-aliases:
      flash: opencode-go/deepseek-v4.1-flash
      qwen: opencode-go/qwen3.7-plus
      kimi: opencode-go/kimi-k2.6
      kimi-code: opencode-go/kimi-k2.7-code
      qwen-max: opencode-go/qwen3.7-max
  Continue:
    agents_dir: .continue/agents
    agent_ext: .md
    surface-version: "v1"
    agent-discovery: false
    model-format: "{model}"
    context_file: .continue/rules/project-context.md
    # Phase-2 context adapter — HYPOTHESIS, UNVERIFIED (candidate pointer file).
    # Disabled until tests/manual/phase2-adapter-hypothesis.md records a real-repo
    # PASS: `context_adapter: false` keeps Continue a direct reader of the core.
    context_adapter: false
    context_adapter_file: .continue/rules/project-context.md
    context_template: templates/configs/CONTINUE.project-template.md
    has_rules: true
    rules_dir: .continue/rules
    has_hooks: false
    has_commands: true
    commands_dir: .continue/prompts
    commands_ext: .md
    commands_format: continue
    commands_managed_index: .agent-meta-commands-managed
    has_settings: true
    has_prompt_commands: true
    capabilities:
    - agents
    - rules
    - commands
    - settings
    - snippets
    - skills
    - context-managed-block
    - context-config-comment
    - mcp
    # alwaysApply frontmatter support (issue #751): Claude Code was removed
    # (#Phase-C token-efficiency review, 2026-08-14) — a fresh sync.py
    # test-lab run confirmed alwaysApply: false has zero effect on Claude
    # Code — it is a Cursor/Continue frontmatter convention Claude Code
    # silently ignores, loading '.claude/rules/*.md' in full regardless.
    # Keeping it there only added noise (and, worse, made the 'silent'
    # preset *heavier* than 'default' because of the extra frontmatter
    # bytes with no lazy-loading benefit). Continue does honor it — see
    # _build_always_apply_frontmatter() in scripts/lib/rules.py.
    - rules-always-apply
    # channel: skill rules land in .continue/skills (IC-15 Nr. 2: a real
    # runtime surface, study 3.8 H9) instead of falling back to .continue/rules.
    - native-skill-channel
    artifact_dir: .continue/artifacts
    checkpoint_dir: .meta-viz
    settings_file: .continue/config.yaml
    settings_template: templates/configs/CONTINUE.config-template.yaml
    settings_local_file: .continue/config.local.yaml
    isolation-dirs:
    - .continue/
    isolation-mechanism: continue-soft-rule
    bash_tool_name: null
    provider_root_dirs:
    - .continue/
    gitignore_entries:
    - .continue/config.local.yaml
    - .continue/pending-tasks.md
    mcp-config:
      committed-file: .continue/config.yaml
      secrets-file: .continue/config.local.yaml
      format: continue-yaml
    model-tiers: {}
    model-aliases: {}
    skills_dir: .continue/skills
    snippets_dir: .continue/snippets
    pending_tasks_file: .continue/pending-tasks.md
    extension_dir: .continue/3-project
    orchestrator_hint: '- **In Continue (IDE):** Tippt `@orchestrator` gefolgt von
      Eurer Aufgabe ein.'
    agent-transform:
      model: inject
      model-note-flat: true
      model-inherit-fallback: true
      inject-memory: true
      inject-permission-mode: true
      extra-fields:
        alwaysApply: false
      tools: remove
      tools-format: remove
      tool-name-map: {}
      reject-fields: []
      strip-claude-lines: true
      body-sanitize-hr: true
  Copilot:
    # PRE-4/OQ-5 + AC-8: GitHub-cloud canonical paths; agent files use the
    # .agent.md extension under .github/agents/ (migration is default-on).
    agents_dir: .github/agents
    agent_ext: .agent.md
    surface-version: "v1"
    agent-discovery: false
    model-format: "{model}"
    context_file: .github/copilot-instructions.md
    # Phase-2 context adapter — HYPOTHESIS, UNVERIFIED (candidate pointer file;
    # the native path, `.github/copilot-instructions.md`, is not confirmed).
    # Disabled until tests/manual/phase2-adapter-hypothesis.md records a real-repo
    # PASS: `context_adapter: false` keeps Copilot a direct reader of the core.
    context_adapter: false
    context_adapter_file: .github/copilot/COPILOT.md
    context_template: templates/configs/COPILOT.project-template.md
    has_rules: true
    rules_dir: .github/instructions
    # IC-15 Nr. 3 / AC-14 (F-13): GitHub Copilot reads path-scoped instruction
    # files (`.github/instructions/<name>.instructions.md`, suffix from the
    # `rules_required_suffix` capability). The syncer reads this key generically
    # (no provider-name branch) and emits it as `applyTo:` frontmatter; `"**"`
    # = repository-wide.
    rules_apply_to: "**"
    has_hooks: false
    # Commands (issue #807): VS Code / GitHub Copilot reusable prompt files
    # (`.github/prompts/*.prompt.md`, invoked as `/name`) are a real command
    # surface — declaring commands: false was an UNDERCLAIM (audit finding P-6,
    # docs/analysis/2026-09-30-provider-audit-docs-part1.md §5). No
    # provider-name branch: commands.py only reads these keys.
    has_commands: true
    commands_dir: .github/prompts
    commands_ext: .prompt.md
    commands_format: markdown
    has_settings: false
    capabilities:
    - agents
    - rules
    - commands
    - snippets
    - skills
    - context-managed-block
    - mcp
    artifact_dir: .github/copilot/artifacts
    checkpoint_dir: .meta-viz
    isolation-dirs:
    - .github/copilot/
    bash_tool_name: null
    provider_root_dirs:
    - .github/copilot/
    gitignore_entries: []
    mcp-config:
      committed-file: .vscode/mcp.json
      format: vscode-settings
    # IC-15 Nr. 2 / AC-14: Copilot discovers .github/skills (study 3.9);
    # .github/copilot/skills was never read (legacy_artifacts).
    skills_dir: .github/skills
    snippets_dir: .github/copilot/snippets
    pending_tasks_file: .github/copilot/pending-tasks.md
    extension_dir: .github/copilot/3-project
    orchestrator_hint: "- **In GitHub Copilot (VS Code):** Nutzt den Chat mit `@orchestrator`\
      \ oder w\xE4hlt den Orchestrator-Agenten."
    model-tiers: {}
    model-aliases: {}
    agent-transform:
      strip-fields:
      - memory
      - permissionMode
      - temperature
      - top_p
      - top_k
      - stop_sequences
      - max_output_tokens
      - tools
      tools-format: skip
      tool-name-map: {}
      reject-fields: []
      strip-claude-lines: true
  Mammouth:
    agents_dir: .mammouth/agents
    agent_ext: .md
    # PRE-5/OQ-7: Mammouth reads AGENTS.md; MAMMOUTH.md and its routing entry
    # are retired. F8/N17: tools need the object form (tools-format: map).
    surface-version: "v1"
    agent-discovery: false
    # #852: Mammouth (OpenCode fork) resolves models at runtime as
    # "<provider>/<model-id>" (e.g. "mammouth/claude-sonnet-5"); a bare ID
    # is rejected. model-tiers/model-aliases below stay bare — apply_model_format()
    # (scripts/lib/roles.py) applies this prefix exactly once at emission,
    # the same mechanism KimiCode's "kimi-code/{model}" already uses.
    model-format: "mammouth/{model}"
    context_file: AGENTS.md
    # Phase-2 context adapter — HYPOTHESIS, UNVERIFIED (candidate pointer file).
    # Disabled until tests/manual/phase2-adapter-hypothesis.md records a real-repo
    # PASS: `context_adapter: false` keeps Mammouth a direct reader of the core.
    context_adapter: false
    context_adapter_file: AGENTS.md
    context_template: templates/configs/AGENTS.project-template.md
    # Opencode fork: reads the generated AGENTS.personal.md (instructions field).
    personal_agents_file: true
    # IC-15 Nr. 9 (F-07, #853): .mammouth/rules is never read (study 3.4,
    # VERIFIED-RUNTIME) -- rules are embedded in AGENTS.md, lazy rules go to
    # .mammouth/skills. The formerly generated directory is cleaned up through
    # its managed indexes (foreign files stay).
    has_rules: false
    retired_rules_dirs:
    - .mammouth/rules
    has_hooks: true
    hooks_dir: .mammouth/hooks
    # Commands (issue #807): Mammouth is an OpenCode fork and owns a project
    # command surface — `mammouth` documents "Add .md files to
    # .mammouth/commands/ for reusable prompts" with `$ARGUMENTS`. Declaring
    # commands: false was an UNDERCLAIM; the runtime binary string is the
    # evidence (2026-10-05). No provider-name branch in scripts/lib/.
    has_commands: true
    commands_dir: .mammouth/commands
    commands_ext: .md
    commands_format: markdown
    has_settings: true
    # #853: Mammouth's native loader reads mammouth.json at the project root
    # (OpenCode-fork convention, mirroring Opencode's own opencode.json) —
    # never .mammouth/settings.json, which was inert (never read).
    settings_file: mammouth.json
    settings_template: templates/configs/MAMMOUTH.settings-template.json
    capabilities:
    - agents
    - hooks
    - commands
    - settings
    - snippets
    - skills
    - context-managed-block
    - mcp
    artifact_dir: .mammouth/artifacts
    checkpoint_dir: .meta-viz
    isolation-dirs:
    - .mammouth/
    bash_tool_name: bash
    provider_root_dirs:
    - .mammouth/
    gitignore_entries:
    - .mammouth/pending-tasks.md
    - .mammouth/mcp.local.json
    - AGENTS.personal.md
    # #857: real MCP surface, mirrored from Opencode's own v1 shape (flat
    # top-level `mcp` key) — Mammouth is an explicit OpenCode fork (see
    # comments elsewhere in this block, e.g. commands_dir/#807) and
    # "opencode-json" is a generic format key (validate_mcp_document /
    # scripts/lib/mcp_provider_config.py), never a provider-name branch.
    # Same committed-file as the settings_file fix above: one JSON document
    # carries both general settings and the "mcp" key.
    mcp-config:
      committed-file: mammouth.json
      secrets-file: .mammouth/mcp.local.json
      format: opencode-json
    skills_dir: .mammouth/skills
    snippets_dir: .mammouth/snippets
    pending_tasks_file: .mammouth/pending-tasks.md
    extension_dir: .mammouth/3-project
    orchestrator_hint: '- **In Mammouth:** Nutzt den Orchestrator-Agenten.'
    model-tiers:
      nano: claude-haiku-5-5
      fast: claude-haiku-5-5
      balanced: claude-sonnet-5-5
      powerful: claude-opus-5-5
      max: claude-fable-5-1
    model-aliases:
      haiku: claude-haiku-5-5
      sonnet: claude-sonnet-5-5
      opus: claude-opus-5-5
      fable: claude-fable-5-1
    agent-transform:
      # F-11/IC-15 Nr. 6: Mammouth is an OpenCode fork. Its agent frontmatter
      # uses the same native surface as Opencode — a lowercase `permission` map
      # (incl. `task`/`todowrite`) and a set `mode` — instead of the previously
      # inert Claude-cased `tools:` object (study 3.4: "Claude-Tool-Keys werden
      # zu inerten Permission-Keys"). The OpenCode-native mechanism also never
      # emits a `tools:` list (a list aborts the whole agent directory, AC-6).
      frontmatter-mechanism: opencode-native
      model: inject
      model-note-flat: true
      # Emit `subagent_depth` from the capability `required_depth` (study 3.4:
      # no depth emitted -> default 1) so a spawned orchestrator keeps its
      # dispatch tools; gated on this data key, never a provider-name branch.
      inject-subagent-depth: true
      tools: skip
      tools-format: skip
      tool-name-map: {}
      strip-fields:
      - memory
      - temperature
      - top_p
      - top_k
      - stop_sequences
      - max_output_tokens
      reject-fields: []
      strip-claude-lines: true
  Codex:
    agents_dir: .codex/agents
    agent_ext: .toml
    surface-version: "v1"
    agent-discovery: false
    model-format: "{model}"
    context_file: AGENTS.md
    # Phase-2 context adapter — HYPOTHESIS, UNVERIFIED (candidate `AGENTS.override.md`).
    # Disabled until tests/manual/phase2-adapter-hypothesis.md records a real-repo
    # PASS: `context_adapter: false` keeps Codex a direct reader of the core.
    context_adapter: false
    context_adapter_file: AGENTS.override.md
    context_template: templates/configs/AGENTS.project-template.md
    # IC-15 Nr. 9 / F-07 (#971): Codex does not read AGENTS.personal.md.
    personal_agents_file: false
    # IC-15 Nr. 9 (F-07): Codex never reads a project-root rules/ directory
    # (study 3.2, VERIFIED-RUNTIME) -- rules are embedded in AGENTS.md, lazy
    # rules go to .agents/skills. The formerly generated rules/ is cleaned up
    # through its managed indexes (foreign files stay).
    has_rules: false
    retired_rules_dirs:
    - rules
    has_hooks: true
    hooks_dir: .codex/hooks
    # Commands (issue #807): Codex custom prompts (`~/.codex/prompts/*.md`,
    # invoked as `/prompts:<name>`) are USER-GLOBAL only and deprecated in
    # favor of skills — the official docs state they "live in your local Codex
    # home directory ... so they're not shared through your repository".
    # Project-scoped `.codex/prompts/` is an open feature request (openai/codex
    # #9848), not implemented. A repo sync therefore cannot emit Codex
    # commands; commands: false is the verified capability decision, not a
    # silent hardcoded default.
    has_commands: false
    has_settings: false
    capabilities:
    - agents
    - hooks
    - snippets
    - skills
    - context-managed-block
    artifact_dir: .codex/artifacts
    checkpoint_dir: .meta-viz
    isolation-dirs:
    - .codex/
    - AGENTS.md
    bash_tool_name: Bash
    provider_root_dirs:
    - .codex/
    - .agents/
    gitignore_entries:
    - .codex/pending-tasks.md
    - AGENTS.personal.md
    mcp-config:
      # Same committed file is the IC-15 Nr. 4 dispatch target: the sync writes
      # a managed [agents] max_depth table here (scripts/lib/dispatch_depth.py),
      # gated on the capability keys agent_config_format: toml + required_depth.
      committed-file: .codex/config.toml
      format: codex-toml-mcp
    skills_dir: .agents/skills
    snippets_dir: .codex/snippets
    pending_tasks_file: .codex/pending-tasks.md
    extension_dir: .codex/3-project
    orchestrator_hint: '- **In Codex:** Use the orchestrator agent.'
    model-tiers:
      nano: gpt-5.4-mini
      fast: gpt-5.4
      balanced: gpt-5.3-codex-spark
      powerful: gpt-5.5
      max: gpt-5.6
    model-aliases:
      sol: gpt-5.6-sol
      terra: gpt-5.6-terra
      luna: gpt-5.6-luna
    agent-transform:
      frontmatter-mechanism: codex-toml
      model: inject
      extra-fields:
        sandbox_mode: workspace-write
      # IC-15 Nr. 21 (F-32): a role whose template tool list carries neither
      # Write nor Edit is read-only. Together with the capability
      # `read_only_enforcement: sandbox` this override map turns the pauschale
      # `workspace-write` into `read-only` for exactly those roles. Pure data —
      # provider_transform reads the keys, never a provider name.
      read-only-extra-fields:
        sandbox_mode: read-only
      tools: skip
      tools-format: skip
      tool-name-map: {}
      reject-fields: []
      strip-claude-lines: true
  ZCode:
    agents_dir: .zcode/agents
    agent_ext: .md
    surface-version: "v1"
    agent-discovery: false
    model-format: "{model}"
    context_file: AGENTS.md
    context_template: templates/configs/AGENTS.project-template.md
    # IC-15 Nr. 9 / F-07 (#971): ZCode does not read AGENTS.personal.md.
    personal_agents_file: false
    has_rules: false
    has_hooks: false
    # Commands (issue #807): ZCode documents a workspace command surface —
    # "Custom commands are stored as .md files under ~/.zcode/commands
    # (workspace-level commands live in the project directory)", invoked as
    # `/name`, YAML frontmatter + `$ARGUMENTS` (zcode.z.ai/en/docs/commands).
    # Declaring commands: false was an UNDERCLAIM (audit finding ZC-2). No
    # provider-name branch in scripts/lib/.
    has_commands: true
    commands_dir: .zcode/commands
    commands_ext: .md
    commands_format: markdown
    has_settings: true
    settings_file: .zcode/config.json
    capabilities:
    - agents
    - commands
    - settings
    - skills
    - mcp
    - context-managed-block
    artifact_dir: .zcode/artifacts
    checkpoint_dir: .meta-viz
    isolation-dirs:
    - .zcode/
    - AGENTS.md
    bash_tool_name: Bash
    provider_root_dirs:
    - .zcode/
    gitignore_entries:
    - .zcode/pending-tasks.md
    - AGENTS.personal.md
    mcp-config:
      committed-file: .zcode/config.json
      format: zcode-json
    skills_dir: .zcode/skills
    snippets_dir: .zcode/snippets
    pending_tasks_file: .zcode/pending-tasks.md
    extension_dir: .zcode/3-project
    orchestrator_hint: '- **In ZCode:** Use the orchestrator agent.'
    model-tiers:
