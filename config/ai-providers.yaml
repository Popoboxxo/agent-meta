providers:
  Claude:
    agents_dir: .claude/agents
    agent_ext: .md
    context_file: CLAUDE.md
    context_template: templates/configs/CLAUDE.project-template.md
    # Claude is the only provider with its own dedicated context-file handling
    # (sync_claude_md_static() in sync.py, AGENT_HINTS_CLAUDE variable in
    # context.py) instead of sharing the generic AGENTS.md path every other
    # provider uses. Expressed as a capability flag (issue #631) so
    # resolve_context_filename()/context.py read a data lookup instead of a
    # literal `provider == "Claude"` string check.
    has_dedicated_context_file: true
    has_rules: true
    has_hooks: true
    # hook_protocol: the hook event/payload contract a provider speaks. Every
    # script in hooks/1-generic/ is written against Claude Code's own model
    # (JSON on stdin, PreToolUse/PostToolUse events, exit-code-2-blocks,
    # registration in settings.json). `has_hooks: true` alone only means "a
    # hooks_dir/settings_file path is configured" — sync only actually mirrors
    # hook scripts to a provider whose hook_protocol matches a known,
    # implemented one (see providers.py::provider_hooks_supported, issue #630).
    hook_protocol: claude-code-json
    has_commands: true
    has_settings: true
    capabilities:
      - agents
      - rules
      - hooks
      - commands
      - settings
      - snippets
      - skills
      - context-managed-block
      - artifacts
      - checkpoints
      - mcp
    artifact_dir: .claude/artifacts
    checkpoint_dir: .meta-viz
    settings_file: .claude/settings.json
    settings_template: templates/configs/CLAUDE.settings-template.json
    settings_local_file: .claude/settings.local.json
    settings_local_template: templates/configs/CLAUDE.settings-local-template.json
    isolation-dirs:
      - .claude/
      - CLAUDE.md
    # Mechanism key consumed by isolation.py's dispatch table (no literal
    # `if provider == "Claude"` branch — see _ISOLATION_MECHANISM_HANDLERS).
    isolation-mechanism: claude-settings-deny
    # Human-readable name for isolation deny-messages (differs from the
    # registry key "Claude" — see isolation.py::_isolation_display_name).
    isolation-display-name: "Claude Code"
    # Terminal (Bash/command-execution) tool name — used by viz.py's fallback
    # CLI-logging hint. null means: no known terminal tool for this provider.
    bash_tool_name: Bash
    gitignore_entries:
      - .claude/settings.local.json
      - .claude/agent-memory-local/
      - .claude/pending-tasks.md
      - CLAUDE.personal.md
      - sync.log
      - .mcp.json
    mcp-config:
      # Claude Code does NOT read a top-level `mcpServers` key from
      # settings.json/settings.local.json for MCP server registration — only
      # from .mcp.json at the project root (or `claude mcp add --scope
      # project`). Writing here previously produced a fully inert,
      # silently-broken integration (audit #388, #400). Both entries point
      # at the same already-gitignored .mcp.json (see gitignore_entries
      # above): committed-file writes ${VAR}-placeholder entries first (safe
      # even if this file were ever committed), then secrets-file overwrites
      # the same mcpServers key with fully resolved values when
      # secrets.local.yaml exists — matching .mcp.json's own native ${VAR}
      # expansion as the fallback when it doesn't.
      committed-file: .mcp.json
      secrets-file: .mcp.json
      format: claude-settings
    # Provider-specific directories for multi-provider orchestration
    skills_dir: .claude/skills
    snippets_dir: .claude/snippets
    pending_tasks_file: .claude/pending-tasks.md
    extension_dir: .claude/3-project
    orchestrator_hint: "- **In Claude Code (CLI):** Startet den `orchestrator`-Agenten mit `claude -a orchestrator` oder wählt ihn aus."
    # Model tiers: abstract tier name → provider-specific model ID.
    # Agents use tier names (nano/fast/balanced/powerful/max) in role-defaults.yaml.
    # sync.py maps each tier to the model ID written into agent frontmatter.
    # Source: https://platform.claude.com/docs/en/about-claude/models/overview (verified 2026-06-24)
    # ID convention: 4.6+ generation uses dateless IDs (claude-sonnet-4-6);
    # pre-4.6 models use dated snapshot IDs (claude-haiku-4-5-20251001).
    model-tiers:
      nano:     claude-haiku-4-5-20251001   # cheapest, high-throughput tasks
      fast:     claude-haiku-4-5-20251001   # quick ops: git, meta-feedback, docker
      balanced: claude-sonnet-5             # default workhorse: dev, docs, review
      powerful: claude-opus-4-8             # complex reasoning: architecture, security
      max:      claude-fable-5              # most capable widely released model
    # Backward-compat aliases (haiku/sonnet/opus still work in model-overrides)
    model-aliases:
      haiku:  claude-haiku-4-5-20251001
      sonnet: claude-sonnet-4-6
      opus:   claude-opus-4-8
      fable:  claude-fable-5
    # Data-driven agent transform (issue #629). Claude supports all fields
    # natively — model/memory/permissionMode injected, tools validated (kept),
    # body left intact (Claude-specific lines are meaningful here).
    agent-transform:
      model: inject
      model-note-flat: true
      inject-memory: true
      inject-permission-mode: true
      tools: keep

  Gemini:
    agents_dir: .gemini/agents
    agent_ext: .md
    context_file: AGENTS.md
    context_template: templates/configs/AGENTS.project-template.md
    has_rules: true
    rules_dir: .gemini/rules
    has_hooks: false
    has_commands: true
    commands_dir: .gemini/commands
    commands_ext: .toml
    has_settings: true
    capabilities:
      - agents
      - rules
      - commands
      - settings
      - snippets
      - skills
      - context-embedded-rules
      - mcp
    artifact_dir: .gemini/artifacts
    checkpoint_dir: .meta-viz
    settings_file: .gemini/settings.json
    settings_template: templates/configs/GEMINI.settings-template.json
    settings_local_file: .gemini/settings.local.json
    isolation-dirs:
      - .gemini/
    isolation-mechanism: gemini-toml-policy
    isolation-display-name: "Gemini CLI"
    bash_tool_name: code_execution
    gitignore_entries:
      - .gemini/settings.local.json
      - .gemini/pending-tasks.md
    mcp-config:
      committed-file: .gemini/settings.json
      secrets-file: .gemini/settings.local.json
      format: gemini-settings
    skills_dir: .gemini/skills
    snippets_dir: .gemini/snippets
    pending_tasks_file: .gemini/pending-tasks.md
    extension_dir: .gemini/3-project
    orchestrator_hint: "- **In Gemini (VS Code):** Nutzt `@orchestrator <Eure Aufgabe>` im Chat."
    planning_mode_hint: "Gemini's `<planning_mode>` hat Vorrang. Wenn der Orchestrator aktiv ist, unterdrückt die Orchestrator-Planning-Phase den nativen Mode. Doppelte Planung vermeiden."
    model-tiers:
      nano:     gemini-3.5-flash-medium     # ultra-fast, low-cost tasks
      fast:     gemini-3.5-flash-high       # quick ops: git, formatting
      balanced: gemini-3.1-pro-low          # reasoning + code (default)
      powerful: gemini-3.1-pro-high         # premium reasoning, complex coding
      max:      gemini-3.1-pro-high         # reserved for future Gemini Ultra
    model-aliases: {}
    # Data-driven agent transform (issue #629). Gemini: provider-mapped model,
    # tools filtered to native subset, sampling/memory/permissionMode stripped,
    # Claude-specific body lines removed and a runtime-registration note added.
    agent-transform:
      model: inject
      tools: filter
      strip-fields:
        - memory
        - permissionMode
        - temperature
        - top_p
        - top_k
        - stop_sequences
        - max_output_tokens
      strip-claude-lines: true
      body-note: gemini-registration

  Opencode:
    display-name: "OpenCode"
    agents_dir: .opencode/agents
    agent_ext: .md
    context_file: AGENTS.md
    context_template: templates/configs/AGENTS.project-template.md
    has_rules: false         # Rules have no native dir in opencode — embedded into AGENTS.md
    has_hooks: false
    has_commands: true
    commands_dir: .opencode/commands
    has_settings: true
    capabilities:
      - agents
      - commands
      - settings
      - snippets
      - skills
      - context-embedded-rules
      - artifacts
      - checkpoints
      - mcp
    artifact_dir: .opencode/artifacts
    checkpoint_dir: .meta-viz
    settings_file: opencode.json
    settings_template: templates/configs/OPENCODE.settings-template.json
    settings_local_file: .opencode/settings.local.json
    isolation-dirs:
      - .opencode/
      - opencode.json
      - AGENTS.md
    isolation-mechanism: opencode-permissions
    bash_tool_name: bash
    gitignore_entries:
      - AGENTS.personal.md
      - .opencode/settings.local.json
      - .opencode/pending-tasks.md
      - .opencode/mcp.local.json
    mcp-config:
      committed-file: opencode.json
      secrets-file: .opencode/mcp.local.json
      format: opencode-json
    skills_dir: .opencode/skills
    snippets_dir: .opencode/snippets
    pending_tasks_file: .opencode/pending-tasks.md
    extension_dir: .opencode/3-project
    orchestrator_hint: "- **In Opencode (VS Code):** Nutzt `@orchestrator <Eure Aufgabe>` im Chat."
    # Data-driven agent transform (issue #629). Opencode uses a native agent
    # frontmatter schema (mode: subagent, permission block, provider/model-id
    # model refs) built by _transform_frontmatter_for_opencode — selected via
    # the frontmatter-mechanism key rather than an `if provider == 'Opencode'`
    # branch. Model/temperature/max_tokens/steps are resolved and folded into
    # that native frontmatter; tools are validated then mapped to permissions.
    agent-transform:
      frontmatter-mechanism: opencode-native
    # opencode model IDs — sourced from the Go catalog (opencode-go/).
    # Full list: https://opencode.ai/zen/go
    model-tiers:
      nano:     opencode-go/deepseek-v4-flash     # Go (cheapest, high-throughput)
      fast:     opencode-go/deepseek-v4-flash     # Go (quick ops)
      balanced: opencode-go/qwen3.7-plus          # Go (default workhorse)
      powerful: opencode-go/kimi-k2.6             # Go (complex reasoning)
      max:      opencode-go/kimi-k2.7-code        # Go (top-tier code model)
    model-aliases:
      flash:      opencode-go/deepseek-v4-flash
      qwen:       opencode-go/qwen3.7-plus
      kimi:       opencode-go/kimi-k2.6
      kimi-code:  opencode-go/kimi-k2.7-code
      qwen-max:   opencode-go/qwen3.7-max

  Continue:
    agents_dir: .continue/agents
    agent_ext: .md
    context_file: .continue/rules/project-context.md
    context_template: templates/configs/CONTINUE.project-template.md
    has_rules: true
    rules_dir: .continue/rules
    has_hooks: false
    has_commands: true
    has_settings: true
    capabilities:
      - agents
      - rules
      - commands
      - settings
      - snippets
      - skills
      - context-managed-block
      - mcp
    artifact_dir: .continue/artifacts
    checkpoint_dir: .meta-viz
    settings_file: .continue/config.yaml
    settings_template: templates/configs/CONTINUE.config-template.yaml
    settings_local_file: .continue/config.local.yaml
    isolation-dirs:
      - .continue/
    isolation-mechanism: continue-soft-rule
    bash_tool_name: null
    gitignore_entries:
      - .continue/config.local.yaml
      - .continue/pending-tasks.md
    mcp-config:
      committed-file: .continue/config.yaml
      secrets-file: .continue/config.local.yaml
      format: continue-yaml
    # Continue manages models centrally in .continue/config.yaml — no per-agent model.
    model-tiers: {}
    model-aliases: {}
    skills_dir: .continue/skills
    snippets_dir: .continue/snippets
    pending_tasks_file: .continue/pending-tasks.md
    extension_dir: .continue/3-project
    orchestrator_hint: "- **In Continue (IDE):** Tippt `@orchestrator` gefolgt von Eurer Aufgabe ein."
    # Data-driven agent transform (issue #629). Continue: model/memory/
    # permissionMode injected (model may inherit main-chat via role-defaults
    # fallback), alwaysApply pinned false, tools field removed (no frontmatter
    # tools model), Claude-specific body lines stripped and standalone `---`
    # sanitized to avoid breaking Continue's YAML parsing.
    agent-transform:
      model: inject
      model-note-flat: true
      model-inherit-fallback: true
      inject-memory: true
      inject-permission-mode: true
      extra-fields:
        alwaysApply: false
      tools: remove
      strip-claude-lines: true
      body-sanitize-hr: true

  Copilot:
    agents_dir: .github/copilot/agents
    agent_ext: .md
    context_file: .github/copilot/COPILOT.md
    context_template: templates/configs/COPILOT.project-template.md
    has_rules: true
    rules_dir: .github/copilot/rules
    has_hooks: false
    has_commands: false
    has_settings: false
    capabilities:
      - agents
      - rules
      - snippets
      - skills
      - context-managed-block
    artifact_dir: .github/copilot/artifacts
    checkpoint_dir: .meta-viz
    isolation-dirs:
      - .github/copilot/
    bash_tool_name: null
    gitignore_entries: []
    mcp-config: {}
    skills_dir: .github/copilot/skills
    snippets_dir: .github/copilot/snippets
    pending_tasks_file: .github/copilot/pending-tasks.md
    extension_dir: .github/copilot/3-project
    orchestrator_hint: "- **In GitHub Copilot (VS Code):** Nutzt den Chat mit `@orchestrator` oder wählt den Orchestrator-Agenten."
    model-tiers: {}
    model-aliases: {}
    # Data-driven agent transform (issue #629) — replaces the per-provider elif
    # branch in provider_transform.py. Copilot uses IDE-configured models, so no
    # model/memory/permission fields; sampling params and tools are stripped.
    agent-transform:
      strip-fields:
        - memory
        - permissionMode
        - temperature
        - top_p
        - top_k
        - stop_sequences
        - max_output_tokens
        - tools
      strip-claude-lines: true

  Mammouth:
    agents_dir: .mammouth/agents
    agent_ext: .md
    context_file: MAMMOUTH.md
    context_template: templates/configs/AGENTS.project-template.md
    has_rules: true
    rules_dir: .mammouth/rules
    has_hooks: true
    # hooks_dir/settings_file stay configured (path-collision test coverage,
    # see tests/test_provider_hooks_config.py), but NO hook_protocol is set
    # here deliberately: whether Mammouth actually understands Claude Code's
    # hook contract is unverified (issue #630). Without a matching
    # hook_protocol, provider_hooks_supported() (providers.py) skips actually
    # mirroring hook scripts — set hook_protocol: claude-code-json once
    # verified.
    hooks_dir: .mammouth/hooks
    has_commands: true
    has_settings: true
    settings_file: .mammouth/settings.json
    capabilities:
      - agents
      - rules
      - hooks
      - commands
      - settings
      - snippets
      - skills
      - context-managed-block
    artifact_dir: .mammouth/artifacts
    checkpoint_dir: .meta-viz
    isolation-dirs:
      - .mammouth/
      - MAMMOUTH.md
    bash_tool_name: bash
    gitignore_entries:
      - .mammouth/pending-tasks.md
    mcp-config: {}
    skills_dir: .mammouth/skills
    snippets_dir: .mammouth/snippets
    pending_tasks_file: .mammouth/pending-tasks.md
    extension_dir: .mammouth/3-project
    orchestrator_hint: "- **In Mammouth:** Nutzt den Orchestrator-Agenten."
    model-tiers:
      nano:     claude-haiku-4-5-20251001
      fast:     claude-haiku-4-5-20251001
      balanced: claude-sonnet-5
      powerful: claude-opus-4-8
      max:      claude-fable-5
    model-aliases:
      haiku:  claude-haiku-4-5-20251001
      sonnet: claude-sonnet-4-6
      opus:   claude-opus-4-8
      fable:  claude-fable-5
    # Data-driven agent transform (issue #629). Mammouth Code supports model,
    # permissionMode and tools; memory and sampling params are stripped.
    agent-transform:
      model: inject
      model-note-flat: true
      inject-permission-mode: true
      tools: keep
      strip-fields:
        - memory
        - temperature
        - top_p
        - top_k
        - stop_sequences
        - max_output_tokens
      strip-claude-lines: true

  Codex:
    agents_dir: .codex/agents
    agent_ext: .toml
    context_file: AGENTS.md
    context_template: templates/configs/AGENTS.project-template.md
    has_rules: true
    rules_dir: rules            # Codex reads a project-root rules/ dir (.rules files; exact naming convention = P6 check)
    has_hooks: true
    # hooks_dir is a PATH RESERVATION only (path-collision test coverage, see
    # tests/test_provider_hooks_config.py). Deliberately NO hook_protocol: the
    # Codex hook payload contract is verified (V1, 2026-09-04: stdin JSON,
    # sync blocking, hooks.json + inline [hooks], 12 Claude-identical event
    # names) but NOT 1:1 Claude-compatible — continue/stopReason/suppressOutput
    # are unsupported for PreToolUse/PermissionRequest, and Codex skips
    # non-hash-trusted hooks until an interactive /hooks review, so mirrored
    # scripts would not run by default (#630 pattern). Set hook_protocol once
    # the deviations are handled.
    hooks_dir: .codex/hooks
    has_commands: false         # slash-command surface unverified — P6 item
    has_settings: false         # no settings.json — everything lives in .codex/config.toml (V8)
    capabilities:
      - agents
      - rules
      - hooks
      - snippets
      - skills
      - context-managed-block
    artifact_dir: .codex/artifacts
    checkpoint_dir: .meta-viz
    isolation-dirs:
      - .codex/
      - AGENTS.md
    bash_tool_name: Bash        # V4 (2026-09-04): canonical hook/matcher name; apply_patch matches as Edit/Write alias
    gitignore_entries:
      - .codex/pending-tasks.md
    mcp-config:
      # NO secrets-file: Codex has no include/import mechanism for a second
      # TOML file (V8, 2026-09-04) — the documented secrets strategy is
      # env-var indirection in the committed config.toml.
      committed-file: .codex/config.toml
      format: codex-toml-mcp
    skills_dir: .agents/skills  # Codex reads user -> repo -> directory (repo-level .agents/skills)
    snippets_dir: .codex/snippets
    pending_tasks_file: .codex/pending-tasks.md
    extension_dir: .codex/3-project
    orchestrator_hint: "- **In Codex:** Use the orchestrator agent."
    # Model tiers per plan §4.3 (GPT-5.x family, state 2026-09)
    model-tiers:
      nano:     gpt-5.4-mini
      fast:     gpt-5.4
      balanced: gpt-5.3-codex-spark
      powerful: gpt-5.5
      max:      gpt-5.6
    model-aliases:
      sol:   gpt-5.6-sol
      terra: gpt-5.6-terra
      luna:  gpt-5.6-luna
    # Data-driven agent transform (issue #629). Codex agents are TOML files
    # (.codex/agents/*.toml, auto-loaded — V7): the codex-toml frontmatter
    # mechanism builds the native TOML document (name, description, model,
    # sandbox_mode, developer_instructions — V7 correction: the required
    # body field is developer_instructions, NOT instructions).
    agent-transform:
      frontmatter-mechanism: codex-toml
      model: inject
      extra-fields:
        sandbox_mode: workspace-write
      tools: skip
      strip-claude-lines: true

  ZCode:
    agents_dir: .zcode/agents
    agent_ext: .md
    context_file: AGENTS.md
    context_template: templates/configs/AGENTS.project-template.md
    has_rules: false            # unverified
    has_hooks: false            # project-level hooks are IGNORED by the harness (V2: config_project_hooks_ignored) — hooks only via plugin or user level
    has_commands: false         # commands surface verified (V2) but no sync adapter yet — grows with P6
    has_settings: true
    settings_file: .zcode/config.json   # canonical workspace config (V6); models are UI-managed in ~/.zcode/v2/config.json (V9) — no settings_template
    capabilities:
      - agents
      - settings
      - mcp
      - context-managed-block
    artifact_dir: .zcode/artifacts
    checkpoint_dir: .meta-viz
    isolation-dirs:
      - .zcode/
      - AGENTS.md
    bash_tool_name: Bash        # V5 (2026-09-04): 9 built-ins + Agent dispatch, all 1:1 names
    gitignore_entries:
      - .zcode/pending-tasks.md
    mcp-config:
      # ZCode workspace MCP lives under the NESTED key `mcp.servers` in
      # .zcode/config.json (V2, 2026-09-04). User-level config wins, no merge.
      committed-file: .zcode/config.json
      format: zcode-json
    skills_dir: .zcode/skills   # verified V2 (workspace scope) — capability growth with P6
    snippets_dir: .zcode/snippets
    pending_tasks_file: .zcode/pending-tasks.md
    extension_dir: .zcode/3-project
    orchestrator_hint: "- **In ZCode:** Use the orchestrator agent."
    # V9 (2026-09-04): verified built-in IDs glm-5.3 + glm-5.3-flash.
    # model.lite -> nano/fast tier, model.main -> balanced/powerful/max.
    model-tiers:
      nano:     glm-5.3-flash
      fast:     glm-5.3-flash
      balanced: glm-5.3
      powerful: glm-5.3
      max:      glm-5.3
    model-aliases: {}
    # V9 revision: ZCode subagent files support a `model` frontmatter field
    # (ID or inherit) — per-role models resolve directly in the generated
    # agent files, so model is INJECTED (not skipped as plan §5.3 sketched).
    # Unknown frontmatter keys are ignored by the harness (V2).
    agent-transform:
      model: inject
      tools: skip
      strip-fields: [memory, permissionMode, temperature, top_p, top_k, stop_sequences, max_output_tokens]
      strip-claude-lines: true

  KimiCode:
    # Registry key KimiCode stays unambiguous vs. the existing Opencode model
    # aliases kimi/kimi-code (see Opencode block model-aliases). Generated
    # paths are lowercase .kimi-code/ (V10 cross-cutting correction — NEVER
    # .kimi/ and never the cross-tool .agents/ convention).
    agents_dir: .kimi-code/agents
    agent_ext: .md
    context_file: AGENTS.md
    context_template: templates/configs/AGENTS.project-template.md
    has_rules: false            # unverified
    has_hooks: false            # hooks are configured via [[hooks]] in user-level ~/.kimi-code/config.toml only (V11) — no hooks-dir mechanism, no project-level generation
    has_commands: false         # unverified
    has_settings: false         # V15: project-level config (.kimi-code/local.toml) is machine-specific — deferred until a real need is verified
    capabilities:
      - agents
      - mcp
      - context-managed-block
    artifact_dir: .kimi-code/artifacts
    checkpoint_dir: .meta-viz
    isolation-dirs:
      - .kimi-code/
      - AGENTS.md
    bash_tool_name: Bash        # V14 (2026-09-04): exact case-sensitive name, 4 doc sources
    gitignore_entries:
      - .kimi-code/pending-tasks.md
    mcp-config:
      # Kimi Code reads {"mcpServers": {...}} from .kimi-code/mcp.json —
      # wire-identical top-level key to the existing claude-settings JSON
      # branch (V13, 2026-09-04: reuse beats a new format branch). No
      # separate secrets file — Kimi-native env indirection via
      # bearerTokenEnvVar / env (P6 detail).
      committed-file: .kimi-code/mcp.json
      format: claude-settings
    skills_dir: .kimi-code/skills   # verified V12 — capability growth with P6
    snippets_dir: .kimi-code/snippets
    pending_tasks_file: .kimi-code/pending-tasks.md
    extension_dir: .kimi-code/3-project
    orchestrator_hint: "- **In Kimi Code:** Use the orchestrator agent."
    # Kimi K2.x model IDs per plan §6.5 / opencode-go catalog — exact IDs verified in P6
    model-tiers:
      nano:     kimi-k2.6
      fast:     kimi-k2.6
      balanced: kimi-k2.7-code
      powerful: kimi-k2.7-code
      max:      kimi-k2.7-code
    model-aliases: {}
    # Option A posture (V10 determined, 2026-09-04): Kimi agents are plain
    # Markdown + YAML frontmatter (name/description/whenToUse/tools/...,
    # unknown fields ignored) — DEFAULT transform path, no new
    # frontmatter-mechanism value.
    agent-transform:
      model: inject
      tools: keep
      strip-fields: [memory, temperature, top_p, top_k, stop_sequences, max_output_tokens]
      strip-claude-lines: true
