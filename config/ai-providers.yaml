      powerful: glm-5.3
      max: glm-5.3
    model-aliases: {}
    agent-transform:
      model: inject
      tools: skip
      strip-fields:
      - memory
      - permissionMode
      - temperature
      - top_p
      - top_k
      - stop_sequences
      - max_output_tokens
      tools-format: skip
      tool-name-map: {}
      reject-fields: []
      strip-claude-lines: true
  KimiCode:
    agents_dir: .kimi-code/agents
    agent_ext: .md
    # F2/H6/OQ-3: only runtime-verified kimi-code/... aliases are emitted; the
    # catalog lists the formatted model-tiers values plus the runtime aliases
    # observed via `kimi provider list --json`. Bare IDs are forbidden.
    surface-version: "v1"
    agent-discovery: false
    model-format: "kimi-code/{model}"
    model-catalog:
    - kimi-code/kimi-k2.6
    - kimi-code/kimi-k2.7-code
    - kimi-code/kimi-for-coding
    - kimi-code/kimi-for-coding-highspeed
    - kimi-code/k3
    - kimi-code/k3-256k
    context_file: AGENTS.md
    context_template: templates/configs/AGENTS.project-template.md
    # IC-15 Nr. 9 / F-07 (#971): KimiCode does not read AGENTS.personal.md.
    personal_agents_file: false
    has_rules: false
    has_hooks: false
    # Commands (issue #807): Kimi Code CLI exposes slash commands as
    # (a) built-ins and (b) Active Skills (`/skill:<name>`) — the docs
    # document no project-level custom-command directory. Kimi's command-like
    # surface is the already-synced `.kimi-code/skills/` tree, not a
    # commands/*.md drop. commands: false is the verified capability decision
    # (docs audit KC-2, 2026-09-30), not a silent default.
    has_commands: false
    has_settings: false
    capabilities:
    - agents
    - skills
    - mcp
    - context-managed-block
    artifact_dir: .kimi-code/artifacts
    checkpoint_dir: .meta-viz
    isolation-dirs:
    - .kimi-code/
    - AGENTS.md
    bash_tool_name: Bash
    provider_root_dirs:
    - .kimi-code/
    gitignore_entries:
    - .kimi-code/pending-tasks.md
    - AGENTS.personal.md
    mcp-config:
      committed-file: .kimi-code/mcp.json
      # F11/KC-1: KimiCode discriminates remote transport via `transport: sse`.
      format: kimi-json
    skills_dir: .kimi-code/skills
    snippets_dir: .kimi-code/snippets
    pending_tasks_file: .kimi-code/pending-tasks.md
    extension_dir: .kimi-code/3-project
    orchestrator_hint: '- **In Kimi Code:** Use the orchestrator agent.'
    model-tiers:
      nano: kimi-k2.6
      fast: kimi-k2.6
      balanced: kimi-k2.7-code
      powerful: kimi-k2.7-code
      max: kimi-k2.7-code
    model-aliases: {}
    agent-transform:
      model: inject
      tools: keep
      tools-format: keep
      # F-10/IC-15 Nr. 5: KimiCode reads `whenToUse` (not `hint`), the native
      # todo tool is `TodoList` (not `TodoWrite`) and the dispatcher needs an
      # explicit `subagents:` allow-list plus the AgentSwarm fan-out tool.
      tool-name-map:
        TodoWrite: TodoList
      rename-fields:
        hint: whenToUse
      subagents-allowlist: routable
      reject-fields: []
      strip-fields:
      - memory
      - temperature
      - top_p
      - top_k
      - stop_sequences
      - max_output_tokens
      strip-claude-lines: true
