    has_settings: false
    capabilities:
    - agents
    - rules
    - snippets
    - skills
    - context-managed-block
    - mcp
    artifact_dir: .mammouth/artifacts
    checkpoint_dir: .meta-viz
    isolation-dirs:
    - .mammouth/
    gitignore_entries:
    - .mammouth/settings.local.json
    mcp-config: {}
    skills_dir: .mammouth/skills
    snippets_dir: .mammouth/snippets
    pending_tasks_file: .mammouth/pending-tasks.md
    extension_dir: .mammouth/3-project
    orchestrator_hint: '- **In Mammouth Code:** Nutzt den Befehl `mammouth` im Terminal
      und referenziert `@orchestrator`.'
    model-tiers:
      nano: deepseek-v4-flash
      fast: deepseek-v4-flash
      balanced: deepseek-v4-pro
      powerful: kimi-k2.6
      max: glm-5.2
      ultra: glm-5.2
    model-aliases: {}
