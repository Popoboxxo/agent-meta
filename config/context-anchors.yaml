# Anchor registry (IC-12, SPEC-CONTEXT-PROFILES-2026-10-11).
# Literal substrings that must stay findable in the rendered artifacts of every
# provider, independent of the context profile. Checked by
# tests/test_context_anchors.py (QG-3).
#
# anchors.<artifact-kind>.all-profiles : required in profile `full` and `compact`
# anchors.<artifact-kind>.compact-only : additionally required in profile `compact`
# Kinds: entry-file | claude-md | orchestrator | rules-native | gate-card
#
# Provider-independent: a rule anchor must be found in the provider's native
# rules directory or, if the provider has none, inlined in its entry file.
#
# Notes:
# - Anchors are literal wording, not semantic: a deliberate text change (e.g.
#   "Verwende Conventional Commits (feat, fix, chore).", the Anti-Recursion
#   sentence) breaks the test on purpose and must be re-anchored consciously.
# - MCP deny-token anchors (`delete_conclusion`, `set_config`,
#   `browser_run_code_unsafe`, `workspace.delete`) are pinned under
#   `gate-card.compact-only`; they are only rendered when an MCP server is
#   active, so the compact render uses tests/fixtures/mcp-active (AC-24/QG-3).
# - The compact-only surfaces live in the shared AGENTS.md managed block (gate
#   card + one-line agent list, IC-06) and in the Claude maintainer notes (IC-08);
#   `rules-native` has no compact-only addition, so its list stays empty.
# - `entry-file.compact-only` pins the compact AGENT ROSTER bullets. C2/C3/IC-06
#   gates that roster on the reader's `roster_in_harness` capability: a provider
#   whose harness owns the roster renders NO list, so test_context_anchors.py
#   asserts these anchors present iff the roster is emitted (capability-driven).
anchors:
  entry-file:
    all-profiles: []
    compact-only:
      - "- `orchestrator`:"
      - "- `developer`:"
  claude-md:
    all-profiles:
      - "## Projekt\n\n**Name:**"
      - "## Agenten-Konfiguration\n\n<!-- agent-meta:managed-begin -->"
    compact-only:
      - "<!--\nGeneriert von agent-meta v"
  orchestrator:
    all-profiles:
      - "Singleton-Regel"
      - "STATUS: done"
      - "RESULT: <"
      - "ARTIFACTS:"
    compact-only:
      - "_wf-orchestrator-reference.md"
      - "<pipeline>.md"
  rules-native:
    all-profiles:
      - "# CRITICAL GATE"
      - "MAIN CHAT darf nicht selbst editieren"
      - "Anti-Recursion: Worker dürfen nicht an `orchestrator` zurück delegieren."
      - "# MCP Hard Prohibitions"
      - "# Branch-Guard"
      - "Keine Code-Änderungen direkt auf `main` oder `master`"
      - "# Sprachregeln"
      - "# Commit-Konventionen"
      - "Verwende Conventional Commits (feat, fix, chore)."
    compact-only: []
  gate-card:
    all-profiles: []
    compact-only:
      - "# CRITICAL GATE"
      - "MAIN CHAT darf nicht selbst editieren"
      - "## Git Delegation"
      - "Anti-Recursion: Worker dürfen nicht an `orchestrator` zurück delegieren."
      - "# Branch-Guard"
      - "Keine Code-Änderungen direkt auf `main` oder `master`"
      - "# Commit-Konventionen"
      - "Verwende Conventional Commits (feat, fix, chore)."
      - "# Sprachregeln"
      - "## Enforced Gates (aktiv prüfen — HARD REJECT)"
      - "Orchestrator-Singleton:"
      - "# MCP Hard Prohibitions"
      - "`delete_conclusion`, `set_config`"
      - "`browser_run_code_unsafe`"
      - "`workspace.delete`"

# Sections the compact gate-card extracts from source rules (IC-06):
# <rule-stem>#<heading>
gate_card_sections:
  - "use-orchestrator#CRITICAL GATE"
  - "use-orchestrator#Git Delegation"
  - "branch-guard#Branch-Guard"
  - "commit-conventions#Commit-Konventionen"
  - "language#Sprachregeln"
  - "a2a-delegation-gates#Enforced Gates"
  - "mcp-guardrails#MCP Hard Prohibitions"

# Paths (globs) that are deliberately never read by a provider (IC-10 unread check).
# Entry form: a glob string, or {glob: <pattern>, reason: <text>} (preferred).
intentional_unread: []

# Declared surfaces that are deliberately empty (IC-10 context.declared-surface-empty):
# - provider_capability: <surface>
#   reason: <text>
intentional_empty: []
