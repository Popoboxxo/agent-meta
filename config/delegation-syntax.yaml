# Provider Delegation Syntax Registry
# Maps abstract {{PAL_*}} placeholders to provider-specific syntax.
# Used by scripts/lib/delegation_syntax.py during agent generation.
#
# IMPORTANT: Do NOT use {{var}} syntax in delegate/fanout/parallel_group values —
# those look like unresolved sync.py placeholders and confuse the LLM at runtime.
# Use <angle-brackets> for runtime slots the LLM fills in.

delegation_syntax:
  Claude:
    delegate: "Delegiere via `Agent(subagent_type=\"<ziel-agent>\", prompt=\"<vollständiger-task-text>\"). Ersetze `<ziel-agent>` mit dem Agenten-Namen (z.B. `developer`) und `<vollständiger-task-text>` mit der vollständigen Aufgabenbeschreibung."
    fanout: "FANOUT — Alle Agent()-Aufrufe in EINER Antwort absetzen, dann laufen sie parallel:\n```\nAgent(subagent_type=\"<agent_1>\", prompt=\"<task_1>\")\nAgent(subagent_type=\"<agent_2>\", prompt=\"<task_2>\")\n# Beide Calls in derselben Antwort → parallele Ausführung\n```"
    parallel_group: "PARALLEL_GROUP — Hintergrund-Tasks mit `run_in_background=True`, Vordergrund-Tasks normal:\n```\nAgent(subagent_type=\"<fg_agent>\", prompt=\"<fg_task>\")\nAgent(subagent_type=\"<bg_agent>\", prompt=\"<bg_task>\", run_in_background=True)\n# Beide Calls in derselben Antwort absetzen\n```"
    fallback: "Delegiere diese Aufgabe via `Agent(subagent_type=\"orchestrator\", prompt=\"<task>\")` an den Orchestrator."
    bootstrap: "file-based"
    tool_preamble: "true"
    parallel_pattern: "**Parallel-Pattern (konkret):**\n```\n# Vordergrund:\nAgent(subagent_type=\"validator\", prompt=\"DoD-Check für ...\")\n# Gleichzeitig im Hintergrund:\nAgent(subagent_type=\"documenter\", prompt=\"Update CODEBASE_OVERVIEW ...\", run_in_background=True)\n# Dann warten bis Hintergrund fertig, dann:\nAgent(subagent_type=\"git\", prompt=\"Commit und PR erstellen ...\")\n```\n"
    handoff: &handoff-json |
      **A2A Handoff Protocol:**
      Jede Delegation MUSS als strukturiertes A2A-Envelope (JSON) erfolgen.
      Füge den JSON-Envelope VOR dem Delegation-Tool-Call in den Prompt ein:
      ```json
      {"protocol_version":"1.0.0","handoff_id":"HOFF-YYYYMMDD-NNN","source_agent":"<quelle>","target_agent":"<ziel>","schema_ref":"<schema-uri>","payload":{...},"trace_parent":"<parent-HOFF>"}
      ```
      FANOUT mit gleichem target: batch:true, payload als Array.

  Opencode:
    delegate: "Delegiere via `task(subagent_type=\"<ziel-agent>\", description=\"<kurzbeschreibung>\", prompt=\"<vollständiger-task-text>\"). Ersetze die Platzhalter entsprechend."
    fanout: "FANOUT — Alle task()-Calls in EINER Antwort absetzen, dann laufen sie parallel:\n```\ntask(subagent_type=\"<agent_1>\", description=\"<desc_1>\", prompt=\"<task_1>\")\ntask(subagent_type=\"<agent_2>\", description=\"<desc_2>\", prompt=\"<task_2>\")\n# Alle Calls in derselben Antwort → parallele Ausführung\n```"
    parallel_group: "PARALLEL_GROUP — Mehrere task()-Calls mit verschiedenen subagent_type in einer Antwort:\n```\ntask(subagent_type=\"<agent_fg>\", description=\"<desc>\", prompt=\"<task>\")\ntask(subagent_type=\"<agent_bg>\", description=\"<desc>\", prompt=\"<task>\")\n```"
    fallback: "@orchestrator <task>"
    bootstrap: "file-based"
    tool_preamble: "true"
    parallel_pattern: "**Parallel-Dispatch (Opencode):**\nFANOUT: Alle N task()-Calls in EINER Antwort-Nachricht. Kein separater Background-Marker.\nPARALLEL_GROUP: Mehrere task()-Calls mit verschiedenen subagent_type in einer Antwort.\nBARRIER: Automatisch — die Antwort kommt erst wenn alle Tasks fertig sind.\n\n```\n# FANOUT(3, developer, [\"Fix A\", \"Fix B\", \"Fix C\"]):\ntask(subagent_type=\"developer\", description=\"Fix Bug A\", prompt=\"...\")\ntask(subagent_type=\"developer\", description=\"Fix Bug B\", prompt=\"...\")\ntask(subagent_type=\"developer\", description=\"Fix Bug C\", prompt=\"...\")\n# Alle drei Calls in derselben Antwort → parallele Ausführung\n# Ergebnisse: task_results als Array [result_A, result_B, result_C]\n```\n\nLimit: Kein hartes Limit. MAX_PARALLEL_AGENTS steuert die Anzahl.\n"
    handoff: *handoff-json

  Gemini:
    delegate: "Rufe den **<ziel-agent>-Agenten** auf mit der Aufgabe: \"<vollständiger-task-text>\". Ersetze `<ziel-agent>` und `<vollständiger-task-text>` entsprechend."
    fanout: "Bearbeite folgende unabhängige Aufgaben — die Gemini-Runtime parallelisiert automatisch bei separaten Tool-Calls:\n1. <task_1> → <agent_1>\n2. <task_2> → <agent_2>"
    parallel_group: "Delegiere diese unabhängigen Teilaufgaben — Gemini führt sie automatisch parallel aus:\n1. <task_1> → <agent_1>\n2. <task_2> → <agent_2>"
    fallback: "Bearbeite folgende Aufgabe selbst, mit höchster Sorgfalt: <task>"
    bootstrap: "api-define_subagent"
    bootstrap_sequence:
      - type: "api_call"
        template: 'define_subagent(name="<name>", description="<description>", system_prompt="<prompt>")'
    tool_preamble: "false"
    auto_parallel: true
    parallel_pattern: "**Parallel-Pattern (konkret):**\nGemini Code Assist führt unabhängige Tool-Aufrufe parallel aus.\nDelegiere an mehrere Agenten in einem einzigen Prompt — die Ausführung erfolgt automatisch parallelisiert.\n"
    handoff: *handoff-json

  Continue:
    delegate: "@<ziel-agent> <vollständiger-task-text>"
    fanout: "Führe folgende Aufgaben nacheinander aus (Continue unterstützt keine parallele Subagent-Ausführung):\n1. @<agent_1> <task_1>\n2. @<agent_2> <task_2>"
    parallel_group: "Führe folgende Aufgaben nacheinander aus:\n1. @<agent_1> <task_1>\n2. @<agent_2> <task_2>"
    fallback: "@orchestrator <task>"
    bootstrap: "config-based"
    bootstrap_sequence:
      - type: "config_update"
        target: ".continue/config.yaml"
    tool_preamble: "false"
    auto_parallel: false
    parallel_pattern: "**Parallel-Pattern:**\nContinue unterstützt keine native parallele Subagent-Ausführung.\nFühre parallele Schritte sequentiell aus oder verwende separate Continue-Sessions.\n"
    handoff: &handoff-yaml |
      **A2A Handoff Protocol — YAML-Fallback:**
      Continue: kein natives JSON-Tool. Verwende YAML-Text-Block:
      ```yaml
      a2a_handoff:
        protocol_version: "1.0.0"
        handoff_id: "HOFF-YYYYMMDD-NNN"
        source_agent: "<quelle>"
        target_agent: "<ziel>"
        schema_ref: "<schema-uri>"
        trace_parent: "<parent-HOFF>"
        payload:
          t: "<task>"
          pri: "<priority>"
      ```
      Dann: @<ziel> Bearbeite diesen strukturierten Handoff.

  Copilot:
    delegate: "@<ziel-agent> Führe folgende Aufgabe aus: <vollständiger-task-text>"
    fanout: "Bearbeite diese Aufgaben der Reihe nach:\n1. @<agent_1> <task_1>\n2. @<agent_2> <task_2>"
    parallel_group: "Bearbeite diese Aufgaben:\n1. @<agent_1> <task_1>\n2. @<agent_2> <task_2>"
    fallback: "Bearbeite: <task>"
    bootstrap: "file-based"
    tool_preamble: "false"
    auto_parallel: false
    parallel_pattern: "**Parallel-Pattern:**\nGitHub Copilot unterstützt keine native parallele Subagent-Ausführung.\nFühre parallele Schritte sequentiell aus oder verwende separate VS Code-Sessions.\n"
    handoff: *handoff-yaml

  # Conservative, text-based delegation for Mammouth (CLI-first, no documented
  # native subagent/tool-call API). Mirrors the Copilot lean-provider pattern so
  # PAL_* placeholders resolve to working syntax instead of being silently
  # stripped. Sequential only, YAML text-block handoff (no JSON envelope).
  Mammouth:
    delegate: "@<ziel-agent> Führe folgende Aufgabe aus: <vollständiger-task-text>"
    fanout: "Bearbeite diese Aufgaben der Reihe nach:\n1. @<agent_1> <task_1>\n2. @<agent_2> <task_2>"
    parallel_group: "Bearbeite diese Aufgaben nacheinander:\n1. @<agent_1> <task_1>\n2. @<agent_2> <task_2>"
    fallback: "Bearbeite: <task>"
    bootstrap: "file-based"
    tool_preamble: "false"
    auto_parallel: false
    parallel_pattern: "**Parallel-Pattern:**\nMammouth Code unterstützt keine native parallele Subagent-Ausführung.\nFühre parallele Schritte sequentiell aus oder verwende separate Mammouth-Sessions.\n"
    handoff: *handoff-yaml

  # Codex (V7, 2026-09-04): native dispatch surface is spawn_agent +
  # send_input/resume_agent/wait_agent/close_agent; multi_agent is stable
  # default-on, so fan-out is multiple spawn_agent calls in one response.
  # JSON handoff (handoff_envelope_support: true).
  Codex:
    delegate: "Delegiere via nativen `spawn_agent`-Toolcall an `<ziel-agent>` mit der Aufgabe: \"<vollständiger-task-text>\". Kontrolliere das Ergebnis via `wait_agent`."
    fanout: "FANOUT — Alle spawn_agent-Calls in EINER Antwort absetzen (multi_agent ist stable default-on):\n```\nspawn_agent(agent=\"<agent_1>\", task=\"<task_1>\")\nspawn_agent(agent=\"<agent_2>\", task=\"<task_2>\")\n```\nErgebnisse via `wait_agent` einsammeln."
    parallel_group: "PARALLEL_GROUP — Mehrere spawn_agent-Calls in einer Antwort; `wait_agent` sammelt alle Ergebnisse ein."
    fallback: "Bearbeite: <task>"
    bootstrap: "file-based"
    tool_preamble: "false"
    auto_parallel: false
    parallel_pattern: "**Parallel-Pattern (konkret):**\n```\nspawn_agent(agent=\"developer\", task=\"Fix A\")\nspawn_agent(agent=\"tester\", task=\"Tests für B\")\nwait_agent(...)  # Ergebnisse einsammeln\n```\n"
    handoff: *handoff-json

  # ZCode (V17, 2026-09-04): dispatch tool is Agent (legacy alias Task);
  # background execution via run_in_background + subagents.autoBackgroundMs.
  # Conservative YAML text-block handoff (handoff_envelope_support: false).
  ZCode:
    delegate: "Delegiere via `Agent(subagent_type=\"<ziel-agent>\", prompt=\"<vollständiger-task-text>\")`. Für Hintergrund-Ausführung `run_in_background: true` setzen (Auto-Backgrounding via subagents.autoBackgroundMs, Ergebnis über /tasks)."
    fanout: "FANOUT — Alle Agent-Calls in EINER Antwort absetzen:\n```\nAgent(subagent_type=\"<agent_1>\", prompt=\"<task_1>\")\nAgent(subagent_type=\"<agent_2>\", prompt=\"<task_2>\")\n```"
    parallel_group: "PARALLEL_GROUP — Vordergrund-Calls normal, Hintergrund-Calls mit `run_in_background: true`; alle Calls in derselben Antwort absetzen."
    fallback: "Bearbeite: <task>"
    bootstrap: "file-based"
    tool_preamble: "false"
    auto_parallel: false
    parallel_pattern: "**Parallel-Pattern (konkret):**\n```\nAgent(subagent_type=\"validator\", prompt=\"DoD-Check für ...\")\nAgent(subagent_type=\"documenter\", prompt=\"Update CODEBASE_OVERVIEW ...\", run_in_background=true)\n# Hintergrund-Ergebnis später über /tasks abholen\n```\n"
    handoff: *handoff-yaml

  # Kimi Code (V16, 2026-09-04): Agent for single dispatch, AgentSwarm for
  # uniform fan-out (prompt_template + items, up to 128, aggregated report).
  # Conservative YAML text-block handoff (handoff_envelope_support: false).
  KimiCode:
    delegate: "Delegiere via `Agent(prompt=\"<vollständiger-task-text>\", description=\"<kurzbeschreibung>\", subagent_type=\"<ziel-agent>\")`."
    fanout: "FANOUT — Für gleichförmige Fan-out-Aufgaben `AgentSwarm` nutzen:\n```\nAgentSwarm(prompt_template=\"<task_template>\", items=[<item_1>, <item_2>, ...])\n```\n(bis 128 Items, aggregierter Report). Alternativ mehrere Agent-Calls in einer Antwort."
    parallel_group: "PARALLEL_GROUP — AgentSwarm mit prompt_template + items-Array für den Fan-out; einzelne abweichende Aufgaben als separate Agent-Calls in derselben Antwort."
    fallback: "Bearbeite: <task>"
    bootstrap: "file-based"
    tool_preamble: "false"
    auto_parallel: false
    parallel_pattern: "**Parallel-Pattern (konkret):**\n```\nAgentSwarm(prompt_template=\"Review {item}\", items=[\"modul_a\", \"modul_b\", \"modul_c\"])\n# einziger Toolcall pro Response, aggregierter Report\n```\n"
    handoff: *handoff-yaml
