# DoD presets. Override via 'dod-preset' or per-field 'dod' in project.yaml.
# Precedence: dod > dod-preset > full.

presets:
  full:                 # enterprise / regulated
    req-traceability: true
    tests-required: true
    codebase-overview: true
    security-audit: false
    se-required: "false"

  standard:             # tests, no REQs / overview
    req-traceability: false
    tests-required: true
    codebase-overview: false
    security-audit: false

  rapid-prototyping:    # minimal overhead
    req-traceability: false
    tests-required: false
    codebase-overview: false
    security-audit: false

  spec-optional:        # SE available, not mandatory
    req-traceability: false
    tests-required: true
    codebase-overview: false
    security-audit: false
    se-required: "false"

  spec-driven:          # SE recommended for complex features
    req-traceability: true
    tests-required: true
    codebase-overview: false
    security-audit: false
    se-required: "recommended"

  spec-certified:       # regulated environments
    req-traceability: true
    tests-required: true
    codebase-overview: true
    security-audit: true
    se-required: "true"
