version: 1.0.0
plugins:
  home-assistant:
    kind: mcp-server
    origin-type: remote-saas
    availability-probe: http-head
    description: Home Assistant real-time device status, sensors, datetime and read-only
      data
    category: iot
    enabled-by-default: false
    tools:
      allowed:
      - GetLiveContext
      - GetDateTime
      - todo_get_items
      blocked:
      - HassTurnOn
      - HassTurnOff
      - HassLightSet
      - HassCallService
      - HassSetVolume
      - HassBroadcast
      - HassMediaPlay
      - HassMediaPause
    agent-hint: 'Primäres Tool: GetLiveContext für Echtzeit-Status.

      Schreibende Operationen sind ABSOLUT VERBOTEN — kein HassTurnOn, HassTurnOff
      etc.

      Gerätesteuerung nur über HA-App, Dashboard oder Sprachassistent.

      '
    connection:
      type: sse
      url: '{{MCP_HA_URL}}/api/mcp'
      headers:
        Authorization: Bearer {{MCP_HA_TOKEN}}
    secrets:
    - MCP_HA_URL
    - MCP_HA_TOKEN
  influxdb:
    kind: mcp-server
    origin-type: local-process
    availability-probe: npx-resolve
    description: InfluxDB time-series database for historical trends and analysis
      via Flux
    category: database
    enabled-by-default: false
    tools:
      allowed:
      - query
      blocked:
      - write
      - create_bucket
      - delete_bucket
      - update_retention
      - delete_measurement
    agent-hint: 'Nur für historische Zeitreihendaten und Trend-Analysen via Flux-Queries.

      Schreiben, Bucket-Verwaltung und Retention-Änderungen sind VERBOTEN.

      Timestamps: InfluxDB speichert UTC — Abfragefenster entsprechend anpassen.

      '
    connection:
      type: stdio
      command: npx
      args:
      - -y
      - influxdb-mcp-server
      env:
        INFLUXDB_URL: '{{MCP_INFLUXDB_URL}}'
        INFLUXDB_TOKEN: '{{MCP_INFLUXDB_TOKEN}}'
        INFLUXDB_ORG: '{{MCP_INFLUXDB_ORG}}'
        INFLUXDB_BUCKET: '{{MCP_INFLUXDB_BUCKET}}'
    secrets:
    - MCP_INFLUXDB_URL
    - MCP_INFLUXDB_TOKEN
    - MCP_INFLUXDB_ORG
    - MCP_INFLUXDB_BUCKET
  viz-logger:
    kind: mcp-server
    origin-type: repo-owned-process
    availability-probe: always
    description: agent-meta visualization event logger — tracks agent_start, delegate_out,
      agent_end for graph generation
    category: agent-meta
    enabled-by-default: true
    tools:
      allowed:
      - log_viz_event
    agent-hint: 'Nutze log_viz_event um Agenten-Starts, Delegationen und Beendigungen
      zu protokollieren.

      Parameter: event (agent_start|delegate_out|agent_end), agent, provider, status,
      target, caller, task_id, payload.

      '
    connection:
      type: stdio
      command: python
      args:
      - scripts/viz-logger.py
      - --mcp
    secrets: []
  a2a-handoff:
    kind: mcp-server
    origin-type: repo-owned-process
    availability-probe: always
    description: 'A2A Handoff Protocol tools: schema validation and route resolution'
    category: agent-meta
    enabled-by-default: true
    tools:
      allowed:
      - validate_handoff
      - resolve_handoff_schema
      - resolve_handoff
    agent-hint: 'validate_handoff: Prüft A2A-Envelope gegen referenziertes Schema.

      resolve_handoff_schema: Liefert Schema-URI für source-target Route.

      resolve_handoff: Rekonstruiert Envelope aus Event-Log (für Supersession-History).

      '
    connection:
      type: stdio
      command: python
      args:
      - scripts/viz-logger.py
      - --mcp
      - --mode
      - a2a
    secrets: []
  honcho:
    kind: mcp-server
    origin-type: remote-saas
    availability-probe: http-head
    description: Honcho local memory and context server
    category: memory
    enabled-by-default: false
    tools:
      allowed:
      - chat
      - get_context
      - get_representation
      - search
      - list_conclusions
      - create_conclusion
      blocked:
      - delete_conclusion
      - set_config
    agent-hint: 'Honcho bietet persistentes Cross-Session-Memory. Verwende diese Tools immer, wenn du Informationen über frühere Interaktionen, Architektur-Entscheidungen oder Nutzer-Präferenzen über Sessions hinweg benötigst oder speichern musst.

      get_context: Wann nutzen? Um den aktuellen Sitzungskontext zu Beginn der Aufgabe zu laden.
      search: Wann nutzen? Bei Recherchen zu vergangenem Code oder historischen Entscheidungen.
      create_conclusion: Wann nutzen? Nach Abschluss eines komplexen Tasks, um Learnings für zukünftige Sessions dauerhaft zu speichern.
      list_conclusions: Wann nutzen? Um bestehende Learnings vor einer Implementierung abzurufen.
      chat: Wann nutzen? Für direkte Konversation mit dem Honcho-Backend bei Unklarheiten im Kontext.
      get_representation: Wann nutzen? Um auf personalisierte Nutzer-Einstellungen zuzugreifen.

      Destruktive Tools (delete_conclusion, set_config) sind gesperrt.
      '
    connection:
      type: sse
      url: '{{MCP_HONCHO_URL}}'
      headers:
        Authorization: 'Bearer {{MCP_HONCHO_API_KEY}}'
        X-Honcho-User-Name: '{{MCP_HONCHO_USER_NAME}}'
        X-Honcho-Assistant-Name: '{{MCP_HONCHO_ASSISTANT_NAME}}'
        X-Honcho-Workspace-ID: '{{MCP_HONCHO_WORKSPACE_ID}}'
    secrets:
    - MCP_HONCHO_URL
    - MCP_HONCHO_API_KEY
    - MCP_HONCHO_USER_NAME
    - MCP_HONCHO_ASSISTANT_NAME
    - MCP_HONCHO_WORKSPACE_ID
    provider-skip:
    - Opencode  # @honcho-ai/opencode-honcho plugin handles this provider natively
  reqogniloom:
    kind: mcp-server
    origin-type: remote-saas
    availability-probe: http-head
    description: ReqogniLoom requirements-engineering platform — requirements, architecture,
      tests, traceability and AI-assisted derivation
    category: requirements
    enabled-by-default: false
    tools:
      allowed:
      - requirement.get
      - requirement.query
      - requirement.create
      - requirement.update
      - requirement.decompose
      - requirement.validate
      - requirement.derive
      - requirement.check_consistency
      - needs.read
      - needs.create
      - needs.update
      - needs.get_traces
      - needs.derive_requirements
      - architecture.get
      - architecture.query
      - architecture.create
      - architecture.update
      - architecture.link
      - architecture.decompose
      - architecture.decompose_commit
      - test.get
      - test.query
      - test.create
      - test.update
      - test.link
      - test.run_create
      - test.run_get
      - test.run_report_results
      - test.derive_from_requirement
      - traceability.query
      - traceability.suggest_links
      - artifact.search
      - artifact.get_tree
      - workspace.get_context
      - adr.read
      - adr.create
      - adr.update
      - adr.delete
      - risk.read
      - risk.create
      - risk.update
      - risk.delete
      - issue.read
      - issue.create
      - issue.update
      - issue.delete
      - glossary.read
      - glossary.create
      - glossary.update
      - glossary.delete
      - prompt_template.get
      - ai_derivation.derive_requirements_from_need
      - ai_derivation.suggest_architecture_for_requirement
      - ai_derivation.decompose_requirement_next_level
      blocked:
      - workspace.close
      - workspace.reactivate
      - workspace.delete
      - permissions.set_rule
      - permissions.list
      - permissions.revoke
      - permissions.check
      - admin.backup_create
      - admin.backup_list
      - admin.restore
      - audit.query
      - audit.ai_review
      - events.dlq_list
      - events.dlq_replay
      - user.create
      - user.assign_role
      - user.list
      - user.deactivate
    agent-hint: 'ReqogniLoom ist die Single-Source-of-Truth für Requirements, Architektur und Test-Traceability. Verwende es immer, wenn du Features validieren oder Architekturentscheidungen nachvollziehen musst.

      requirement.query/get: Wann nutzen? Zu Beginn jeder Aufgabe, um Anforderungen und deren Kontext zu verstehen.
      requirement.create/update/decompose/derive: Wann nutzen? Während der Planungsphase, um große Features in überprüfbare Requirements zu zerlegen.
      architecture.*, test.*: Wann nutzen? Beim Systemdesign (Architecture) und TDD-Prozess (Tests) zur Verknüpfung mit Code.
      traceability.query/suggest_links: Wann nutzen? Beim Code-Review oder Validator-Gate, um die REQ-Abdeckung zu validieren.
      artifact.search/get_tree: Wann nutzen? Für tiefgreifende Recherchen über den gesamten Artefakt-Baum.
      ai_derivation.*: Wann nutzen? Wenn du komplexe, abstrakte Requirements systematisch in technische Sub-Tasks aufschlüsseln musst.

      Schreibende Tools erfordern Editor- oder Admin-Rolle. Administrative/destruktive Namespaces (admin.*, user.*, etc.) sind aus Sicherheitsgründen hart blockiert.
      '
    connection:
      type: sse
      url: '{{MCP_REQOGNILOOM_URL}}/mcp/sse/'
      headers:
        Authorization: 'Bearer {{MCP_REQOGNILOOM_API_KEY}}'
        X-Project-ID: '{{MCP_REQOGNILOOM_PROJECT_ID}}'
        X-User-ID: '{{MCP_REQOGNILOOM_USER_ID}}'
        X-Workspace-ID: '{{MCP_REQOGNILOOM_WORKSPACE_ID}}'
    secrets:
    - MCP_REQOGNILOOM_URL
    - MCP_REQOGNILOOM_API_KEY
    - MCP_REQOGNILOOM_PROJECT_ID
    - MCP_REQOGNILOOM_USER_ID
    - MCP_REQOGNILOOM_WORKSPACE_ID
  playwright:
    kind: mcp-server
    origin-type: local-process
    availability-probe: npx-resolve
    description: Playwright MCP Server for browser automation and E2E tests
    category: testing
    enabled-by-default: false
    tools:
      allowed:
      - browser_navigate
      - browser_navigate_back
      - browser_snapshot
      - browser_take_screenshot
      - browser_click
      - browser_type
      - browser_hover
      - browser_select_option
      - browser_press_key
      - browser_fill_form
      - browser_wait_for
      - browser_resize
      - browser_tabs
      - browser_network_requests
      - browser_network_request
      - browser_console_messages
      blocked:
      - browser_run_code_unsafe
      - browser_evaluate
      - browser_file_upload
      - browser_handle_dialog
    agent-hint: 'Browser-Automation für E2E-Flows, visuelle Regression und Accessibility-Audits.

      browser_navigate: zur Ziel-URL navigieren.

      browser_snapshot: Accessibility-Baum der Seite erfassen (Basis für a11y-Audit
      und stabile Selektoren).

      browser_click/browser_type/browser_fill_form: User-Interaktionen im Flow simulieren.

      browser_take_screenshot: visuelle Regression via Screenshot-Vergleich.

      browser_network_requests/browser_console_messages: Netzwerk und Konsole inspizieren.

      Arbiträre Code-Ausführung (browser_run_code_unsafe, browser_evaluate) ist gesperrt.

      '
    connection:
      type: stdio
      command: npx
      args:
      - '@playwright/mcp@latest'
      # --browser chromium: the server defaults to the 'chrome' channel, which
      # expects a system-wide Google Chrome at /opt/google/chrome and whose
      # installer calls sudo — unavailable in CI and sandboxes (issue #470).
      # Chromium ships with Playwright: `npx playwright install chromium`.
      - '--browser'
      - 'chromium'
    secrets: []
  graphify:
    kind: cli-tool
    origin-type: local-binary
    availability-probe: command-v
    binary: graphify
    description: >-
      graphify — lokal installiertes CLI-Tool. Baut das Repo als Wissensgraph
      auf (Community Detection, God Nodes, Query/Path/Explain). Wird NICHT von
      agent-meta bereitgestellt, muss lokal installiert sein.
    category: dev-tool
    enabled-by-default: false
    provider-skip: []
    rule-content: |
      ## graphify
      `graphify` ist ein lokal installiertes CLI-Tool für Architektur-/Datei-
      Beziehungsfragen. Bei Bedarf `graphify-out/` prüfen bzw. `/graphify`
      nutzen. Nicht auf dieser Maschine installiert? Die Hook-Wrapper unten
      laufen dann folgenlos durch (exit 0), nichts wird blockiert.
    hooks:
      - graphify-search-guard
      - graphify-read-guard
    permitted-injections:
      - kind: skill
        name: graphify
        description: "Claude-Code-Skill (SKILL.md + references), vom graphify-Installer selbst verwaltet"
  project-atlas:
    kind: mcp-server
    origin-type: local-process
    availability-probe: command-v
    binary: project-atlas
    description: >-
      Project Atlas — local MCP-based repo knowledge-graph tool
      (https://github.com/styler-ai/ProjectAtlas). Placeholder entry; exact
      connection.command/args verified at first real integration.
    category: dev-tool
    enabled-by-default: false
    tools:
      allowed: []
    connection:
      type: stdio
      command: project-atlas
      args: [--mcp]
    secrets: []
