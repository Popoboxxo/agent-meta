# Provider Bootstrap Registry
# Defines how agents are registered/discovered by each provider.
# Used by scripts/lib/bootstrap.py at sync time and at session start.
#
# Marker contract (spec §2.4, design §3.5):
#   marker_id        str      scoped marker id; default = provider name. Emits
#                             `<!-- agent-meta:bootstrap-begin:{marker_id} -->`
#                             … `<!-- agent-meta:bootstrap-end:{marker_id} -->`.
#   context_file     str|null explicit injection target; null -> the provider's
#                             `context_file` from config/ai-providers.yaml.
#   instructions_mode str     "static" (registry `instructions` text injected
#                             verbatim — ZCode) or "generated" (per-agent roster
#                             from agents_dir — Gemini). Only consumed by
#                             `inject-bootstrap-instructions` providers; declared
#                             uniformly so the registry is self-describing.

bootstrap:
  Claude:
    mechanism: "file-based"
    action: "none"
    marker_id: "Claude"
    context_file: null
    instructions_mode: "static"
    description: "Agenten in .claude/agents/ werden beim Kontext-Laden automatisch registriert."

  Opencode:
    mechanism: "file-based"
    action: "none"
    marker_id: "Opencode"
    context_file: null
    instructions_mode: "static"
    description: "Agenten in .opencode/agents/ werden beim Start automatisch geladen."

  Gemini:
    mechanism: "api-based"
    action: "inject-bootstrap-instructions"
    marker_id: "Gemini"
    context_file: null
    instructions_mode: "generated"
    template_file: "templates/bootstrap/gemini-session-bootstrap.md"
    description: |
      Gemini/Antigravity benötigt define_subagent API-Calls bei Session-Start.
      Die Bootstrap-Instruktionen werden in GEMINI.md injiziert.
    instructions: |
      Bei Session-Beginn MUSS der Hauptchat:
      1. Alle Dateien in .gemini/agents/ lesen.
      2. Jeden Agent via define_subagent registrieren.
      3. Dann erst Anfragen bearbeiten.

  Continue:
    mechanism: "config-based"
    action: "update-config"
    marker_id: "Continue"
    context_file: null
    instructions_mode: "static"
    description: "Agenten in .continue/agents/ sind eine `cn review`-only Oberfläche — kein Chat-Auto-Discovery; kein config.yaml agents-Block (OQ-2)."

  Copilot:
    mechanism: "file-based"
    action: "none"
    marker_id: "Copilot"
    context_file: null
    instructions_mode: "static"
    description: "Agenten in .github/copilot/agents/ werden automatisch geladen."

  Mammouth:
    mechanism: "file-based"
    action: "none"
    marker_id: "Mammouth"
    context_file: null
    instructions_mode: "static"
    description: "Agenten in .mammouth/agents/ werden dateibasiert bereitgestellt — kein Session-Bootstrap nötig."

  Codex:
    mechanism: "file-based"
    action: "none"
    marker_id: "Codex"
    context_file: null
    instructions_mode: "static"
    description: "Agenten in .codex/agents/*.toml werden automatisch geladen (V7, 2026-09-04: personal- + project-scoped Config-Layer, kein Registrierungs-Schritt; multi_agent stable default-on)."

  ZCode:
    # mechanism "api-based" is the legacy dispatch name of BootstrapEngine for
    # "inject bootstrap instructions into the context file" (same handler as
    # Gemini). ZCode uses a STATIC instruction text (instructions_mode: static)
    # instead of Gemini's generated per-agent roster.
    mechanism: "api-based"
    action: "inject-bootstrap-instructions"
    marker_id: "ZCode"
    context_file: null
    instructions_mode: "static"
    instructions: |
      ## Agent Bootstrap — Session-Start Pflicht

      ZCode lädt Workspace-Level `.zcode/agents/` NICHT automatisch als
      Subagent-Roster (verifizierter Auto-Load nur user-level `~/.zcode/agents/`,
      V18 2026-09-04; Workspace-Auto-Load = offener P6 real-repo-test).

      **Führe folgende Schritte zu Beginn JEDER Session aus:**

      1. Lies alle `.md`-Dateien in `.zcode/agents/`.
      2. Registriere jeden Agenten unter seinem Dateinamen (ohne `.md`) als
         verfügbaren Subagenten in deinem Kontext (Prompt-Registrierung —
         es gibt KEINE define_subagent-API; Auswahl später über den
         `Agent`-Toolcall mit `subagent_type` bzw. dem registrierten Namen).
      3. Erst danach: Bearbeite User-Anfragen (Delegation an Orchestrator etc.).

      > **Ohne diese Registrierung existieren die Agenten NICHT im Roster**
      > und der Orchestrator kann nicht delegieren.
    description: "Agenten werden als Dateien generiert (.zcode/agents/*.md) und via Bootstrap-Injection in AGENTS.md als Roster registriert — Workspace-Auto-Load unverified (V18)."

  KimiCode:
    mechanism: "file-based"
    action: "none"
    marker_id: "KimiCode"
    context_file: null
    instructions_mode: "static"
    description: "Kimi Code discoverte Custom Agents automatisch neben den Built-ins (V16, 2026-09-04: explicit > project .kimi-code/agents/ > extra dirs > user > plugin > built-in) — kein Session-Bootstrap nötig."
