# Provider Capability Matrix
# Documents what each provider supports for agent orchestration.
# Used to drive conditional logic in agent generation and bootstrap.

capabilities:
  Claude:
    subagent_dispatch: true
    parallel_execution: true
    file_based_agents: true
    text_mentions: true
    hooks: true
    native_agent_tools: ["Agent", "Task"]
    structured_handoff: true
    handoff_format: "json"
    handoff_envelope_support: true
    description: "Vollständige Agent-Orchestrierung mit nativen Tool-Calls und Hooks."

  Opencode:
    subagent_dispatch: true
    parallel_execution: true
    file_based_agents: true
    text_mentions: false
    hooks: false
    native_agent_tools: ["task"]
    structured_handoff: true
    handoff_format: "json"
    handoff_envelope_support: true
    description: "Agent-Orchestrierung via task() tool, dateibasierte Agent-Registrierung."

  Gemini:
    subagent_dispatch: true
    parallel_execution: true
    file_based_agents: false
    text_mentions: false
    hooks: false
    native_agent_tools: ["define_subagent", "send_message", "invoke_subagent"]
    structured_handoff: true
    handoff_format: "json"
    handoff_envelope_support: true
    description: "API-basierte Agent-Registrierung, ephemere Runtime."
    bootstrap_required: true
    special_notes:
      - "Agenten müssen bei JEDER Session via define_subagent registriert werden."
      - ".gemini/agents/*.md werden NICHT automatisch geladen."
      - "Kein dateibasiertes Agent-Inventar wie Claude Code."

  Continue:
    subagent_dispatch: false
    parallel_execution: false
    file_based_agents: false
    text_mentions: true
    hooks: false
    native_agent_tools: []
    structured_handoff: false
    handoff_format: "yaml_text_block"
    handoff_envelope_support: false
    description: "Text-basierte Agent-Mentions (@agent). Keine native Subagent-API."
    special_notes:
      - "@agent Text-Mentions als Subagent-Dispatch."
      - "Agenten werden in .continue/config.yaml konfiguriert."
      - "Keine parallele Subagent-Ausführung."

  Copilot:
    subagent_dispatch: false
    parallel_execution: false
    file_based_agents: true
    text_mentions: true
    hooks: false
    native_agent_tools: []
    structured_handoff: false
    handoff_format: "yaml_text_block"
    handoff_envelope_support: false
    description: "Dateibasierte Agenten (.github/copilot/agents/). @agent Text-Mentions."
    special_notes:
      - "Dateien in .github/copilot/agents/ werden automatisch geladen."

  # Conservative baseline — Mammouth is a CLI-first tool (Plan/Build modes) whose
  # native orchestration surface is undocumented. Only capabilities backed by
  # config/ai-providers.yaml are enabled; everything orchestration-specific stays
  # false until verified. `hooks: true` is evidence-based: ai-providers.yaml sets
  # has_hooks: true + hooks_dir (.mammouth/hooks), enforced by
  # tests/test_provider_hooks_config.py.
  Mammouth:
    subagent_dispatch: false
    parallel_execution: false
    file_based_agents: true
    text_mentions: true
    hooks: true
    native_agent_tools: []
    structured_handoff: false
    handoff_format: "yaml_text_block"
    handoff_envelope_support: false
    description: "Dateibasierte Agenten (.mammouth/agents/), CLI-first mit Plan/Build-Modi. Text-basierte Delegation, keine native Subagent-API."
    special_notes:
      - "CLI-first Tool mit Plan- (read-only) und Build-Modus (Ausführung)."
      - "Keine native parallele Subagent-Ausführung — Delegation sequentiell/textbasiert."
      - "Hooks werden unterstützt (.mammouth/hooks); MCP-Integration in ai-providers.yaml nicht konfiguriert."
