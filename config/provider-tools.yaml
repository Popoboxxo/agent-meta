# Provider Tools Whitelist
# Defines which tool names are valid for each provider's frontmatter.
# Used by sync.py to validate and filter template tools during agent generation.
#
# Unknown tools are logged as WARNING in sync.log and excluded from output.

claude:
  - Bash
  - Read
  - Write
  - Edit
  - Glob
  - Grep
  - Task
  - Agent
  - TodoWrite
  - WebFetch
  - WebSearch
  - mcp__*              # MCP tool prefix (wildcard)

opencode:
  # Opencode uses a permission-based model. Template tools are mapped to permissions.
  # Only these template tool names are recognized and mapped.
  - Bash
  - Read
  - Write
  - Edit
  - Glob
  - Grep
  - WebFetch
  - WebSearch
  - Agent
  - TodoWrite

gemini:
  # Gemini native tools: code_execution, google_search, url_context
  # File system tools (Read, Write, Edit, Glob, Grep) are implicitly active
  # in the Gemini sandbox and don't need explicit frontmatter entries.
  - Bash                # -> code_execution
  - WebSearch           # -> google_search
  - WebFetch            # -> url_context
  - Read                # implicit in sandbox (no frontmatter entry needed)
  - Write               # implicit in sandbox
  - Edit                # implicit in sandbox
  - Glob                # implicit in sandbox
  - Grep                # implicit in sandbox
  - TodoWrite           # skipped silently (unsupported, keeps log clean)

# Known-unsupported tools for Gemini — dropped by design (INFO instead of WARNING).
# Gemini delegation happens via the runtime (define_subagent), not via a tool.
gemini-silent:
  - Agent               # Gemini has no subagent dispatch tool
  - Task                # Gemini has no task orchestration tool
  - mcp__*              # Gemini MCP support varies by version

opencode_deny_critical:
  - Bash
  - Write
  - Edit

continue:
  # Continue has no frontmatter tools model. All tools are available by default.
  # The 'tools' field is removed during generation.

copilot:
  # GitHub Copilot has no frontmatter tools model. Tools are provided by the IDE.
  # The 'tools' field is removed during generation.

codex:
  # Codex built-in/matcher names (V4, 2026-09-04): Bash is the canonical
  # hook/matcher name; apply_patch matches as the Edit/Write tool;
  # spawn_agent is the subagent dispatch (matches under alias Agent).
  # Internal names shell/exec_command are NOT whitelisted.
  - Bash
  - Read
  - Write
  - Edit
  - Glob
  - Grep
  - WebFetch
  - WebSearch
  - Agent
  - mcp__*              # MCP tool prefix (wildcard)

# Known-unsupported tools for Codex — dropped by design (INFO instead of WARNING).
codex-silent:
  - TodoWrite           # no verified todo tool in the Codex tool catalog

zcode:
  # ZCode built-ins (V5, 2026-09-04): 9 tools + Agent dispatch;
  # MCP tools are addressed by their full mcp__<server>__<tool> name.
  - Bash
  - Read
  - Write
  - Edit
  - Glob
  - Grep
  - WebFetch
  - WebSearch
  - TodoWrite
  - Agent
  - Task                # legacy alias of Agent (V17)
  - mcp__*

kimicode:
  # Kimi Code built-in catalog (V14, 2026-09-04, exact case-sensitive names).
  # Template-side alias names are kept valid here so generation stays
  # warning-free; harness-native names noted per entry.
  - Read
  - Write
  - Edit
  - Grep
  - Glob
  - Bash
  - WebSearch
  - WebFetch            # template-side name — Kimi-native tool is FetchURL
  - Agent               # single dispatch (prompt/description/subagent_type/resume/run_in_background)
  - AgentSwarm          # fan-out dispatch (prompt_template + items, up to 128)
  - mcp__*              # MCP tool prefix (wildcard)

# Known-unsupported tools for Kimi Code — dropped by design (INFO instead of WARNING).
kimicode-silent:
  - TodoWrite           # Kimi-native name is TodoList

# Terminal (Command-Execution) Tool per Provider
# Used by viz.py inject_viz_prompt_block to name the correct tool in the fallback
# Null means: no known terminal tool, use generic phrasing
terminal_tool:
  Claude: Bash
  Opencode: bash
  Gemini: code_execution
  Continue: null
  Copilot: null
  Mammouth: bash
  Codex: Bash
  ZCode: Bash
  KimiCode: Bash
