# Review rules index — frontend domain
#
# Per-rule semantics (full rationale in review-rules/ai.yaml):
#   blocking    true -> must be resolved before merge; false -> advisory
#   claim_type  verifiable -> falsifiable by re-reading code or re-running data
#               judgment   -> requires expert opinion, cannot be proven
# Source: "comment signals" taxonomy, "Looks Good to Me" ch. 6.
version: 1
domain: frontend
rules:
  - id: FE-01
    title: Component single-responsibility (no god-components)
    severity_hint: medium
    blocking: false
    claim_type: judgment
    standard_ref:
  - id: FE-02
    title: State correctness, no duplicated derived state
    severity_hint: medium
    blocking: true
    claim_type: verifiable
    standard_ref:
  - id: FE-03
    title: SSR/hydration safety (no window/document during initial render)
    severity_hint: high
    blocking: true
    claim_type: verifiable
    standard_ref:
  - id: FE-04
    title: Browser API hygiene (cleanup, feature detection)
    severity_hint: medium
    blocking: false
    claim_type: verifiable
    standard_ref:
  - id: FE-05
    title: Render performance on hot paths
    severity_hint: medium
    blocking: false
    claim_type: judgment
    standard_ref:
  - id: FE-06
    title: No inline secrets/keys in client bundles
    severity_hint: critical
    blocking: true
    claim_type: verifiable
    standard_ref: CWE-798
  - id: FE-07
    title: Premature memoization / unnecessary re-renders (memo only on measured hot paths)
    severity_hint: medium
    standard_ref:
