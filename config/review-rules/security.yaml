# Review rules index — security domain
#
# Per-rule semantics (full rationale in review-rules/ai.yaml):
#   blocking    true -> must be resolved before merge; false -> advisory
#   claim_type  verifiable -> falsifiable by re-reading code or re-running data
#               judgment   -> requires expert opinion, cannot be proven
# Source: "comment signals" taxonomy, "Looks Good to Me" ch. 6.
# All security rules block: an unresolved security finding is never advisory.
version: 1
domain: security
rules:
  - id: SEC-01
    title: Injection families (SQLi, XSS, command, SSTI)
    severity_hint: critical
    blocking: true
    claim_type: verifiable
    standard_ref: OWASP-A03;CWE-89;CWE-79;CWE-78
    asvs_level: "OWASP ASVS 5.0#L1"
  - id: SEC-02
    title: Hardcoded secrets/credentials
    severity_hint: critical
    blocking: true
    claim_type: verifiable
    standard_ref: OWASP-A07;CWE-798
    asvs_level: "OWASP ASVS 5.0#L1"
  - id: SEC-03
    title: Broken authentication/authorization
    severity_hint: critical
    blocking: true
    claim_type: verifiable
    standard_ref: OWASP-A01;OWASP-A07;CWE-287;CWE-862
    asvs_level: "OWASP ASVS 5.0#L2"
  - id: SEC-04
    title: Cryptographic weaknesses (MD5/SHA1/DES/RC4, weak randomness)
    severity_hint: high
    blocking: true
    claim_type: verifiable
    standard_ref: OWASP-A02;CWE-327
    asvs_level: "OWASP ASVS 5.0#L2"
  - id: SEC-05
    title: Dependency/supply-chain risks
    severity_hint: high
    blocking: true
    claim_type: verifiable
    standard_ref: OWASP-A06
    asvs_level: "OWASP ASVS 5.0#L2"
  - id: SEC-06
    title: SSRF/path traversal/insecure deserialization
    severity_hint: high
    blocking: true
    claim_type: verifiable
    standard_ref: OWASP-A08;OWASP-A10;CWE-22;CWE-502;CWE-918
    asvs_level: "OWASP ASVS 5.0#L1"