outcome-caching:
  enabled: false
  ttl_seconds: 3600
  max_entries: 100
  invalidation: git-commit
reflection_pairs:
- id: dev-review-loop
  generator: developer
  critic: code-reviewer
  max_iterations: 3
  on_blocked: escalate_to_principal-developer
- id: se-requirements-loop
  generator: se-requirements
  critic: se-critic
  max_iterations: 3
- id: se-architect-loop
  generator: se-architect
  critic: se-critic
  max_iterations: 3
- id: se-test-loop
  generator: se-test-engineer
  critic: se-testreviewer
  max_iterations: 3
- id: se-dev-review-loop
  generator: se-developer
  critic: code-reviewer
  max_iterations: 3
  on_blocked: escalate_to_orchestrator
quality_pipelines:
  feature-lifecycle:
    description: Vollständiger Feature-Lifecycle mit optionalem Plan-Input, REQ, TDD, Review, PR
    signal_keywords:
    - Feature implementieren
    - Feature bauen
    - neues Feature
    - Funktion bauen
    - Feature Lifecycle
    - komplexes Feature
    - Feature Pipeline
    accepts_plan_ref: true
    stages:
    - id: branch
      agent: git
      task: Feature-Branch anlegen
      mode: sequential
    - id: requirement
      agent: requirements
      task: REQ-ID vergeben
      mode: conditional
      condition:
        dod_flag: req-traceability
    - id: tests
      agent: tester
      task: TDD Red Phase — Tests mit REQ-ID im Namen
      mode: conditional
      condition:
        dod_flag: tests-required
    - id: implement
      agent: developer
      task: Implementierung
      mode: plan-driven
      plan-driven:
        fallback_agent: developer
        allowed_agents:
        - junior-developer
        - developer
        - senior-developer
        - frontend-component-engineer
    - id: verify
      agent: tester
      task: Tests grün, keine Regression
      mode: conditional
      condition:
        dod_flag: tests-required
    - id: validate-and-document
      mode: parallel_group
      parallel_group:
      - agent: validator
        task: DoD-Check
      - agent: documenter
        task: CODEBASE_OVERVIEW aktualisieren
    - id: commit
      agent: git
      task: 'Commit: feat([REQ-ID]): ... + PR'
      mode: sequential
    on_error: escalate_to_orchestrator
  quick-fix:
    description: Schneller Bugfix ohne Overhead
    signal_keywords:
    - Bug fixen
    - Bug beheben
    - Triage
    - schneller Fix
    - Hotfix
    stages:
    - id: fix
      agent: developer
      task: Bugfix
      mode: sequential
    - id: commit
      agent: git
      task: Commit + Push
      mode: sequential
    on_error: escalate_to_orchestrator
  bugfix:
    description: 'Default bugfix pipeline: triage → fix → review → document. FANOUT-fähig
      für unabhängige Bugs.'
    signal_keywords:
    - Bug fixen
    - Bug beheben
    - Fehler beheben
    stages:
    - id: triage
      agent: bug-feature-analyzer
      task: Bug klassifizieren (Bug/User-Error/Feature/Out-of-Scope). Bei User-Error/Out-of-Scope
        → Pipeline stoppen.
      mode: sequential
    - id: fix
      agent: developer
      task: Bugfix implementieren
      mode: sequential
    - id: review
      agent: code-reviewer
      task: Code-Qualität, Blast-Radius, SOLID/DRY prüfen
      mode: loop
      loop:
        generator: developer
        critic: code-reviewer
        max_iterations: 2
    - id: document
      agent: documenter
      task: CODEBASE_OVERVIEW und Session-Erkenntnisse aktualisieren
      mode: sequential
    on_error: escalate_to_orchestrator
  concept-development:
    description: Recherche → Konzept → Review-Loop für Vorfeld-/Designarbeit ohne
      Code
    signal_keywords:
    - Konzept
    - Design-Doc
    - Architektur-Recherche
    - Trade-offs
    stages:
    - id: research
      agent: ideation
      task: 'Recherche: Stand der Technik, Optionen, Quellen, Trade-offs'
      mode: sequential
    - id: concept
      agent: ideation
      task: Konzept/Design-Doc erstellen und Review-Feedback einarbeiten
      mode: loop
      loop:
        generator: ideation
        critic: concept-reviewer
        max_iterations: 3
    - id: handoff
      agent: requirements
      task: Konzept in REQs überführen
      mode: sequential
    on_error: escalate_to_orchestrator
  refactor:
    description: 'Codebase refactoring: blast-radius analysis → implement → review
      → commit. Use for cross-cutting refactorings, not trivial renames.'
    signal_keywords:
    - Refactoring
    - aufräumen
    - Cleanup
    - Code verbessern
    stages:
    - id: analyze
      agent: senior-developer
      task: 'Blast-Radius-Analyse: Scope bestimmen, betroffene Dateien identifizieren,
        Risiken bewerten'
      mode: sequential
    - id: implement
      agent: developer
      task: Refactoring implementieren ohne funktionale Änderungen
      mode: sequential
    - id: review
      agent: developer
      task: Refactoring auf Clean Code, SOLID, DRY prüfen und Feedback einarbeiten
      mode: loop
      loop:
        generator: developer
        critic: code-reviewer
        max_iterations: 2
    - id: commit
      agent: git
      task: Commit + Push
      mode: sequential
    on_error: escalate_to_orchestrator
  docs-update:
    description: 'Documentation update: write/update docs → commit. For README, CODEBASE_OVERVIEW,
      ARCHITECTURE, and similar doc-only changes.'
    signal_keywords:
    - Dokumentation
    - README
    - Docs
    - Doku
    stages:
    - id: update
      agent: documenter
      task: Dokumentation aktualisieren
      mode: sequential
    - id: commit
      agent: git
      task: Commit + Push
      mode: sequential
    on_error: skip
  se-cascade:
    description: Systems Engineering Recursive Decomposition (Zig-Zag L0→Ln)
    signal_keywords:
    - SE-Kaskade
    - Zerlegung
    - Systems Engineering
    - SE-Breakdown
    stages:
    - id: l0-stakeholder
      agent: se-requirements
      task: Stakeholder Needs → formal SN-xxx Requirements
      mode: loop
      loop:
        generator: se-requirements
        critic: se-critic
        max_iterations: 3
    - id: l1-requirements
      agent: se-requirements
      task: L1 System Requirements (REQ-L1) from Stakeholder Needs
      mode: loop
      loop:
        generator: se-requirements
        critic: se-critic
        max_iterations: 3
    - id: l1-architecture
      agent: se-architect
      task: L1 System White-Box Decomposition (ARCH-L1)
      mode: loop
      loop:
        generator: se-architect
        critic: se-critic
        max_iterations: 3
    - id: l2-requirements
      agent: se-requirements
      task: L2 System Requirements (REQ-L2) derived from L1 Architecture
      mode: loop
      loop:
        generator: se-requirements
        critic: se-critic
        max_iterations: 3
    - id: l2-architecture
      agent: se-architect
      task: L2 System White-Box Decomposition (ARCH-L2)
      mode: loop
      loop:
        generator: se-architect
        critic: se-critic
        max_iterations: 3
    - id: l2-interface
      agent: se-interface-mgr
      task: Interface Registry + Propagation Map for L2
      mode: sequential
    - id: l3-requirements
      agent: se-requirements
      task: L3 System Requirements (REQ-L3) derived from L2 Architecture
      mode: loop
      loop:
        generator: se-requirements
        critic: se-critic
        max_iterations: 3
    - id: l3-architecture
      agent: se-architect
      task: L3 System White-Box Decomposition (ARCH-L3)
      mode: loop
      loop:
        generator: se-architect
        critic: se-critic
        max_iterations: 3
    - id: termination
      agent: se-termination
      task: Per-system leaf/continue decision (respects SE_MIN_DEPTH / SE_MAX_DEPTH)
      mode: conditional
      condition:
        type: agent_decision
        agent: se-termination
    - id: implementation
      agent: orchestrator
      allow_orchestrator: true
      task: 'For each leaf node with domain: software from the termination phase:

        - Route to se-junior-developer for trivial leafs (0-1 interfaces, no cross-cutting)

        - Route to se-developer for standard leafs (2-4 interfaces)

        - Route to se-senior-developer for complex leafs (5+ interfaces, cross-cutting,
        boundary-level, security/performance-critical)

        Implement each leaf against its Black-Box specification and interface contracts
        from the interface-registry.

        Each implementation must reference its req_id and leaf_id in code artifacts.

        hardware/mechanics leafs → document as COTS/spec (not implemented).

        '
      mode: loop
      loop:
        generator: se-developer
        critic: code-reviewer
        max_iterations: 2
    - id: validation
      agent: se-validator
      task: L1 System Validation + Multi-Level Verification
      mode: parallel_group
      parallel_group:
      - agent: se-validator
        task: L1 User-Journey validation
      - agent: se-verifier
        task: Multi-Level verification
      - agent: se-integration-and-test-manager
        task: V&V orchestration
se_variables:
  SE_BASE_DIR: SE
  SE_MIN_DEPTH: 2
  SE_MAX_DEPTH: 6
  SE_MAX_CRITIC_ITERATIONS: 3
  SE_MAX_PARALLEL_CELLS: 4
  SE_MAX_CELLS: 20
  cost_limit_eur: 5
  output_persistence: true
  resume_pointer_path: .se-state.yaml
  se_pipeline_classifier: default
  se_persistence_schema_dir: schemas
