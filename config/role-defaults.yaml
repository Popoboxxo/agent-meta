# Zentrale Rollen-Konfiguration für agent-meta.
# Definiert alle bekannten Rollen, empfohlene Modelle, Memory-Scopes und Kurzbeschreibungen.
# Wird von sync.py beim Generieren gelesen.
#
# model: Modell-Tier für diese Rolle. Leer = erbt vom Parent-Kontext (kein model:-Feld).
#   Tier-Namen (provider-agnostisch, empfohlen):
#     nano     — ultra-schnell, minimale Kosten (z.B. einfache Formatierungen)
#     fast     — schnell & günstig (z.B. git, meta-feedback, docker)
#     balanced — guter Kompromiss Kosten/Qualität (Standard für dev, docs, review)
#     powerful — starkes Reasoning (z.B. security-audit, komplexe Architektur)
#     max      — maximale Kapazität, reserviert für zukünftige Ultra-Modelle
#   Rückwärtskompatibel: 'haiku', 'sonnet', 'opus' funktionieren als Claude-Aliase.
#   Volle Modell-IDs ('claude-sonnet-4-6') werden direkt übergeben (kein Tier-Lookup).
#   Provider-Mapping: config/ai-providers.yaml → model-tiers pro Provider.
#   Projekte überschreiben via 'model-overrides' in .meta-config/project.yaml.
#
# memory: persistentes Agenten-Gedächtnis über Sessions hinweg. Leer = kein Gedächtnis.
#   Gültige Werte: 'project' (.claude/agent-memory/<name>/, in git),
#                  'local' (.claude/agent-memory-local/<name>/, gitignored),
#                  'user' (~/.claude/agent-memory/<name>/, maschinenlokal).
#   Projekte überschreiben via 'memory-overrides' in .meta-config/project.yaml.
#
# permission_mode: Claude Code Berechtigungsmodus. Leer = Standard (kein Frontmatter-Feld).
#   Gültige Werte: 'default', 'acceptEdits', 'bypassPermissions', 'plan' (read-only).
#   Projekte überschreiben via 'permission-mode-overrides' in .meta-config/project.yaml.
#
# steps: Maximale Iterationen für Opencode-Agenten. Leer = kein Limit (kein steps:-Feld).
#   Gültige Werte: positive Ganzzahl (z.B. 10, 25).
#   Projekte überschreiben via 'steps-overrides' in .meta-config/project.yaml.
#
# workflow_tier: Empfehlungsstufe. 'required' = Kern-Workflow; 'recommended' = Standard-Qualität;
#   'optional' = bei Bedarf. User steuert via 'roles' in .meta-config/project.yaml.

roles:

  orchestrator:
    model: "balanced"     # Routing/Delegation braucht Reasoning; balanced ist der richtige Kompromiss
    memory: ""
    workflow_tier: required
    description: "Einstiegspunkt für alle Entwicklungsaufgaben — koordiniert alle anderen Agenten. Wählt automatisch das kosteneffizienteste Model-Tier für jede Delegation (nano/fast/balanced/powerful/max)."

  developer:
    model: powerful          # erbt — oft das stärkste verfügbare Modell gewünscht
    memory: ""
    workflow_tier: required
    description: "Feature-Implementierung und Bugfixes"

  requirements:
    model: balanced
    memory: project
    workflow_tier: recommended
    description: "Anforderungen aufnehmen, REQ-IDs vergeben, REQUIREMENTS.md pflegen"

  ideation:
    model: ""           # erbt
    memory: ""
    workflow_tier: optional
    description: "Neue Ideen explorieren, Vision schärfen, Übergabe an requirements"

  feature:
    model: ""           # erbt — koordiniert andere Agenten, kein eigenes Coding
    memory: ""
    workflow_tier: recommended
    description: "Feature-Lifecycle-Subagent: Branch → REQ → TDD → Dev → Validate → PR. Wird vom Orchestrator gestartet, nicht direkt vom User."

  tester:
    model: balanced
    memory: ""
    workflow_tier: recommended
    description: "TDD, Test-Suite ausführen, Testabdeckung sichern"

  validator:
    model: balanced
    memory: project
    permission_mode: plan
    workflow_tier: recommended
    description: "Code gegen REQs prüfen, DoD-Checkliste, Traceability-Audit"

  documenter:
    model: fast
    memory: project
    workflow_tier: recommended
    description: "CODEBASE_OVERVIEW, ARCHITECTURE, README, Erkenntnisse pflegen"

  security-auditor:
    model: powerful
    memory: project
    permission_mode: plan
    workflow_tier: optional
    description: "Sicherheits-Audit: OWASP, Secrets, Dependencies, Supply-Chain — statische Analyse"

  agent-meta-scout:
    model: balanced
    memory: local
    workflow_tier: optional
    description: "Claude-Ökosystem scouten: neue Skills, Rollen, Rules und Patterns entdecken"

  agent-meta-manager:
    model: balanced
    memory: ""
    workflow_tier: optional
    description: "agent-meta verwalten: Upgrade, Sync, Feedback, projektspezifische Agenten anlegen"

  release:
    model: balanced
    memory: ""
    workflow_tier: optional
    description: "Versioning, Changelog, Build-Artifact, GitHub Release erstellen"

  git:
    model: fast
    memory: ""
    workflow_tier: required
    description: "Commits, Branches, Tags, Push/Pull und alle Git-Operationen"

  meta-feedback:
    model: fast
    memory: ""
    workflow_tier: optional
    description: "Verbesserungsvorschläge für agent-meta als GitHub Issues einreichen"

  docker:
    model: fast
    memory: ""
    workflow_tier: optional
    description: "Dev-Stack verwalten, Test-Stack starten, Binary-Management, Dockerfiles erstellen"

  log-analyzer:
    model: balanced
    memory: ""
    workflow_tier: required
    description: "System- und Applikations-Logs analysieren: Frequency-Clustering, Severity-Klassifikation (RFC 5424), Root-Cause-Hypothesen, Delegation an feedback/developer/security-auditor"

  feedback:
    model: fast
    memory: ""
    workflow_tier: required
    description: "Projekt-Feedback standardisieren: Bugs, Features, Verbesserungen als GitHub Issues einreichen — immer vor git für Issue-Erstellung"

  bug-feature-analyzer:
    model: balanced
    memory: ""
    workflow_tier: recommended
    description: "Issue-Triage: Eingehende Bug-Meldungen und Feature-Requests analysieren und klassifizieren (Bug, User-Error, Feature, Out-of-Scope) vor Ressourcen-Allokation"

  openscad-developer:
    model: balanced
    memory: local
    workflow_tier: optional
    description: "Parametrische 3D-Modelle in OpenSCAD generieren, Render-Inspect-Refine via MCP, Druck-Optimierung"

  se-requirements:
    model: balanced
    memory: project
    workflow_tier: optional
    description: "Nimmt Stakeholder-Bedürfnisse auf und erstellt das formale L1-Blackbox-Requirement."

  se-architect:
    model: powerful
    memory: project
    workflow_tier: optional
    description: "Zerlegt Blackboxes in Whiteboxes nach strengen Architekturgesetzen (CQRS, Orthogonalität)."

  se-critic:
    model: powerful
    memory: ""
    workflow_tier: optional
    description: "Prüft Architekturentscheidungen iterativ auf Vollständigkeit, Konsistenz und Testbarkeit."

  se-interface-mgr:
    model: balanced
    memory: project
    workflow_tier: optional
    description: "Verwaltet und validiert alle Schnittstellenverträge domänenübergreifend."

  se-termination:
    model: fast
    memory: ""
    workflow_tier: optional
    description: "Entscheidet deterministisch, ob der L3-Component-Leaf-Node erreicht wurde."

  se-orchestrator:
    model: balanced
    memory: ""
    workflow_tier: optional
    description: "Koordiniert den gesamten 6-stufigen rekursiven Systems-Engineering-Herunterbruch."

  se-test-engineer:
    model: balanced
    memory: ""
    workflow_tier: optional
    description: "Entwickelt MBSE-Testmodelle und entwirft Integrationstests für den rechten V-Modell-Flügel."

  se-testreviewer:
    model: powerful
    memory: ""
    permission_mode: plan
    workflow_tier: optional
    description: "Auditiert Teststrategien auf Edge-Cases, Boundary Values, Äquivalenzklassen und Flakiness."

  se-verifier:
    model: balanced
    memory: project
    workflow_tier: optional
    description: "Multi-Level Verification (L1-Ln): Prüft integrierte Systeme gegen Architektur-Spezifikationen."

  se-validator:
    model: powerful
    memory: project
    workflow_tier: optional
    description: "L1 System-Validierung: End-to-End User Journeys gegen Stakeholder-Bedürfnisse."

  se-integration-and-test-manager:
    model: balanced
    memory: ""
    workflow_tier: optional
    description: "V&V-Orchestrator: Bestimmt Integrationsstrategie und koordiniert Test-Ebenen."

  code-reviewer:
    model: powerful
    memory: project
    permission_mode: plan
    workflow_tier: recommended
    description: "Clean Code Gatekeeper: Blast-Radius-Analyse, SOLID/DRY Prüfung, Code-Qualitäts-Audit."

  ui-ux-designer:
    model: balanced
    memory: project
    workflow_tier: optional
    description: "UI-Spezifikationen, Mockups und Design-Systeme erstellen."

  api-specialist:
    model: balanced
    memory: project
    workflow_tier: optional
    description: "OpenAPI/Contract-First API Design, Schnittstellen-Spezifikationen."

  devops-engineer:
    model: fast
    memory: ""
    workflow_tier: optional
    description: "CI/CD, Infrastructure as Code, Kubernetes, Observability."

  performance-optimizer:
    model: powerful
    memory: ""
    workflow_tier: optional
    description: "Big-O Bottleneck-Identifikation und datengetriebene Performance-Optimierung."

  export-manager:
    model: fast
    memory: ""
    workflow_tier: optional
    description: "Target-agnostischer Output-Router: Markdown, Confluence, Jira-Xray, Notion."
