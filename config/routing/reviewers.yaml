# Reviewer routing matrix — consumed by the orchestrator (concept §5.1, review-agent fleet)
# Path-class patterns dispatch reviewer sets; ambiguous diffs fan out to all matches.
version: 1
synthesis: true
max_parallel: 5
routes:
  - match: "**/*.{tsx,jsx,vue,svelte,css,scss}"
    reviewers:
      - frontend-reviewer
      - ui-reviewer
  - match: "**/migrations/**"
    reviewers:
      - database-reviewer
  - match: "**/*.{sql}"
    reviewers:
      - database-reviewer
  - match: "**/{api,server,controllers,services}/**"
    reviewers:
      - backend-reviewer
  - match: "**/*.{py,ts,js,go,java,rb,php}"
    reviewers:
      - security-auditor
notes: >-
  security-auditor acts as fallback on any code diff. ui-reviewer delegates deep
  WCAG work to accessibility-specialist. Long reports: the read-only reviewer
  quartet writes no files and returns a compact summary, splitting oversized
  output into chunks (k/n) on the return channel; writable roles write the
  full report to .tmp/<role>-<topic>.md in the repo and return only the path
  (issue #514).
