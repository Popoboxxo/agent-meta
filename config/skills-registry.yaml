# Zentrale Konfiguration für externe Skill-Pakete (Modell A — liegt in agent-meta).
#
# repos: bekannte externe Repos — korrespondieren mit .gitmodules Einträgen.
#   pinned_commit wird von sync.py gegen den tatsächlichen Submodul-Commit geprüft.
#
# skills: 1:n zu repos.
#   approved: true = vom Meta-Maintainer freigegeben.
#   Projekte aktivieren via 'external-skills' in agent-meta.config.yaml.

repos:
  reqogniloom:
    repo: https://github.com/Popoboxxo/ReqogniLoom
    local_path: external/ReqogniLoom
    pinned_commit: 9e0399b30de291ea7df064e8d58d2dee70e87b64

  neat-little-package:
    repo: https://github.com/racurry/neat-little-package
    local_path: external/neat-little-package
    pinned_commit: be411f313c9451b62024e91b3af972ee63cbc063

  awesome-claude-code:
    repo: https://github.com/hesreallyhim/awesome-claude-code
    local_path: external/awesome-claude-code
    pinned_commit: 3d8bde25f70bb296267b393890e3f111ef725fb8
    enabled: true
    implicit-dependency: agent-meta-scout
    # Meta-Repo (kuratierter Claude-Ökosystem-Index). Kein Skill-Eintrag —
    # wird vom agent-meta-scout Agenten (1-generic) direkt per Read-Tool referenziert.
    # enabled: false → deaktiviert die automatische Einbindung (Scout sucht dann via Web).

skills:
  reqogniloom-change-manager:
    approved: true
    repo: reqogniloom
    source: docs/agent-templates
    entry: change-manager.md
    role: change-manager
    name: Change Manager
    description: ReqogniLoom Change Manager Agent

  reqogniloom-quality-auditor:
    approved: true
    repo: reqogniloom
    source: docs/agent-templates
    entry: quality-auditor.md
    role: quality-auditor
    name: Quality Auditor
    description: ReqogniLoom Quality Auditor Agent

  reqogniloom-requirements-architect:
    approved: true
    repo: reqogniloom
    source: docs/agent-templates
    entry: requirements-architect.md
    role: requirements-architect
    name: Requirements Architect
    description: ReqogniLoom Requirements Architect Agent

  reqogniloom-risk-analyst:
    approved: true
    repo: reqogniloom
    source: docs/agent-templates
    entry: risk-analyst.md
    role: risk-analyst
    name: Risk Analyst
    description: ReqogniLoom Risk Analyst Agent

  reqogniloom-test-engineer:
    approved: true
    repo: reqogniloom
    source: docs/agent-templates
    entry: test-engineer.md
    role: test-engineer
    name: Test Engineer
    description: ReqogniLoom Test Engineer Agent



  home-organization:
    approved: true
    repo: neat-little-package
    source: plugins/spirograph/skills/home-organization
    entry: SKILL.md
    role: home-organization-specialist
    name: Home Organization Specialist
    description: >-
      Spezialist für 3D-gedruckte Heimorganisationssysteme (Gridfinity, OpenGrid, NeoGrid,
      French Cleat, Underware, Deskware) — Auswahl, Kombination und Konfiguration.
    additional_files:
      - cross-system-compatibility.md
      - deskware-reference.md
      - french-cleat-reference.md
      - frenchfinity-reference.md
      - gridfinity-reference.md
      - neogrid-reference.md
      - opengrid-reference.md
      - underware-reference.md

  opengrid-openscad:
    approved: true
    repo: neat-little-package
    source: plugins/spirograph/skills/opengrid-openscad
    entry: SKILL.md
    role: opengrid-designer
    name: OpenGrid OpenSCAD Designer
    description: >-
      Spezialist für OpenSCAD-Code-Generierung für wandmontierte
      OpenGrid/MultiConnect-Organizer (28mm Grid, QuackWorks-Patterns).
    additional_files:
      - enhancements.md
