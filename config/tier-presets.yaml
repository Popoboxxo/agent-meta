# Tier presets — map abstract tiers to provider-specific model IDs.
#
# Tier hierarchy (weakest → strongest): nano < fast < balanced < powerful < max < ultra
#
# ultra — LAST-RESORT ESCALATION ONLY.
#   Reserved for the principal-developer role, which is invoked only after
#   senior-developer has failed multiple times. It is the single most expensive
#   call in the system and must never be auto-routed by keyword.
#   ultra is always assigned the strongest *real* (non-fictitious, non-blacklisted)
#   model available per provider — see config/model-curation.yaml for the
#   fictitious/unconfirmed IDs (e.g. claude-fable-5, claude-sonnet-5) that are
#   deliberately NOT used here. The distinction between max and ultra is
#   primarily semantic (usage-gated), not necessarily a different model.
#   NOTE: In presets whose `max` points at a fictitious ID (claude-fable-5),
#   `ultra` intentionally resolves to a *lower-but-real* model (claude-opus-4-8),
#   because ultra must always be a usable model.
Cheap:
  description: Flattens all tiers to nano/fast range.
  tiers:
    nano: claude-haiku-4-5-20251001
    fast: claude-haiku-4-5-20251001
    balanced: claude-haiku-4-5-20251001
    powerful: claude-haiku-4-5-20251001
    max: claude-sonnet-4-6
    ultra: claude-opus-4-8        # last-resort: strongest real model, above this preset's max
  providers:
    Claude:
      tiers:
        nano: claude-haiku-4-5-20251001
        fast: claude-haiku-4-5-20251001
        balanced: claude-haiku-4-5-20251001
        powerful: claude-haiku-4-5-20251001
        max: claude-sonnet-4-6
        ultra: claude-opus-4-8
    Gemini:
      tiers:
        nano: gemini-3.5-flash-medium
        fast: gemini-3.5-flash-medium
        balanced: gemini-3.5-flash-medium
        powerful: gemini-3.5-flash-medium
        max: gemini-3.5-flash-high
        ultra: gemini-3.1-pro-high
    Opencode:
      tiers:
        nano: opencode-go/deepseek-v4-flash
        fast: opencode-go/deepseek-v4-flash
        balanced: opencode-go/deepseek-v4-flash
        powerful: opencode-go/deepseek-v4-flash
        max: opencode-go/qwen3.7-plus
        ultra: opencode-go/kimi-k2.7-code
    Mammouth:
      tiers:
        nano: deepseek-v4-flash
        fast: deepseek-v4-flash
        balanced: deepseek-v4-flash
        powerful: deepseek-v4-flash
        max: kimi-k2.6
        ultra: glm-5.2
