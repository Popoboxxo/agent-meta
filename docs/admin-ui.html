/* =========================================================================
 * Views — Sync controls
 * ========================================================================= */
async function viewSync() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["Sync"]));
  wrap.appendChild(el("p", {}, ["Run sync.py and view its output in real time."]));

  // Renamed from ``console`` to avoid shadowing the global console object.
  const consoleEl = el("div", { class: "console" }, ["(idle)"]);
  const runBtn = el("button", { class: "btn btn-primary" }, ["Run sync.py"]);
  const dryBtn = el("button", { class: "btn" }, ["Dry-run (--validate)"]);
  wrap.appendChild(el("div", { class: "btn-row" }, [runBtn, dryBtn]));
  wrap.appendChild(consoleEl);

  const setOutput = (text) => {
    consoleEl.replaceChildren();
    const lines = String(text || "").split("\n");
    for (const line of lines) {
      let cls = "line-info";
      if (/WRITE|UPDATE|COPY|DONE|✓/i.test(line)) cls = "line-write";
      else if (/WARN|warning/i.test(line)) cls = "line-warn";
      else if (/ERROR|FAIL|!!/i.test(line)) cls = "line-error";
      consoleEl.appendChild(el("div", { class: cls }, [line]));
    }
    consoleEl.scrollTop = consoleEl.scrollHeight;
  };

  runBtn.addEventListener("click", async () => {
    runBtn.disabled = true; dryBtn.disabled = true;
    setOutput("Running sync.py …");
    try {
      const r = await api.post("/api/sync/run");
      setOutput(r.output);
      toast(r.success ? "Sync complete" : "Sync failed", r.success ? "success" : "error");
    } catch (err) { setOutput(err.message); toast(err.message, "error"); }
    finally { runBtn.disabled = false; dryBtn.disabled = false; }
  });
  dryBtn.addEventListener("click", async () => {
    runBtn.disabled = true; dryBtn.disabled = true;
    setOutput("Running sync.py --validate …");
    try {
      const r = await api.post("/api/sync/dry-run");
      setOutput(r.output);
      toast(r.success ? "Dry-run OK" : "Dry-run reported issues", r.success ? "success" : "warning");
    } catch (err) { setOutput(err.message); toast(err.message, "error"); }
    finally { runBtn.disabled = false; dryBtn.disabled = false; }
  });
  return wrap;
}

/* =========================================================================
 * Views — Config Audit
 * Detects deprecated roles, missing templates, missing role-defaults and
 * orphaned pipeline references in the active project.yaml. Mirrors the
 * `python scripts/sync.py --audit-config` CLI.
 * ========================================================================= */
async function viewConfigAudit() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["Config Audit"]));
  wrap.appendChild(el("p", { class: "muted" }, [
    "Compares .meta-config/project.yaml against role-defaults.yaml and the ",
    "generic agent templates. Deprecated roles can be auto-disabled (a ",
    "timestamped backup of project.yaml is kept).",
  ]));

  const runBtn   = el("button", { class: "btn btn-primary" }, ["Audit ausführen"]);
  const applyBtn = el("button", { class: "btn", disabled: true }, ["Deprecated auskommentieren"]);
  wrap.appendChild(el("div", { class: "btn-row" }, [runBtn, applyBtn]));

  const summary = el("div", { class: "muted", style: "margin-top:1rem;" }, ["(no audit run yet)"]);
  wrap.appendChild(summary);

  const resultsEl = el("div", { style: "margin-top:1rem;" });
  wrap.appendChild(resultsEl);

  // Maps the four backend categories to UI presentation metadata. Order is
  // significant: auto-fixable items come first so the user sees the actionable
  // findings before informational ones.
  const SECTIONS = [
    { key: "deprecated_roles",         label: "Deprecated roles (auto-fixable)", severity: "warn"  },
    { key: "roles_without_template",   label: "Roles without template",          severity: "error" },
    { key: "templates_without_default",label: "Templates without role-default",  severity: "info"  },
    { key: "orphaned_pipelines",       label: "Orphaned pipeline references",    severity: "warn"  },
  ];

  const severityColor = (sev) => ({
    error: "var(--accent-red)",
    warn:  "var(--accent-yellow, #c9a227)",
    info:  "var(--text-muted)",
  }[sev] || "var(--text-muted)");

  function render(report) {
    resultsEl.replaceChildren();
    if (!report || !report.categories) {
      resultsEl.appendChild(el("p", { class: "muted" }, ["(no data)"]));
      return;
    }

    const deprecated = report.categories.deprecated_roles || [];
    applyBtn.disabled = deprecated.length === 0;

    if (!report.has_issues) {
      summary.textContent = "Config audit: no issues found.";
      summary.style.color = "var(--accent-green)";
      return;
    }
    summary.textContent = `${report.total} issue(s) found.`;
    summary.style.color = "var(--text-default)";

    for (const sec of SECTIONS) {
      const items = report.categories[sec.key] || [];
      if (!items.length) continue;
      const panel = el("div", { class: "panel" });
      panel.appendChild(el("div", { class: "panel-title" }, [
        el("h2", { style: `margin:0; color:${severityColor(sec.severity)};` },
           [`${sec.label} (${items.length})`]),
      ]));
      const list = el("div");
      for (const issue of items) {
        const row = el("div", { style: "padding:0.4rem 0; border-bottom:1px solid var(--border);" });
        row.appendChild(el("div", { style: "font-weight:600;" }, [issue.role || "(no role)"]));
        row.appendChild(el("div", { class: "muted", style: "font-size:0.9em;" }, [issue.message || ""]));
        if (issue.detail && issue.detail !== issue.message) {
          row.appendChild(el("div", { class: "muted", style: "font-size:0.8em;" }, [issue.detail]));
        }
        list.appendChild(row);
      }
      panel.appendChild(list);
      resultsEl.appendChild(panel);
    }
  }

  async function runAudit() {
    runBtn.disabled = true; applyBtn.disabled = true;
    summary.textContent = "Running audit…";
    try {
      const r = await api.get("/api/config-audit");
      render(r);
    } catch (err) {
      summary.textContent = `Audit failed: ${err.message}`;
      summary.style.color = "var(--accent-red)";
      toast(`Audit failed: ${err.message}`, "error");
    } finally {
      runBtn.disabled = false;
    }
  }

  runBtn.addEventListener("click", runAudit);

  applyBtn.addEventListener("click", async () => {
    runBtn.disabled = true; applyBtn.disabled = true;
    try {
      const r = await api.post("/api/config-audit/apply");
      const changed = r && typeof r.changed === "number" ? r.changed : 0;
      toast(`Disabled ${changed} deprecated role line(s)`, "success");
      render(r);
    } catch (err) {
      toast(`Apply failed: ${err.message}`, "error");
    } finally {
      runBtn.disabled = false;
    }
  });

  // Auto-run on view open so users get immediate feedback.
  runAudit();
  return wrap;
}

/** Load project.yaml; returns {} on error so forms still render. */
async function loadProject() {
  try { return await api.get("/api/config/project"); }
  catch { return {}; }
}

/** Save one top-level section of project.yaml via the partial-update route. */
async function saveProjectSection(key, value, statusEl) {
  try {
    await api.put("/api/config/project/section", { key, value });
    toast(`Saved project.${key}`, "success");
    if (statusEl) { statusEl.textContent = "Saved."; statusEl.style.color = "var(--accent-green)"; }
  } catch (err) {
    toast(`Save failed: ${err.message}`, "error");
    if (statusEl) { statusEl.textContent = `Save failed: ${err.message}`; statusEl.style.color = "var(--accent-red)"; }
    throw err;
  }
}

/** Save multiple sections sequentially. */
async function saveProjectSections(entries, statusEl) {
  for (const [key, value] of entries) {
    await saveProjectSection(key, value, null);
  }
  toast("All sections saved", "success");
  if (statusEl) { statusEl.textContent = "Saved."; statusEl.style.color = "var(--accent-green)"; }
}

function textField(label, value, onInput, help) {
  const field = el("div", { class: "field" });
  field.appendChild(el("label", { class: "field-label" }, [label]));
  const inp = el("input", { type: "text", value: value ?? "" });
  inp.addEventListener("input", () => onInput(inp.value));
  field.appendChild(inp);
  if (help) field.appendChild(el("div", { class: "field-help" }, [help]));
  return field;
}

function dropdownField(label, options, value, onChange, labels) {
  const field = el("div", { class: "field" });
  field.appendChild(el("label", { class: "field-label" }, [label]));
  const sel = el("select");
  const labelMap = labels && typeof labels === "object" ? labels : null;
  for (const opt of options) {
    const display = labelMap && Object.prototype.hasOwnProperty.call(labelMap, opt)
      ? labelMap[opt]
      : (opt || "—");
    const o = el("option", { value: opt }, [display]);
    if (opt === value) o.selected = true;
    sel.appendChild(o);
  }
  sel.addEventListener("change", () => onChange(sel.value));
  field.appendChild(sel);
  return field;
}

function checkboxField(label, value, onChange) {
  const field = el("div", { class: "field" });
  const wrapL = el("label", { class: "toggle", style: "margin-right:8px;" });
  const cb = el("input", { type: "checkbox" });
  cb.checked = !!value;
  cb.addEventListener("change", () => onChange(cb.checked));
  wrapL.appendChild(cb); wrapL.appendChild(el("span", { class: "slider" }));
  field.appendChild(el("label", { class: "field-label" }, [label]));
  field.appendChild(wrapL);
  return field;
}

/* ----------------------------------- General ----------------------------- */
async function viewProjectGeneral() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["Project — General"]));

  // Fallback enums (used if /api/config/<preset> is unavailable, e.g. when the
  // admin server is not running in super_admin mode).
  const DOD_FALLBACK   = ["rapid-prototyping", "standard", "strict"];
  const RULES_FALLBACK = ["default", "minimal", "silent"];
  // sync with schema speech-mode enum (config/project-config.schema.json)
  const SPEECH_MODES   = ["full", "short", "childish", "caveman", "asozial", "submissive", "business", "bullshit-bingo", "linkedin"];

  // Load project.yaml and presets in parallel. Each preset endpoint may fail
  // independently — fall back to the hardcoded list in that case.
  const [data, dodPresetsResp, rulesPresetsResp] = await Promise.all([
    loadProject(),
    api.get("/api/config/dod-presets").catch(() => null),
    api.get("/api/config/rules-presets").catch(() => null),
  ]);

  // dod-presets.yaml has either a top-level mapping of preset-name → config,
  // or wraps presets under a "presets" key. Handle both shapes defensively.
  const extractPresetKeys = (obj, fallback) => {
    if (!obj || typeof obj !== "object") return fallback;
    if (obj.presets && typeof obj.presets === "object") return Object.keys(obj.presets);
    return Object.keys(obj);
  };
  const dodOptions   = extractPresetKeys(dodPresetsResp, DOD_FALLBACK);
  const rulesOptions = extractPresetKeys(rulesPresetsResp, RULES_FALLBACK);

  const project = (data.project && typeof data.project === "object") ? clone(data.project) : {};
  const top = { "dod-preset": data["dod-preset"] || "", "rules-preset": data["rules-preset"] || "", "speech-mode": data["speech-mode"] || "", "tier-preset": data["tier-preset"] || "Normal" };

  const TIER_PRESETS = [
    "Cheap", "Normal", "Advanced", "Expensive", "Expensive as Hell",
    "Cheap (SE)", "Normal (SE)", "Advanced (SE)", "Expensive (SE)", "Expensive as Hell (SE)"
  ];

  const status = el("div", { class: "muted" }, ["Loaded from project.yaml."]);
  wrap.appendChild(status);

  const panel = el("div", { class: "panel" });
  panel.appendChild(textField("project.name", project.name, v => project.name = v));
  panel.appendChild(textField("project.prefix", project.prefix, v => project.prefix = v));
  panel.appendChild(textField("project.short", project.short, v => project.short = v));
  panel.appendChild(dropdownField("dod-preset", dodOptions, top["dod-preset"], v => top["dod-preset"] = v));
  panel.appendChild(dropdownField("rules-preset", rulesOptions, top["rules-preset"], v => top["rules-preset"] = v));
  panel.appendChild(dropdownField("speech-mode", SPEECH_MODES, top["speech-mode"], v => top["speech-mode"] = v));
  
  // Tier Preset logic
  const onTierPresetChange = (v) => {
      top["tier-preset"] = v;
      // Triggers live preview update if needed
  };
  panel.appendChild(dropdownField("tier-preset", TIER_PRESETS, top["tier-preset"], onTierPresetChange));

  wrap.appendChild(panel);

  wrap.appendChild(el("div", { class: "btn-row" }, [
    el("button", { class: "btn btn-primary", onclick: async () => {
      try {
        await saveProjectSections([
          ["project", project],
          ["dod-preset", top["dod-preset"]],
          ["rules-preset", top["rules-preset"]],
          ["speech-mode", top["speech-mode"]],
          ["tier-preset", top["tier-preset"]],
        ], status);
      } catch { /* toast already shown */ }
    } }, ["Save"]),
    el("button", { class: "btn", onclick: () => runDryRun() }, ["Dry-run"]),
  ]));
  return wrap;
}

/* ------------------------- Providers & Platforms ------------------------- */
async function viewProjectProviders() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["Project — Providers & Platforms"]));
  const [data, providers, platforms] = await Promise.all([
    loadProject(),
    api.get("/api/providers").catch(() => []),
    api.get("/api/platforms").catch(() => []),
  ]);

  const selProviders = new Set(Array.isArray(data["ai-providers"]) ? data["ai-providers"] : []);
  const selPlatforms = new Set(Array.isArray(data.platforms) ? data.platforms : []);
  const providerOptions = (data["provider-options"] && typeof data["provider-options"] === "object")
    ? clone(data["provider-options"]) : {};
  let isolation = data["provider-isolation"];

  const status = el("div", { class: "muted" }, ["Loaded from project.yaml."]);
  wrap.appendChild(status);

  // Providers checklist
  const provPanel = el("div", { class: "panel" });
  provPanel.appendChild(el("h2", {}, ["AI providers"]));
  if (!providers.length) provPanel.appendChild(el("div", { class: "empty" }, ["No providers available (super-admin config not found)."]));
  for (const p of providers) {
    const line = el("label", { class: "flex-row", style: "gap:8px; margin-bottom:6px; cursor:pointer;" });
    const cb = el("input", { type: "checkbox" });
    cb.checked = selProviders.has(p.name);
    cb.addEventListener("change", () => { cb.checked ? selProviders.add(p.name) : selProviders.delete(p.name); });
    line.appendChild(cb);
    line.appendChild(el("span", { class: "mono" }, [p.name]));
    if (!p.has_model_tiers) line.appendChild(el("span", { class: "muted", title: "manages models centrally" }, ["(central models)"]));
    provPanel.appendChild(line);
  }
  wrap.appendChild(provPanel);

  // Platforms checklist — "generic" is the always-active base layer and is
  // excluded from the selection list (it cannot be toggled off).
  const platPanel = el("div", { class: "panel" });
  platPanel.appendChild(el("h2", {}, ["Platforms"]));
  const selectablePlatforms = platforms.filter(pl => pl.name !== "generic");
  if (!selectablePlatforms.length) platPanel.appendChild(el("div", { class: "empty" }, ["No platforms available."]));
  for (const pl of selectablePlatforms) {
    const line = el("label", { class: "flex-row", style: "gap:8px; margin-bottom:6px; cursor:pointer;" });
    const cb = el("input", { type: "checkbox" });
    cb.checked = selPlatforms.has(pl.name);
    cb.addEventListener("change", () => { cb.checked ? selPlatforms.add(pl.name) : selPlatforms.delete(pl.name); });
    line.appendChild(cb);
    line.appendChild(el("span", { class: "mono" }, [pl.name]));
    platPanel.appendChild(line);
  }
  platPanel.appendChild(el("div", { class: "field-help", style: "margin-top:10px;" }, [
    "Multiple platform layers can be active simultaneously. Agents from ",
    el("code", {}, ["agents/2-platform/<platform>-*.md"]),
    " override generic agents. The ",
    el("code", {}, ["1-generic"]),
    " base is always active and cannot be selected.",
  ]));
  wrap.appendChild(platPanel);

  // provider-isolation + provider-options (nested KV editor)
  const optPanel = el("div", { class: "panel" });
  optPanel.appendChild(el("h2", {}, ["Options"]));
  // provider-isolation: schema enum allows only "disabled". An empty value
  // means "not set" (default = isolation enabled). Render an explicit "(unset)"
  // option so users can clear the field.
  const isolationOptions = ["", "disabled"];
  const isolationLabels  = { "": "enabled (default)", "disabled": "disabled" };
  optPanel.appendChild(dropdownField(
    "provider-isolation",
    isolationOptions,
    typeof isolation === "string" ? isolation : "",
    v => { isolation = v; },
    isolationLabels,
  ));

  // Provider Options — per-provider collapsible KV editors
  optPanel.appendChild(el("h3", { style: "margin-top:16px; margin-bottom:8px; font-size:13px; color:var(--text-secondary);" }, ["provider-options"]));

  // Determine provider names: union of providers from API + keys already in providerOptions
  const providerNames = new Set([
    ...providers.map(p => p.name),
    ...Object.keys(providerOptions),
  ]);

  if (providerNames.size === 0) {
    optPanel.appendChild(el("div", { class: "empty" }, ["No providers configured."]));
  }

  for (const provName of providerNames) {
    if (!providerOptions[provName] || typeof providerOptions[provName] !== "object") {
      providerOptions[provName] = {};
    }
    const provOpts = providerOptions[provName];

    // Collapsible section per provider
    const section = el("div", { style: "margin-bottom:12px; border:1px solid var(--border-color); border-radius:var(--radius);" });

    const header = el("div", {
      style: "display:flex; align-items:center; justify-content:space-between; padding:8px 12px; cursor:pointer; background:var(--bg-tertiary); border-radius:var(--radius);",
    });
    header.appendChild(el("span", { class: "mono", style: "font-weight:600;" }, [provName]));
    const toggleBtn = el("span", { style: "color:var(--text-muted); font-size:11px;" }, ["▼"]);
    header.appendChild(toggleBtn);

    const body = el("div", { style: "padding:8px 12px; display:block;" });

    // KV table
    const table = el("table", { style: "width:100%; border-collapse:collapse;" });
    const thead = el("tr", {}, [
      el("th", { style: "text-align:left; font-size:11px; color:var(--text-muted); padding:4px 0; width:40%;" }, ["Key"]),
      el("th", { style: "text-align:left; font-size:11px; color:var(--text-muted); padding:4px 0; width:40%;" }, ["Value"]),
      el("th", { style: "width:20%;" }, [""]),
    ]);
    table.appendChild(thead);

    // Render existing rows
    function addKVRow(key, val) {
      const row = el("tr", {});
      const keyCell = el("td", { style: "padding:2px 4px 2px 0;" });
      const keyInput = el("input", { type: "text", style: "width:100%; font-family:var(--font-mono); font-size:12px;", placeholder: "key" });
      keyInput.value = key;
      keyCell.appendChild(keyInput);

      const valCell = el("td", { style: "padding:2px 4px;" });
      // Detect bool vs string
      const isBool = val === true || val === false;
      const valSel = el("select", { style: "margin-right:4px; font-size:12px;" });
      const typeOpts = [["string", "string"], ["bool", "bool"]];
      for (const [tv, tl] of typeOpts) {
        const o = el("option", { value: tv }, [tl]);
        if (isBool && tv === "bool") o.setAttribute("selected", "");
        else if (!isBool && tv === "string") o.setAttribute("selected", "");
        valSel.appendChild(o);
      }
      const valInput = el("input", { type: "text", style: "width:calc(100% - 70px); font-size:12px; font-family:var(--font-mono);", placeholder: "value" });
      valInput.value = isBool ? String(val) : (val != null ? String(val) : "");
      valCell.appendChild(valSel);
      valCell.appendChild(valInput);

      const removeCell = el("td", { style: "padding:2px 0 2px 4px; text-align:right;" });
      const removeBtn = el("button", { class: "btn", style: "font-size:11px; padding:2px 6px; color:var(--accent-red);", onclick: () => {
        const oldKey = keyInput.value.trim();
        if (oldKey) delete provOpts[oldKey];
        row.remove();
      } }, ["✕"]);
      removeCell.appendChild(removeBtn);

      // On change: update provOpts
      function sync() {
        const k = keyInput.value.trim();
        if (!k) return;
        // Remove old key if renamed
        // We can't easily track old key here, so we rebuild on save instead
        let v;
        if (valSel.value === "bool") {
          v = valInput.value.trim().toLowerCase() === "true";
        } else {
          v = valInput.value;
        }
        provOpts[k] = v;
      }
      keyInput.addEventListener("change", sync);
      valInput.addEventListener("change", sync);
      valSel.addEventListener("change", sync);

      row.appendChild(keyCell);
      row.appendChild(valCell);
      row.appendChild(removeCell);
      table.appendChild(row);
    }

    for (const [k, v] of Object.entries(provOpts)) {
      addKVRow(k, v);
    }

    body.appendChild(table);

    const addBtn = el("button", { class: "btn", style: "margin-top:6px; font-size:12px;", onclick: () => {
      addKVRow("", "");
    } }, ["+ Add option"]);
    body.appendChild(addBtn);

    // Toggle collapse
    let expanded = true;
    header.addEventListener("click", () => {
      expanded = !expanded;
      body.style.display = expanded ? "block" : "none";
      toggleBtn.textContent = expanded ? "▼" : "▶";
    });

    section.appendChild(header);
    section.appendChild(body);
    optPanel.appendChild(section);
  }

  wrap.appendChild(optPanel);

  wrap.appendChild(el("div", { class: "btn-row" }, [
    el("button", { class: "btn btn-primary", onclick: async () => {
      // Rebuild providerOptions from current table state before saving
      // (rows may have been added/removed; re-read from DOM)
      // We rely on the sync() callbacks having kept provOpts up-to-date.
      // Empty-key rows are ignored by sync(), so provOpts stays clean.
      try {
        await saveProjectSections([
          ["ai-providers", Array.from(selProviders)],
          ["platforms", Array.from(selPlatforms)],
          ["provider-options", providerOptions],
          ["provider-isolation", isolation],
        ], status);
      } catch { /* toast shown */ }
    } }, ["Save"]),
    el("button", { class: "btn", onclick: () => runDryRun() }, ["Dry-run"]),
  ]));
  return wrap;
}

/* ----------------------------------- Roles ------------------------------- */
async function viewProjectRoles() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["Project — Roles"]));

  // Load names + descriptions in parallel. Hierarchy is the authoritative
  // source for descriptions; /api/roles is the alphabetically sorted list.
  const [data, allRoles, hierarchy] = await Promise.all([
    loadProject(),
    api.get("/api/roles").catch(() => []),
    api.get("/api/agents/hierarchy").catch(() => ({ roles: [] })),
  ]);

  const descByName = new Map();
  for (const r of (hierarchy.roles || [])) {
    if (r && r.name) descByName.set(r.name, r.description || "");
  }
  const roleNames = allRoles.map(r => r.name);
  const knownSet  = new Set(roleNames);

  // Active list keeps insertion order (= project.yaml order). Unknown names
  // referenced by project.yaml are preserved so users can clean them up
  // explicitly.
  const active = Array.isArray(data.roles) ? data.roles.filter(Boolean) : [];

  const status = el("div", { class: "muted" }, [`${active.length} roles selected.`]);
  wrap.appendChild(status);

  // Two-column layout: Available ↔ Active
  const grid = el("div", {
    class: "panel",
    style: "display:grid; grid-template-columns:1fr 1fr; gap:16px;",
  });

  const availPanel  = el("div");
  const activePanel = el("div");
  availPanel.appendChild(el("h2", { style: "margin-top:0;" }, ["Available"]));
  activePanel.appendChild(el("h2", { style: "margin-top:0;" }, ["Active"]));

  const availList  = el("div", { class: "role-list", style: "min-height:120px; border:1px dashed var(--border-color); border-radius:var(--radius); padding:8px;" });
  const activeList = el("div", { class: "role-list", style: "min-height:120px; border:1px dashed var(--border-color); border-radius:var(--radius); padding:8px;" });
  availPanel.appendChild(availList);
  activePanel.appendChild(activeList);
  grid.appendChild(availPanel);
  grid.appendChild(activePanel);
  wrap.appendChild(grid);

  /** Build a single role card. ``side`` is "available" or "active". */
  const buildCard = (name, side) => {
    const desc = descByName.get(name) || (knownSet.has(name) ? "" : "Unknown role — not declared in role-defaults.yaml.");
    const card = el("div", {
      class: "role-card",
      draggable: "true",
      "data-role": name,
      style: "display:flex; align-items:flex-start; gap:8px; padding:8px 10px; margin-bottom:6px; border:1px solid var(--border-color); border-radius:var(--radius); background:var(--bg-secondary); cursor:grab;",
    });

    // Move button: → adds to active, ← removes from active
    const moveBtn = el("button", {
      class: "btn",
      style: "flex-shrink:0; padding:2px 8px; font-size:14px; line-height:1;",
      title: side === "available" ? "Add to active" : "Remove from active",
    }, [side === "available" ? "→" : "←"]);
    moveBtn.addEventListener("click", () => {
      if (side === "available") {
        if (!active.includes(name)) active.push(name);
      } else {
        const idx = active.indexOf(name);
        if (idx >= 0) active.splice(idx, 1);
      }
      render();
    });

    const text = el("div", { style: "flex:1; min-width:0;" });
    const nameLine = el("div", { class: "mono", style: "font-weight:600;" }, [name]);
    if (!knownSet.has(name)) nameLine.appendChild(el("span", { class: "muted", style: "margin-left:6px; font-weight:normal;" }, [" (unknown)"]));
    text.appendChild(nameLine);
    if (desc) text.appendChild(el("div", { class: "muted", style: "font-size:12px; margin-top:2px; white-space:normal; word-break:break-word;" }, [desc]));

    card.appendChild(moveBtn);
    card.appendChild(text);

    // Drag handlers — payload is the role name; drop targets read it
    // and call the same move logic the button uses.
    card.addEventListener("dragstart", (e) => {
      e.dataTransfer.setData("text/plain", JSON.stringify({ name, from: side }));
      e.dataTransfer.effectAllowed = "move";
      card.style.opacity = "0.5";
    });
    card.addEventListener("dragend", () => { card.style.opacity = ""; });

    return card;
  };

  /** Attach drop-zone handlers to a column list. */
  const wireDropZone = (zone, targetSide) => {
    zone.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      zone.style.background = "var(--bg-tertiary, rgba(127,127,127,0.08))";
    });
    zone.addEventListener("dragleave", () => { zone.style.background = ""; });
    zone.addEventListener("drop", (e) => {
      e.preventDefault();
      zone.style.background = "";
      let payload;
      try { payload = JSON.parse(e.dataTransfer.getData("text/plain") || "{}"); }
      catch { return; }
      if (!payload.name || payload.from === targetSide) return;
      if (targetSide === "active") {
        if (!active.includes(payload.name)) active.push(payload.name);
      } else {
        const idx = active.indexOf(payload.name);
        if (idx >= 0) active.splice(idx, 1);
      }
      render();
    });
  };
  wireDropZone(availList,  "available");
  wireDropZone(activeList, "active");

  const render = () => {
    availList.replaceChildren();
    activeList.replaceChildren();

    const activeSet = new Set(active);
    const availableNames = roleNames.filter(n => !activeSet.has(n));

    if (!availableNames.length) {
      availList.appendChild(el("div", { class: "empty muted", style: "padding:8px;" }, ["All known roles are active."]));
    } else {
      for (const n of availableNames) availList.appendChild(buildCard(n, "available"));
    }

    if (!active.length) {
      activeList.appendChild(el("div", { class: "empty muted", style: "padding:8px;" }, ["No roles selected — drag from the left or use →."]));
    } else {
      for (const n of active) activeList.appendChild(buildCard(n, "active"));
    }

    status.textContent = `${active.length} roles selected.`;
  };
  render();

  wrap.appendChild(el("div", { class: "field-help", style: "margin-top:10px;" }, [
    "Drag cards between columns or use the arrow buttons. Active roles are saved in their current order to ",
    el("code", {}, ["project.yaml"]),
    " under the ",
    el("code", {}, ["roles"]),
    " key.",
  ]));

  wrap.appendChild(el("div", { class: "btn-row" }, [
    el("button", { class: "btn btn-primary", onclick: async () => {
      try { await saveProjectSection("roles", active.filter(Boolean), status); } catch { /* shown */ }
    } }, ["Save"]),
    el("button", { class: "btn", onclick: () => runDryRun() }, ["Dry-run"]),
  ]));
  return wrap;
}

    prSel.appendChild(o);
  }
  prSel.addEventListener("change", () => {
    hf.protocol_routing = prSel.value || undefined;
    orch.handoff = hf;
  });
  prRow.appendChild(prSel);
  hPanel.appendChild(prRow);

  wrap.appendChild(hPanel);

  // ── Token Budget ──────────────────────────────────────────────────────────
  const tb = (hf["token-budget"] && typeof hf["token-budget"] === "object") ? hf["token-budget"] : {};
  const tbPanel = el("div", { class: "panel" });

    hf["token-budget"] = tb; orch.handoff = hf;
  });
  sbRow.appendChild(sbInput);
  tbPanel.appendChild(sbRow);

  // max_overhead_pct — number input
  const pctRow = el("div", { class: "field-row" });
  pctRow.appendChild(el("label", { class: "field-label" }, ["max_overhead_pct"]));
  const pctInput = el("input", { type: "number", min: "0", max: "100", style: "width:80px;" });
  pctInput.value = tb.max_overhead_pct != null ? String(tb.max_overhead_pct) : "";
  pctInput.addEventListener("change", () => {
    const v = parseInt(pctInput.value, 10);
    tb.max_overhead_pct = isNaN(v) ? undefined : v;
    hf["token-budget"] = tb; orch.handoff = hf;
  });
  pctRow.appendChild(pctInput);
  tbPanel.appendChild(pctRow);

  // on_exceed — dropdown
  const oeRow = el("div", { class: "field-row" });
  oeRow.appendChild(el("label", { class: "field-label" }, ["on_exceed"]));
  const oeSel = el("select", { class: "select" });
  for (const opt of ["", "compact", "warn"]) {
    const o = el("option", { value: opt }, [opt || "(not set)"]);
    if ((tb.on_exceed || "") === opt) o.setAttribute("selected", "");
    oeSel.appendChild(o);
  }
  oeSel.addEventListener("change", () => {
    tb.on_exceed = oeSel.value || undefined;
    hf["token-budget"] = tb; orch.handoff = hf;
  });
  oeRow.appendChild(oeSel);
  tbPanel.appendChild(oeRow);

  wrap.appendChild(tbPanel);

  // ── Save ─────────────────────────────────────────────────────────────────
  wrap.appendChild(el("div", { class: "btn-row" }, [
    el("button", { class: "btn btn-primary", onclick: async () => {
      // Ensure nested objects are written back before saving
      if (Object.keys(uf).length > 0 || orch["unknown-fallback"] !== undefined) {
        orch["unknown-fallback"] = uf;
      }
      if (Object.keys(hf).length > 0 || orch.handoff !== undefined) {
        hf["token-budget"] = tb;
        orch.handoff = hf;
      }
      try { await saveProjectSection("orchestrator", orch, status); } catch { /* toast shown */ }
    } }, ["Save"]),
    el("button", { class: "btn", onclick: () => runDryRun() }, ["Dry-run"]),
  ]));
  return wrap;
}

/* ----------------------------- Model Overrides --------------------------- */
async function viewProjectModelOverrides() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["Project — Model Overrides"]));
  wrap.appendChild(el("p", { class: "muted" }, [
    "Override the model used per provider + role. Providers that manage models centrally are excluded.",
  ]));
  const [data, providers, roles, modelsRes] = await Promise.all([
    loadProject(),
    api.get("/api/providers").catch(() => []),
    api.get("/api/roles").catch(() => []),
    api.get("/api/models").catch(() => ({ models: [] })),
  ]);

  // Only providers with model tiers can carry overrides.
  const tierProviders = providers.filter(p => p.has_model_tiers);
  const providerByName = new Map(providers.map(p => [p.name, p]));
  const roleNames = roles.map(r => r.name);
  const specificModels = modelsRes.models || [];

  // Flatten existing model-overrides into editable rows.
  const existing = (data["model-overrides"] && typeof data["model-overrides"] === "object") ? data["model-overrides"] : {};
  const rows = [];
  for (const [prov, roleMap] of Object.entries(existing)) {
    if (!roleMap || typeof roleMap !== "object") continue;
    for (const [role, model] of Object.entries(roleMap)) {
      rows.push({ provider: prov, role, model });
    }
  }

  const status = el("div", { class: "muted" }, [`${rows.length} overrides.`]);
  wrap.appendChild(status);

  const tableWrap = el("div");
  wrap.appendChild(tableWrap);

  const render = () => {
    tableWrap.replaceChildren();
    const table = el("table", { class: "data" });
    table.appendChild(el("thead", {}, [
      el("tr", {}, ["Provider", "Role", "Model", ""].map(h => el("th", {}, [h]))),
    ]));
    const tbody = el("tbody");
    rows.forEach((row, idx) => {
      const tr = el("tr");

      // Provider dropdown (tier-capable providers only).
      const provSel = el("select");
      const provNames = tierProviders.map(p => p.name);
      if (row.provider && !provNames.includes(row.provider)) {
        provSel.appendChild(el("option", { value: row.provider }, [row.provider + " (no tiers)"]));
      }
      provSel.appendChild(el("option", { value: "" }, ["— select —"]));
      for (const pn of provNames) {
        const o = el("option", { value: pn }, [pn]);
        if (pn === row.provider) o.selected = true;
        provSel.appendChild(o);
      }
      provSel.addEventListener("change", () => { row.provider = provSel.value; render(); });
      tr.appendChild(el("td", {}, [provSel]));

      // Role dropdown.
      const roleSel = el("select");
      const known = new Set(roleNames);
      if (row.role && !known.has(row.role)) roleSel.appendChild(el("option", { value: row.role }, [row.role + " (unknown)"]));
      roleSel.appendChild(el("option", { value: "" }, ["— select —"]));
      for (const rn of roleNames) {
        const o = el("option", { value: rn }, [rn]);
        if (rn === row.role) o.selected = true;
        roleSel.appendChild(o);
      }
      roleSel.addEventListener("change", () => { row.role = roleSel.value; });
      tr.appendChild(el("td", {}, [roleSel]));

      // Model dropdown (depends on provider).
      const modelSel = el("select");
      modelSel.appendChild(el("option", { value: "" }, ["-- Preset Standard (Kein Override) --"]));
      
      const p = providerByName.get(row.provider);
      let found = false;
      if (p) {
        const tierGroup = el("optgroup", { label: "Abstrakte Tiers (Via Matrix aufgelöst)" });
        for (const t of Object.keys(p.model_tiers || {})) {
           const o = el("option", { value: t }, ["Tier: " + t.charAt(0).toUpperCase() + t.slice(1)]);
           if (row.model === t) { o.selected = true; found = true; }
           tierGroup.appendChild(o);
        }
        modelSel.appendChild(tierGroup);

        const specificGroup = el("optgroup", { label: "Spezifische Modelle (Hard Override)" });
        const providerModels = specificModels.filter(m => m.provider === row.provider);
        for (const m of providerModels) {
           const label = m.name ? `${m.name} (${m.provider})` : `${m.id} (${m.provider})`;
           const o = el("option", { value: m.id }, [label]);
           if (row.model === m.id) { o.selected = true; found = true; }
           specificGroup.appendChild(o);
        }
        modelSel.appendChild(specificGroup);
      }
      
      if (row.model && !found) {
        const o = el("option", { value: row.model }, [row.model]);
        o.selected = true;
        modelSel.appendChild(o);
      }
      modelSel.addEventListener("change", () => { row.model = modelSel.value; });
      tr.appendChild(el("td", {}, [modelSel]));

      const rm = el("button", { class: "btn btn-danger" }, ["×"]);
      rm.addEventListener("click", () => { rows.splice(idx, 1); render(); });
      tr.appendChild(el("td", {}, [rm]));

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    status.textContent = `${rows.length} overrides.`;
  };
  render();

  wrap.appendChild(el("div", { class: "btn-row" }, [
    el("button", { class: "btn", onclick: () => { rows.push({ provider: "", role: "", model: "" }); render(); } }, ["Add override"]),
    el("button", { class: "btn btn-primary", onclick: async () => {
      // Rebuild nested object {Provider: {role: model}}.
      const out = {};
      for (const row of rows) {
        if (!row.provider || !row.role || !row.model) continue;
        out[row.provider] = out[row.provider] || {};
        out[row.provider][row.role] = row.model;
      }
      try { await saveProjectSection("model-overrides", out, status); } catch { /* shown */ }
    } }, ["Save"]),
    el("button", { class: "btn", onclick: () => runDryRun() }, ["Dry-run"]),
  ]));
  return wrap;
}

/* =========================================================================
 * Views — Viz Dashboard (embedded iframe + subserver controls)
 * ========================================================================= */
async function viewVizDashboard() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["Viz Dashboard"]));
  wrap.appendChild(el("p", { class: "muted" }, [
    "Embeds the Viz dashboard subserver and lets you start, stop and restart the Viz and MCP subservers.",
  ]));

  // Control panel — Start/Stop/Restart per service.
  const controls = el("div", { class: "panel" });
  controls.appendChild(el("div", { class: "panel-title" }, [el("h2", { style: "margin:0;" }, ["Subserver controls"])]));
  const controlBody = el("div");
  controls.appendChild(controlBody);
  wrap.appendChild(controls);

  // Embed area — iframe (running) or placeholder (stopped).
  const embed = el("div", { class: "panel" });
  embed.appendChild(el("div", { class: "panel-title" }, [el("h2", { style: "margin:0;" }, ["Viz dashboard"])]));
  const embedBody = el("div");
  embed.appendChild(embedBody);
  wrap.appendChild(embed);

  let inFlight = false;
  let lastVizUrl = null;

  const renderControls = (status) => {
    controlBody.replaceChildren();
    const row = (label, name, running) => {
      const line = el("div", { class: "flex-row", style: "margin-bottom:8px;" });
      const dot = running
        ? el("span", { style: "color:var(--accent-green)" }, ["● running"])
        : el("span", { style: "color:var(--text-muted)" }, ["○ stopped"]);
      line.appendChild(el("span", { style: "min-width:120px; font-weight:600;" }, [label]));
      line.appendChild(dot);
      const mkBtn = (text, action, cls) => {
        const b = el("button", { class: `btn ${cls || ""}` }, [text]);
        b.disabled = inFlight;
        b.addEventListener("click", () => doAction(name, action));
        return b;
      };
      line.appendChild(mkBtn("Start", "start", "btn-primary"));
      line.appendChild(mkBtn("Stop", "stop", "btn-danger"));
      line.appendChild(mkBtn("Restart", "restart", ""));
      return line;
    };
    controlBody.appendChild(row("Viz dashboard", "viz", status?.viz?.running));
    controlBody.appendChild(row("MCP server", "mcp", status?.mcp?.running));
  };

  const renderEmbed = (status) => {
    const viz = status?.viz || {};
    if (viz.running && viz.url) {
      // Only rebuild the iframe when the URL changes — avoids reloading on
      // every 5s poll.
      if (lastVizUrl !== viz.url || !embedBody.querySelector("iframe")) {
        embedBody.replaceChildren();
        const frame = el("iframe", {
          src: viz.url,
          style: "width:100%; height:600px; border:1px solid var(--border-color); border-radius:var(--radius); background:#fff;",
        });
        embedBody.appendChild(frame);
        lastVizUrl = viz.url;
      }
    } else {
      lastVizUrl = null;
      embedBody.replaceChildren();
      const placeholder = el("div", { class: "empty" });
      placeholder.appendChild(el("div", {}, ["Viz dashboard is not running."]));
      const startBtn = el("button", { class: "btn btn-primary", style: "margin-top:12px;" }, ["Start Viz Server"]);
      startBtn.disabled = inFlight;
      startBtn.addEventListener("click", () => doAction("viz", "start"));
      placeholder.appendChild(startBtn);
      embedBody.appendChild(placeholder);
    }
  };

  const applyStatus = (status) => {
    renderControls(status);
    renderEmbed(status);
  };

  const doAction = async (name, action) => {
    if (inFlight) return;
    inFlight = true;
    renderControls(lastStatus);
    toast(`${action} ${name}…`, "info", 1500);
    try {
      const r = await api.post(`/api/subserver/${name}/${action}`);
      lastStatus = r.status;
      toast(
        r.success ? `${name} ${action} ok` : `${name} ${action} failed`,
        r.success ? "success" : "error",
      );
    } catch (err) {
      toast(`${name} ${action} failed: ${err.message}`, "error");
    } finally {
      inFlight = false;
      applyStatus(lastStatus);
    }
  };

  let lastStatus = null;
  try {
    lastStatus = await api.get("/api/subserver-status");
  } catch { /* best effort */ }
  applyStatus(lastStatus);

  // Poll every 5s while this view is mounted. Stop on route change.
  const poll = setInterval(async () => {
    if (inFlight) return;
    try {
      lastStatus = await api.get("/api/subserver-status");
      applyStatus(lastStatus);
    } catch { /* best effort */ }
  }, 5000);
  window.addEventListener("hashchange", () => clearInterval(poll), { once: true });

  return wrap;
}

/* =========================================================================

async function viewModelDashboard() {

    provider: "",
    model: "",
    category: "",

    outCost: "",

  const tableWrap = el("div", { id: "models-table-wrap" });

  const applyFilters = () => {
    const rows = tableWrap.querySelectorAll("tbody tr");

      const pMatch = !filterState.provider || texts[0].includes(filterState.provider.toLowerCase());

      const cMatch = !filterState.category || texts[2].includes(filterState.category.toLowerCase());
      
      if (pMatch && mMatch && cMatch) {
        tr.style.display = "";
      } else {
        tr.style.display = "none";
      }
    });
  };

  const createFilterInput = (key) => {
    const input = el("input", { type: "text", placeholder: "Filter...", style: "width: 100%; box-sizing: border-box; margin-top: 4px; font-weight: normal; font-size: 0.9em; padding: 2px 4px;" });
    input.addEventListener("input", (e) => {
      filterState[key] = e.target.value;
      applyFilters();
    });
    return input;
  };

  const renderTable = () => {
    tableWrap.innerHTML = "";
    if (modelsData.length === 0) {
      tableWrap.innerHTML = "<div class='empty'>No models found in registry. Click refresh to discover.</div>";
      return;
    }
    
    const table = el("table", { class: "data", id: "models-table" });
    const thead = el("thead");
    
    // Headers with filters
    thead.appendChild(el("tr", {}, [
      el("th", {}, ["Provider", el("br"), createFilterInput("provider")]),
      el("th", {}, ["Model (Name & ID)", el("br"), createFilterInput("model")]),
      el("th", {}, ["Category", el("br"), createFilterInput("category")]),
      el("th", {}, ["Input Cost ($/1M)"]),
      el("th", {}, ["Output Cost ($/1M)"]),
      el("th", {}, ["Cost Factor (1-100)"]),
      el("th", {}, ["Actions / Ref"]),
    ]));
    table.appendChild(thead);
    
    const tbody = el("tbody");
    modelsData.forEach(m => {
      const tr = el("tr");
      tr.dataset.provider = m.provider;
      tr.dataset.modelId = m.id;

      tr.appendChild(el("td", {}, [m.provider]));
      tr.appendChild(el("td", {}, [
        el("strong", {}, [m.name || m.id]),
        el("br"),
        el("small", { class: "muted mono" }, [m.id])
      ]));
      tr.appendChild(el("td", {}, [el("span", { class: "badge" }, [m.tier || "Standard"])]));
      
      const inVal = m.input_cost?.toFixed(2) || "0.00";
      const outVal = m.output_cost?.toFixed(2) || "0.00";
      
      // Cost fields container
      const inTd = el("td", { class: "mono" });
      const outTd = el("td", { class: "mono" });
      
      const inInput = el("input", { type: "number", step: "0.01", style: "width: 80px;", value: inVal, class: "cost-input-in" });
      const outInput = el("input", { type: "number", step: "0.01", style: "width: 80px;", value: outVal, class: "cost-input-out" });
      
      const inSpan = el("span", { class: "cost-text" }, [inVal]);
      const outSpan = el("span", { class: "cost-text" }, [outVal]);
      
      inInput.style.display = editMode ? "inline-block" : "none";
      outInput.style.display = editMode ? "inline-block" : "none";
      inSpan.style.display = editMode ? "none" : "inline-block";
      outSpan.style.display = editMode ? "none" : "inline-block";

      const inBadgeClass = (m.input_source === "Overlay") ? "badge warn" : "badge ok";
      const outBadgeClass = (m.output_source === "Overlay") ? "badge warn" : "badge ok";

      inTd.appendChild(inInput);
      inTd.appendChild(inSpan);
      inTd.appendChild(el("span", { class: inBadgeClass, style: "margin-left: 8px;" }, [m.input_source || "API"]));
      
      outTd.appendChild(outInput);
      outTd.appendChild(outSpan);
      outTd.appendChild(el("span", { class: outBadgeClass, style: "margin-left: 8px;" }, [m.output_source || "API"]));
      
      tr.appendChild(inTd);
      tr.appendChild(outTd);
      
      const cf = m.cost_factor || 0;
      let heatColor = "var(--accent-blue)";
      if (cf > 20) heatColor = "var(--accent-yellow)";
      if (cf > 50) heatColor = "var(--accent-red)";
      
      tr.appendChild(el("td", { style: `color: ${heatColor}; font-weight: bold;` }, [
        cf.toFixed(2),
        el("span", { class: "badge optional", style: "margin-left: 8px;" }, ["Calc"])
      ]));
      
      const actionTd = el("td", {});
      if (m.source_url && !editMode) {
        actionTd.appendChild(el("a", { href: m.source_url, target: "_blank" }, ["Pricing URL"]));
      }
      
      const resetBtn = el("button", { class: "btn-icon", style: "cursor: pointer; background: transparent; border: none; font-size: 1.2em;", title: "Reset Pricing Overlay" }, ["🗑️"]);
      resetBtn.style.display = editMode ? "inline-block" : "none";
      resetBtn.onclick = async () => {
        if (!confirm(`Reset pricing overlay for ${m.id}?`)) return;
        const r = await api.post("/api/pricing/reset", { provider: m.provider, id: m.id });
        if (r.success) {
          toast("Pricing reset", "success");
          await loadData();
        } else {
          toast("Reset failed", "error");
        }
      };
      
      actionTd.appendChild(resetBtn);
      
      tr.appendChild(actionTd);
      
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    applyFilters();
  };

  const getDatalistId = (provider) => `model-list-${provider.replace(/[^a-zA-Z0-9]/g, '-')}`;

  const renderProviders = () => {
    providersWrap.innerHTML = "";
    providersWrap.appendChild(el("h2", {}, ["Provider Tier Mappings"]));
    providersWrap.appendChild(el("p", { class: "muted" }, ["Map specific models to abstract performance tiers for each provider. Readings from ai-providers.yaml"]));
    
    // Create datalists for each provider's models
    const uniqueProviders = [...new Set(modelsData.map(m => m.provider))];
    uniqueProviders.forEach(p => {
      const dl = el("datalist", { id: getDatalistId(p) });
      modelsData.filter(m => m.provider === p).forEach(m => {
        dl.appendChild(el("option", { value: m.id }, [m.name]));
      });
      providersWrap.appendChild(dl);
    });
    
    const table = el("table", { class: "data provider-tiers-table" });
    const thead = el("thead");
    thead.appendChild(el("tr", {}, [
      el("th", {}, ["Provider"]),
      el("th", {}, ["Tier: nano"]),
      el("th", {}, ["Tier: fast"]),
      el("th", {}, ["Tier: balanced"]),
      el("th", {}, ["Tier: powerful"]),
      el("th", {}, ["Tier: max"]),
    ]));
    table.appendChild(thead);
    
    const tbody = el("tbody");
    
    const providersList = Object.keys(aiProvidersData).length > 0 ? Object.keys(aiProvidersData) : uniqueProviders;
    
    providersList.forEach(p => {
      const tr = el("tr");
      tr.dataset.provider = p;
      tr.appendChild(el("td", {}, [el("strong", {}, [p])]));
      
      const tiers = ["nano", "fast", "balanced", "powerful", "max"];
      const pData = aiProvidersData[p] || {};
      const tData = pData.tiers || {};
      
      tiers.forEach(t => {
        const td = el("td", {});
        const val = tData[t] || "";
        
        if (editMode) {
          const input = el("input", { type: "text", list: getDatalistId(p), value: val, class: `tier-input-${t}`, style: "width: 100%; box-sizing: border-box;" });
          td.appendChild(input);
        } else {
          td.appendChild(el("span", { class: "mono" }, [val || "-"]));
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    
    table.appendChild(tbody);
    providersWrap.appendChild(table);
  };

  const renderPresets = () => {
    presetsWrap.innerHTML = "";
    presetsWrap.appendChild(el("h2", {}, ["Tier Presets"]));
    presetsWrap.appendChild(el("p", { class: "muted" }, ["Manage configuration templates that map generic tasks to required model tiers. (tier-presets.yaml)"]));
    
    const table = el("table", { class: "data tier-presets-table" });
    const thead = el("thead");
    thead.appendChild(el("tr", {}, [
      el("th", {}, ["Preset ID"]),
      el("th", {}, ["Description"]),
      el("th", {}, ["Default"]),
      el("th", {}, ["Trivial"]),
      el("th", {}, ["Standard"]),
      el("th", {}, ["Complex"])
    ]));
    table.appendChild(thead);
    
    const tbody = el("tbody");
    
    // Convert dict to array to map
    Object.keys(tierPresetsData).forEach(presetId => {
      const tr = el("tr");
      tr.dataset.presetId = presetId;
      const data = tierPresetsData[presetId];
      
      tr.appendChild(el("td", {}, [el("strong", {}, [presetId])]));
      
      if (editMode) {
        tr.appendChild(el("td", {}, [el("input", { type: "text", class: "preset-desc", value: data.description || "", style: "width: 100%; box-sizing: border-box;" })]));
      } else {
        tr.appendChild(el("td", {}, [data.description || "-"]));
      }
      
      const tiers = ["nano", "fast", "balanced", "powerful", "max"];
      const mapping = data.mapping || {};
      
      ["default", "trivial", "standard", "complex"].forEach(taskComplexity => {
        const td = el("td", {});
        const val = mapping[taskComplexity] || "";
        
        if (editMode) {
          const select = el("select", { class: `preset-mapping-${taskComplexity}`, style: "width: 100%;" });
          select.appendChild(el("option", { value: "" }, ["(none)"]));
          tiers.forEach(t => {
            const opt = el("option", { value: t }, [t]);
            if (t === val) opt.selected = true;
            select.appendChild(opt);
          });
          td.appendChild(select);
        } else {
          td.appendChild(el("span", { class: "badge" }, [val || "-"]));
        }
        tr.appendChild(td);
      });
      
      tbody.appendChild(tr);
    });
    
    table.appendChild(tbody);
    presetsWrap.appendChild(table);
  };

  const loadData = async () => {
    try {
      const [resModels, resProviders, resPresets] = await Promise.all([
        api.get("/api/models"),
        api.get("/api/ai-providers"),
        api.get("/api/tier-presets")
      ]);
      
      modelsData = resModels.models || [];
      aiProvidersData = resProviders || {};
      tierPresetsData = resPresets || {};
      
      renderTable();
      renderProviders();
      renderPresets();
    } catch (err) {
      tableWrap.innerHTML = "";
      tableWrap.appendChild(renderError(err));
    }
  };

  editToggle.addEventListener("change", (e) => {
    editMode = e.target.checked;
    saveBtn.style.display = editMode ? "inline-block" : "none";
    
    // Re-render to show/hide inputs
    renderTable();
    renderProviders();
    renderPresets();
  });

  refreshBtn.onclick = async () => {
    refreshBtn.disabled = true;
    refreshBtn.textContent = "Running sync.py...";
    try {
      const r = await api.post("/api/models/update");
      if (r.success) {
        toast("Models updated successfully", "success");
        await loadData();
      } else {
        toast("Model update failed", "error");
      }
    } catch (err) {
      toast("Error: " + err.message, "error");
    } finally {
      refreshBtn.disabled = false;
      refreshBtn.textContent = "Refresh via sync.py";
    }
  };

  saveBtn.onclick = async () => {
    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";
    
    try {
      // 1. Collect Pricing Updates
      const pricingUpdates = [];
      tableWrap.querySelectorAll("tr[data-provider]").forEach(tr => {
        const inInput = tr.querySelector(".cost-input-in");
        const outInput = tr.querySelector(".cost-input-out");
        if (inInput && outInput) {
            pricingUpdates.push({
              provider: tr.dataset.provider,
              id: tr.dataset.modelId,
              input_cost: inInput.value ? parseFloat(inInput.value) : 0,
              output_cost: outInput.value ? parseFloat(outInput.value) : 0
            });
        }
      });
      
      // 2. Collect Providers Updates
      const newProvidersData = JSON.parse(JSON.stringify(aiProvidersData));
      providersWrap.querySelectorAll("tr[data-provider]").forEach(tr => {
        const p = tr.dataset.provider;
        if (!newProvidersData[p]) newProvidersData[p] = { tiers: {} };
        if (!newProvidersData[p].tiers) newProvidersData[p].tiers = {};
        
        ["nano", "fast", "balanced", "powerful", "max"].forEach(t => {
          const input = tr.querySelector(`.tier-input-${t}`);
          if (input) {
            if (input.value) newProvidersData[p].tiers[t] = input.value;
            else delete newProvidersData[p].tiers[t];
          }
        });
      });
      
      // 3. Collect Presets Updates
      const newPresetsData = JSON.parse(JSON.stringify(tierPresetsData));
      presetsWrap.querySelectorAll("tr[data-preset-id]").forEach(tr => {
        const pid = tr.dataset.presetId;
        const descInput = tr.querySelector(".preset-desc");
        if (descInput) {
          newPresetsData[pid].description = descInput.value;
        }
        
        if (!newPresetsData[pid].mapping) newPresetsData[pid].mapping = {};
        
        ["default", "trivial", "standard", "complex"].forEach(comp => {
          const select = tr.querySelector(`.preset-mapping-${comp}`);
          if (select) {
            if (select.value) newPresetsData[pid].mapping[comp] = select.value;
            else delete newPresetsData[pid].mapping[comp];
          }
        });
      });

      const p1 = api.post("/api/pricing/update", { updates: pricingUpdates });
      const p2 = api.post("/api/ai-providers/update", Object.keys(newProvidersData).length > 0 ? newProvidersData : {});
      const p3 = api.post("/api/tier-presets/update", Object.keys(newPresetsData).length > 0 ? newPresetsData : {});
      
      await Promise.all([p1, p2, p3]);
      
      toast("Configs saved successfully", "success");
      await loadData();
    } catch (err) {
      toast("Error saving: " + err.message, "error");
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = "Save Configs";
    }
  };

  loadData();
  return wrap;
}

/* =========================================================================
 * Bootstrap
 * ========================================================================= */
async function init() {
  // Mode detection
  try {
    const mode = await api.get("/api/mode");
    state.state.mode = mode.mode;
    state.state.allowedKeys = mode.allowed_keys || [];
    state.state.projectAdminAvailable = !!mode.project_admin_available;
    const badge = document.getElementById("mode-badge");
    badge.textContent = mode.mode;
    badge.classList.toggle("project", mode.mode === "project_admin");
  } catch (err) {
    document.getElementById("content").innerHTML = "";
    document.getElementById("content").appendChild(renderError(err));
    return;
  }

  // Schema
  let schema = { type: "object", properties: {} };
  try { schema = await api.get("/api/schema/project"); } catch { /* optional */ }
  state.state.schema = schema;
  const schemaP = Promise.resolve(schema);

  // Routes
  router.register("/",                viewDashboard);
  router.register("/viz-dashboard",   viewVizDashboard);
  router.register("/sync",            viewSync);
  router.register("/live",            viewLive);
  // Project instance — thematic sub-pages (split from the old single config page)
  router.register("/project/general",         viewProjectGeneral);
  router.register("/project/providers",       viewProjectProviders);
  router.register("/project/roles",           viewProjectRoles);
  router.register("/project/orchestrator",    viewProjectOrchestrator);
  router.register("/project/viz-admin",       viewProjectVizAdmin);
  router.register("/project/model-overrides", viewProjectModelOverrides);
  router.register("/project/advanced",        viewProjectAdvanced);
  // Backward-compat: keep the old route pointing at the raw editor.
  router.register("/config/project",  viewProjectAdvanced);
  router.register("/config/role-defaults",     viewRoleDefaults);
  router.register("/config/ai-providers",      viewAIProviders);
  router.register("/config/skills-registry",   viewSkillsRegistry);
  router.register("/config/mcp-registry",      viewMcpRegistry);
  router.register("/config/dod-presets",       viewDodPresets);
  router.register("/config/delegation-syntax", viewDelegationSyntax);
  router.register("/config/export",            viewExport);
  router.register("/roles",     viewRoles);
  router.register("/pipelines", viewPipelines);
  router.register("/agents",    viewAgentTemplates);
  router.register("/config-audit", viewConfigAudit);
  router.register("/models", viewModelDashboard);

  buildSidebar();
  router.resolve();
}

init();
</script>
