<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>agent-meta — Live Dashboard</title>
    <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
    <style>
        :root {
            --bg: #0f0f23;
            --surface: #1a1a2e;
            --surface-hover: #16213e;
            --text: #eaeaea;
            --text-muted: #a0a0a0;
            --border: #2a2a4a;
            --running: #ffd43b;
            --success: #69db7c;
            --error: #ff6b6b;
            --idle: #868e96;
            --recommended: #1971c2;
            --accent: #4dabf7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
            overflow-x: hidden;
        }
        #app { display: flex; flex-direction: column; height: 100vh; }
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        header h1 { font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }
        #session-meta { display: flex; gap: 20px; font-size: 0.85rem; color: var(--text-muted); }
        #session-meta span strong { color: var(--text); }
        #status-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--idle); display: inline-block;
            animation: none;
        }
        #status-dot.live {
            background: var(--running);
            box-shadow: 0 0 8px var(--running);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; box-shadow: 0 0 4px var(--running); }
            50% { opacity: 0.6; box-shadow: 0 0 12px var(--running); }
            100% { opacity: 1; box-shadow: 0 0 4px var(--running); }
        }
        #error-banner {
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid var(--error);
            color: var(--error);
            padding: 10px 24px;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        #main {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 1px;
            background: var(--border);
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }
        #graph-container {
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }
        #cy { width: 100%; height: 100%; }
        #sidebar {
            background: var(--surface);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px;
            gap: 12px;
        }
        #sidebar h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .agent-card {
            background: var(--bg);
            border-radius: 8px;
            padding: 12px;
            border-left: 3px solid var(--idle);
            transition: border-color 0.3s, transform 0.2s;
            cursor: default;
        }
        .agent-card:hover { transform: translateX(2px); }
        .agent-card.status-running { border-left-color: var(--running); }
        .agent-card.status-success { border-left-color: var(--success); }
        .agent-card.status-error { border-left-color: var(--error); }
        .agent-card.status-done { border-left-color: var(--success); }
        .agent-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .agent-name { font-weight: 600; font-size: 0.95rem; }
        .agent-badge {
            font-size: 0.65rem; text-transform: uppercase; padding: 2px 6px;
            border-radius: 4px; background: rgba(255,255,255,0.08); color: var(--text-muted);
            font-weight: 600;
        }
        .agent-badge.status-running { background: rgba(255,212,59,0.15); color: var(--running); }
        .agent-badge.status-success { background: rgba(105,219,124,0.15); color: var(--success); }
        .agent-badge.status-error { background: rgba(255,107,107,0.15); color: var(--error); }
        .agent-duration { font-size: 0.8rem; color: var(--text-muted); }
        #timeline-container {
            background: var(--surface);
            border-top: 1px solid var(--border);
            max-height: 220px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        #timeline-container h3 {
            padding: 10px 24px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }
        #timeline-scroll { overflow-y: auto; flex: 1; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        thead th {
            position: sticky; top: 0;
            background: var(--surface);
            padding: 8px 24px;
            text-align: left;
            color: var(--text-muted);
            font-weight: 500;
            border-bottom: 1px solid var(--border);
        }
        tbody td { padding: 6px 24px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        tbody tr:hover { background: rgba(255,255,255,0.03); }
        tbody tr.new-row { animation: fadein 0.5s ease-out; }
        @keyframes fadein { from { opacity: 0; background: rgba(77,171,247,0.1); } to { opacity: 1; background: transparent; } }
        .icon { width: 24px; text-align: center; }
        .ts { color: var(--text-muted); font-family: monospace; font-size: 0.8rem; width: 70px; }
        .msg { color: var(--text); overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
        #empty-state {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; color: var(--text-muted); gap: 12px;
        }
        #empty-state code {
            background: var(--surface); padding: 6px 12px; border-radius: 6px;
            border: 1px solid var(--border); color: var(--text);
        }
        @media (max-width: 900px) {
            #main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
            #sidebar { max-height: 200px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <h1><span id="status-dot"></span> agent-meta — Live Dashboard</h1>
            <div id="session-meta">
                <span>Session: <strong id="meta-name">—</strong></span>
                <span>Dauer: <strong id="meta-duration">—</strong></span>
                <span>Agenten: <strong id="meta-agents">0</strong></span>
                <span>Events: <strong id="meta-events">0</strong></span>
            </div>
        </header>
        <div id="error-banner">
            <span>⚠</span> <span id="error-text">Server nicht erreichbar</span>
        </div>
        <div id="main">
            <div id="graph-container">
                <div id="cy"></div>
                <div id="empty-state" style="display:none">
                    <div style="font-size:2rem">🤖</div>
                    <div>Keine Session-Daten vorhanden</div>
                    <div>Starte den Server: <code>python scripts/viz-report.py --serve</code></div>
                </div>
            </div>
            <div id="sidebar">
                <h3>Agenten-Status</h3>
                <div id="agent-list"></div>
            </div>
        </div>
        <div id="timeline-container">
            <h3>Event-Timeline</h3>
            <div id="timeline-scroll">
                <table>
                    <thead><tr><th class="ts">Zeit</th><th class="icon"></th><th>Ereignis</th></tr></thead>
                    <tbody id="timeline-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const POLL_MS = 2000;
            let cy = null;
            let lastEventCount = 0;
            let isFirstLoad = true;

            const colors = {
                idle: '#868e96',
                running: '#ffd43b',
                success: '#69db7c',
                error: '#ff6b6b',
                done: '#69db7c',
                edge: '#4dabf7',
                edgeHighlight: '#ffd43b'
            };

            function initGraph() {
                cy = cytoscape({
                    container: document.getElementById('cy'),
                    style: [
                        { selector: 'node', style: {
                            'background-color': colors.idle,
                            'label': 'data(label)',
                            'color': '#fff',
                            'text-valign': 'center',
                            'text-halign': 'center',
                            'shape': 'round-rectangle',
                            'width': 'label',
                            'height': 'label',
                            'padding': '12px',
                            'font-size': '13px',
                            'font-weight': '600',
                            'border-width': 2,
                            'border-color': '#fff',
                            'border-opacity': 0.3,
                            'text-wrap': 'wrap',
                            'text-max-width': '100px',
                            'transition-property': 'background-color, border-color, border-width',
                            'transition-duration': '0.3s'
                        }},
                        { selector: 'node.status-running', style: {
                            'background-color': colors.running,
                            'color': '#000',
                            'border-color': colors.running,
                            'border-opacity': 1,
                            'border-width': 3,
                            'shadow-blur': 12,
                            'shadow-color': colors.running,
                            'shadow-opacity': 0.6
                        }},
                        { selector: 'node.status-success', style: {
                            'background-color': colors.success,
                            'color': '#000',
                            'border-color': colors.success,
                            'border-opacity': 0.6
                        }},
                        { selector: 'node.status-done', style: {
                            'background-color': colors.done,
                            'color': '#000',
                            'border-color': colors.done,
                            'border-opacity': 0.6
                        }},
                        { selector: 'node.status-error', style: {
                            'background-color': colors.error,
                            'color': '#fff',
                            'border-color': colors.error,
                            'border-opacity': 1,
                            'border-width': 3
                        }},
                        { selector: 'edge', style: {
                            'width': 2,
                            'line-color': colors.edge,
                            'target-arrow-color': colors.edge,
                            'target-arrow-shape': 'triangle',
                            'curve-style': 'bezier',
                            'arrow-scale': 1.2,
                            'line-opacity': 0.5
                        }},
                        { selector: 'edge.highlight', style: {
                            'line-color': colors.edgeHighlight,
                            'target-arrow-color': colors.edgeHighlight,
                            'line-opacity': 1,
                            'width': 3,
                            'shadow-blur': 8,
                            'shadow-color': colors.edgeHighlight,
                            'shadow-opacity': 0.5
                        }}
                    ],
                    layout: { name: 'grid', padding: 30 },
                    wheelSensitivity: 0.3,
                    minZoom: 0.3,
                    maxZoom: 2.5
                });
            }

            function updateGraph(state) {
                if (!cy) initGraph();
                const agents = state.agents || {};
                const edges = state.edges || [];

                const existingNodes = new Set(cy.nodes().map(n => n.id()));
                const existingEdges = new Set(cy.edges().map(e => e.id()));
                const neededNodes = new Set(Object.keys(agents));
                const neededEdges = new Set();

                edges.forEach((e, i) => {
                    neededNodes.add(e.from);
                    neededNodes.add(e.to);
                    neededEdges.add(`edge-${i}`);
                });

                // Remove old
                cy.nodes().filter(n => !neededNodes.has(n.id())).remove();
                cy.edges().filter(e => !neededEdges.has(e.id())).remove();

                // Add/update nodes
                Object.entries(agents).forEach(([name, info]) => {
                    const status = info.status || 'idle';
                    const el = cy.getElementById(name);
                    if (el.length === 0) {
                        cy.add({ group: 'nodes', data: { id: name, label: name } });
                    }
                    const node = cy.getElementById(name);
                    node.removeClass('status-idle status-running status-success status-error status-done');
                    node.addClass(`status-${status}`);
                });

                // Add/update edges
                edges.forEach((e, i) => {
                    const id = `edge-${i}`;
                    if (cy.getElementById(id).length === 0) {
                        cy.add({
                            group: 'edges',
                            data: { id: id, source: e.from, target: e.to }
                        });
                    }
                });

                // Layout nur beim ersten Mal oder wenn neue Nodes/Edges
                if (isFirstLoad || cy.nodes().length !== existingNodes.size) {
                    cy.layout({
                        name: 'cose',
                        padding: 30,
                        animate: true,
                        animationDuration: 500,
                        fit: true,
                        componentSpacing: 60,
                        nodeOverlap: 20,
                        refresh: 20,
                        gravity: 0.8
                    }).run();
                }
            }

            function updateAgents(agents) {
                const container = document.getElementById('agent-list');
                const existing = new Set(Array.from(container.children).map(c => c.dataset.name));
                const needed = new Set(Object.keys(agents));

                // Entferne alte
                Array.from(container.children).forEach(c => {
                    if (!needed.has(c.dataset.name)) c.remove();
                });

                Object.entries(agents).forEach(([name, info]) => {
                    let card = container.querySelector(`[data-name="${name}"]`);
                    const status = info.status || 'idle';
                    const dur = info.duration_sec || 0;
                    const durStr = dur > 0 ? `${Math.floor(dur/60).toString().padStart(2,'0')}:${Math.floor(dur%60).toString().padStart(2,'0')}` : '—';

                    if (!card) {
                        card = document.createElement('div');
                        card.className = 'agent-card';
                        card.dataset.name = name;
                        container.appendChild(card);
                    }
                    card.className = `agent-card status-${status}`;
                    card.innerHTML = `
                        <div class="agent-header">
                            <span class="agent-name">${name}</span>
                            <span class="agent-badge status-${status}">${status}</span>
                        </div>
                        <div class="agent-duration">⏱ ${durStr}</div>
                    `;
                });
            }

            function updateTimeline(timeline) {
                const tbody = document.getElementById('timeline-body');
                const rows = timeline.slice(-50).reverse();
                const html = rows.map((t, i) => {
                    const ts = t.ts ? t.ts.split('T')[1].substring(0, 8) : '';
                    const isNew = i < (timeline.length - lastEventCount);
                    const cls = isNew ? 'new-row' : '';
                    return `<tr class="${cls}"><td class="ts">${ts}</td><td class="icon">${t.icon}</td><td class="msg">${escapeHtml(t.msg)}</td></tr>`;
                }).join('');
                tbody.innerHTML = html;
                lastEventCount = timeline.length;
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function updateMeta(state) {
                document.getElementById('meta-name').textContent = state.session_name || '—';
                document.getElementById('meta-duration').textContent = formatDuration(state.duration_sec || 0);
                document.getElementById('meta-agents').textContent = Object.keys(state.agents || {}).length;
                document.getElementById('meta-events').textContent = (state.timeline || []).length;
            }

            function formatDuration(sec) {
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            }

            function showError(msg) {
                const banner = document.getElementById('error-banner');
                const text = document.getElementById('error-text');
                text.textContent = msg;
                banner.style.display = 'flex';
                document.getElementById('status-dot').classList.remove('live');
            }
            function hideError() {
                document.getElementById('error-banner').style.display = 'none';
                document.getElementById('status-dot').classList.add('live');
            }

            async function fetchState() {
                try {
                    const resp = await fetch('/api/state');
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    const state = await resp.json();
                    hideError();

                    const hasData = Object.keys(state.agents || {}).length > 0 || (state.timeline || []).length > 0;
                    document.getElementById('empty-state').style.display = hasData ? 'none' : 'flex';
                    if (!hasData) return;

                    updateMeta(state);
                    updateGraph(state);
                    updateAgents(state.agents || {});
                    updateTimeline(state.timeline || []);
                    isFirstLoad = false;
                } catch (e) {
                    showError('Server nicht erreichbar — Starte mit: python scripts/viz-report.py --serve');
                    if (!cy || cy.nodes().length === 0) {
                        document.getElementById('empty-state').style.display = 'flex';
                    }
                }
            }

            // Init
            initGraph();
            fetchState();
            setInterval(fetchState, POLL_MS);
        })();
    </script>
</body>
</html>
