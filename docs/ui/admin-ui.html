async function viewRulesPresets() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["rules-presets.yaml"]));
  let data;
  try { data = await api.get("/api/config/rules-presets"); }
  catch (err) { wrap.appendChild(renderError(err)); return wrap; }

  data.presets = data.presets || {};
  const presets = data.presets;

  // Collect every rule referenced across all presets
  const knownRules = new Set();
  for (const p of Object.values(presets)) {
    if (p && typeof p === "object") {
      for (const k of Object.keys(p)) knownRules.add(k);
    }
  }
  const rules = [...knownRules].sort();

  const GEMINI_OPTIONS = ["", "skip"];
  const status = el("div", { class: "muted" }, [`${Object.keys(presets).length} presets · ${rules.length} rules`]);
  wrap.appendChild(status);
  const markDirty = () => {
    status.textContent = "Unsaved changes.";
    status.style.color = "var(--accent-yellow)";
  };
  const save = async () => {
    try {
      await api.put("/api/config/rules-presets", data);
      toast("rules-presets saved", "success");
      status.textContent = "Saved.";
      status.style.color = "var(--accent-green)";
    } catch (err) {
      toast(`Save failed: ${err.message}`, "error");
      status.textContent = `Save failed: ${err.message}`;
      status.style.color = "var(--accent-red)";
    }
  };
  wrap.appendChild(el("div", { class: "btn-row" }, [
    el("button", { class: "btn btn-primary", onclick: save }, ["Save"]),
    el("button", { class: "btn", onclick: () => runDryRun() }, ["Dry-run"]),
  ]));

  for (const [pName, preset] of Object.entries(presets)) {
    if (!preset || typeof preset !== "object") continue;
    const panel = el("details", { class: "panel" });
    const ruleCount = Object.keys(preset).length;
    panel.appendChild(el("summary", { style: "cursor:pointer; font-weight:600;" }, [`${pName} (${ruleCount} rules)`]));

    const rulesHere = new Set(Object.keys(preset));

    // Add-rule row
    const addRow = el("div", { class: "field-row", style: "margin-bottom:12px;" });
    const addSel = el("select");
    addSel.appendChild(el("option", { value: "" }, ["— add rule —"]));
    for (const r of rules) {
      if (!rulesHere.has(r)) addSel.appendChild(el("option", { value: r }, [r]));
    }
    addSel.appendChild(el("option", { value: "__new__" }, ["+ new rule…"]));
    addSel.addEventListener("change", () => {
      if (addSel.value === "__new__") {
        const name = prompt("New rule name (e.g. my-rule):", "");
        if (name && !preset[name]) { preset[name] = {}; rules.push(name); markDirty(); renderPreset(); }
        addSel.value = "";
        return;
      }
      if (addSel.value && !preset[addSel.value]) {
        preset[addSel.value] = {};
        markDirty();
        renderPreset();
      }
      addSel.value = "";
    });
    addRow.appendChild(el("label", { class: "field-label" }, ["Add rule:"]));
    addRow.appendChild(addSel);

    const rulesWrap = el("div");
    const renderPreset = () => {
      rulesWrap.replaceChildren();
      for (const [rule, opts] of Object.entries(preset)) {
        if (!opts || typeof opts !== "object") continue;
        const row = el("div", { class: "field-row", style: "align-items:center; gap:12px; margin-bottom:6px;" });
        row.appendChild(el("span", { style: "min-width:160px; font-family:monospace;" }, [rule]));

        const alwaysCb = el("input", { type: "checkbox" });
        alwaysCb.checked = !!opts.alwaysApply;
        alwaysCb.addEventListener("change", () => { opts.alwaysApply = alwaysCb.checked; markDirty(); });
        const l1 = el("label", { class: "toggle", style: "margin-right:8px;" });
        l1.appendChild(alwaysCb); l1.appendChild(el("span", { class: "slider" }));
        const f1 = el("div", { style: "display:flex; align-items:center; gap:4px;" });
        f1.appendChild(l1);
        f1.appendChild(el("span", { style: "font-size:0.85em;" }, ["alwaysApply"]));
        row.appendChild(f1);

        const embedCb = el("input", { type: "checkbox" });
        embedCb.checked = !!opts.embed;
        embedCb.addEventListener("change", () => { opts.embed = embedCb.checked; markDirty(); });
        const l2 = el("label", { class: "toggle", style: "margin-right:8px;" });
        l2.appendChild(embedCb); l2.appendChild(el("span", { class: "slider" }));
        const f2 = el("div", { style: "display:flex; align-items:center; gap:4px;" });
        f2.appendChild(l2);
        f2.appendChild(el("span", { style: "font-size:0.85em;" }, ["embed"]));
        row.appendChild(f2);

        // Gemini
        const gemSel = el("select");
        for (const g of GEMINI_OPTIONS) {
          const o = el("option", { value: g }, [g || "(none)"]);
          if ((opts.gemini || "") === g) o.selected = true;
          gemSel.appendChild(o);
        }
        gemSel.addEventListener("change", () => {
          if (gemSel.value) { opts.gemini = gemSel.value; } else { delete opts.gemini; }
          markDirty();
        });
        const f3 = el("div", { style: "display:flex; align-items:center; gap:4px;" });
        f3.appendChild(gemSel);
        f3.appendChild(el("span", { style: "font-size:0.85em;" }, ["gemini"]));
        row.appendChild(f3);

        const rm = el("button", { class: "btn btn-danger", title: "Remove rule from this preset" }, ["×"]);
        rm.addEventListener("click", () => { delete preset[rule]; markDirty(); renderPreset(); });
        row.appendChild(rm);
        rulesWrap.appendChild(row);
      }
    };
    renderPreset();
    panel.appendChild(addRow);
    panel.appendChild(rulesWrap);
    wrap.appendChild(panel);
  }
  return wrap;
}

/* =========================================================================
 * Views — Project DoD Overrides
 * ========================================================================= */
async function viewProjectDodOverrides() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["Project — DoD Overrides"]));
  wrap.appendChild(el("p", { class: "muted" }, [
    "Override individual DoD criteria on top of the selected dod-preset. Precedence: dod override > dod-preset > full.",
  ]));

  const [data, dodPresetsResp] = await Promise.all([
    loadProject(),
    api.get("/api/config/dod-presets").catch(() => null),
  ]);

  const presets = (dodPresetsResp && dodPresetsResp.presets) ? dodPresetsResp.presets : {};
  const activePreset = data["dod-preset"] || "full";
  const presetDefaults = presets[activePreset] || presets["full"] || {};

  const knownCols = new Set(["req-traceability", "tests-required", "codebase-overview", "security-audit", "se-required"]);
  for (const p of Object.values(presets)) {
    if (p && typeof p === "object") for (const k of Object.keys(p)) knownCols.add(k);
  }
  const criteria = [...knownCols];

  const overrides = (data.dod && typeof data.dod === "object") ? clone(data.dod) : {};

  const status = el("div", { class: "muted" });
  const contentWrap = el("div");

  const render = () => {
    const cleaned = Object.keys(overrides).filter(k => overrides[k] !== undefined && overrides[k] !== "" && overrides[k] !== null).length;
    status.textContent = `Active preset: ${activePreset}. ${cleaned} overrides active.`;
    contentWrap.replaceChildren();

    const panel = el("div", { class: "panel" });
    panel.appendChild(el("h2", {}, [`Overrides (on top of "${activePreset}" preset)`]));

    const table = el("table", { class: "data" });
    table.appendChild(el("thead", {}, [
      el("tr", {}, ["Criterion", "Preset Default", "Override", "Active Value"].map(h => el("th", {}, [h]))),
    ]));
    const tbody = el("tbody");
    for (const c of criteria) {
      const tr = el("tr");
      tr.appendChild(el("td", { class: "mono" }, [c]));
      tr.appendChild(el("td", { class: "muted" }, [String(presetDefaults[c] ?? "false")]));

      const overrideTd = el("td");
      if (c === "se-required") {
        const sel = el("select");
        for (const v of ["", "false", "recommended", "true"]) {
          const o = el("option", { value: v }, [v || "(no override)"]);
          if ((overrides[c] || "") === v) o.selected = true;
          sel.appendChild(o);
        }
        sel.addEventListener("change", () => {
          if (sel.value) { overrides[c] = sel.value; } else { delete overrides[c]; }
          render();
        });
        overrideTd.appendChild(sel);
      } else {
        const sel = el("select");
        const curVal = c in overrides ? String(overrides[c]) : "";
        const selOpts = [["", "(no override)"], ["true", "true"], ["false", "false"]];
        for (const [v, label] of selOpts) {
          const o = el("option", { value: v }, [label]);
          if (curVal === v) o.selected = true;
          sel.appendChild(o);
        }
        sel.addEventListener("change", () => {
          if (sel.value === "") { delete overrides[c]; } else { overrides[c] = sel.value === "true"; }
          render();
        });
        overrideTd.appendChild(sel);
      }
      tr.appendChild(overrideTd);

      const activeVal = c in overrides ? String(overrides[c]) : String(presetDefaults[c] ?? "false");
      const activeTd = el("td");
      activeTd.appendChild(el("span", { class: `badge ${c in overrides ? "warn" : "ok"}` }, [activeVal]));
      tr.appendChild(activeTd);

      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    panel.appendChild(table);
    contentWrap.appendChild(panel);
  };
  render();

  wrap.appendChild(status);
  wrap.appendChild(contentWrap);

  wrap.appendChild(el("div", { class: "btn-row" }, [
    el("button", { class: "btn btn-primary", onclick: async () => {
      try {
        const clean = {};
        for (const k of Object.keys(overrides)) {
          if (overrides[k] !== undefined && overrides[k] !== "" && overrides[k] !== null) {
            clean[k] = overrides[k];
          }
        }
        await saveProjectSection("dod", clean, status);
      } catch { /* toast shown */ }
    } }, ["Save"]),
    el("button", { class: "btn", onclick: () => runDryRun() }, ["Dry-run"]),
  ]));
  return wrap;
}

/* =========================================================================
 * Views — Project Rules Overrides
 * ========================================================================= */
async function viewProjectRulesOverrides() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["Project — Rules Overrides"]));
  wrap.appendChild(el("p", { class: "muted" }, [
    "Override individual rule settings on top of the selected rules-preset. Precedence: rules override > rules-preset > default.",
  ]));

  const [data, rulesPresetsResp] = await Promise.all([
    loadProject(),
    api.get("/api/config/rules-presets").catch(() => null),
  ]);

  const presets = (rulesPresetsResp && rulesPresetsResp.presets) ? rulesPresetsResp.presets : {};
  const activePreset = data["rules-preset"] || "default";
  const presetRules = presets[activePreset] || presets["default"] || {};

  // Collect all known rules across all presets
  const allRules = new Set(Object.keys(presetRules));
  for (const p of Object.values(presets)) {
    if (p && typeof p === "object") {
      for (const k of Object.keys(p)) allRules.add(k);
    }
  }
  // Also include any rules currently in project overrides
  const projectOverrides = (data.rules && typeof data.rules === "object") ? clone(data.rules) : {};
  for (const k of Object.keys(projectOverrides)) allRules.add(k);

  const rules = [...allRules].sort();
  const GEMINI_OPTIONS = ["", "skip"];

  // Merge: project override wins, preset provides defaults
  const resolved = {};
  for (const r of rules) {
    if (r in projectOverrides) {
      resolved[r] = Object.assign({}, presetRules[r] || {}, projectOverrides[r] || {});
    } else if (r in presetRules) {
      resolved[r] = Object.assign({}, presetRules[r]);
    } else {
      resolved[r] = {};
    }
  }

  const status = el("div", { class: "muted" }, [`Active preset: ${activePreset}. ${Object.keys(projectOverrides).length} overrides active.`]);
  wrap.appendChild(status);

  // Show each rule
  for (const rule of rules) {
    const presetCfg = presetRules[rule] || {};
    const overrideCfg = projectOverrides[rule] || {};

    const panel = el("details", { class: "panel", open: !!(rule in projectOverrides) });
    const overridden = rule in projectOverrides;
    panel.appendChild(el("summary", { style: "cursor:pointer; font-weight:600;" }, [
      rule,
      overridden ? el("span", { class: "badge warn", style: "margin-left:8px;" }, ["overridden"]) : "",
    ]));

    const row = el("div", { class: "field-row", style: "align-items:center; gap:16px; flex-wrap:wrap;" });

    // alwaysApply
    const presetAlways = presetCfg.alwaysApply !== undefined ? String(presetCfg.alwaysApply) : "true (default)";
    const overrideAlways = overrideCfg.alwaysApply !== undefined ? String(overrideCfg.alwaysApply) : "";
    const alwaysLabel = el("span", { style: "font-size:0.85em;" }, [`alwaysApply (preset: ${presetAlways})`]);
    const alwaysSel = el("select");
    for (const v of ["", "true", "false"]) {
      const o = el("option", { value: v }, [v || "(preset default)"]);
      if (overrideAlways === v) o.selected = true;
      alwaysSel.appendChild(o);
    }
    alwaysSel.addEventListener("change", () => {
      if (alwaysSel.value === "") {
        delete overrideCfg.alwaysApply;
      } else {
        overrideCfg.alwaysApply = alwaysSel.value === "true";
      }
      if (Object.keys(overrideCfg).length === 0) {
        delete projectOverrides[rule];
      } else {
        projectOverrides[rule] = overrideCfg;
      }
      updateStatus();
    });
    row.appendChild(el("div", { style: "display:flex; flex-direction:column; gap:4px;" }, [alwaysLabel, alwaysSel]));

    // embed
    const presetEmbed = presetCfg.embed !== undefined ? String(presetCfg.embed) : "true (default)";
    const overrideEmbed = overrideCfg.embed !== undefined ? String(overrideCfg.embed) : "";
    const embedLabel = el("span", { style: "font-size:0.85em;" }, [`embed (preset: ${presetEmbed})`]);
    const embedSel = el("select");
    for (const v of ["", "true", "false"]) {
      const o = el("option", { value: v }, [v || "(preset default)"]);
      if (overrideEmbed === v) o.selected = true;
      embedSel.appendChild(o);
    }
    embedSel.addEventListener("change", () => {
      if (embedSel.value === "") {
        delete overrideCfg.embed;
      } else {
        overrideCfg.embed = embedSel.value === "true";
      }
      if (Object.keys(overrideCfg).length === 0) {
        delete projectOverrides[rule];
      } else {
        projectOverrides[rule] = overrideCfg;
      }
      updateStatus();
    });
    row.appendChild(el("div", { style: "display:flex; flex-direction:column; gap:4px;" }, [embedLabel, embedSel]));

    // gemini
    const presetGemini = presetCfg.gemini || "";
    const overrideGemini = overrideCfg.gemini || "";
    const gemLabel = el("span", { style: "font-size:0.85em;" }, [`gemini (preset: ${presetGemini || "(none)"})`]);
    const gemSel = el("select");
    for (const v of GEMINI_OPTIONS) {
      const o = el("option", { value: v }, [v || "(preset default)"]);
      if (overrideGemini === v) o.selected = true;
      gemSel.appendChild(o);
    }
    gemSel.addEventListener("change", () => {
      if (gemSel.value === "") {
        delete overrideCfg.gemini;
      } else {
        overrideCfg.gemini = gemSel.value;
      }
      if (Object.keys(overrideCfg).length === 0) {
        delete projectOverrides[rule];
      } else {
        projectOverrides[rule] = overrideCfg;
      }
      updateStatus();
    });
    row.appendChild(el("div", { style: "display:flex; flex-direction:column; gap:4px;" }, [gemLabel, gemSel]));

    panel.appendChild(row);
    wrap.appendChild(panel);
  }

  const updateStatus = () => {
    status.textContent = `Active preset: ${activePreset}. ${Object.keys(projectOverrides).length} overrides active.`;
  };

  // Add custom rule
  const addPanel = el("details", { class: "panel" });
  addPanel.appendChild(el("summary", { style: "cursor:pointer; font-weight:600;" }, ["+ Add custom rule override"]));
  const addRow = el("div", { class: "field-row", style: "gap:8px; align-items:center;" });
  const nameInp = el("input", { type: "text", placeholder: "rule name (e.g. my-rule)" });
  const addBtn = el("button", { class: "btn" }, ["Add"]);
  addBtn.addEventListener("click", () => {
    const name = nameInp.value.trim();
    if (!name) { toast("Enter a rule name", "warning"); return; }
    projectOverrides[name] = projectOverrides[name] || {};
    nameInp.value = "";
    viewProjectRulesOverrides().then(newView => {
      wrap.replaceChildren(...(newView.children || []));
    });
  });
  addRow.appendChild(nameInp);
  addRow.appendChild(addBtn);
  addPanel.appendChild(addRow);
  wrap.appendChild(addPanel);

  wrap.appendChild(el("div", { class: "btn-row" }, [
    el("button", { class: "btn btn-primary", onclick: async () => {
      try {
        // Remove empty override objects
        for (const [k, v] of Object.entries(projectOverrides)) {
          if (!v || (typeof v === "object" && Object.keys(v).length === 0)) {
            delete projectOverrides[k];
          }
        }
        await saveProjectSection("rules", projectOverrides, status);
      } catch { /* toast shown */ }
    } }, ["Save"]),
    el("button", { class: "btn", onclick: () => runDryRun() }, ["Dry-run"]),
  ]));

  return wrap;
}

    generalPanel.appendChild(labeledTextField(
      "Schema language", ke["schema-language"] || "auto", (v) => { ke["schema-language"] = v; },
      "Language the knowledge-* agents write wiki pages in. \"auto\" follows this project's existing language convention (see Language rules); set an explicit code (e.g. \"en\", \"de\") to override.",
    ));
    contentWrap.appendChild(generalPanel);

    // Panel 2 — OKF
    const okfPanel = el("div", { class: "panel" });
    okfPanel.appendChild(el("h2", {}, ["OKF (Open Knowledge Format)"]));
    okfPanel.appendChild(el("p", { class: "muted" }, [
      "Google's Open Knowledge Format defines how wiki pages are structured — YAML frontmatter with a concept type, plus the index.md/log.md convention. These toggles control how strictly it's enforced.",
    ]));
    okfPanel.appendChild(checkboxField(
      "Enforce frontmatter", ke.okf["enforce-frontmatter"] !== false, (v) => { ke.okf["enforce-frontmatter"] = v; },
      "Requires every wiki page to carry OKF-compliant YAML frontmatter (concept type, title, tags). knowledge-linter flags pages missing it. Turn off only for quick, informal wikis.",
    ));
    okfPanel.appendChild(checkboxField(
      "Auto-index", ke.okf["auto-index"] !== false, (v) => { ke.okf["auto-index"] = v; },
      "knowledge-indexer keeps index.md (the content catalog every query starts from) in sync automatically after each ingest. Off: index.md must be updated manually or via knowledge-gardener.",
    ));
    okfPanel.appendChild(checkboxField(
      "Auto-log", ke.okf["auto-log"] !== false, (v) => { ke.okf["auto-log"] = v; },
      "Appends a dated entry to log.md (the chronological event log, OKF §7) on every ingest/migration. Useful for auditing what changed and when; safe to leave on.",
    ));
    okfPanel.appendChild(labeledTextField(
      "Allowed types (comma-separated)",
      (ke.okf["allowed-types"] || []).join(", "),
      (v) => { ke.okf["allowed-types"] = v.split(",").map(s => s.trim()).filter(Boolean); },
      "Restricts which OKF concept types (e.g. \"paper\", \"decision\", \"character\") knowledge-curator/ingestor may create — enforced by knowledge-linter as a lint check. Leave empty to allow any concept type.",
    ));
    contentWrap.appendChild(okfPanel);

    // Panel 3 — Operations
    const opsPanel = el("div", { class: "panel" });
    opsPanel.appendChild(el("h2", {}, ["Operations"]));
    opsPanel.appendChild(el("p", { class: "muted" }, [
      "Fine-tunes the behavior of the three core workflows: Ingest (source → wiki), Query (question → wiki → answer) and Lint (wiki health check).",
    ]));

    opsPanel.appendChild(el("h3", {}, ["Ingest — turning a new source into wiki pages"]));
    opsPanel.appendChild(checkboxField(
      "Auto cross-reference", ke.operations.ingest["auto-cross-reference"] !== false, (v) => { ke.operations.ingest["auto-cross-reference"] = v; },
      "knowledge-ingestor automatically links new/updated pages to related existing pages (backlinks). More thorough but slower per ingest — worth it once the wiki has real cross-links to find (research/business/book domains).",
    ));
    opsPanel.appendChild(checkboxField(
      "Auto index update", ke.operations.ingest["auto-index-update"] !== false, (v) => { ke.operations.ingest["auto-index-update"] = v; },
      "Updates index.md as part of every ingest run, not just via a separate step. Keep on unless you're batching many sources and prefer a single index rebuild at the end.",
    ));
    opsPanel.appendChild(checkboxField(
      "Batch mode", !!ke.operations.ingest["batch-mode"], (v) => { ke.operations.ingest["batch-mode"] = v; },
      "Optimized for ingesting many sources in one sitting (e.g. a paper backlog): defers per-source index/log writes and does one consolidated update at the end. Off: each source is fully processed (and indexed/logged) before the next one starts.",
    ));

    opsPanel.appendChild(el("h3", {}, ["Query — answering questions from the wiki"]));
    opsPanel.appendChild(checkboxField(
      "File-back results", ke.operations.query["file-back-results"] !== false, (v) => { ke.operations.query["file-back-results"] = v; },
      "Good synthesized answers are saved back into the wiki as new pages, so the same question doesn't need to be re-derived next time (\"compounding knowledge\"). Off: queries are read-only and never write to wiki/.",
    ));

    opsPanel.appendChild(el("h3", {}, ["Lint — wiki health checks"]));
    opsPanel.appendChild(dropdownField(
      "Schedule",
      ["on-demand", "post-ingest", "periodic"],
      ke.operations.lint.schedule || "on-demand",
      (v) => { ke.operations.lint.schedule = v; },
      {
        "on-demand": "On-demand — only when you ask for it",
        "post-ingest": "Post-ingest — after every ingest run",
        "periodic": "Periodic — on a recurring schedule",
      },
      "When knowledge-linter runs automatically. \"on-demand\" has zero background cost; \"post-ingest\" catches problems immediately but adds latency to every ingest; \"periodic\" needs a scheduler/cron hook configured separately.",
    ));
    opsPanel.appendChild(el("p", { class: "field-help" }, [
      "Which checks knowledge-linter performs. Each maps to a concrete wiki problem:",
    ]));
    const lintChecks = new Set(ke.operations.lint.checks || ["broken-links", "missing-frontmatter"]);
    const checksWrap = el("div");
    for (const check of KNOWLEDGE_ALL_LINT_CHECKS) {
      checksWrap.appendChild(checkboxField(check, lintChecks.has(check), (v) => {
        if (v) { lintChecks.add(check); } else { lintChecks.delete(check); }
        ke.operations.lint.checks = [...lintChecks];
      }, KNOWLEDGE_LINT_CHECK_HELP[check]));
    }
    opsPanel.appendChild(checksWrap);
    contentWrap.appendChild(opsPanel);

    // Panel 4 — Migration
    const migrationPanel = el("div", { class: "panel" });
    migrationPanel.appendChild(el("h2", {}, ["Migration"]));
    migrationPanel.appendChild(el("p", { class: "muted" }, [
      "Controls knowledge-migrator, used once when adopting the Knowledge Engine on a project that already has scattered docs/notes. Workflow is always Discovery → Plan → your explicit approval → Migration → Validation — these toggles configure that flow, they never start it by themselves.",
    ]));
    migrationPanel.appendChild(el("p", { class: "muted" }, ["Migration always copies, never moves. These toggles do not start a migration by themselves."]));
    migrationPanel.appendChild(checkboxField(
      "Auto-detect sources", !!ke.migration["auto-detect-sources"], (v) => { ke.migration["auto-detect-sources"] = v; },
      "During Discovery, let knowledge-migrator scan the repo for candidate documents (e.g. docs/, notes/) instead of you pointing it at specific files/folders. Convenient but produces a longer plan to review — check it carefully before approving.",
    ));
    migrationPanel.appendChild(checkboxField(
      "Clean duplicates", !!ke.migration["clean-duplicates"], (v) => { ke.migration["clean-duplicates"] = v; },
      "Detects near-duplicate content across source documents during migration and merges/skips it instead of creating redundant wiki pages. Off: everything is migrated as-is, even if duplicated.",
    ));
    migrationPanel.appendChild(checkboxField(
      "Preserve originals", ke.migration["preserve-originals"] !== false, (v) => { ke.migration["preserve-originals"] = v; },
      "Leaves the original documents in place after migration (copy, not move — see note above). Turning this off is not recommended; it only affects whether the migrator additionally deletes originals after a validated migration.",
    ));
    contentWrap.appendChild(migrationPanel);

    // Panel 5 — Search
    const searchPanel = el("div", { class: "panel" });
    searchPanel.appendChild(el("h2", {}, ["Search"]));
    searchPanel.appendChild(el("p", { class: "muted" }, [
      "How knowledge-querier finds relevant wiki pages before answering a question.",
    ]));
    searchPanel.appendChild(dropdownField(
      "Engine",
      ["index-only", "mcp-qmd", "custom"],
      ke.search.engine || "index-only",
      (v) => { ke.search.engine = v; render(); },
      {
        "index-only": "Index-only — read index.md, no extra tooling (default, zero setup)",
        "mcp-qmd": "MCP: qmd — delegate search to a qmd MCP server",
        "custom": "Custom — delegate search to another configured MCP server",
      },
      "\"index-only\" scales fine for wikis up to a few hundred pages and needs no setup. Switch to an MCP-backed engine only once index.md alone becomes too large to scan efficiently.",
    ));
    if (ke.search.engine !== "index-only") {
      searchPanel.appendChild(labeledTextField(
        "MCP server", ke.search["mcp-server"] || "", (v) => { ke.search["mcp-server"] = v; },
        "Name of the MCP server (as registered in config/mcp-registry.yaml) that knowledge-querier should call for semantic/full-text search instead of scanning index.md directly.",
      ));
    }
    contentWrap.appendChild(searchPanel);
  };
  render();

  wrap.appendChild(status);
  wrap.appendChild(contentWrap);

  wrap.appendChild(el("div", { class: "btn-row" }, [
    el("button", { class: "btn btn-primary", onclick: async () => {
      try {
        await saveProjectSection("knowledge-engine", ke, status);
      } catch { /* toast shown */ }
    } }, ["Save"]),
  ]));
  return wrap;
}

/* =========================================================================
 * Views — Export config (Phase 3f)
 * ========================================================================= */
async function viewExport() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["export.yaml"]));
  let data;
  try { data = await api.get("/api/config/export"); }
  catch (err) { wrap.appendChild(renderError(err)); return wrap; }
  if (typeof data !== "object" || data === null) data = {};

  const status = el("div", { class: "muted" }, [`${Object.keys(data).length} export mappings`]);
  wrap.appendChild(status);
  const markDirty = () => {
    status.textContent = "Unsaved changes.";
    status.style.color = "var(--accent-yellow)";
  };
  const save = async () => {
    try {
      await api.put("/api/config/export", data);
      toast("export.yaml saved", "success");
      status.textContent = "Saved.";
      status.style.color = "var(--accent-green)";
    } catch (err) {
      toast(`Save failed: ${err.message}`, "error");
      status.textContent = `Save failed: ${err.message}`;
      status.style.color = "var(--accent-red)";
    }
  };
  const addRow = () => {
    const name = prompt("Export mapping name (e.g. test-models):", "");
    if (!name) return;
    if (data[name]) {
      toast("Already exists", "warning");
      return;
    }
    data[name] = { target: "markdown", output_dir: `docs/${name}/` };
    markDirty();
    render();
  };
  wrap.appendChild(el("div", { class: "btn-row" }, [
    el("button", { class: "btn btn-primary", onclick: save }, ["Save"]),
    el("button", { class: "btn", onclick: addRow }, ["Add mapping"]),
    el("button", { class: "btn", onclick: () => runDryRun() }, ["Dry-run"]),
  ]));

  const tableContainer = el("div");
  wrap.appendChild(tableContainer);

  const targets = ["markdown", "confluence", "jira-xray", "notion"];

  function render() {
    tableContainer.replaceChildren();
    const table = el("table", { class: "data" });
    table.appendChild(el("thead", {}, [
      el("tr", {}, ["Mapping", "Target", "Output dir", ""].map(h => el("th", {}, [h]))),
    ]));
    const tbody = el("tbody");
    for (const [name, conf] of Object.entries(data)) {
      if (!conf || typeof conf !== "object") continue;
      const tr = el("tr");
      tr.appendChild(el("td", { class: "mono" }, [name]));

      // target dropdown
      const tSel = el("select");
      const knownTargets = new Set(targets);
      const current = conf.target || "markdown";
      if (current && !knownTargets.has(current)) {
        tSel.appendChild(el("option", { value: current }, [current + " (unknown)"]));
      }
      for (const t of targets) {
        const o = el("option", { value: t }, [t]);
        if (t === current) o.selected = true;
        tSel.appendChild(o);
      }
      tSel.addEventListener("change", () => { conf.target = tSel.value; markDirty(); });
      tr.appendChild(el("td", {}, [tSel]));

      // output_dir input
      const dirInp = el("input", { type: "text", value: conf.output_dir || "" });
      dirInp.addEventListener("input", () => { conf.output_dir = dirInp.value; markDirty(); });
      tr.appendChild(el("td", {}, [dirInp]));

      // delete row
      const delBtn = el("button", { class: "btn btn-danger", title: "Remove mapping" }, ["×"]);
      delBtn.addEventListener("click", () => {
        if (!confirm(`Remove export mapping "${name}"?`)) return;
        delete data[name];
        markDirty();
        render();
      });
      tr.appendChild(el("td", {}, [delBtn]));

      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    tableContainer.appendChild(table);
  }
  render();
  return wrap;
}

/* =========================================================================
 * Views — Pipelines (Phase 4)
 * ========================================================================= */
const STAGE_MODES = [
  "sequential",
  "parallel_group",
  "fanout",
  "loop",
  "conditional",
  "agent_decision",
];

async function viewPipelines() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["Quality pipelines"]));

  // Two parallel loads: the pipelines themselves (from role-defaults.yaml via
  // /api/pipelines) and the agent hierarchy (used to populate agent dropdowns).
  let envelope;
  let hierarchy;
  try {
    [envelope, hierarchy] = await Promise.all([
      api.get("/api/pipelines"),
      api.get("/api/agents/hierarchy"),
    ]);
  } catch (err) {
    wrap.appendChild(renderError(err));
    return wrap;
  }
  const pipelines = (envelope && envelope.pipelines && typeof envelope.pipelines === "object")
    ? envelope.pipelines
    : {};
  const agentNames = (hierarchy && Array.isArray(hierarchy.roles))
    ? hierarchy.roles.map(r => r.name).sort()
    : [];

  const status = el("div", { class: "muted" }, [`${Object.keys(pipelines).length} pipelines loaded.`]);
  wrap.appendChild(status);

  const savePipelines = async () => {
    try {
      await api.put("/api/pipelines", { pipelines });
      toast("Pipelines saved to role-defaults.yaml", "success");
      status.textContent = `${Object.keys(pipelines).length} pipelines (saved).`;
      status.style.color = "var(--accent-green)";
    } catch (err) {
      toast(`Save failed: ${err.message}`, "error");
      status.textContent = `Save failed: ${err.message}`;
      status.style.color = "var(--accent-red)";
    }
  };
  const addPipelinePrompt = () => {
    const name = prompt("Pipeline name:", "new-pipeline");
    if (!name) return;
    if (pipelines[name]) {
      toast(`Pipeline ${name} already exists`, "warning");
      return;
    }
    pipelines[name] = {
      description: "",
      stages: [{ id: "stage-1", agent: agentNames[0] || "developer", task: "describe the work", mode: "sequential" }],
      on_error: "escalate_to_orchestrator",
    };
    render();
  };

  const toolbar = el("div", { class: "btn-row" }, [
    el("button", { class: "btn btn-primary", onclick: savePipelines }, ["Save pipelines"]),
    el("button", { class: "btn", onclick: addPipelinePrompt }, ["Add pipeline"]),
    el("button", { class: "btn", onclick: () => runDryRun() }, ["Dry-run"]),
    el("button", { class: "btn btn-ghost", title: "Pipelines help", onclick: () => showPipelineHelp() }, ["?"]),
  ]);
  wrap.appendChild(toolbar);

  const container = el("div", { class: "pipelines-container" });
  wrap.appendChild(container);

  function render() {
    container.replaceChildren();
    const names = Object.keys(pipelines);
    if (!names.length) {
      container.appendChild(el("div", { class: "empty" }, ['No pipelines defined yet — click "Add pipeline".']));
      return;
    }
    for (const name of names) {
      container.appendChild(pipelineBlock(name));
    }
    status.textContent = `${names.length} pipelines.`;
    status.style.color = "";
  }

  function pipelineBlock(name) {
    const pipeline = pipelines[name];
    if (!pipeline || typeof pipeline !== "object") return el("div");
    const block = el("div", { class: "pipeline-block panel" });
    const enabled = pipeline.enabled !== false;  // default: true
    const enabledLabel = el("span", { style: "font-size:10px; color: var(--text-muted); font-family: var(--font-mono);" }, [enabled ? "ENABLED" : "DISABLED"]);
    const toggleWrap = el("label", { class: "toggle", style: "margin-right:8px;" });
    const toggleCb = el("input", { type: "checkbox" });
    toggleCb.checked = enabled;
    toggleCb.addEventListener("change", () => {
      pipeline.enabled = toggleCb.checked;
      enabledLabel.textContent = toggleCb.checked ? "ENABLED" : "DISABLED";
    });
    toggleWrap.appendChild(toggleCb);
    toggleWrap.appendChild(el("span", { class: "slider" }));
    const header = el("div", { class: "panel-title" }, [
      el("div", { style: "display:flex; align-items:center; gap:8px;" }, [
        toggleWrap,
        enabledLabel,
      ]),
      el("h2", { style: "margin:0;" }, [name]),
      el("button", {
        class: "btn btn-danger",
        onclick: () => {
          if (!confirm(`Delete pipeline "${name}"?`)) return;
          delete pipelines[name];
          render();
        },
      }, ["Delete pipeline"]),
    ]);
    block.appendChild(header);

    // Description field
    const descField = el("div", { class: "field" });
    descField.appendChild(el("label", { class: "field-label" }, ["Description"]));
    const descInp = el("input", { type: "text", value: pipeline.description || "" });
    descInp.addEventListener("input", () => { pipeline.description = descInp.value; });
    descField.appendChild(descInp);
    block.appendChild(descField);

    // on_error select
    const oeField = el("div", { class: "field" });
    oeField.appendChild(el("label", { class: "field-label" }, ["on_error"]));
    const oeSel = el("select");
    for (const opt of ["escalate_to_orchestrator", "skip", "abort", "retry"]) {
      const o = el("option", { value: opt }, [opt]);
      if ((pipeline.on_error || "escalate_to_orchestrator") === opt) o.selected = true;
      oeSel.appendChild(o);
    }
    oeSel.addEventListener("change", () => { pipeline.on_error = oeSel.value; });
    oeField.appendChild(oeSel);
    block.appendChild(oeField);

    // Stages swimlane
    const stages = Array.isArray(pipeline.stages) ? pipeline.stages : [];
    pipeline.stages = stages;
    const swim = el("div", { class: "swimlane" });
    stages.forEach((stage, idx) => {
      swim.appendChild(stageCard(stage, idx, stages, () => render()));
    });
    swim.appendChild(el("div", {
      class: "stage-add",
      onclick: () => {
        stages.push({
          id: `stage-${stages.length + 1}`,
          agent: agentNames[0] || "developer",
          task: "describe the work",
          mode: "sequential",
        });
        render();
      },
    }, ["+ Add stage"]));
    block.appendChild(swim);

    // SE depth configuration slider (only for se-cascade pipeline)
    if (name === "se-cascade") {
      const depthConfig = el("div", { class: "se-depth-config" });
      depthConfig.appendChild(el("label", {}, ["SE Depth:"]));

      const minLabel = el("label", {}, ["Min:"]);
      const minSlider = el("input", { type: "range", min: "1", max: "6", value: "2" });
      const minVal = el("span", { class: "depth-value" }, ["2"]);
      minSlider.addEventListener("input", () => { minVal.textContent = minSlider.value; });
      depthConfig.appendChild(minLabel);
      depthConfig.appendChild(minSlider);
      depthConfig.appendChild(minVal);

      const maxLabel = el("label", {}, ["Max:"]);
      const maxSlider = el("input", { type: "range", min: "2", max: "8", value: "6" });
      const maxVal = el("span", { class: "depth-value" }, ["6"]);
      maxSlider.addEventListener("input", () => { maxVal.textContent = maxSlider.value; });
      depthConfig.appendChild(maxLabel);
      depthConfig.appendChild(maxSlider);
      depthConfig.appendChild(maxVal);

      block.appendChild(depthConfig);
    }

    return block;
  }

  function isReqArchPair(a, b) {
    const aId = (a.id || "").toLowerCase();
    const bId = (b.id || "").toLowerCase();
    const isReq = (id) => id.includes("requirements") || id.includes("-req");
    const isArch = (id) => id.includes("architecture") || id.includes("-arch");
    return (isReq(aId) && isArch(bId)) || (isArch(aId) && isReq(bId));
  }

  function stageCard(stage, idx, list, refresh) {
    // Detect SE level from stage id for visual indicators
    const stageId = (stage.id || "").toLowerCase();
    let levelClass = "";
    let levelText = "";
    let zigzagClass = "";
    if (stageId.startsWith("l0")) { levelClass = "level-l0"; levelText = "L0"; }
    else if (stageId.startsWith("l1-req") || stageId === "l1-requirements") { levelClass = "level-l1"; levelText = "L1"; zigzagClass = "zigzag-req"; }
    else if (stageId.startsWith("l1-arch") || stageId === "l1-architecture") { levelClass = "level-l1"; levelText = "L1"; zigzagClass = "zigzag-arch"; }
    else if (stageId.startsWith("l2-req") || stageId === "l2-requirements") { levelClass = "level-l2"; levelText = "L2"; zigzagClass = "zigzag-req"; }
    else if (stageId.startsWith("l2-arch") || stageId === "l2-architecture") { levelClass = "level-l2"; levelText = "L2"; zigzagClass = "zigzag-arch"; }
    else if (stageId.startsWith("l2-int") || stageId === "l2-interface") { levelClass = "level-l2"; levelText = "L2"; }
    else if (stageId.startsWith("l3") || stageId === "l3-components") { levelClass = "level-l3"; levelText = "L3"; }
    else if (stageId === "termination" || stageId === "validation") { levelClass = "level-se"; levelText = stageId === "termination" ? "TERM" : "V&V"; }

    // Detect zig-zag pattern: if previous or next stage is a different type (req↔arch)
    const prevStage = idx > 0 ? list[idx - 1] : null;
    const nextStage = idx < list.length - 1 ? list[idx + 1] : null;
    const isZigzag = (prevStage && isReqArchPair(prevStage, stage)) || (nextStage && isReqArchPair(stage, nextStage));

    const classes = ["stage", zigzagClass];
    if (isZigzag) classes.push("zigzag");
    const node = el("div", { class: classes.join(" ") });

    // Add level label if detected
    if (levelText) {
      node.appendChild(el("span", { class: `level-label ${levelClass}` }, [levelText]));
    }

    // id input
    const idInp = el("input", { type: "text", placeholder: "stage id", value: stage.id || stage.name || "" });
    idInp.addEventListener("input", () => {
      stage.id = idInp.value;
      // Mirror to "name" for backward-compat with older project.yaml entries.
      stage.name = idInp.value;
    });
    node.appendChild(idInp);

    // mode dropdown
    const modeSel = el("select", { title: "stage mode" });
    for (const opt of STAGE_MODES) {
      const o = el("option", { value: opt }, [opt]);
      if ((stage.mode || "sequential") === opt) o.selected = true;
      modeSel.appendChild(o);
    }
    modeSel.addEventListener("change", () => {
      stage.mode = modeSel.value;
      refresh();
    });
    node.appendChild(modeSel);

    // agent dropdown (from hierarchy). Fall back to a free-text input if the
    // hierarchy is empty so the form stays usable in degraded modes.
    if (agentNames.length) {
      const ag = el("select", { title: "agent" });
      // Allow the currently configured agent even if it is not (yet) in the
      // hierarchy list — avoids silently losing the value.
      const known = new Set(agentNames);
      const current = stage.agent || "";
      if (current && !known.has(current)) {
        ag.appendChild(el("option", { value: current }, [current + " (unknown)"]));
      }
      for (const name of agentNames) {
        const o = el("option", { value: name }, [name]);
        if (name === current) o.selected = true;
        ag.appendChild(o);
      }
      ag.addEventListener("change", () => { stage.agent = ag.value; });
      node.appendChild(ag);
    } else {
      const ag = el("input", { type: "text", placeholder: "agent", value: stage.agent || "" });
      ag.addEventListener("input", () => { stage.agent = ag.value; });
      node.appendChild(ag);
    }

    // task textarea
    const taskTa = el("textarea", { rows: 2, placeholder: "task" });
    taskTa.value = stage.task || "";
    taskTa.addEventListener("input", () => { stage.task = taskTa.value; });
    node.appendChild(taskTa);

    // loop-specific controls
    if (stage.mode === "loop") {
      stage.loop = stage.loop || {};
      const loop = stage.loop;
      node.appendChild(el("div", { class: "muted", style: "font-size:11px; margin-top:6px;" }, ["loop config"]));

      const genWrap = el("div", { class: "field" });
      genWrap.appendChild(el("label", { class: "field-label" }, ["generator"]));
      genWrap.appendChild(agentDropdown(loop.generator, v => loop.generator = v));
      node.appendChild(genWrap);

      const critWrap = el("div", { class: "field" });
      critWrap.appendChild(el("label", { class: "field-label" }, ["critic"]));
      critWrap.appendChild(agentDropdown(loop.critic, v => loop.critic = v));
      node.appendChild(critWrap);

      const maxField = el("div", { class: "field" });
      maxField.appendChild(el("label", { class: "field-label" }, ["max_iterations"]));
      const mi = el("input", { type: "number", min: "1", max: "20" });
      mi.value = loop.max_iterations ?? 3;
      mi.addEventListener("input", () => {
        const v = Number(mi.value);
        loop.max_iterations = Number.isFinite(v) && v > 0 ? v : 1;
      });
      maxField.appendChild(mi);
      node.appendChild(maxField);
    }

    // Move/delete row
    node.appendChild(el("div", { class: "btn-row" }, [
      el("button", {
        class: "btn btn-ghost",
        title: "move left",
        onclick: () => {
          if (idx > 0) { [list[idx-1], list[idx]] = [list[idx], list[idx-1]]; refresh(); }
        },
      }, ["←"]),
      el("button", {
        class: "btn btn-ghost",
        title: "move right",
        onclick: () => {
          if (idx < list.length-1) { [list[idx+1], list[idx]] = [list[idx], list[idx+1]]; refresh(); }
        },
      }, ["→"]),
      el("button", {
        class: "btn btn-danger",
        title: "delete stage",
        onclick: () => { list.splice(idx, 1); refresh(); },
      }, ["×"]),
    ]));
    return node;
  }

  function agentDropdown(value, onChange) {
    if (!agentNames.length) {
      const inp = el("input", { type: "text", placeholder: "agent name", value: value || "" });
      inp.addEventListener("input", () => onChange(inp.value));
      return inp;
    }
    const sel = el("select");
    const known = new Set(agentNames);
    if (value && !known.has(value)) {
      sel.appendChild(el("option", { value: value }, [value + " (unknown)"]));
    }
    sel.appendChild(el("option", { value: "" }, ["— select —"]));
    for (const name of agentNames) {
      const o = el("option", { value: name }, [name]);
      if (name === value) o.selected = true;
      sel.appendChild(o);
    }
    sel.addEventListener("change", () => onChange(sel.value));
    return sel;
  }

  render();
  return wrap;
}

/* =========================================================================
 * Views — Sync controls
 * ========================================================================= */
async function viewSync() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["Sync"]));
  wrap.appendChild(el("p", {}, ["Run sync.py and view its output in real time."]));

  // Status card — reflects the most recent sync run and current sync state.
  const statusEl = el("div", { style: "margin-bottom: 16px;" });
  wrap.appendChild(statusEl);

  const loadStatus = async () => {
    const s = await api.get("/api/sync/status").catch(() => null);
    statusEl.replaceChildren();
    if (!s) return;

    const ts = s.last_run_timestamp
      ? new Date(s.last_run_timestamp).toLocaleString()
      : "never";

    let codeCls = "optional", codeVal = "—";
    if (s.last_run_exit_code === 0) { codeCls = "ok"; codeVal = "0 (ok)"; }
    else if (typeof s.last_run_exit_code === "number") { codeCls = "required"; codeVal = String(s.last_run_exit_code); }

    const card = el("div", {
      class: "metric",
      style: "display: block; padding: 16px;",
    });
    card.appendChild(el("div", { class: "label", style: "margin-bottom: 10px;" }, ["Sync status"]));

    const row = el("div", { style: "display: flex; flex-wrap: wrap; gap: 8px; align-items: center;" });
    row.appendChild(el("span", { class: "value mono", style: "font-size: 13px; color: var(--text-secondary);" }, [`Last run: ${ts}`]));
    row.appendChild(el("span", { class: `badge ${codeCls}` }, [`exit ${codeVal}`]));
    row.appendChild(el("span", {
      class: `badge ${s.context_hashes_present ? "ok" : "warn"}`,
    }, [`Context hashes: ${s.context_hashes_present ? "present" : "missing"}`]));
    row.appendChild(el("span", {
      class: `badge ${s.pending_tasks_present ? "warn" : "ok"}`,
    }, [`Pending tasks: ${s.pending_tasks_present ? "yes" : "no"}`]));
    card.appendChild(row);

    if (s.last_run_summary) {
      card.appendChild(el("div", {
        class: "mono",
        style: "margin-top: 10px; font-size: 12px; color: var(--text-muted);",
      }, [s.last_run_summary]));
    }
    statusEl.appendChild(card);
  };

  // Renamed from ``console`` to avoid shadowing the global console object.
  const consoleEl = el("div", { class: "console" }, ["(idle)"]);
  const runBtn = el("button", { class: "btn btn-primary" }, ["Run sync.py"]);
  const dryBtn = el("button", { class: "btn" }, ["Dry-run (--validate)"]);
  const statsWrap = el("div", { style: "margin-top: 16px; display: none;" });
  wrap.appendChild(el("div", { class: "btn-row", style: "margin-bottom: 12px;" }, [runBtn, dryBtn]));
  wrap.appendChild(consoleEl);
  wrap.appendChild(statsWrap);

  loadStatus();

  const setOutput = (text) => {
    consoleEl.replaceChildren();
    statsWrap.style.display = "none";
    statsWrap.replaceChildren();

    const lines = String(text || "").split("\n");
    let inDebug = false;
    const debugLines = [];
    let summaryLine = "";

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];

      if (line === "DEBUG" && lines[i+1] === "-----") {
        inDebug = true;
      } else if (inDebug && (line === "WARNINGS" || line === "SUMMARY") && lines[i+1] && lines[i+1].startsWith("---")) {
        inDebug = false;
      } else if (inDebug && line.trim() && !line.startsWith("-----")) {
        debugLines.push(line);
      }

      if (line === "SUMMARY" && lines[i+1] === "-------") {
        summaryLine = lines[i+2];
      }

      let cls = "line-info";
      if (/WRITE|UPDATE|COPY|DONE|✓/i.test(line)) cls = "line-write";
      else if (/WARN|warning/i.test(line)) cls = "line-warn";
      else if (/ERROR|FAIL|!!/i.test(line)) cls = "line-error";
      consoleEl.appendChild(el("div", { class: cls }, [line]));
    }
    consoleEl.scrollTop = consoleEl.scrollHeight;

    if (summaryLine) {
      const parts = summaryLine.split("|").map(p => p.trim());
      const actions = parts[0] || "0 actions";
      const skipped = parts[1] || "0 skipped";
      const warnings = parts[2] || "0 warnings";

      statsWrap.style.display = "block";
      const cards = el("div", { class: "panel-grid", style: "margin-bottom: 12px;" });

      const makeCard = (label, valStr) => {
        const numMatch = valStr.match(/\d+/);
        const num = numMatch ? numMatch[0] : "0";
        const isWarn = label === "Warnings" && num !== "0";
        const isInfo = label === "Actions" && num !== "0";
        return el("div", { class: "metric", style: isWarn ? "border-color: var(--accent-yellow);" : "" }, [
          el("div", { class: "label", style: isWarn ? "color: var(--accent-yellow);" : "" }, [label]),
          el("div", { class: "value mono", style: isWarn ? "color: var(--accent-yellow);" : (isInfo ? "color: var(--accent-green);" : "") }, [valStr])
        ]);
      };

      cards.appendChild(makeCard("Actions", actions));
      cards.appendChild(makeCard("Skipped", skipped));
      cards.appendChild(makeCard("Warnings", warnings));
      statsWrap.appendChild(cards);

      if (debugLines.length > 0) {
        const details = el("details", { style: "background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 12px;" });
        const summary = el("summary", { style: "cursor: pointer; font-weight: 600; color: var(--text-secondary); outline: none;" }, ["Debug Output (Model Substitutions)"]);
        const pre = el("pre", { style: "margin-top: 10px; background: var(--bg-input); border: 1px solid var(--border-color); max-height: 250px; overflow-y: auto;" }, [debugLines.join("\n")]);
        details.appendChild(summary);
        details.appendChild(pre);
        statsWrap.appendChild(details);
      }
    }
  };

  runBtn.addEventListener("click", async () => {
    runBtn.disabled = true; dryBtn.disabled = true;
    setOutput("Running sync.py …");
    try {
      const r = await api.post("/api/sync/run");
      setOutput(r.output);
      toast(r.success ? "Sync complete" : "Sync failed", r.success ? "success" : "error");
    } catch (err) { setOutput(err.message); toast(err.message, "error"); }
    finally { runBtn.disabled = false; dryBtn.disabled = false; loadStatus(); }
  });
  dryBtn.addEventListener("click", async () => {
    runBtn.disabled = true; dryBtn.disabled = true;
    setOutput("Running sync.py --validate …");
    try {
      const r = await api.post("/api/sync/dry-run");
      setOutput(r.output);
      toast(r.success ? "Dry-run OK" : "Dry-run reported issues", r.success ? "success" : "warning");
    } catch (err) { setOutput(err.message); toast(err.message, "error"); }
    finally { runBtn.disabled = false; dryBtn.disabled = false; loadStatus(); }
  });
  return wrap;
}

  async function buildConsistencyCheck() {
    const wrap = el("div");
    wrap.appendChild(el("h2", {}, ["Consistency Check"]));
    wrap.appendChild(el("p", { class: "muted" }, [
      "This runs a strict cross-reference scan across the agent-meta framework. It ensures parity between documentation, CLI arguments, UI routes, templates, and handoff contracts."
    ]));

    const runBtn = el("button", { class: "btn btn-primary" }, ["Run check"]);
    wrap.appendChild(el("div", { class: "btn-row" }, [runBtn]));

    const summary = el("div", { class: "muted", style: "margin-top:1rem;" }, ["(no check run yet)"]);
    wrap.appendChild(summary);

    const resultBox = el("div", { style: "margin-top:1rem;" });
    wrap.appendChild(resultBox);

    async function runCheck() {
      runBtn.disabled = true;
      summary.textContent = "Running consistency check…";
      summary.style.color = "var(--text-secondary)";
      resultBox.innerHTML = "";

      try {
        const res = await api.get("/api/consistency-check");
        resultBox.innerHTML = "";
        
        if (res.error) {
           summary.textContent = `Check failed.`;
           summary.style.color = "var(--accent-red)";
           const errPanel = el("div", { class: "panel" });
           errPanel.appendChild(el("div", { class: "panel-title" }, [
             el("h2", { style: "margin:0; color:var(--accent-red);" }, ["Execution Error"])
           ]));
           errPanel.appendChild(el("pre", { style: "margin:10px; font-family:monospace; color:var(--accent-red);" }, [res.error]));
           if (res.output) errPanel.appendChild(el("pre", { style: "margin:10px; font-family:monospace; color:var(--text-muted);" }, [res.output]));
           resultBox.appendChild(errPanel);
           if (!res.findings || res.findings.length === 0) return;
        }

        if (res.summary.total === 0) {
          summary.textContent = "Consistency check: no issues found.";
          summary.style.color = "var(--accent-green)";
          return;
        }

        summary.textContent = `${res.summary.total} issue(s) found (${res.summary.errors} Error(s), ${res.summary.warnings} Warning(s)).`;
        summary.style.color = "var(--text-secondary)";

        // Group findings by file
        const byFile = {};
        res.findings.forEach(f => {
          if (!byFile[f.file]) byFile[f.file] = [];
          byFile[f.file].push(f);
        });

        const severityColor = (sev) => ({
          ERROR: "var(--accent-red)",
          WARN:  "var(--accent-yellow, #c9a227)",
          INFO:  "var(--text-muted)",
        }[sev] || "var(--text-muted)");

        for (const [file, items] of Object.entries(byFile)) {
          const panel = el("div", { class: "panel" });
          panel.appendChild(el("div", { class: "panel-title" }, [
            el("h2", { style: `margin:0; color:var(--text-secondary);` },
               [`${file} (${items.length})`]),
          ]));
          const list = el("div");
          for (const item of items) {
             const row = el("div", { style: "padding:0.4rem 0; border-bottom:1px solid var(--border-color);" });
             const color = severityColor(item.severity);
             
             row.appendChild(el("div", { style: `font-weight:600; color:${color};` }, [`[${item.severity}] ${item.check}`]));
             row.appendChild(el("div", { class: "muted", style: "font-size:0.9em;" }, [item.message || ""]));
             if (item.suggestion) {
               row.appendChild(el("div", { class: "muted", style: "font-size:0.8em;" }, ["💡 " + item.suggestion]));
             }
             list.appendChild(row);
          }
          panel.appendChild(list);
          resultBox.appendChild(panel);
        }

      } catch (err) {
        summary.textContent = `Check failed: ${err.message}`;
        summary.style.color = "var(--accent-red)";
      } finally {
        runBtn.disabled = false;
      }
    }

    runBtn.addEventListener("click", runCheck);
    
    // Auto-run on load to match Config Audit
    runCheck();
    
    return wrap;
  }
