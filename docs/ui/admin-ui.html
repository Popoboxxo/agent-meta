/* =========================================================================
 * Views — Config Audit
 * Detects deprecated roles, missing templates, missing role-defaults and
 * orphaned pipeline references in the active project.yaml. Mirrors the
 * `python scripts/sync.py --audit-config` CLI.
 * ========================================================================= */
async function buildConfigAudit() {
  const wrap = el("div");
  wrap.appendChild(el("h2", {}, ["Config Audit"]));
  wrap.appendChild(el("p", { class: "muted" }, [
    "Compares .meta-config/project.yaml against role-defaults.yaml and the ",
    "generic agent templates. Deprecated roles can be auto-disabled (a ",
    "timestamped backup of project.yaml is kept).",
  ]));

  const runBtn   = el("button", { class: "btn btn-primary" }, ["Run audit"]);
  const applyBtn = el("button", { class: "btn", disabled: true }, ["Disable deprecated"]);
  wrap.appendChild(el("div", { class: "btn-row" }, [runBtn, applyBtn]));

  const summary = el("div", { class: "muted", style: "margin-top:1rem;" }, ["(no audit run yet)"]);
  wrap.appendChild(summary);

  const resultsEl = el("div", { style: "margin-top:1rem;" });
  wrap.appendChild(resultsEl);

  // Maps the four backend categories to UI presentation metadata. Order is
  // significant: auto-fixable items come first so the user sees the actionable
  // findings before informational ones.
  const SECTIONS = [
    { key: "deprecated_roles",         label: "Deprecated roles (auto-fixable)", severity: "warn"  },
    { key: "roles_without_template",   label: "Roles without template",          severity: "error" },
    { key: "templates_without_default",label: "Templates without role-default",  severity: "info"  },
    { key: "orphaned_pipelines",       label: "Orphaned pipeline references",    severity: "warn"  },
  ];

  const severityColor = (sev) => ({
    error: "var(--accent-red)",
    warn:  "var(--accent-yellow, #c9a227)",
    info:  "var(--text-muted)",
  }[sev] || "var(--text-muted)");

  // Normalize the flat API response { has_issues, errors, warnings, issues }
  // into the categories-based shape the render function works with.
  function normalizeAuditReport(r) {
    if (!r) return r;
    if (r.categories) return r;  // already in expected format (future-proof)
    const all = [...(r.issues || []), ...(r.errors || []), ...(r.warnings || [])];
    const categories = {};
    for (const issue of all) {
      const cat = issue.category || "other";
      if (!categories[cat]) categories[cat] = [];
      categories[cat].push(issue);
    }
    return { ...r, categories, total: all.length };
  }

  function render(report) {
    resultsEl.replaceChildren();
    const norm = normalizeAuditReport(report);
    if (!norm || !norm.categories) {
      resultsEl.appendChild(el("p", { class: "muted" }, ["(no data)"]));
      return;
    }

    const deprecated = norm.categories.deprecated_roles || [];
    applyBtn.disabled = deprecated.length === 0;

    if (!norm.has_issues) {
      summary.textContent = "Config audit: no issues found.";
      summary.style.color = "var(--accent-green)";
      return;
    }
    summary.textContent = `${norm.total} issue(s) found.`;
    summary.style.color = "var(--text-secondary)";

    for (const sec of SECTIONS) {
      const items = norm.categories[sec.key] || [];
      if (!items.length) continue;
      const panel = el("div", { class: "panel" });
      panel.appendChild(el("div", { class: "panel-title" }, [
        el("h2", { style: `margin:0; color:${severityColor(sec.severity)};` },
           [`${sec.label} (${items.length})`]),
      ]));
      const list = el("div");
      for (const issue of items) {
        const row = el("div", { style: "padding:0.4rem 0; border-bottom:1px solid var(--border-color);" });
        row.appendChild(el("div", { style: "font-weight:600;" }, [issue.role || "(no role)"]));
        row.appendChild(el("div", { class: "muted", style: "font-size:0.9em;" }, [issue.message || ""]));
        if (issue.detail && issue.detail !== issue.message) {
          row.appendChild(el("div", { class: "muted", style: "font-size:0.8em;" }, [issue.detail]));
        }
        list.appendChild(row);
      }
      panel.appendChild(list);
      resultsEl.appendChild(panel);
    }
  }

  async function runAudit() {
    runBtn.disabled = true; applyBtn.disabled = true;
    summary.textContent = "Running audit…";
    try {
      const r = await api.get("/api/config-audit");
      render(r);
    } catch (err) {
      summary.textContent = `Audit failed: ${err.message}`;
      summary.style.color = "var(--accent-red)";
      toast(`Audit failed: ${err.message}`, "error");
    } finally {
      runBtn.disabled = false;
    }
  }

  runBtn.addEventListener("click", runAudit);

  applyBtn.addEventListener("click", async () => {
    runBtn.disabled = true; applyBtn.disabled = true;
    try {
      const r = await api.post("/api/config-audit/apply");
      const fixed = r && typeof r.fixed === "number" ? r.fixed : 0;
      toast(`Disabled ${fixed} deprecated role line(s)`, "success");
      // Re-run the audit so the results reflect the post-apply state.
      await runAudit();
    } catch (err) {
      toast(`Apply failed: ${err.message}`, "error");
    } finally {
      runBtn.disabled = false;
    }
  });

  // Auto-run on view open so users get immediate feedback.
  runAudit();
  return wrap;
}

async function viewSystemAudit() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["System Health & Audit"]));
  
  const auditNode = await buildConfigAudit();
  wrap.appendChild(auditNode);
  
  wrap.appendChild(el("hr", { style: "margin: 32px 0; border: 0; border-top: 1px solid var(--border-color);" }));
  
  const consNode = await buildConsistencyCheck();
  wrap.appendChild(consNode);
  
  return wrap;
}

/* =========================================================================
 * Views — Live event stream (Phase 6)
 * ========================================================================= */
async function viewLive() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["Live events"]));
  wrap.appendChild(el("p", { class: "muted" }, ["Streams .meta-viz/events.jsonl in real time. Run the server with --watch to also capture filesystem changes to configs."]));
  // Renamed from ``console`` to avoid shadowing the global console object.
  const consoleEl = el("div", { class: "console" }, ["(connecting…)"]);
  wrap.appendChild(consoleEl);

  const append = (event) => {
    if (consoleEl.textContent === "(connecting…)") consoleEl.replaceChildren();
    const line = el("div", { class: "line-info" }, [JSON.stringify(event)]);
    consoleEl.appendChild(line);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  };
  const stream = api.streamEvents("/api/events", append);
  // disconnect on route change
  window.addEventListener("hashchange", () => { try { stream.close(); } catch {} }, { once: true });
  return wrap;
}

/* =========================================================================
 * Views — Project instance sub-pages (project.yaml split by theme)
 * ========================================================================= */

/** Load project.yaml; returns {} on error so forms still render. */
async function loadProject() {
  try { return await api.get("/api/config/project"); }
  catch { return {}; }
}

/** Save one top-level section of project.yaml via the partial-update route. */
async function saveProjectSection(key, value, statusEl) {
  try {
    await api.put("/api/config/project/section", { section: key, data: value });
    toast(`Saved project.${key}`, "success");
    if (statusEl) { statusEl.textContent = "Saved."; statusEl.style.color = "var(--accent-green)"; }
  } catch (err) {
    toast(`Save failed: ${err.message}`, "error");
    if (statusEl) { statusEl.textContent = `Save failed: ${err.message}`; statusEl.style.color = "var(--accent-red)"; }
    throw err;
  }
}

/** Save multiple sections sequentially. */
async function saveProjectSections(entries, statusEl) {
  for (const [key, value] of entries) {
    await saveProjectSection(key, value, null);
  }
  toast("All sections saved", "success");
  if (statusEl) { statusEl.textContent = "Saved."; statusEl.style.color = "var(--accent-green)"; }
}

function labeledTextField(label, value, onInput, help) {
  const field = el("div", { class: "field" });
  field.appendChild(el("label", { class: "field-label" }, [label]));
  const inp = el("input", { type: "text", value: value ?? "" });
  inp.addEventListener("input", () => onInput(inp.value));
  field.appendChild(inp);
  if (help) field.appendChild(el("div", { class: "field-help" }, [help]));
  return field;
}

function envField(label, inputEl, help) {
  const field = el("div", { class: "field" });
  const lbl = el("label", { class: "field-label" }, [label]);
  if (inputEl.type === "checkbox") {
    lbl.style.display = "inline-flex";
    lbl.style.alignItems = "center";
    lbl.style.gap = "6px";
    lbl.prepend(inputEl);
  } else {
    field.appendChild(lbl);
    field.appendChild(inputEl);
  }
  if (help) field.appendChild(el("div", { class: "field-help" }, [help]));
  return field;
}

function dropdownField(label, options, value, onChange, labels, help) {
  const field = el("div", { class: "field" });
  field.appendChild(el("label", { class: "field-label" }, [label]));
  const sel = el("select");
  const labelMap = labels && typeof labels === "object" ? labels : null;
  for (const opt of options) {
    const display = labelMap && Object.prototype.hasOwnProperty.call(labelMap, opt)
      ? labelMap[opt]
      : (opt || "—");
    const o = el("option", { value: opt }, [display]);
    if (opt === value) o.selected = true;
    sel.appendChild(o);
  }
  sel.addEventListener("change", () => onChange(sel.value));
  field.appendChild(sel);
  if (help) field.appendChild(el("div", { class: "field-help" }, [help]));
  return field;
}

function checkboxField(label, value, onChange, help) {
  const field = el("div", { class: "field" });
  const wrapL = el("label", { class: "toggle", style: "margin-right:8px;" });
  const cb = el("input", { type: "checkbox" });
  cb.checked = !!value;
  cb.addEventListener("change", () => onChange(cb.checked));
  wrapL.appendChild(cb); wrapL.appendChild(el("span", { class: "slider" }));
  field.appendChild(el("label", { class: "field-label" }, [label]));
  field.appendChild(wrapL);
  if (help) field.appendChild(el("div", { class: "field-help" }, [help]));
  return field;
}

function tagEditorField(label, values, onChange, helpText) {
  const field = el("div", { class: "field" });
  field.appendChild(el("label", { class: "field-label" }, [label]));
  const wrap = el("div", { class: "tag-editor flex-row", style: "gap:6px; flex-wrap:wrap;" });
  const tags = Array.isArray(values) ? [...values] : [];
  const refresh = () => {
    wrap.innerHTML = "";
    tags.forEach((t, i) => {
      const tag = el("span", { class: "badge" }, [String(t)]);
      const rm = el("button", { class: "btn btn-ghost", style: "padding:0 6px; font-size:11px;", title: "remove" }, ["×"]);
      rm.addEventListener("click", () => { tags.splice(i, 1); onChange([...tags]); refresh(); });
      tag.appendChild(rm);
      wrap.appendChild(tag);
    });
    const inp = el("input", { type: "text", placeholder: "add…", style: "max-width:160px;" });
    inp.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && inp.value.trim()) {
        ev.preventDefault();
        tags.push(inp.value.trim()); onChange([...tags]); inp.value = ""; refresh();
      }
    });
    wrap.appendChild(inp);
  };
  refresh();
  field.appendChild(wrap);
  if (helpText) field.appendChild(el("div", { class: "field-help" }, [helpText]));
  return field;
}

/* ----------------------------------- General ----------------------------- */
async function viewProjectGeneral() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["Project — General"]));

  // Fallback enums (used if /api/config/<preset> is unavailable, e.g. when the
  // admin server is not running in super_admin mode).
  const DOD_FALLBACK   = ["rapid-prototyping", "standard", "strict"];
  const RULES_FALLBACK = ["default", "minimal", "silent"];
  const TIER_FALLBACK = ["Cheap", "Normal", "Advanced", "Expensive", "Expensive as Hell", "Normal (SE)", "Advanced (SE)"];
  // sync with schema speech-mode enum (config/project-config.schema.json)
  const SPEECH_MODES   = ["full", "short", "childish", "caveman", "asozial", "submissive", "business", "bullshit-bingo", "linkedin"];

  // Load project.yaml and presets in parallel. Each preset endpoint may fail
  // independently — fall back to the hardcoded list in that case.
  const [data, dodPresetsResp, rulesPresetsResp, tierPresetsResp] = await Promise.all([
    loadProject(),
    api.get("/api/config/dod-presets").catch(() => null),
    api.get("/api/config/rules-presets").catch(() => null),
    api.get("/api/tier-presets/merged").catch(() => null),
  ]);

  // dod-presets.yaml has either a top-level mapping of preset-name → config,
  // or wraps presets under a "presets" key. Handle both shapes defensively.
  const extractPresetKeys = (obj, fallback) => {
    if (!obj || typeof obj !== "object") return fallback;
    if (obj.presets && typeof obj.presets === "object") return Object.keys(obj.presets);
    return Object.keys(obj);
  };
  const dodOptions   = extractPresetKeys(dodPresetsResp, DOD_FALLBACK);
  const rulesOptions = extractPresetKeys(rulesPresetsResp, RULES_FALLBACK);

  const project = (data.project && typeof data.project === "object") ? clone(data.project) : {};
  const top = { "dod-preset": data["dod-preset"] || "", "rules-preset": data["rules-preset"] || "", "speech-mode": data["speech-mode"] || "", "tier-preset": data["tier-preset"] || "Normal", "se-focus": !!data["se-focus"] };

  const TIER_PRESETS = extractPresetKeys(tierPresetsResp, TIER_FALLBACK);
  // Build label map: project-local presets get a ★ prefix so they stand out
  // visually in the dropdown. Global presets render unchanged.
  const TIER_PRESET_LABELS = {};
  if (tierPresetsResp && typeof tierPresetsResp === "object") {
    for (const key of TIER_PRESETS) {
      const entry = tierPresetsResp[key];
      if (entry && typeof entry === "object" && entry.source === "project") {
        TIER_PRESET_LABELS[key] = `★ ${key}`;
      }
    }
  }

  const status = el("div", { class: "muted" }, ["Loaded from project.yaml."]);
  wrap.appendChild(status);

  const panel = el("div", { class: "panel" });
  panel.appendChild(labeledTextField("project.name", project.name, v => project.name = v));
  panel.appendChild(labeledTextField("project.prefix", project.prefix, v => project.prefix = v));
  panel.appendChild(labeledTextField("project.short", project.short, v => project.short = v));
  panel.appendChild(dropdownField("dod-preset", dodOptions, top["dod-preset"], v => top["dod-preset"] = v));
  panel.appendChild(dropdownField("rules-preset", rulesOptions, top["rules-preset"], v => top["rules-preset"] = v));
  panel.appendChild(dropdownField("speech-mode", SPEECH_MODES, top["speech-mode"], v => top["speech-mode"] = v));
  
  // Tier Preset logic
  const onTierPresetChange = (v) => {
      top["tier-preset"] = v;
      // Triggers live preview update if needed
  };
  panel.appendChild(dropdownField("tier-preset", TIER_PRESETS, top["tier-preset"], onTierPresetChange, TIER_PRESET_LABELS));
  panel.appendChild(checkboxField("se-focus", top["se-focus"], v => { top["se-focus"] = v; }));

  wrap.appendChild(panel);

  wrap.appendChild(el("div", { class: "panel", style: "margin-top: 16px;" }, [
    el("h2", {}, ["Global Framework Setup"]),
    el("p", { class: "muted" }, ["Configure provider model tiers, tier mappings and other global settings."]),
    el("a", { href: "#/config/ai-providers", class: "btn" }, ["Open ai-providers.yaml →"]),
  ]));

  wrap.appendChild(el("div", { class: "btn-row" }, [
    el("button", { class: "btn btn-primary", onclick: async () => {
      try {
        await saveProjectSections([
          ["project", project],
          ["dod-preset", top["dod-preset"]],
          ["rules-preset", top["rules-preset"]],
          ["speech-mode", top["speech-mode"]],
          ["tier-preset", top["tier-preset"]],
          ["se-focus", top["se-focus"]],
        ], status);
      } catch { /* toast already shown */ }
    } }, ["Save"]),
    el("button", { class: "btn", onclick: () => runDryRun() }, ["Dry-run"]),
  ]));
  return wrap;
}

/* ------------------------- Providers & Platforms ------------------------- */
async function viewProjectProviders() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["Project — Providers & Platforms"]));
  const [data, providers, platforms] = await Promise.all([
    loadProject(),
    api.get("/api/providers").catch(() => []),
    api.get("/api/platforms").catch(() => []),
  ]);

  const selProviders = new Set(Array.isArray(data["ai-providers"]) ? data["ai-providers"] : []);
  const selPlatforms = new Set(Array.isArray(data.platforms) ? data.platforms : []);
  const providerOptions = (data["provider-options"] && typeof data["provider-options"] === "object")
    ? clone(data["provider-options"]) : {};
  let isolation = data["provider-isolation"];
  // Track whether the user (or the loaded project.yaml) ever gave this field a
  // real value. If it stays untouched (no key on load, dropdown never used),
  // `isolation` is `undefined` — JSON.stringify() then drops the whole "data"
  // field of the save payload, which the backend rejects. Only send the
  // section when there is something meaningful to write.
  let isolationTouched = typeof isolation === "string";

  const status = el("div", { class: "muted" }, ["Loaded from project.yaml."]);
  wrap.appendChild(status);

  // Providers checklist
  const provPanel = el("div", { class: "panel" });
  provPanel.appendChild(el("h2", {}, ["AI providers"]));
  if (!providers.length) provPanel.appendChild(el("div", { class: "empty" }, ["No providers available (super-admin config not found)."]));
  for (const p of providers) {
    const line = el("label", { class: "flex-row", style: "gap:8px; margin-bottom:6px; cursor:pointer;" });
    const cb = el("input", { type: "checkbox" });
    cb.checked = selProviders.has(p.name);
    cb.addEventListener("change", () => { cb.checked ? selProviders.add(p.name) : selProviders.delete(p.name); });
    line.appendChild(cb);
    line.appendChild(el("span", { class: "mono" }, [p.display_name || p.name]));
    if (!p.has_model_tiers) line.appendChild(el("span", { class: "muted", title: "manages models centrally" }, ["(central models)"]));
    provPanel.appendChild(line);
  }
  wrap.appendChild(provPanel);

  // Platforms checklist — "generic" is the always-active base layer and is
  // excluded from the selection list (it cannot be toggled off).
  const platPanel = el("div", { class: "panel" });
  platPanel.appendChild(el("h2", {}, ["Platforms"]));
  const selectablePlatforms = platforms.filter(pl => pl.name !== "generic");
  if (!selectablePlatforms.length) platPanel.appendChild(el("div", { class: "empty" }, ["No platforms available."]));
  for (const pl of selectablePlatforms) {
    const line = el("label", { class: "flex-row", style: "gap:8px; margin-bottom:6px; cursor:pointer;" });
    const cb = el("input", { type: "checkbox" });
    cb.checked = selPlatforms.has(pl.name);
    cb.addEventListener("change", () => { cb.checked ? selPlatforms.add(pl.name) : selPlatforms.delete(pl.name); });
    line.appendChild(cb);
    line.appendChild(el("span", { class: "mono" }, [pl.name]));
    platPanel.appendChild(line);
  }
  platPanel.appendChild(el("div", { class: "field-help", style: "margin-top:10px;" }, [
    "Multiple platform layers can be active simultaneously. Agents from ",
    el("code", {}, ["agents/2-platform/<platform>-*.md"]),
    " override generic agents. The ",
    el("code", {}, ["1-generic"]),
    " base is always active and cannot be selected.",
  ]));
  wrap.appendChild(platPanel);

  // provider-isolation + provider-options (nested KV editor)
  const optPanel = el("div", { class: "panel" });
  optPanel.appendChild(el("h2", {}, ["Options"]));
  // provider-isolation: schema enum allows only "disabled". An empty value
  // means "not set" (default = isolation enabled). Render an explicit "(unset)"
  // option so users can clear the field.
  const isolationOptions = ["", "disabled"];
  const isolationLabels  = { "": "enabled (default)", "disabled": "disabled" };
  optPanel.appendChild(dropdownField(
    "provider-isolation",
    isolationOptions,
    typeof isolation === "string" ? isolation : "",
    v => { isolation = v; isolationTouched = true; },
    isolationLabels,
  ));

  // Provider Options — per-provider collapsible KV editors
  optPanel.appendChild(el("h3", { style: "margin-top:16px; margin-bottom:8px; font-size:13px; color:var(--text-secondary);" }, ["provider-options"]));

  // Determine provider names: union of providers from API + keys already in providerOptions
  const providerNames = new Set([
    ...providers.map(p => p.name),
    ...Object.keys(providerOptions),
  ]);

  if (providerNames.size === 0) {
    optPanel.appendChild(el("div", { class: "empty" }, ["No providers configured."]));
  }

  for (const provName of providerNames) {
    if (!providerOptions[provName] || typeof providerOptions[provName] !== "object") {
      providerOptions[provName] = {};
    }
    const provOpts = providerOptions[provName];

    // Collapsible section per provider
    const section = el("div", { style: "margin-bottom:12px; border:1px solid var(--border-color); border-radius:var(--radius);" });

    const header = el("div", {
      style: "display:flex; align-items:center; justify-content:space-between; padding:8px 12px; cursor:pointer; background:var(--bg-tertiary); border-radius:var(--radius);",
    });
    header.appendChild(el("span", { class: "mono", style: "font-weight:600;" }, [provName]));
    const toggleBtn = el("span", { style: "color:var(--text-muted); font-size:11px;" }, ["▼"]);
    header.appendChild(toggleBtn);

    const body = el("div", { style: "padding:8px 12px; display:block;" });

    // KV table
    const table = el("table", { style: "width:100%; border-collapse:collapse;" });
    const thead = el("tr", {}, [
      el("th", { style: "text-align:left; font-size:11px; color:var(--text-muted); padding:4px 0; width:40%;" }, ["Key"]),
      el("th", { style: "text-align:left; font-size:11px; color:var(--text-muted); padding:4px 0; width:40%;" }, ["Value"]),
      el("th", { style: "width:20%;" }, [""]),
    ]);
    table.appendChild(thead);

    // Render existing rows
    function addKVRow(key, val) {
      const row = el("tr", {});
      const keyCell = el("td", { style: "padding:2px 4px 2px 0;" });
      const keyInput = el("input", { type: "text", style: "width:100%; font-family:var(--font-mono); font-size:12px;", placeholder: "key" });
      keyInput.value = key;
      keyCell.appendChild(keyInput);

      const valCell = el("td", { style: "padding:2px 4px;" });
      // Detect bool vs string
      const isBool = val === true || val === false;
      const valSel = el("select", { style: "margin-right:4px; font-size:12px;" });
      const typeOpts = [["string", "string"], ["bool", "bool"]];
      for (const [tv, tl] of typeOpts) {
        const o = el("option", { value: tv }, [tl]);
        if (isBool && tv === "bool") o.setAttribute("selected", "");
        else if (!isBool && tv === "string") o.setAttribute("selected", "");
        valSel.appendChild(o);
      }
      const valInput = el("input", { type: "text", style: "width:calc(100% - 70px); font-size:12px; font-family:var(--font-mono);", placeholder: "value" });
      valInput.value = isBool ? String(val) : (val != null ? String(val) : "");
      valCell.appendChild(valSel);
      valCell.appendChild(valInput);

      const removeCell = el("td", { style: "padding:2px 0 2px 4px; text-align:right;" });
      const removeBtn = el("button", { class: "btn", style: "font-size:11px; padding:2px 6px; color:var(--accent-red);", onclick: () => {
        const oldKey = keyInput.value.trim();
        if (oldKey) delete provOpts[oldKey];
        row.remove();
      } }, ["✕"]);
      removeCell.appendChild(removeBtn);

      // On change: update provOpts
      function sync() {
        const k = keyInput.value.trim();
        if (!k) return;
        // Remove old key if renamed
        // We can't easily track old key here, so we rebuild on save instead
        let v;
        if (valSel.value === "bool") {
          v = valInput.value.trim().toLowerCase() === "true";
        } else {
          v = valInput.value;
        }
        provOpts[k] = v;
      }
      keyInput.addEventListener("change", sync);
      valInput.addEventListener("change", sync);
      valSel.addEventListener("change", sync);

      row.appendChild(keyCell);
      row.appendChild(valCell);
      row.appendChild(removeCell);
      table.appendChild(row);
    }

    for (const [k, v] of Object.entries(provOpts)) {
      addKVRow(k, v);
    }

    body.appendChild(table);

    const addBtn = el("button", { class: "btn", style: "margin-top:6px; font-size:12px;", onclick: () => {
      addKVRow("", "");
    } }, ["+ Add option"]);
    body.appendChild(addBtn);

    // Toggle collapse
    let expanded = true;
    header.addEventListener("click", () => {
      expanded = !expanded;
      body.style.display = expanded ? "block" : "none";
      toggleBtn.textContent = expanded ? "▼" : "▶";
    });

    section.appendChild(header);
    section.appendChild(body);
    optPanel.appendChild(section);
  }

  wrap.appendChild(optPanel);

  wrap.appendChild(el("div", { class: "btn-row" }, [
    el("button", { class: "btn btn-primary", onclick: async () => {
      // Rebuild providerOptions from current table state before saving
      // (rows may have been added/removed; re-read from DOM)
      // We rely on the sync() callbacks having kept provOpts up-to-date.
      // Empty-key rows are ignored by sync(), so provOpts stays clean.
      try {
        const entries = [
          ["ai-providers", Array.from(selProviders)],
          ["platforms", Array.from(selPlatforms)],
          ["provider-options", providerOptions],
        ];
        if (isolationTouched) entries.push(["provider-isolation", isolation]);
        await saveProjectSections(entries, status);
      } catch { /* toast shown */ }
    } }, ["Save"]),
    el("button", { class: "btn", onclick: () => runDryRun() }, ["Dry-run"]),
  ]));
  return wrap;
}

/* ----------------------------------- Roles ------------------------------- */
async function viewProjectRoles() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["Project — Roles"]));

  // Load names + descriptions in parallel. Hierarchy is the authoritative
  // source for descriptions; /api/roles is the alphabetically sorted list.
  const [data, allRoles, hierarchy] = await Promise.all([
    loadProject(),
    api.get("/api/roles").catch(() => []),
    api.get("/api/agents/hierarchy").catch(() => ({ roles: [] })),
  ]);

  const descByName = new Map();
  for (const r of (hierarchy.roles || [])) {
    if (r && r.name) descByName.set(r.name, r.description || "");
  }
  const roleNames = allRoles.map(r => r.name);
  const knownSet  = new Set(roleNames);

  // Active list keeps insertion order (= project.yaml order). Unknown names
  // referenced by project.yaml are preserved so users can clean them up
  // explicitly.
  const active = Array.isArray(data.roles) ? data.roles.filter(Boolean) : [];

  const status = el("div", { class: "muted" }, [`${active.length} roles selected.`]);
  wrap.appendChild(status);

  // Two-column layout: Available ↔ Active
  const grid = el("div", {
    class: "panel",
    style: "display:grid; grid-template-columns:1fr 1fr; gap:16px;",
  });

  const availPanel  = el("div");
  const activePanel = el("div");
  availPanel.appendChild(el("h2", { style: "margin-top:0;" }, ["Available"]));
  activePanel.appendChild(el("h2", { style: "margin-top:0;" }, ["Active"]));

  const availList  = el("div", { class: "role-list", style: "min-height:120px; border:1px dashed var(--border-color); border-radius:var(--radius); padding:8px;" });
  const activeList = el("div", { class: "role-list", style: "min-height:120px; border:1px dashed var(--border-color); border-radius:var(--radius); padding:8px;" });
  availPanel.appendChild(availList);
  activePanel.appendChild(activeList);
  grid.appendChild(availPanel);
  grid.appendChild(activePanel);
  wrap.appendChild(grid);

  /** Build a single role card. ``side`` is "available" or "active". */
  const buildCard = (name, side) => {
    const desc = descByName.get(name) || (knownSet.has(name) ? "" : "Unknown role — not declared in role-defaults.yaml.");
    const card = el("div", {
      class: "role-card",
      draggable: "true",
      "data-role": name,
      style: "display:flex; align-items:flex-start; gap:8px; padding:8px 10px; margin-bottom:6px; border:1px solid var(--border-color); border-radius:var(--radius); background:var(--bg-secondary); cursor:grab;",
    });

    // Move button: → adds to active, ← removes from active
    const moveBtn = el("button", {
      class: "btn",
      style: "flex-shrink:0; padding:2px 8px; font-size:14px; line-height:1;",
      title: side === "available" ? "Add to active" : "Remove from active",
    }, [side === "available" ? "→" : "←"]);
    moveBtn.addEventListener("click", () => {
      if (side === "available") {
        if (!active.includes(name)) active.push(name);
      } else {
        const idx = active.indexOf(name);
        if (idx >= 0) active.splice(idx, 1);
      }
      render();
    });

    const text = el("div", { style: "flex:1; min-width:0;" });
    const nameLine = el("div", { class: "mono", style: "font-weight:600;" }, [name]);
    if (!knownSet.has(name)) nameLine.appendChild(el("span", { class: "muted", style: "margin-left:6px; font-weight:normal;" }, [" (unknown)"]));
    text.appendChild(nameLine);
    if (desc) text.appendChild(el("div", { class: "muted", style: "font-size:12px; margin-top:2px; white-space:normal; word-break:break-word;" }, [desc]));

    card.appendChild(moveBtn);
    card.appendChild(text);

    // Drag handlers — payload is the role name; drop targets read it
    // and call the same move logic the button uses.
    card.addEventListener("dragstart", (e) => {
      e.dataTransfer.setData("text/plain", JSON.stringify({ name, from: side }));
      e.dataTransfer.effectAllowed = "move";
      card.style.opacity = "0.5";
    });
    card.addEventListener("dragend", () => { card.style.opacity = ""; });

    return card;
  };

  /** Attach drop-zone handlers to a column list. */
  const wireDropZone = (zone, targetSide) => {
    zone.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      zone.style.background = "var(--bg-tertiary, rgba(127,127,127,0.08))";
    });
    zone.addEventListener("dragleave", () => { zone.style.background = ""; });
    zone.addEventListener("drop", (e) => {
      e.preventDefault();
      zone.style.background = "";
      let payload;
      try { payload = JSON.parse(e.dataTransfer.getData("text/plain") || "{}"); }
      catch { return; }
      if (!payload.name || payload.from === targetSide) return;
      if (targetSide === "active") {
        if (!active.includes(payload.name)) active.push(payload.name);
      } else {
        const idx = active.indexOf(payload.name);
        if (idx >= 0) active.splice(idx, 1);
      }
      render();
    });
  };
  wireDropZone(availList,  "available");
  wireDropZone(activeList, "active");

  const render = () => {
    availList.replaceChildren();
    activeList.replaceChildren();

    const activeSet = new Set(active);
    const availableNames = roleNames.filter(n => !activeSet.has(n));

    if (!availableNames.length) {
      availList.appendChild(el("div", { class: "empty muted", style: "padding:8px;" }, ["All known roles are active."]));
    } else {
      for (const n of availableNames) availList.appendChild(buildCard(n, "available"));
    }

    if (!active.length) {
      activeList.appendChild(el("div", { class: "empty muted", style: "padding:8px;" }, ["No roles selected — drag from the left or use →."]));
    } else {
      for (const n of active) activeList.appendChild(buildCard(n, "active"));
    }

    status.textContent = `${active.length} roles selected.`;
  };
  render();

  wrap.appendChild(el("div", { class: "field-help", style: "margin-top:10px;" }, [
    "Drag cards between columns or use the arrow buttons. Active roles are saved in their current order to ",
    el("code", {}, ["project.yaml"]),
    " under the ",
    el("code", {}, ["roles"]),
    " key.",
  ]));

  wrap.appendChild(el("div", { class: "btn-row" }, [
    el("button", { class: "btn btn-primary", onclick: async () => {
      try { await saveProjectSection("roles", active.filter(Boolean), status); } catch { /* shown */ }
    } }, ["Save"]),
    el("button", { class: "btn", onclick: () => runDryRun() }, ["Dry-run"]),
  ]));
  return wrap;
}

/* ------------------------------- Orchestrator ---------------------------- */
async function viewProjectOrchestrator() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["Project — Orchestrator"]));
  const data = await loadProject();
  const orch = (data.orchestrator && typeof data.orchestrator === "object") ? clone(data.orchestrator) : {};

  // Orchestrator mode enum — replaces the deprecated `strict` checkbox.
  // Takes precedence over legacy enabled/strict booleans in sync.py.
  // Framework default (config/project-config.schema.json): "strict".
  const orchModeValue = orch.mode
    || (orch.enabled === false ? "main-chat" : (orch.strict !== false ? "strict" : "advisory"));
  const modeField = el("div", { class: "field" });

  modeField.appendChild(selectField(["strict", "advisory", "main-chat"], orchModeValue, v => { orch.mode = v; }));
  modeField.appendChild(el("div", { class: "muted", style: "font-size:11px; margin-top:2px;" },
    ["Orchestrator mode. Replaces the deprecated strict/enabled checkboxes. main-chat = no orchestrator subagent, main chat routes. Default: strict."]));
  genPanel.appendChild(modeField);
  genPanel.appendChild(checkboxField("direct-dispatch-enabled", orch["direct-dispatch-enabled"], v => { orch["direct-dispatch-enabled"] = v; }));
  genPanel.appendChild(checkboxField("checkpointing", orch.checkpointing, v => { orch.checkpointing = v; }));
  wrap.appendChild(genPanel);

  // ── Native Extensions ────────────────────────────────────────────────────
  const nativeExt = (orch["native-extensions"] && typeof orch["native-extensions"] === "object") ? orch["native-extensions"] : {};
  const nePanel = el("div", { class: "panel" });
  nePanel.appendChild(el("h2", {}, ["Native Extensions"]));
  nePanel.appendChild(checkboxField("enabled", nativeExt.enabled !== false, v => { nativeExt.enabled = v; orch["native-extensions"] = nativeExt; }));
  nePanel.appendChild(tagEditorField(
    "whitelist",
    nativeExt.whitelist,
    v => { nativeExt.whitelist = v; orch["native-extensions"] = nativeExt; },
    "Ist die Whitelist nicht leer, sind ausschließlich die dort gelisteten Skills/Plugins erlaubt — alles andere wird automatisch gesperrt, unabhängig vom generellen Erlaubt-Statement. Leer = kein Filter."
  ));
  wrap.appendChild(nePanel);

  // ── Unknown Fallback ──────────────────────────────────────────────────────
  const uf = (orch["unknown-fallback"] && typeof orch["unknown-fallback"] === "object") ? orch["unknown-fallback"] : {};
  const ufPanel = el("div", { class: "panel" });
  ufPanel.appendChild(el("h2", {}, ["Unknown Fallback"]));
  ufPanel.appendChild(checkboxField("meta-feedback", uf["meta-feedback"], v => { uf["meta-feedback"] = v; orch["unknown-fallback"] = uf; }));
  ufPanel.appendChild(checkboxField("main-chat", uf["main-chat"], v => { uf["main-chat"] = v; orch["unknown-fallback"] = uf; }));
  ufPanel.appendChild(checkboxField("ask-user", uf["ask-user"], v => { uf["ask-user"] = v; orch["unknown-fallback"] = uf; }));
  wrap.appendChild(ufPanel);

  // ── Handoff ───────────────────────────────────────────────────────────────
  const hf = (orch.handoff && typeof orch.handoff === "object") ? orch.handoff : {};
  const hPanel = el("div", { class: "panel" });
  hPanel.appendChild(el("h2", {}, ["Handoff"]));
  // protocol — dropdown
  const protRow = el("div", { class: "field-row" });
  protRow.appendChild(el("label", { class: "field-label" }, ["protocol"]));
  const protSel = el("select", { class: "select" });
  for (const [val, label] of [["a2a-v1", "a2a-v1 (default)"], ["none", "none (disabled)"]]) {
    const o = el("option", { value: val }, [label]);
    if ((hf.protocol || "a2a-v1") === val) o.setAttribute("selected", "");
    protSel.appendChild(o);
  }
  protSel.addEventListener("change", () => {
    hf.protocol = protSel.value;
    orch.handoff = hf;
  });
  protRow.appendChild(protSel);
  hPanel.appendChild(protRow);
  hPanel.appendChild(checkboxField("validate-before-delegate", hf["validate-before-delegate"], v => { hf["validate-before-delegate"] = v; orch.handoff = hf; }));
  hPanel.appendChild(checkboxField("supersession-tracking", hf["supersession-tracking"], v => { hf["supersession-tracking"] = v; orch.handoff = hf; }));
  hPanel.appendChild(checkboxField("strict-validation", hf["strict-validation"], v => { hf["strict-validation"] = v; orch.handoff = hf; }));
  hPanel.appendChild(checkboxField("compact-mode", hf["compact-mode"], v => { hf["compact-mode"] = v; orch.handoff = hf; }));
  hPanel.appendChild(checkboxField("human_approval_required", hf["human_approval_required"], v => { hf["human_approval_required"] = v; orch.handoff = hf; }));

  // max_retries — number input
  const retriesRow = el("div", { class: "field-row" });
  retriesRow.appendChild(el("label", { class: "field-label" }, ["max_retries"]));
  const retriesInput = el("input", { type: "number", min: "0", style: "width:80px;" });
  retriesInput.value = hf.max_retries != null ? String(hf.max_retries) : "";
  retriesInput.addEventListener("change", () => {
    const v = parseInt(retriesInput.value, 10);
    hf.max_retries = isNaN(v) ? undefined : v;
    orch.handoff = hf;
  });
  retriesRow.appendChild(retriesInput);
  hPanel.appendChild(retriesRow);

  // protocol_routing — dropdown
  const prRow = el("div", { class: "field-row" });
  prRow.appendChild(el("label", { class: "field-label" }, ["protocol_routing"]));
  const prSel = el("select", { class: "select" });
  for (const opt of ["", "static", "dynamic"]) {
    const o = el("option", { value: opt }, [opt || "(not set)"]);
    if ((hf.protocol_routing || "") === opt) o.setAttribute("selected", "");
    prSel.appendChild(o);
  }
  prSel.addEventListener("change", () => {
    hf.protocol_routing = prSel.value || undefined;
    orch.handoff = hf;
  });
  prRow.appendChild(prSel);
  hPanel.appendChild(prRow);

  wrap.appendChild(hPanel);

  // ── Delegation ────────────────────────────────────────────────────────────
  const del = (orch.delegation && typeof orch.delegation === "object") ? clone(orch.delegation) : {};
  const delPanel = el("div", { class: "panel" });
  delPanel.appendChild(el("h2", {}, ["Delegation"]));
  delPanel.appendChild(el("p", { class: "muted" }, [
    "Hard limits for agent-to-agent handoffs. Self-handoff (source_agent == target_agent) is always forbidden and cannot be disabled."
  ]));

  // max_depth — number input
  const mdRow = el("div", { class: "field-row" });
  mdRow.appendChild(el("label", { class: "field-label" }, ["max_depth"]));
  const mdInput = el("input", { type: "number", min: "1", max: "50", style: "width:80px;" });
  mdInput.value = del.max_depth != null ? String(del.max_depth) : "10";
  mdInput.addEventListener("change", () => {
    const v = parseInt(mdInput.value, 10);
    del.max_depth = isNaN(v) ? 10 : Math.max(1, Math.min(50, v));
    orch.delegation = del;
  });
  mdRow.appendChild(mdInput);
  mdRow.appendChild(el("span", { class: "muted", style: "margin-left:8px;" }, ["Default: 10, Range: 1–50"]));
  delPanel.appendChild(mdRow);

  wrap.appendChild(delPanel);

  // ── Provider Overrides ──────────────────────────────────────────────────────
  // Per-provider override of orchestrator.mode. Providers without an entry (or
  // with "(inherit default)" selected) fall back to the global "mode" set above.
  const provOverrides = (orch["provider-overrides"] && typeof orch["provider-overrides"] === "object")
    ? clone(orch["provider-overrides"]) : {};
  const activeProviders = Array.isArray(data["ai-providers"]) ? data["ai-providers"] : [];
  const povPanel = el("div", { class: "panel" });
  povPanel.appendChild(el("h2", {}, ["Provider Overrides"]));
  povPanel.appendChild(el("p", { class: "muted" }, [
    "Override the orchestrator mode for a single provider. Leave at “(inherit default)” to use the General mode above.",
  ]));
  const MODE_OPTIONS = ["", "strict", "advisory", "main-chat"];
  for (const prov of activeProviders) {
    const provEntry = (provOverrides[prov] && typeof provOverrides[prov] === "object") ? provOverrides[prov] : {};
    const row = el("div", { class: "field-row" });
    row.appendChild(el("label", { class: "field-label" }, [prov]));
    const sel = el("select", { class: "select" });
    for (const opt of MODE_OPTIONS) {
      const o = el("option", { value: opt }, [opt || "(inherit default)"]);
      if ((provEntry.mode || "") === opt) o.setAttribute("selected", "");
      sel.appendChild(o);
    }
    sel.addEventListener("change", () => {
      if (sel.value) {
        provOverrides[prov] = { ...provEntry, mode: sel.value };
      } else {
        delete provOverrides[prov];
      }
    });
    row.appendChild(sel);
    povPanel.appendChild(row);
  }
  if (activeProviders.length === 0) {
    povPanel.appendChild(el("p", { class: "muted" }, ["No active providers configured — set ai-providers first."]));
  }
  wrap.appendChild(povPanel);

  // ── Token Budget ──────────────────────────────────────────────────────────
  const tb = (hf["token-budget"] && typeof hf["token-budget"] === "object") ? hf["token-budget"] : {};
  const tbPanel = el("div", { class: "panel" });
  tbPanel.appendChild(el("h2", {}, ["Token Budget"]));
  tbPanel.appendChild(checkboxField("enabled", tb.enabled, v => { tb.enabled = v; hf["token-budget"] = tb; orch.handoff = hf; }));

  // session_budget — number input
  const sbRow = el("div", { class: "field-row" });
  sbRow.appendChild(el("label", { class: "field-label" }, ["session_budget"]));
  const sbInput = el("input", { type: "number", min: "0", style: "width:120px;" });
  sbInput.value = tb.session_budget != null ? String(tb.session_budget) : "";
  sbInput.addEventListener("change", () => {
    const v = parseInt(sbInput.value, 10);
    tb.session_budget = isNaN(v) ? undefined : v;
    hf["token-budget"] = tb; orch.handoff = hf;
  });
  sbRow.appendChild(sbInput);
  tbPanel.appendChild(sbRow);

  // max_overhead_pct — number input
  const pctRow = el("div", { class: "field-row" });
  pctRow.appendChild(el("label", { class: "field-label" }, ["max_overhead_pct"]));
  const pctInput = el("input", { type: "number", min: "0", max: "100", style: "width:80px;" });
  pctInput.value = tb.max_overhead_pct != null ? String(tb.max_overhead_pct) : "";
  pctInput.addEventListener("change", () => {
    const v = parseInt(pctInput.value, 10);
    tb.max_overhead_pct = isNaN(v) ? undefined : v;
    hf["token-budget"] = tb; orch.handoff = hf;
  });
  pctRow.appendChild(pctInput);
  tbPanel.appendChild(pctRow);

  // on_exceed — dropdown
  const oeRow = el("div", { class: "field-row" });
  oeRow.appendChild(el("label", { class: "field-label" }, ["on_exceed"]));
  const oeSel = el("select", { class: "select" });
  for (const opt of ["", "compact", "warn"]) {
    const o = el("option", { value: opt }, [opt || "(not set)"]);
    if ((tb.on_exceed || "") === opt) o.setAttribute("selected", "");
    oeSel.appendChild(o);
  }
  oeSel.addEventListener("change", () => {
    tb.on_exceed = oeSel.value || undefined;
    hf["token-budget"] = tb; orch.handoff = hf;
  });
  oeRow.appendChild(oeSel);
  tbPanel.appendChild(oeRow);

  wrap.appendChild(tbPanel);

  // ── Save ─────────────────────────────────────────────────────────────────
  wrap.appendChild(el("div", { class: "btn-row" }, [
    el("button", { class: "btn btn-primary", onclick: async () => {
      // Ensure nested objects are written back before saving
      if (Object.keys(uf).length > 0 || orch["unknown-fallback"] !== undefined) {
        orch["unknown-fallback"] = uf;
      }
      if (Object.keys(hf).length > 0 || orch.handoff !== undefined) {
        hf["token-budget"] = tb;
        orch.handoff = hf;
      }
      if (Object.keys(del).length > 0 || orch.delegation !== undefined) {
        orch.delegation = del;
      }
      if (Object.keys(provOverrides).length > 0) {
        orch["provider-overrides"] = provOverrides;
      } else {
        delete orch["provider-overrides"];
      }
      try { await saveProjectSection("orchestrator", orch, status); } catch { /* toast shown */ }
    } }, ["Save"]),
    el("button", { class: "btn", onclick: () => runDryRun() }, ["Dry-run"]),
  ]));
  return wrap;
}

/* ------------------------------- Prompt Modes ----------------------------- */
async function viewProjectPromptModes() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["Project — Prompt Modes"]));
  wrap.appendChild(el("p", { class: "muted" }, [
    "Configure which rendering mode each agent role uses. ",
    el("strong", {}, ["legacy"]), " = unchanged Markdown (default). ",
    el("strong", {}, ["hybrid"]), " = auto-wrapped XML sections. ",
    el("strong", {}, ["modern"]), " = native 6-block XML (requires template in agents/1-generic-modern/).",
  ]));

  const data = await loadProject();
  const ap = (data["agent-prompts"] && typeof data["agent-prompts"] === "object")
    ? clone(data["agent-prompts"])
    : {};
  if (!ap.modes || typeof ap.modes !== "object") ap.modes = {};

  const status = el("div", { class: "muted" }, ["Loaded from project.yaml."]);
  wrap.appendChild(status);

  const MODES = ["legacy", "hybrid", "modern"];

  // ── Default Mode ──────────────────────────────────────────────────────────
  const defaultPanel = el("div", { class: "panel" });
  defaultPanel.appendChild(el("h2", {}, ["Default Mode"]));
  defaultPanel.appendChild(el("p", { class: "muted" }, [
    "Applied to all roles that have no explicit override below."
  ]));
  defaultPanel.appendChild(dropdownField(
    "default",
    MODES,
    ap.default || "legacy",
    v => { ap.default = v; },
    { legacy: "legacy — unchanged Markdown", hybrid: "hybrid — auto-wrapped XML", modern: "modern — native 6-block XML" }
  ));
  wrap.appendChild(defaultPanel);

  // ── Per-Role Overrides ────────────────────────────────────────────────────
  const rolesPanel = el("div", { class: "panel" });
  rolesPanel.appendChild(el("h2", {}, ["Per-Role Overrides"]));
  rolesPanel.appendChild(el("p", { class: "muted" }, [
    "Override the default for individual roles. Roles with a modern template available are marked with ★."
  ]));

  // Load available roles and modern templates in parallel
  let activeRoles = [], modernTemplates = [];
  try {
    const [proj, templates] = await Promise.all([
      api.get("/api/config/project").catch(() => ({})),
      api.get("/api/agents/templates").catch(() => ({ templates: [] })),
    ]);
    activeRoles = Array.isArray(proj.roles) ? proj.roles.sort() : [];
    // Modern templates come from 1-generic-modern/ — fetched via /api/prompt-modes
    const pm = await api.get("/api/prompt-modes").catch(() => ({ modes: {} }));
    // Build set of roles that have a modern template by checking hierarchy prompt_mode
    const hier = await api.get("/api/agents/hierarchy").catch(() => ({ roles: [] }));
    modernTemplates = (hier.roles || [])
      .filter(r => {
        // A modern template exists if the role can be set to modern
        // (we detect by checking if 1-generic-modern dir has it — proxy: name in templates)
        return true; // show all; mark with ★ if mode is "modern" anywhere
      })
      .map(r => r.name);
  } catch { /* degraded */ }

  // Check which roles actually have a modern template (via templates list from super-admin)
  let modernAvailable = new Set();
  try {
    const tmplData = await api.get("/api/agents/templates").catch(() => ({ templates: [] }));
    // templates lists 1-generic/ stems — we can't distinguish modern from legacy here
    // Use the prompt_mode from hierarchy as proxy: if a role ever had modern set, mark it
    const hier = await api.get("/api/agents/hierarchy").catch(() => ({ roles: [] }));
    for (const r of (hier.roles || [])) {
      // roles that have a modern template in 1-generic-modern/ will be settable
      modernAvailable.add(r.name);
    }
  } catch { /* ok */ }

  // Roles to show: union of active project roles + any already in ap.modes
  const modesKeys = Object.keys(ap.modes);
  const allRoles = [...new Set([...activeRoles, ...modesKeys])].sort();

  if (allRoles.length === 0) {
    rolesPanel.appendChild(el("div", { class: "muted" }, [
      "No roles found. Add roles in Project → Roles first."
    ]));
  } else {
    const table = el("table", { class: "data" });
    const thead = el("thead");
    thead.appendChild(el("tr", {}, [
      el("th", {}, ["Role"]),
      el("th", {}, ["Mode"]),
      el("th", {}, ["Clear"]),
    ]));
    table.appendChild(thead);
    const tbody = el("tbody");

    for (const role of allRoles) {
      const tr = el("tr");

      // Role name + ★ if modern template known to exist (heuristic)
      const hasModernTemplate = (ap.modes[role] === "modern") ||
        (role === "orchestrator") || (role === "developer"); // known modern templates
      const nameTd = el("td", {}, [
        role,
        hasModernTemplate ? el("span", { style: "color:var(--accent-yellow);margin-left:4px;", title: "Modern template available" }, [" ★"]) : "",
      ]);
      tr.appendChild(nameTd);

      // Mode dropdown — blank = "use default"
      const modeTd = el("td");
      const sel = el("select", { class: "select" });
      const currentMode = ap.modes[role] || "";
      for (const [val, label] of [
        ["", `(default: ${ap.default || "legacy"})`],
        ["legacy", "legacy"],
        ["hybrid", "hybrid"],
        ["modern", "modern ★"],
      ]) {
        const o = el("option", { value: val }, [label]);
        if (currentMode === val) o.selected = true;
        sel.appendChild(o);
      }
      sel.addEventListener("change", () => {
        if (sel.value === "") {
          delete ap.modes[role];
        } else {
          ap.modes[role] = sel.value;
        }
      });
      modeTd.appendChild(sel);
      tr.appendChild(modeTd);

      // Clear button
      const clearTd = el("td");
      const clearBtn = el("button", { class: "btn btn-ghost", style: "padding:2px 8px;font-size:11px;", title: "Clear override" }, ["✕"]);
      clearBtn.addEventListener("click", () => {
        delete ap.modes[role];
        sel.value = "";
        toast(`Cleared override for ${role}`, "info", 1500);
      });
      clearTd.appendChild(clearBtn);
      tr.appendChild(clearTd);

      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    rolesPanel.appendChild(table);
  }
  wrap.appendChild(rolesPanel);

  // ── Save ──────────────────────────────────────────────────────────────────
  wrap.appendChild(el("div", { class: "btn-row" }, [
    el("button", { class: "btn btn-primary", onclick: async () => {
      // Strip empty modes object if nothing set
      const payload = { default: ap.default || "legacy", modes: ap.modes };
      if (Object.keys(payload.modes).length === 0) delete payload.modes;
      try { await saveProjectSection("agent-prompts", payload, status); } catch { /* toast shown */ }
    }}, ["Save"]),
    el("button", { class: "btn", onclick: () => runDryRun() }, ["Dry-run"]),
  ]));

  return wrap;
}

/* =========================================================================
 * Central Per-Provider Model-Source (Models & Pricing <-> Provider Tier Overrides)
 * =========================================================================
 * The source (registry vs. models.dev) each provider draws its models from is
 * a CENTRAL, server-persisted setting, stored in .meta-config/project.yaml
 * under `model-source-preference` and served by GET/POST /api/model-source.
 * It is the single source of truth for every model dropdown/suggestion: a
 * provider set to "registry" only ever suggests registry models, one set to
 * "modelsdev" only ever suggests models.dev models -- the two sources are
 * never mixed. `modelSourceState.providerSource` is an in-memory cache of the
 * server map, refreshed via loadModelSourcePrefs() when a view mounts.
 * Changes are batched client-side (see viewModels()'s "Per provider:" row)
 * and persisted in one shot via POST /api/model-source/batch when the user
 * clicks Save -- there is no longer an immediate POST per dropdown change.
 */

// Map agent-meta provider names -> models.dev provider IDs. Mirrors
// PROVIDER_MODELSDEV_SLUGS in scripts/admin-server.py -- keep both in sync.
// Opencode maps to the "opencode-go" slug: models.dev's catalog exposes it
// as a distinct provider entry (api https://opencode.ai/zen/go/v1) that is
// the exact same endpoint fetch_opencode_go_models() in
// scripts/lib/model_discovery.py fetches directly, so the two sources
// describe the same catalog.
const PROVIDER_MODELSDEV_MAP = {
  "Claude": "anthropic",
  "Gemini": "google",
  "Opencode": "opencode-go",
  "Copilot": "github-copilot",
  // Mammouth & Continue not available in models.dev -> registry-only
};
// Providers that have NO models.dev data (registry-only). For these,
// admin-server.py synthesizes a "curated" provider node (id = name
// lowercased, e.g. "mammouth") from config/pricing-overlay.yaml instead of
// a real models.dev catalog entry -- see _apply_pricing_overlay.
const MODELSDEV_REGISTRY_ONLY_PROVIDERS = new Set(["Mammouth", "Continue"]);

// Fallback default source, used only until loadModelSourcePrefs() resolves
// the real central default (config/ai-providers.yaml -> default-model-source,
// see admin-server.py _default_model_source) or if that fetch fails.
const DEFAULT_MODEL_SOURCE = "registry";

// In-memory mirror of the server-side per-provider map, plus the central
// default reported by the server. Populated by loadModelSourcePrefs(); never
// persisted client-side (no localStorage).
const modelSourceState = { providerSource: {}, defaultSource: DEFAULT_MODEL_SOURCE };

/** Fetch the central per-provider source map (and the central default) from
 * the server into the local cache. Called when a source-aware view mounts.
 * Best-effort: on failure the cache is left as-is (providers fall back to
 * DEFAULT_MODEL_SOURCE). */
async function loadModelSourcePrefs() {
  try {
    const res = await api.get("/api/model-source");
    modelSourceState.providerSource = (res && res.preferences) || {};
    if (res && typeof res.default === "string") modelSourceState.defaultSource = res.default;
  } catch { /* keep existing cache */ }
  return modelSourceState.providerSource;
}

/** Effective source ("registry" | "modelsdev") for a provider name: the
 * central per-provider setting, or the central default when unset. */
function effectiveModelSource(providerName) {
  return modelSourceState.providerSource[providerName] || modelSourceState.defaultSource;
}

async function viewBackups() {
  const wrap = el("div");

  const status = el("div", { class: "muted" }, ["Loading..."]);
  wrap.appendChild(status);

  let data = null;
  const load = async () => {
    try {
      status.textContent = "Loading backups...";
      data = await api.get("/api/backups");
      status.textContent = "";
      render();
    } catch(e) {
      status.textContent = "Error: " + e;
    }
  };

  const tableWrap = el("div");
  wrap.appendChild(tableWrap);

  const render = () => {
    tableWrap.innerHTML = "";
    if (!data || !data.archives || data.archives.length === 0) {
      tableWrap.appendChild(el("p", {}, ["No backups found."]));
      return;
    }
    const t = el("table", { class: "roles-table" }, [
      el("thead", {}, [
        el("tr", {}, [
          el("th", {}, ["Date"]),
          el("th", {}, ["Label"]),
          el("th", {}, ["Size"]),
          el("th", {}, ["Actions"]),
        ])
      ]),
      el("tbody", {}, data.archives.map(a => 
        el("tr", {}, [
          el("td", {}, [a.created.substring(0,19).replace("T"," ")]),
          el("td", {}, [a.label || "-"]),
          el("td", {}, [a.size_mb + " MB"]),
          el("td", {}, [
            el("button", { class: "btn small", onclick: async () => {
              if(!confirm("Restore this backup?")) return;
              try {
                await api.post("/api/backups/restore", {archive_name: a.name, force: true});
                alert("Restored successfully.");
                load();
              } catch(e) { alert("Error: " + e); }
            }}, ["Restore"]),
            " ",
            el("button", { class: "btn small", onclick: async () => {
              if(!confirm("Delete this backup?")) return;
              try {
                await api.delete("/api/backups/" + a.name);
                load();
              } catch(e) { alert("Error: " + e); }
            }}, ["Delete"])
          ])
        ])
      ))
    ]);
    tableWrap.appendChild(t);
  };

  const controls = el("div", { style: "margin-top: 1em;" }, [
    el("button", { class: "btn", onclick: async () => {
      const label = prompt("Optional label for backup:");

        load();
      } catch(e) { alert("Error: " + e); load(); }
    }}, ["Create Backup"])
  ]);
  wrap.appendChild(controls);

  load();
  return wrap;
}

  const toggleRow = el("div", { class: "btn-row", style: "gap:12px;" });
  toggleRow.appendChild(el("span", {}, ["Global: "]));
  const modeSel = el("select");
  modeSel.appendChild(el("option", { value: "all" }, ["All Providers"]));
  modeSel.appendChild(el("option", { value: "selective" }, ["Selective"]));
  if (deactStatus.mode === "selective") modeSel.value = "selective";
  else modeSel.value = "all";
  toggleRow.appendChild(modeSel);
  toggleRow.appendChild(el("label", { style: "display:flex; align-items:center; gap:4px;" }, [
    el("input", { type: "checkbox", checked: enabled, onchange: () => { modeSel.disabled = !event.target.checked; } }),
    el("span", {}, ["Enable deactivation"]),
  ]));
  actions.appendChild(toggleRow);
  actions.appendChild(el("br"));

  // Per-provider cards
  const providers = deactStatus.providers || {};
  const providerNames = Object.keys(providers).sort();
  const grid = el("div", { style: "display:grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap:12px;" });

  for (const name of providerNames) {
    const p = providers[name];
    const card = el("div", { class: "panel", style: "padding:12px;" });
    const header = el("div", { style: "display:flex; justify-content:space-between; align-items:center;" });
    header.appendChild(el("strong", {}, [name]));
    const badge = el("span", {
      style: `font-size:11px; padding:2px 8px; border-radius:4px; background:${p.deactivated ? '#553333' : '#335533'}; color:${p.deactivated ? '#ff9999' : '#99ff99'};`
    }, [p.deactivated ? "DEACTIVATED" : "ACTIVE"]);
    header.appendChild(badge);
    card.appendChild(header);

    const info = el("div", { style: "font-size:12px; color:var(--text-secondary); margin-top:6px;" });
    if (p.directory_exists) {
      info.appendChild(el("div", {}, [`Dir: ${p.directory}`]));
    } else {
      info.appendChild(el("div", { style: "color:#aa8866;" }, [`(no directory)`]));
    }
    if (p.backups.length > 0) {
      info.appendChild(el("div", {}, [`Backups: ${p.backups.length} (latest: ${p.backups[p.backups.length - 1]})`]));
    } else {
      info.appendChild(el("div", { style: "color:#aa8866;" }, ["No backups"]));
    }
    card.appendChild(info);

    const btnRow = el("div", { class: "btn-row", style: "margin-top:8px;" });
    const deactBtn = el("button", { class: "btn btn-danger", style: "font-size:11px;", disabled: !p.directory_exists }, ["Deactivate"]);
    deactBtn.addEventListener("click", async () => {
      deactBtn.disabled = true;
      deactBtn.textContent = "Working...";
      try {
        await api.post("/api/provider-deactivation/deactivate", { providers: [name] });
        router.resolve(); // refresh
      } catch (e) { deactBtn.textContent = "Error!"; }
    });
    btnRow.appendChild(deactBtn);

    const actBtn = el("button", { class: "btn", style: "font-size:11px;", disabled: p.backups.length === 0 || p.directory_exists }, ["Activate"]);
    actBtn.addEventListener("click", async () => {
      actBtn.disabled = true;
      actBtn.textContent = "Working...";
      try {
        await api.post("/api/provider-deactivation/activate", { providers: [name] });
        router.resolve(); // refresh
      } catch (e) { actBtn.textContent = "Error!"; }
    });
    btnRow.appendChild(actBtn);
    card.appendChild(btnRow);

    grid.appendChild(card);
  }

  actions.appendChild(grid);
  actions.appendChild(el("br"));

  // Bulk actions
  const bulkRow = el("div", { class: "btn-row", style: "gap:12px;" });
  const deactAllBtn = el("button", { class: "btn btn-danger" }, ["Deactivate ALL"]);
  deactAllBtn.addEventListener("click", async () => {
    if (!confirm("Deactivate ALL providers? This will zip and remove all provider directories.")) return;
    deactAllBtn.disabled = true;
    try { await api.post("/api/provider-deactivation/deactivate", { providers: [] });
    router.resolve(); } catch { /* ignore */ }
  });
  bulkRow.appendChild(deactAllBtn);

  const actAllBtn = el("button", { class: "btn" }, ["Activate ALL (from backups)"]);
  actAllBtn.addEventListener("click", async () => {
    if (!confirm("Activate ALL providers from backups?")) return;
    actAllBtn.disabled = true;
    try { await api.post("/api/provider-deactivation/activate", { providers: [] });
    router.resolve(); } catch { /* ignore */ }
  });
  bulkRow.appendChild(actAllBtn);
  actions.appendChild(bulkRow);

  // Save config
  actions.appendChild(el("br"));
  const saveRow = el("div", { class: "btn-row", style: "gap:12px;" });
  saveRow.appendChild(el("button", { class: "btn btn-primary", onclick: async () => {
    const data = await loadProject();
    if (!data["provider-deactivation"]) data["provider-deactivation"] = {};
    data["provider-deactivation"].enabled = enabled;
    data["provider-deactivation"].mode = modeSel.value;
    if (modeSel.value === "selective") {
      // Keep existing selective list from status
      data["provider-deactivation"].providers = deactStatus.deactivated_providers || [];
    } else {
      delete data["provider-deactivation"].providers;
    }
    data["provider-deactivation"]["backup-dir"] = deactStatus.backup_dir || ".backup/provider-deactivation";
    try { await saveConfig("project", data, status); } catch { /* ignore */ }
  } }, ["Save Config"]));
  saveRow.appendChild(el("button", { class: "btn", onclick: () => router.resolve() }, ["Refresh"]));
  actions.appendChild(saveRow);

  wrap.appendChild(actions);
  status.textContent = "";
  return wrap;
}

/* -------------------------- Environment Variables ------------------------- */
async function viewProjectEnvironments() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["Project — Environment Variables"]));
  wrap.appendChild(el("p", { class: "muted" }, [
    "Define environment variables that sync generates as platform scripts (.ps1/.sh). ",
    "Set defaults, mark as required, or flag secrets for masking in logs.",
  ]));

  const data = await loadProject();
  const envs = (data["environments"] && typeof data["environments"] === "object") ? data["environments"] : {};

  const statusEl = el("span");
  const topBar = el("div", { style: "display:flex;gap:8px;margin-bottom:12px;align-items:center;" });
  const addBtn = el("button", { class: "btn", onclick: () => openEnvModal(null) }, ["+ Add Variable"]);
  const scriptsBtn = el("button", { class: "btn", style: "margin-left:auto;", onclick: showEnvScripts }, ["📜 Generate Scripts"]);
  topBar.appendChild(addBtn);
  topBar.appendChild(scriptsBtn);
  topBar.appendChild(statusEl);
  wrap.appendChild(topBar);

  const tableWrap = el("div");
  wrap.appendChild(tableWrap);

  function render() {
    tableWrap.replaceChildren();
    const names = Object.keys(envs).sort();
    if (!names.length) {
      tableWrap.appendChild(el("p", { class: "muted" }, ["No environment variables defined. Click '+ Add Variable' to start."]));
      return;
    }
    const table = el("table", { class: "data" });
    const th = (t) => el("th", {}, [t]);
    table.appendChild(el("thead", {}, [el("tr", {}, [th("Name"), th("Description"), th("Default"), th("Required"), th("Secret"), th("")])]));
    const tbody = el("tbody");
    for (const name of names) {
      const cfg = envs[name] || {};
      const isReq = cfg.required === true;
      const isSec = cfg.secret === true;
      const defDisp = isSec && cfg.default ? "••••••••" : (cfg.default || "—");
      const tr = el("tr", { style: "cursor:pointer;", onclick: () => openEnvModal(name) });
      tr.appendChild(el("td", {}, [el("code", {}, [name])]));
      tr.appendChild(el("td", {}, [cfg.description || "—"]));
      tr.appendChild(el("td", { class: "mono" }, [defDisp]));
      tr.appendChild(el("td", {}, [isReq ? "✅" : "—"]));
      tr.appendChild(el("td", {}, [isSec ? "🔒" : "—"]));
      const delCell = el("td");
      const delBtn = el("button", { class: "btn btn-sm btn-danger", onclick: (ev) => { ev.stopPropagation(); deleteEnv(name); } }, ["✕"]);
      delCell.appendChild(delBtn);
      tr.appendChild(delCell);
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    statusEl.textContent = `${names.length} variable(s).`;
  }

  async function deleteEnv(name) {
    if (!confirm(`Delete environment variable "${name}"?`)) return;
    delete envs[name];
    await saveProjectSection("environments", envs, statusEl);
    render();
  }

  async function openEnvModal(name) {
    const isNew = name == null;
    const cfg = isNew ? { description: "", default: "", required: false, secret: false } : (clone(envs[name]) || { description: "", default: "", required: false, secret: false });
    const title = isNew ? "Add Environment Variable" : `Edit: ${name}`;

    const nameInput = el("input", { type: "text", placeholder: "MCP_HONCHO_URL", value: isNew ? "" : name, class: "field" });
    const descInput = el("input", { type: "text", placeholder: "Honcho Server URL", value: cfg.description || "", class: "field" });
    const defInput  = el("input", { type: "text", placeholder: "http://localhost:8200", value: cfg.default || "", class: "field" });
    const reqCheck  = el("input", { type: "checkbox", checked: cfg.required === true });
    const secCheck  = el("input", { type: "checkbox", checked: cfg.secret === true });

    const body = el("div", { style: "display:flex;flex-direction:column;gap:12px;" });
    body.appendChild(envField("Name", nameInput, "UPPERCASE, e.g. MCP_HONCHO_URL"));
    body.appendChild(envField("Description", descInput, "What this variable is for"));
    body.appendChild(envField("Default", defInput, "Fallback value if not set in environment"));
    body.appendChild(envField("Required", reqCheck, "Warn if not set at startup"));
    body.appendChild(envField("Secret", secCheck, "Mask value in logs and generated scripts"));

    const saveBtn = el("button", { class: "btn btn-primary", onclick: async () => {
      const newName = nameInput.value.trim().toUpperCase();
      if (!newName) { toast("Name is required", "error"); return; }
      const oldName = isNew ? null : name;
      if (oldName && oldName !== newName) delete envs[oldName];
      envs[newName] = {
        description: descInput.value.trim(),
        default: defInput.value.trim(),
        required: reqCheck.checked,
        secret: secCheck.checked,
      };
      await saveProjectSection("environments", envs, statusEl);
      hideModal();
      render();
    } }, ["Save"]);

    showModal(title, body, [saveBtn, el("button", { class: "btn", onclick: hideModal }, ["Cancel"])]);
  }

  async function showEnvScripts() {
    try {
      const scripts = await api.get("/api/environments/scripts");
      const body = el("div");
      const tabs = el("div", { style: "display:flex;gap:4px;margin-bottom:8px;" });
      const content = el("div");
      let active = ".meta-config/env.ps1";

      for (const [file, text] of Object.entries(scripts)) {
        const btn = el("button", {
          class: `btn btn-sm ${file === active ? "btn-primary" : ""}`,
          onclick: () => { active = file; renderScript(); },
        }, [file.replace(".meta-config/", "")]);
        tabs.appendChild(btn);
      }
      body.appendChild(tabs);

      function renderScript() {
        content.replaceChildren();
        const pre = el("pre", { style: "max-height:400px;overflow:auto;background:var(--bg-code);padding:12px;border-radius:6px;font-size:0.85em;" }, [scripts[active] || "(empty)"]);
        content.appendChild(pre);
        const copyBtn = el("button", { class: "btn btn-sm", style: "margin-top:8px;", onclick: () => {
          navigator.clipboard.writeText(scripts[active] || "").then(() => toast("Copied!", "success"));
        } }, ["📋 Copy"]);
        content.appendChild(copyBtn);
        // Update active tab styles
        for (const b of tabs.children) {
          b.className = `btn btn-sm ${b.textContent === active.replace(".meta-config/", "") ? "btn-primary" : ""}`;
        }
      }
      renderScript();
      body.appendChild(content);
      showModal("Generated Environment Scripts", body, [el("button", { class: "btn", onclick: hideModal }, ["Close"])]);
    } catch (err) {
      toast(`Failed to load scripts: ${err.message}`, "error");
    }
  }

  render();
  return wrap;
}

/* =========================================================================
 * Views — Viz Dashboard (embedded iframe + subserver controls)
 * ========================================================================= */
async function viewVizDashboard() {
  const wrap = el("div");
  wrap.appendChild(el("h1", {}, ["Viz Dashboard"]));
  wrap.appendChild(el("p", { class: "muted" }, [
    "Embeds the Viz dashboard subserver and lets you start, stop and restart the Viz and MCP subservers.",
  ]));

  // Control panel — Start/Stop/Restart per service.
  const controls = el("div", { class: "panel" });
  controls.appendChild(el("div", { class: "panel-title" }, [el("h2", { style: "margin:0;" }, ["Subserver controls"])]));
  const controlBody = el("div");
  controls.appendChild(controlBody);
  wrap.appendChild(controls);

  // Embed area — iframe (running) or placeholder (stopped).
  const embed = el("div", { class: "panel" });
  embed.appendChild(el("div", { class: "panel-title" }, [el("h2", { style: "margin:0;" }, ["Viz dashboard"])]));
  const embedBody = el("div");
  embed.appendChild(embedBody);
  wrap.appendChild(embed);

  let inFlight = false;
  let lastVizUrl = null;

  const renderControls = (status) => {
    controlBody.replaceChildren();
    const row = (label, name, running) => {
      const line = el("div", { class: "flex-row", style: "margin-bottom:8px;" });
      const dot = running
        ? el("span", { style: "color:var(--accent-green)" }, ["● running"])
        : el("span", { style: "color:var(--text-muted)" }, ["○ stopped"]);
      line.appendChild(el("span", { style: "min-width:120px; font-weight:600;" }, [label]));
      line.appendChild(dot);
      const mkBtn = (text, action, cls) => {
        const b = el("button", { class: `btn ${cls || ""}` }, [text]);
        b.disabled = inFlight;
        b.addEventListener("click", () => doAction(name, action));
        return b;
      };
      line.appendChild(mkBtn("Start", "start", "btn-primary"));
      line.appendChild(mkBtn("Stop", "stop", "btn-danger"));
      line.appendChild(mkBtn("Restart", "restart", ""));
      return line;
    };
    controlBody.appendChild(row("Viz dashboard", "viz", status?.viz?.running));
    controlBody.appendChild(row("MCP server", "mcp", status?.mcp?.running));
  };

  const renderEmbed = (status) => {
    const viz = status?.viz || {};
    if (viz.running && viz.url) {
      // Only rebuild the iframe when the URL changes — avoids reloading on
      // every 5s poll.
      if (lastVizUrl !== viz.url || !embedBody.querySelector("iframe")) {
        embedBody.replaceChildren();
        const frame = el("iframe", {
          src: viz.url,
          style: "width:100%; height:600px; border:1px solid var(--border-color); border-radius:var(--radius); background:#fff;",
        });
        embedBody.appendChild(frame);
        lastVizUrl = viz.url;
      }
    } else {
      lastVizUrl = null;
      embedBody.replaceChildren();
      const placeholder = el("div", { class: "empty" });
      placeholder.appendChild(el("div", {}, ["Viz dashboard is not running."]));
      const startBtn = el("button", { class: "btn btn-primary", style: "margin-top:12px;" }, ["Start Viz Server"]);
      startBtn.disabled = inFlight;
      startBtn.addEventListener("click", () => doAction("viz", "start"));
      placeholder.appendChild(startBtn);
      embedBody.appendChild(placeholder);
    }
  };

  const applyStatus = (status) => {
    renderControls(status);
    renderEmbed(status);
  };

  const doAction = async (name, action) => {
    if (inFlight) return;
    inFlight = true;
    renderControls(lastStatus);
    toast(`${action} ${name}…`, "info", 1500);
    try {
      const r = await api.post(`/api/subserver/${name}/${action}`);
      lastStatus = r.status;
      toast(
        r.success ? `${name} ${action} ok` : `${name} ${action} failed`,
        r.success ? "success" : "error",
      );
    } catch (err) {
      toast(`${name} ${action} failed: ${err.message}`, "error");
    } finally {
      inFlight = false;
      applyStatus(lastStatus);
    }
  };

  let lastStatus = null;
  try {
    lastStatus = await api.get("/api/subserver-status");
  } catch { /* best effort */ }
  applyStatus(lastStatus);

  // Poll every 5s while this view is mounted. Stop on route change.
  const poll = setInterval(async () => {
    if (inFlight) return;
    try {
      lastStatus = await api.get("/api/subserver-status");
      applyStatus(lastStatus);
    } catch { /* best effort */ }
  }, 5000);
  window.addEventListener("hashchange", () => clearInterval(poll), { once: true });

  return wrap;
}

/* =========================================================================
 * Models & Pricing (unified — Registry + models.dev)
 * ========================================================================= */
async function viewModels() {
  const wrap = el("div");

  const state = {
    // `source` is a purely local VIEW toggle (which catalog table to render);
    // it is NOT a persisted setting. The persisted, per-provider setting is
    // the central `model-source-preference` (server-backed), mirrored into
    // `providerSource` -- the SAME object reference as
    // modelSourceState.providerSource, so effectiveModelSource() and the
    // Provider Tier Overrides view resolve the identical central values.
    source: DEFAULT_MODEL_SOURCE,   // local view toggle: "registry" | "modelsdev"
    registry: [],              // model-registry.json data
    modelsDev: null,           // { providers, models } from models.dev
    configuredProviders: [],   // provider names from .meta-config/project.yaml → ai-providers
    providerSource: modelSourceState.providerSource,   // central per-provider: "registry" | "modelsdev"
    // Local-only, unsaved per-provider source changes from the "Per provider:"
    // dropdowns. Keyed by provider name -> "registry" | "modelsdev". Cleared
    // once "Save" persists them via POST /api/model-source/batch. Nothing in
    // here is sent to the server until Save is clicked.
    pendingSourceChanges: {},
    loading: true,
    filterProvider: "",
    filterModel: "",
    filterCap: { reasoning: false, toolCall: false, attachment: false, vision: false, structured: false },
    showAllProviders: false,   // false = scope models.dev table to configured providers only
  };

  // Local aliases for the module-level maps (shared with
  // viewProjectProviderTierOverrides) so the rest of this function needs no
  // further changes.
  const PROVIDER_MAP = PROVIDER_MODELSDEV_MAP;
  const REGISTRY_ONLY = MODELSDEV_REGISTRY_ONLY_PROVIDERS;

  function fmtCost(val) { if (val == null) return "\u2014"; if (val === 0) return "Free"; return "$" + val.toFixed(val < 0.01 ? 4 : 2); }
  function fmtCtx(v) { if (!v) return "\u2014"; if (v >= 1000000) return (v / 1000000).toFixed(1) + "M"; return (v / 1000).toFixed(0) + "K"; }

  function render() {
    wrap.innerHTML = "";
    wrap.appendChild(el("h1", {}, ["Models & Pricing"]));

    // Source toggle
    const srcRow = el("div", { class: "btn-row", style: "margin-bottom:16px;align-items:center;display:flex;gap:8px;" });
    srcRow.appendChild(el("span", { style: "font-weight:600;margin-right:4px;" }, ["Source:"]));
    for (const [val, label] of [["registry", "model-registry.json"], ["modelsdev", "models.dev"]]) {
      const active = state.source === val;
      srcRow.appendChild(el("button", {
        class: "btn" + (active ? " btn-primary" : ""),
        onclick: () => { state.source = val; render(); },
        style: active ? "" : "opacity:0.6;"
      }, [label]));
    }
    if (state.modelsDev) {
      const d = state.modelsDev;
      const srcBadge = d.source === "sdk" ? "SDK" : d.source === "api" ? "API" : "ERR";
      const srcColor = d.source === "sdk" ? "var(--accent-green)" : d.source === "api" ? "var(--accent-yellow)" : "var(--accent-red)";
      srcRow.appendChild(el("span", { class: "badge ok", style: `margin-left:auto;background:${srcColor};color:#000;` }, [srcBadge]));
      if (d.generated_at) srcRow.appendChild(el("span", { style: "font-size:0.8em;opacity:0.6;" }, [new Date(d.generated_at).toLocaleDateString()]));
      srcRow.appendChild(el("button", { class: "btn", onclick: async () => { await api.post("/api/models-dev/refresh", {}); loadModelsDev(); render(); }, style: "font-size:0.85em;" }, ["↻"]));
    }
    wrap.appendChild(srcRow);

    // Per-provider source override. Dropdowns only change LOCAL state
    // (state.pendingSourceChanges) — nothing is sent to the server until the
    // "Save" button at the end of the row is clicked, which persists every
    // changed provider in one batched POST /api/model-source/batch call.
    if (state.configuredProviders.length > 0) {
      const provRow = el("div", { style: "display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:0.82em;" });
      provRow.appendChild(el("span", { style: "opacity:0.6;margin-right:4px;" }, ["Per provider:"]));
      state.configuredProviders.forEach(provName => {
        const mdId = PROVIDER_MAP[provName];
        const saved = effectiveModelSource(provName);
        const hasPending = Object.prototype.hasOwnProperty.call(state.pendingSourceChanges, provName);
        const displayed = hasPending ? state.pendingSourceChanges[provName] : saved;
        const isRegistryOnly = REGISTRY_ONLY.has(provName) || !mdId;
