# Continue configuration — Cloud API setup (generated by agent-meta)
# See https://docs.continue.dev for full documentation
#
# This template uses Claude via Anthropic API.
# Copy to .continue/config.yaml and add your API key.
# NEVER overwritten by sync.py — edit freely.
#
# ──────────────────────────────────────────────────────────────
# SETUP:
#   1. Get API key: https://console.anthropic.com
#   2. Set ANTHROPIC_API_KEY environment variable, or
#      add apiKey below (not recommended for shared machines)
# ──────────────────────────────────────────────────────────────

name: Cloud API Workspace
version: 1.0.0
schema: v1

# ──────────────────────────────────────────────────────────────
# MODELS — Claude via Anthropic API
# Agent-meta tier mapping:
#   balanced → claude-sonnet-4-6  (workhorse: developer, documenter, ...)
#   powerful → claude-opus-4-7    (complex: security-auditor, performance, ...)
#   fast     → claude-haiku-4-5   (quick ops: git, meta-feedback, ...)
# ──────────────────────────────────────────────────────────────
models:

  # Default workhorse — chat, edit and agent mode
  - name: Claude Sonnet 4.6 (Agent)
    provider: anthropic
    model: claude-sonnet-4-6
    roles: [chat, edit, agent]
    # apiKey: sk-ant-...  # or set ANTHROPIC_API_KEY env var

  # Powerful reasoning — for complex tasks
  - name: Claude Opus 4.7 (Powerful)
    provider: anthropic
    model: claude-opus-4-7
    roles: [chat, agent]

  # Fast and cheap — for simple tasks
  - name: Claude Haiku 4.5 (Fast)
    provider: anthropic
    model: claude-haiku-4-5-20251001
    roles: [chat, edit]

# ──────────────────────────────────────────────────────────────
# AGENT MODE
# Agents are in .continue/agents/ — invoke by name in Agent Mode.
# Rules are loaded from .continue/rules/ automatically.
# ──────────────────────────────────────────────────────────────

# ──────────────────────────────────────────────────────────────
# PROMPTS (Slash-Commands via "/")
# ──────────────────────────────────────────────────────────────
