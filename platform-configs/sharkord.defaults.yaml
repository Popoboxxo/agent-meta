# platform-configs/sharkord.defaults.yaml
# =============================================================================
# Default configuration for the "sharkord" platform.
#
# These values are injected into rules/2-platform/sharkord-*.md and
# agents/2-platform/sharkord-*.md as {{platform.sharkord.*}} placeholders
# during sync.
#
# OVERRIDE in your project by creating .claude/platform-config.yaml:
#
#   platform:
#     sharkord:
#       image_tag: "v0.1.0"
#       min_version: "0.1.0"
#
# Empty string ("") = required field — sync.py emits [WARN] if not overridden.
# Non-empty value   = sensible default that works out of the box.
# =============================================================================

platform:
  sharkord:

    # -------------------------------------------------------------------------
    # Docker image
    # -------------------------------------------------------------------------

    # Docker image tag — must match peerDependencies in package.json
    # Example: "v0.0.16"
    image_tag: "v0.0.16"

    # -------------------------------------------------------------------------
    # Release notes
    # -------------------------------------------------------------------------

    # Minimum Sharkord version required by this plugin (for release notes)
    # Example: "0.0.16"
    min_version: "0.0.16"

    # NOTE: the former service_name/host_lan_ip sub-keys have been removed --
    # they now live in variables.SERVICE_NAME/variables.HOST_LAN_IP below
    # (platform-preset cascade). {{SERVICE_NAME}}/{{HOST_LAN_IP}} in templates
    # resolve via scripts/lib/platform.py::resolve_platform_defaults(), same
    # values as before the migration.

# =============================================================================
# Platform-preset cascade -- see hacs.defaults.yaml's header comment above
# for the mechanism. variables.SERVICE_NAME/CONTAINER_NAME/HOST_LAN_IP below
# carry the values formerly held by the now-removed
# platform.sharkord.service_name/host_lan_ip sub-keys, exposed through the
# generic, cascade-aware {{SERVICE_NAME}}/{{HOST_LAN_IP}} placeholders
# (design spec Architektur §1 -- sharkord config duplication).
#
# conventions-preset: deliberately omitted -- same reasoning as
# hacs.defaults.yaml (sharkord plugins already use SemVer via image_tag,
# i.e. 'default'; no differentiated preset exists to reference).
# =============================================================================

dod-preset: standard

variables:
  PLATFORM: "Sharkord Plugin SDK"
  RUNTIME: "Bun"
  PROJECT_LANGUAGES: "TypeScript"
  SERVICE_NAME: "sharkord"
  CONTAINER_NAME: "sharkord"
  HOST_LAN_IP: "127.0.0.1"
  TEST_COMMANDS+: "docker compose run --rm test"
  CODE_CONVENTIONS+: "TypeScript, ESLint, Prettier"
