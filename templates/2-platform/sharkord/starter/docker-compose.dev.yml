version: "3.8"

services:
  sharkord:
    # IMPORTANT: Always pin the Sharkord version. NEVER use "latest".
    # Update this version explicitly after testing compatibility.
    image: ghcr.io/sharkord/sharkord:v0.0.20
    container_name: sharkord-dev
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    environment:
      - SHARKORD_WEBRTC_ANNOUNCED_ADDRESS={{platform.sharkord.host_lan_ip}}
    volumes:
      - ./dist/{{PROJECT_NAME}}:/home/bun/.config/sharkord/plugins/{{PROJECT_NAME}}
    ports:
      - "3000:3000"
      - "10000-10100:10000-10100/udp"
