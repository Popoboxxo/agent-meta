name: Sharkord Plugin CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint || npx tsc --noEmit

  docker-smoke:
    if: contains(github.event.head_commit.message, 'voice') || contains(github.event.head_commit.message, 'stream') || contains(github.event.head_commit.message, 'mediasoup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker compose -f docker-compose.dev.yml build
      - name: Health check
        run: |
          docker compose -f docker-compose.dev.yml up -d
          sleep 10
          docker compose -f docker-compose.dev.yml ps
          docker compose -f docker-compose.dev.yml down
