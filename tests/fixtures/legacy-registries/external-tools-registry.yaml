version: 1.0.0
external-tools:
  graphify:
    description: >-
      graphify — lokal installiertes CLI-Tool. Baut das Repo als Wissensgraph
      auf (Community Detection, God Nodes, Query/Path/Explain). Wird NICHT von
      agent-meta bereitgestellt, muss lokal installiert sein.
    category: dev-tool
    enabled-by-default: false
    provider-skip: []
    rule-content: |
      ## graphify
      `graphify` ist ein lokal installiertes CLI-Tool für Architektur-/Datei-
      Beziehungsfragen. Bei Bedarf `graphify-out/` prüfen bzw. `/graphify`
      nutzen. Nicht auf dieser Maschine installiert? Die Hook-Wrapper unten
      laufen dann folgenlos durch (exit 0), nichts wird blockiert.
    hooks:
      - graphify-search-guard
      - graphify-read-guard
    permitted-injections:
      - kind: skill
        name: graphify
        description: "Claude-Code-Skill (SKILL.md + references), vom graphify-Installer selbst verwaltet"
