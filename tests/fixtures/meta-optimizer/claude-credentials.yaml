# Fixture: credential exclusion (AC-89, IC-24 Rev. 3.1).
# `admin-ui.token` / `admin-ui.token-file` are explicit registry credentials,
# `variables.API_TOKEN` matches the name pattern AND `scan_for_secrets`, and
# `max-tokens-overrides` is the negative case (must NOT be a credential).
agent-meta-version: "2.0.0-beta.3"
ai-providers:
- Claude
dod-preset: rapid-prototyping
admin-ui:
  token: adminuisecrettokenvalue1234567890
  token-file: /run/secrets/admin-token
max-tokens-overrides:
  developer: 4096
repo_containment:
  tmp-sink:
    enabled: true
    path: scratch/out
variables:
  API_TOKEN: sk-abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUV
  PROJECT_NAME: credfixturetoken
