# Fixture: two keys sharing one value (duplicate-value hint, AC-57).
# No unused/dead variables so the only non-deterministic candidates without
# --include-semantic are the AC-81 runtime-reader info-only hints
# (e.g. repo_containment), never a semantic kind.
agent-meta-version: "2.0.0-beta.6"
ai-providers:
- Claude
dod-preset: rapid-prototyping
repo_containment:
  tmp-sink:
    enabled: true
    path: scratch/out
variables:
  PROJECT_NAME: duplicatetoken
  PROJECT_GOAL: duplicatetoken
