# Fixture: AC-89 credential exclusion + sink hardening end-to-end (Task 26 / 2d.7).
#
# ``admin-ui.token`` / ``admin-ui.token-file`` are explicit registry credentials,
# ``variables.API_TOKEN`` matches the credential name pattern AND
# ``secrets.scan_for_secrets`` (OpenAI-style, ``sk-`` + 48 alphanumerics), and
# ``variables.RELEASE_NOTE`` is a neutral key name whose value is only caught by
# the value scan (GitHub ``ghp_`` + 36 alphanumerics).
# ``UNUSED_NEIGHBOR`` sits directly below ``API_TOKEN`` so the removal diff
# context must redact the credential line. ``max-tokens-overrides`` is the
# negative case: it must never be classified as a credential.
agent-meta-version: "2.0.0-beta.2"
ai-providers:
- Claude
dod-preset: rapid-prototyping
admin-ui:
  token: adminuisecrettokenvalue1234567890
  token-file: /run/secrets/admin-token
max-tokens-overrides:
  developer: 4096
repo_containment:
  tmp-sink:
    enabled: true
    path: scratch/out
variables:
  API_TOKEN: sk-abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUV
  UNUSED_NEIGHBOR: deadneighborvalue
  RELEASE_NOTE: ghp_abcdefghijklmnopqrstuvwxyz0123456789
  PROJECT_NAME: credentialfixture
