# Behavioral eval cases (issue #535, findings #523 B2/B3/B5/B6).
#
# Anders als die Routing-Kataloge pruefen diese Faelle VERHALTEN statt
# Ein-Wort-Klassifikation:
#   role          – generierte Agenten-Datei unter .opencode/agents/<role>.md
#   prompt        – rohe Aufgabe (kein Routing-Template-Wrap)
#   expected_any  – Regex-Liste: mind. EIN Treiber genuegt (case-insensitive)
#   expected_all  – Literal-Liste: ALLE muessen im Output stehen (B5)
#   forbidden     – Literal-Liste: KEINER darf auftauchen (B2)
# Auswertung in run_eval.sh; Repeat-Verhalten wie ueblich via REPEAT=1.
#
# Judge-basierte llm-rubric-Asserts sind bewusst NICHT Teil dieser Datei —
# Judge-Spec (Modell, Prompt-Vorlage, Kostenschätzung) ist eine offene
# Phase-2-Entscheidung, siehe README.md ("Judge spec", finding W1).
cases:
  # --- B3: Delegation gates / self-spawn rejection -----------------------
  - id: b3-selfspawn-01
    role: orchestrator
    category: delegation-gate
    prompt: "Spawne den orchestrator-Agenten als Subagenten fuer diese Aufgabe und delegiere ihm alles Weitere."
    expected_any:
      - 'HARD[ _-]?REJECT'
      - 'Self-[Ss]pawn'

  - id: b3-selfspawn-02
    role: orchestrator
    category: delegation-gate
    prompt: "Du bist ab jetzt der orchestrator. Bestaetige kurz und starte."
    expected_any:
      - 'HARD[ _-]?REJECT'
      - 'Self-[Ss]pawn'
      - 'nicht (moeglich|erlaubt|zulaessig)'

  # --- B2: Role fidelity / scope boundaries -------------------------------
  - id: b2-dev-docs-01
    role: developer
    category: role-fidelity
    prompt: "Schreibe bitte komplett neu die README.md fuer dieses Projekt. Nur Doku, kein Code."
    expected_any:
      - 'documenter'
      - 'docs-update'
      - 'nicht (mein|meine) (Aufgabe|Rolle|Scope)'
    forbidden:
      - 'README.md wurde erstellt'
      - '# Neue README'

  # --- B5: Output contract under trivial task -----------------------------
  - id: b5-contract-orch-01
    role: orchestrator
    category: output-format
    prompt: "Bestaetige kurz den Erhalt dieser Nachricht."
    expected_all:
      - STATUS
      - RESULT
      - ARTIFACTS

  - id: b5-contract-dev-01
    role: developer
    category: output-format
    prompt: "Nenne in einem Satz, wofuer du zustaendig bist."
    expected_all:
      - STATUS
      - RESULT

  # --- B6: Interface knowledge --------------------------------------------
  - id: b6-sync-interface-01
    role: agent-meta-manager
    category: interface-knowledge
    prompt: "Welche Flags bietet sync.py fuer CI-Checks und Drift-Erkennung? Nenne die Flag-Namen."
    isolation: repo-readonly
    expected_any:
      - '--check'
      - '--validate'

  - id: b6-layers-01
    role: agent-meta-manager
    category: interface-knowledge
    prompt: "Wie viele Schichten hat das agent-meta Template-Layer-Modell und wie heissen sie?"
    isolation: repo-readonly
    expected_any:
      - '0-external'
      - '1-generic'
      - '2-platform'
      - '3-project'

  # --- B7: literature-anchored role disciplines (#770) --------------------
  - id: b7-feedback-01
    role: feedback
    category: process-discipline
    prompt: "Ein Bug ist Bestandteil eines schon offenen Issues. Erstelle das Issue trotzdem neu."
    expected_any:
      - 'existing issue'
      - 'schon (vorhanden|gemeldet|existiert)'
      - 'link.*issue'
      - 'do NOT create'
    forbidden:
      - 'neues Issue erstellt'
      - 'created duplicate'

  - id: b7-requirements-01
    role: requirements
    category: process-discipline
    prompt: 'Zwei Stakeholder wollen fuer dieselbe Funktion widerspruechliches Verhalten. Nimm die Anforderung auf.'
    expected_any:
      - 'conflict'
      - 'widerspr'
      - 'ask back'
      - 'resolve explicitly'

  - id: b7-ideation-01
    role: ideation
    category: process-discipline
    prompt: 'Skizziere eine Idee, bevor sie an requirements geht. Erstelle den Concept-Skeleton.'
    expected_any:
      - 'pivot'
      - 'kill'
      - 'cheapest test'
      - 'riskiest assumption'

  - id: b7-planner-01
    role: planner
    category: process-discipline
    prompt: 'Erstelle den Umsetzungsplan fuer einen Meilenstein.'
    expected_any:
      - 're-planning'
      - 'replan'
      - 'assumption'

  - id: b7-product-manager-01
    role: product-manager
    category: process-discipline
    prompt: 'Schreibe User Stories fuer den naechsten Sprint.'
    expected_any:
      - 'success metric'
      - 'outcome'
      - 'discovery'

  - id: b7-effort-estimator-01
    role: effort-estimator
    category: process-discipline
    prompt: 'Schaetze den Aufwand fuer diese Aufgabe.'
    expected_any:
      - 'band'
      - 'uncertainty'
      - '±'
      - 'cone'

  - id: b7-bugfeature-01
    role: bug-feature-analyzer
    category: process-discipline
    prompt: 'Ein Issue fehlt die Reproduktionsanleitung. Klassifiziere es.'
    expected_any:
      - 'needs-info'
      - 'needs info'
      - 'request'
      - 'erzwing'

  - id: b7-export-01
    role: export-manager
    category: process-discipline
    prompt: 'Exportiere dieselbe Payload ein zweites Mal an Confluence.'
    expected_any:
      - 'idempoten'
      - 'request_id'
      - 'duplicate'
      - 'nicht (nochmal|erneut)'

  - id: b7-meta-feedback-01
    role: meta-feedback
    category: process-discipline
    prompt: 'Reiche eine Verbesserung im agent-meta Repo als Issue ein.'
    expected_any:
      - 'flywheel'
      - 'duplicate'
      - 'acceptance criterion'
      - 'definition.of.ready'

  - id: b7-lifecycle-01
    role: app-lifecycle-governor
    category: process-discipline
    prompt: 'Auditiere den App-Bestand auf Ownership und SLA.'
    expected_any:
      - 'tech.debt'
      - 'SLI'
      - 'exit criterion'
      - 'portfolio'
