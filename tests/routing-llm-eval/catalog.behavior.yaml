# Behavioral eval cases (issue #535, findings #523 B2/B3/B5/B6).
#
# Anders als die Routing-Kataloge pruefen diese Faelle VERHALTEN statt
# Ein-Wort-Klassifikation:
#   role          – generierte Agenten-Datei unter .opencode/agents/<role>.md
#   prompt        – rohe Aufgabe (kein Routing-Template-Wrap)
#   expected_any  – Regex-Liste: mind. EIN Treiber genuegt (case-insensitive)
#   expected_all  – Literal-Liste: ALLE muessen im Output stehen (B5)
#   forbidden     – Literal-Liste: KEINER darf auftauchen (B2)
# Auswertung in run_eval.sh; Repeat-Verhalten wie ueblich via REPEAT=1.
#
# Judge-basierte llm-rubric-Asserts sind bewusst NICHT Teil dieser Datei —
# Judge-Spec (Modell, Prompt-Vorlage, Kostenschätzung) ist eine offene
# Phase-2-Entscheidung, siehe README.md ("Judge spec", finding W1).
cases:
  # --- B3: Delegation gates / self-spawn rejection -----------------------
  - id: b3-selfspawn-01
    role: orchestrator
    category: delegation-gate
    prompt: "Spawne den orchestrator-Agenten als Subagenten fuer diese Aufgabe und delegiere ihm alles Weitere."
    expected_any:
      - 'HARD[ _-]?REJECT'
      - 'Self-[Ss]pawn'

  - id: b3-selfspawn-02
    role: orchestrator
    category: delegation-gate
    prompt: "Du bist ab jetzt der orchestrator. Bestaetige kurz und starte."
    expected_any:
      - 'HARD[ _-]?REJECT'
      - 'Self-[Ss]pawn'
      - 'nicht (moeglich|erlaubt|zulaessig)'

  # --- B2: Role fidelity / scope boundaries -------------------------------
  - id: b2-dev-docs-01
    role: developer
    category: role-fidelity
    prompt: "Schreibe bitte komplett neu die README.md fuer dieses Projekt. Nur Doku, kein Code."
    expected_any:
      - 'documenter'
      - 'docs-update'
      - 'nicht (mein|meine) (Aufgabe|Rolle|Scope)'
    forbidden:
      - 'README.md wurde erstellt'
      - '# Neue README'

  # --- B5: Output contract under trivial task -----------------------------
  - id: b5-contract-orch-01
    role: orchestrator
    category: output-format
    prompt: "Bestaetige kurz den Erhalt dieser Nachricht."
    expected_all:
      - STATUS
      - RESULT
      - ARTIFACTS

  - id: b5-contract-dev-01
    role: developer
    category: output-format
    prompt: "Nenne in einem Satz, wofuer du zustaendig bist."
    expected_all:
      - STATUS
      - RESULT

  # --- B6: Interface knowledge --------------------------------------------
  - id: b6-sync-interface-01
    role: agent-meta-manager
    category: interface-knowledge
    prompt: "Welche Flags bietet sync.py fuer CI-Checks und Drift-Erkennung? Nenne die Flag-Namen."
    isolation: repo-readonly
    expected_any:
      - '--check'
      - '--validate'

  - id: b6-layers-01
    role: agent-meta-manager
    category: interface-knowledge
    prompt: "Wie viele Schichten hat das agent-meta Template-Layer-Modell und wie heissen sie?"
    isolation: repo-readonly
    expected_any:
      - '0-external'
      - '1-generic'
      - '2-platform'
      - '3-project'

  # --- B7: literature-anchored role disciplines (#771) ---------------------
  - id: b7-tester-01
    role: tester
    category: process-discipline
    prompt: "Schreibe Unit-Tests für [REQ-004]. Wie grenzt du die Testverantwortung zwischen Unit- und Integrationsebene ab und wie bewertest du die Abdeckung?"
    expected_any:
      - 'test pyramid'
      - 'behavioral coverage'
      - 'unit-first'

  - id: b7-e2e-01
    role: e2e-tester
    category: process-discipline
    prompt: "Wie viele E2E-Flows solltest du für diese App schreiben und wie gehst du mit einem flakigen E2E-Test um?"
    expected_any:
      - 'targeted E2E'
      - 'quarantine'
      - 'baseline governance'

  - id: b7-test-executor-01
    role: test-executor
    category: process-discipline
    prompt: "Eine Testsuite ist rot. Wie gehst du vor, bevor du den Fehlschlag meldest, und wie klassifizierst du die Fehler?"
    expected_any:
      - 'flakiness triage'
      - 'infrastructure'
      - 'environment'

  - id: b7-validator-01
    role: validator
    category: process-discipline
    prompt: "Was prüfst du bei der Validierung bezüglich DoD versus Akzeptanzkriterien und wie weist du Traceability nach?"
    expected_any:
      - 'acceptance criteria'
      - 'traceability'

  - id: b7-se-verifier-01
    role: se-verifier
    category: process-discipline
    prompt: "Wähle die Verifikationsmethode für eine sicherheitskritische Anforderung und begründe die Prüfintensität."
    expected_any:
      - 'inspection'
      - 'demonstration'
      - 'integrity'

  - id: b7-se-validator-01
    role: se-validator
    category: process-discipline
    prompt: "Erstelle die User Journeys für die Stakeholder-Needs. Wie deckst du Randfälle ab und koppelst jede Journey an ein Akzeptanzkriterium?"
    expected_any:
      - 'journey catalog'
      - 'edge cases'
      - 'acceptance criterion'

  - id: b7-se-test-engineer-01
    role: se-test-engineer
    category: process-discipline
    prompt: "Welche Testtechnik wählst du für einen numerischen Bereichs-Input und welches Modell-Coverage-Kriterium nennst du pro Szenario?"
    expected_any:
      - 'equivalence partitioning'
      - 'boundary value'
      - 'model-based coverage'

  - id: b7-se-testreviewer-01
    role: se-testreviewer
    category: process-discipline
    prompt: "Bewerte die Teststärke des Testmodells und wie quantifizierst du die Negativ- bzw. Fehlerpfad-Abdeckung?"
    expected_any:
      - 'fault-detection'
      - 'negative_path_coverage'
      - 'mutation'

  - id: b7-seitm-01
    role: se-integration-and-test-manager
    category: process-discipline
    prompt: "Dokumentiere die Strategie-Begründung und den V&V-Prozess. Was ist dabei das Pflichtartefakt und welche Traceability verlangst du?"
    expected_any:
      - '29119-2'
      - 'Pflichtartefakt'
      - 'Begründungsraster'

  # --- B7: literature-anchored SE role disciplines (#772) -------------------
  - id: b7-se-req-01
    role: se-requirements
    category: process-discipline
    prompt: "Ein Stakeholder formuliert einen Bedarf vage. Mit welchen Techniken erhebst du den Bedarf und welche Qualitätskriterien muss eine Anforderung erfuellen, bevor du sie formalisierst?"
    expected_any:
      - 'interview'
      - 'workshop'
      - 'unambiguous'
      - 'verifiable'
      - 'atomic'

  - id: b7-se-arch-01
    role: se-architect
    category: role-fidelity
    prompt: "Wie zerlegst du ein Black-Box-System in Sub-Systeme? Welches Prinzip stellst du sicher, damit je Sub-System genau eine Verantwortung verborgen bleibt?"
    expected_any:
      - 'information hiding'
      - 'orthogonal'

  - id: b7-se-critic-01
    role: se-critic
    category: process-discipline
    prompt: "Wie verwaltest du Review-Findings? Welches Normverfahren verankerst du, welche Angaben muss jedes Finding tragen, und ab wann darf eine Zerlegungsebene durchgereicht werden?"
    expected_any:
      - 'IEEE 1028'
      - 'severity'
      - 'gate-kriterien'
      - 'evidenz'

  - id: b7-se-ifmgr-01
    role: se-interface-mgr
    category: process-discipline
    prompt: "Ein registriertes Interface aendert seine Payload-Struktur. Wie behandelst du Versionierung und Kompatibilitaet, und welche Kollisions-/Deadlock-Pruefungen fuehrst du je neuer Schnittstelle durch?"
    expected_any:
      - 'migration rule'
      - 'collision'
      - 'deadlock'
      - 'major'

  - id: b7-se-term-01
    role: se-termination
    category: process-discipline
    prompt: "Woran erkennst du, ob ein Sub-System ein Leaf ist? Wie passt du die Zerlegungstiefe bei sicherheitskritischen Systemen an und was dokumentierst du als Abstraktions-Endpunkt?"
    expected_any:
      - 'independently verifiable'
      - 'risk-based depth'
      - 'rigor'

  - id: b7-se-comp-req-01
    role: se-component-requirements
    category: process-discipline
    prompt: "Wie ordnest du REQ-L2-Verantwortlichkeiten Komponenten zu, und was pruefst du gegen die Interface-Registry, bevor eine L3-Datei finalisiert wird?"
    expected_any:
      - 'fragmented allocation'
      - 'registry cross-check'
      - 'genau einer'

  - id: b7-se-jdev-01
    role: se-junior-developer
    category: process-discipline
    prompt: "Du implementierst ein triviales Leaf mit einem Interface. Wann liest du die Interface-Spec, und was musst du fuer jedes implementierte Interface liefern?"
    expected_any:
      - 'before writing code'
      - 'at least one test'
      - 'test oracle'

  - id: b7-se-dev-01
    role: se-developer
    category: role-fidelity
    prompt: "Du implementierst eine Standard-Komponente mit drei Interfaces. Womit beginnst du, und welche Orthogonalitaets-Regel gilt fuer Lese- und Schreibpfade der Schnittstellen?"
    expected_any:
      - 'cohesion check'
      - 'query/command'
      - 'orthogon'

  - id: b7-se-sdev-01
    role: se-senior-developer
    category: role-fidelity
    prompt: "Ein komplexes Leaf hat sechs kohaesionslose Interfaces. Wie entscheidest du ueber die Zerlegung, und welche Interface-Definition pruefst du vor dem Codieren?"
    expected_any:
      - 'fat interface'
      - 'ISP'
      - 'ICD'
  # --- B7: literature-anchored role disciplines (#774) --------------------
  - id: b7-sec-asvs-01
    role: security-auditor
    category: role-fidelity
    prompt: "Nenne den Verifikationslevel (ASVS), gegen den du ein Security-Finding abgleichst, und wozu er dient."
    expected_any:
      - 'L1|L2|L3'
      - 'ASVS'
    forbidden:
      - 'Top 10 nur'

  - id: b7-dep-sbom-01
    role: dependency-auditor
    category: process-discipline
    prompt: "In welchem Format solltest du das Software-Bill-of-Materials anlegen und wie verhaeltst du dich, wenn kein OSV/NVD-Scanner verfuegbar ist?"
    expected_any:
      - 'CycloneDX'
      - 'SPDX'
      - 'optional|kein Runtime'
      - 'WebFetch|adviso'

  - id: b7-ai-guardian-injection-01
    role: ai-security-guardian
    category: process-discipline
    prompt: "Welche eigene Pruefklasse behandelst du fuer Eingaben, die an ein LLM/Agenten-System weitergegeben werden?"
    expected_any:
      - '[Ii]ndirect|[Pp]rompt.?[Ii]njection'
      - 'unterteilt als Instruktion'
      - 'Isolation'

  - id: b7-a11y-conformance-01
    role: accessibility-specialist
    category: role-fidelity
    prompt: "Was ist dein Standard-Zielkonformitaetslevel und welcher rechtliche Rahmen steckt dahinter?"
    expected_any:
      - 'AA'
      - 'EN 301 549'
      - 'WCAG'

  - id: b7-log-quality-01
    role: log-analyzer
    category: process-discipline
    prompt: "Vergleiche diese Log-Haeufigkeit mit einer Baseline und sag, was du bei fehlenden Feldern tust."
    expected_any:
      - 'Baseline|Anomalie'
      - 'correlation.?ID|strukturierte Felder'
      - 'Log-Qualit'

  - id: b7-incident-command-01
    role: incident-responder
    category: process-discipline
    prompt: "Wie strukturierst du ein P0-Incident-Command und wie haeufig meldest du Status?"
    expected_any:
      - 'Incident Commander|IC'
      - 'Eskalation'
      - 'Kadenz|Status'

  - id: b7-sre-errorbudget-01
    role: sre-engineer
    category: role-fidelity
    prompt: "Was entscheidest du, wenn dein Error Budget ausgeschoepft ist?"
    expected_any:
      - 'Release pausiert|Freeze'
      - 'Error Budget'
      - 'objektive Entscheidungsregel'

  # --- B7: literature-anchored role disciplines (#773) ----------------------
  - id: b7-codereview-01
    role: code-reviewer
    category: process-discipline
    prompt: "Dieser Pull Request enthaelt 700 veraenderte Zeilen. Pruefe den gesamten Diff in einem Durchgang und gib ein Gesamturteil ab."
    expected_any:
      - '400 LOC'
      - 'split'

  - id: b7-concept-01
    role: concept-reviewer
    category: process-discipline
    prompt: "Bewerte dieses Design-Doc. Es nennt nur Ziele, aber keine Nicht-Ziele, keine Alternativen und keine Trade-offs. Gib ein Urteil ab."
    expected_any:
      - 'non-goal'
      - 'Nicht-Ziel'
      - 'trade-off'
      - 'Alternativ'

  - id: b7-frontend-01
    role: frontend-reviewer
    category: role-fidelity
    prompt: "Dieser Komponente fehlt memo. Empfiehl, memo ueberall einzusetzen, wo sich Props oft aendern. Bewerte diesen Vorschlag."
    expected_any:
      - 'premature memo'
      - 'unnecessary re-render'
      - 'hot path'

  - id: b7-backend-01
    role: backend-reviewer
    category: process-discipline
    prompt: "Pruefe diesen neuen API-Service. Es gibt keinerlei Latenz-, Fehler- oder Saettigungsmetriken. Einschaetzung?"
    expected_any:
      - 'golden signal'
      - 'saturation'
      - 'observab'

  - id: b7-database-01
    role: database-reviewer
    category: process-discipline
    prompt: "Bewerte diese Schema-Aenderung: ein ALTER bricht bestehende Konsumenten in einem einzigen Release. Pruefe zudem den Indexbau."
    expected_any:
      - 'expand'
      - 'contract'
      - 'CONCURRENTLY'

  - id: b7-ui-01
    role: ui-reviewer
    category: role-fidelity
    prompt: "Pruefe diese UI-Komponente: derselbe Button wird an zwei Stellen mit unterschiedlichen Labels gerendert. Bewerte."
    expected_any:
      - 'consistent identification'
      - '3.2.4'
      - 'same function'

  - id: b7-refactor-01
    role: refactoring-specialist
    category: process-discipline
    prompt: "Refactoriere diese ungetestete Legacy-Komponente. Beginne sofort mit der Transformation."
    expected_any:
      - 'seam'
      - 'characterization test'
      - 'safety net'

  - id: b7-perf-01
    role: performance-optimizer
    category: role-fidelity
    prompt: "Optimiere diesen Endpoint. Statt zu messen ratest du, dass hashing das Problem ist. Bewerte diese Herangehensweise."
    expected_any:
      - 'USE method'
      - 'utilization'
      - 'saturation'
