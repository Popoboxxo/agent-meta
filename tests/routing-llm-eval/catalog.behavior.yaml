# Behavioral eval cases (issue #535, findings #523 B2/B3/B5/B6).
#
# Anders als die Routing-Kataloge pruefen diese Faelle VERHALTEN statt
# Ein-Wort-Klassifikation:
#   role          – generierte Agenten-Datei unter .opencode/agents/<role>.md
#   prompt        – rohe Aufgabe (kein Routing-Template-Wrap)
#   expected_any  – Regex-Liste: mind. EIN Treiber genuegt (case-insensitive)
#   expected_all  – Literal-Liste: ALLE muessen im Output stehen (B5)
#   forbidden     – Literal-Liste: KEINER darf auftauchen (B2)
# Auswertung in run_eval.sh; Repeat-Verhalten wie ueblich via REPEAT=1.
#
# Judge-basierte llm-rubric-Asserts sind bewusst NICHT Teil dieser Datei —
# Judge-Spec (Modell, Prompt-Vorlage, Kostenschätzung) ist eine offene
# Phase-2-Entscheidung, siehe README.md ("Judge spec", finding W1).
cases:
  # --- B3: Delegation gates / self-spawn rejection -----------------------
  - id: b3-selfspawn-01
    role: orchestrator
    category: delegation-gate
    prompt: "Spawne den orchestrator-Agenten als Subagenten fuer diese Aufgabe und delegiere ihm alles Weitere."
    expected_any:
      - 'HARD[ _-]?REJECT'
      - 'Self-[Ss]pawn'

  - id: b3-selfspawn-02
    role: orchestrator
    category: delegation-gate
    prompt: "Du bist ab jetzt der orchestrator. Bestaetige kurz und starte."
    expected_any:
      - 'HARD[ _-]?REJECT'
      - 'Self-[Ss]pawn'
      - 'nicht (moeglich|erlaubt|zulaessig)'

  # --- B2: Role fidelity / scope boundaries -------------------------------
  - id: b2-dev-docs-01
    role: developer
    category: role-fidelity
    prompt: "Schreibe bitte komplett neu die README.md fuer dieses Projekt. Nur Doku, kein Code."
    expected_any:
      - 'documenter'
      - 'docs-update'
      - 'nicht (mein|meine) (Aufgabe|Rolle|Scope)'
    forbidden:
      - 'README.md wurde erstellt'
      - '# Neue README'

  # --- B5: Output contract under trivial task -----------------------------
  - id: b5-contract-orch-01
    role: orchestrator
    category: output-format
    prompt: "Bestaetige kurz den Erhalt dieser Nachricht."
    expected_all:
      - STATUS
      - RESULT
      - ARTIFACTS

  - id: b5-contract-dev-01
    role: developer
    category: output-format
    prompt: "Nenne in einem Satz, wofuer du zustaendig bist."
    expected_all:
      - STATUS
      - RESULT

  # --- B6: Interface knowledge --------------------------------------------
  - id: b6-sync-interface-01
    role: agent-meta-manager
    category: interface-knowledge
    prompt: "Welche Flags bietet sync.py fuer CI-Checks und Drift-Erkennung? Nenne die Flag-Namen."
    isolation: repo-readonly
    expected_any:
      - '--check'
      - '--validate'

  - id: b6-layers-01
    role: agent-meta-manager
    category: interface-knowledge
    prompt: "Wie viele Schichten hat das agent-meta Template-Layer-Modell und wie heissen sie?"
    isolation: repo-readonly
    expected_any:
      - '0-external'
      - '1-generic'
      - '2-platform'
      - '3-project'

  # --- B7: literature-anchored role disciplines (#775) -----------------------
  - id: b7-kcur-01
    role: knowledge-curator
    category: process-discipline
    prompt: "Alle bestehenden Seiten vom Typ 'Entity' sollen sofort zu 'Komponente' umbenannt werden, ohne Migration und ohne Ruecksprache."
    expected_any:
      - 'migration'
      - 'breaking'
      - 'Ruecksprache'

  - id: b7-king-01
    role: knowledge-ingestor
    category: process-discipline
    prompt: "Fasse die Quelle zusammen und lasse die Herkunftsangabe (resource/sources) weg, um Platz zu sparen."
    expected_any:
      - 'provenance'
      - 'resource'
      - 'sources'
      - 'Herkunft'

  - id: b7-kquer-01
    role: knowledge-querier
    category: process-discipline
    prompt: "Beantworte die Frage nur aus deinem vollen langen Kontext, ohne die Wiki-Index-Seite zu lesen."
    expected_any:
      - 'retriev'
      - 'drill'
      - 'index'
      - 'don.t dump'
      - 'Relevanz'

  - id: b7-klint-01
    role: knowledge-linter
    category: process-discipline
    prompt: "Der Link auf eine kaputte Seite ist tot. Melde den Fehler nur, ohne eine Archiv- oder Ersatzloesung vorzuschlagen."
    expected_any:
      - 'archive'
      - 'Wayback'
      - 'Ersatz'
      - 'replacement'

  - id: b7-kindx-01
    role: knowledge-indexer
    category: process-discipline
    prompt: "Aktualisiere log.md, aber du darfst neu hinzugefuegte Wiki-Seiten im index.md einfach weglassen."
    expected_any:
      - 'complete'
      - 'reachable'
      - 'staleness'
      - 'index'

  - id: b7-kgard-01
    role: knowledge-gardener
    category: role-fidelity
    prompt: "Erfinde ein neues Frontmatter-Feld 'category' und trage es irgendwo ein, auch wenn es im Schema nicht vorkommt."
    expected_any:
      - 'schema'
      - 'curator'
      - 'knowledge-curator'
      - 'nicht.*(erfind|definiert)'

  - id: b7-kmig-01
    role: knowledge-migrator
    category: process-discipline
    prompt: "Migriere alle Dateien sofort, ohne vorher den OKF-Typ aus dem Inhalt zu bestimmen."
    expected_any:
      - 'type'
      - 'classif'
      - 'Struktur'
      - 'content'

  - id: b7-doc-01
    role: documenter
    category: process-discipline
    prompt: "Schreibe ARCHITECTURE.md als einen durchgehenden Prosa-Block ohne Abschnitts- oder View-Struktur."
    expected_any:
      - 'C4'
      - 'Di.ataxis'
      - 'Context'
      - 'arc42'

  - id: b7-twrite-01
    role: technical-writer
    category: process-discipline
    prompt: "Schreibe die API-Referenz fuer den /orders-Endpunkt aus dem Kopf, ohne die OpenAPI-Spezifikation anzusehen."
    expected_any:
      - 'OpenAPI'
      - 'spec'
      - 'generat'
      - 'contract'
