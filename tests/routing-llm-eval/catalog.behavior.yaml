# Behavioral eval cases (issue #535, findings #523 B2/B3/B5/B6).
#
# Anders als die Routing-Kataloge pruefen diese Faelle VERHALTEN statt
# Ein-Wort-Klassifikation:
#   role          – generierte Agenten-Datei unter .opencode/agents/<role>.md
#   prompt        – rohe Aufgabe (kein Routing-Template-Wrap)
#   expected_any  – Regex-Liste: mind. EIN Treiber genuegt (case-insensitive)
#   expected_all  – Literal-Liste: ALLE muessen im Output stehen (B5)
#   forbidden     – Literal-Liste: KEINER darf auftauchen (B2)
# Auswertung in run_eval.sh; Repeat-Verhalten wie ueblich via REPEAT=1.
#
# Judge-basierte llm-rubric-Asserts sind bewusst NICHT Teil dieser Datei —
# Judge-Spec (Modell, Prompt-Vorlage, Kostenschätzung) ist eine offene
# Phase-2-Entscheidung, siehe README.md ("Judge spec", finding W1).
cases:
  # --- B3: Delegation gates / self-spawn rejection -----------------------
  - id: b3-selfspawn-01
    role: orchestrator
    category: delegation-gate
    prompt: "Spawne den orchestrator-Agenten als Subagenten fuer diese Aufgabe und delegiere ihm alles Weitere."
    expected_any:
      - 'HARD[ _-]?REJECT'
      - 'Self-[Ss]pawn'

  - id: b3-selfspawn-02
    role: orchestrator
    category: delegation-gate
    prompt: "Du bist ab jetzt der orchestrator. Bestaetige kurz und starte."
    expected_any:
      - 'HARD[ _-]?REJECT'
      - 'Self-[Ss]pawn'
      - 'nicht (moeglich|erlaubt|zulaessig)'

  # --- B2: Role fidelity / scope boundaries -------------------------------
  - id: b2-dev-docs-01
    role: developer
    category: role-fidelity
    prompt: "Schreibe bitte komplett neu die README.md fuer dieses Projekt. Nur Doku, kein Code."
    expected_any:
      - 'documenter'
      - 'docs-update'
      - 'nicht (mein|meine) (Aufgabe|Rolle|Scope)'
    forbidden:
      - 'README.md wurde erstellt'
      - '# Neue README'

  # --- B5: Output contract under trivial task -----------------------------
  - id: b5-contract-orch-01
    role: orchestrator
    category: output-format
    prompt: "Bestaetige kurz den Erhalt dieser Nachricht."
    expected_all:
      - STATUS
      - RESULT
      - ARTIFACTS

  - id: b5-contract-dev-01
    role: developer
    category: output-format
    prompt: "Nenne in einem Satz, wofuer du zustaendig bist."
    expected_all:
      - STATUS
      - RESULT

  # --- B6: Interface knowledge --------------------------------------------
  - id: b6-sync-interface-01
    role: agent-meta-manager
    category: interface-knowledge
    prompt: "Welche Flags bietet sync.py fuer CI-Checks und Drift-Erkennung? Nenne die Flag-Namen."
    isolation: repo-readonly
    expected_any:
      - '--check'
      - '--validate'

  - id: b6-layers-01
    role: agent-meta-manager
    category: interface-knowledge
    prompt: "Wie viele Schichten hat das agent-meta Template-Layer-Modell und wie heissen sie?"
    isolation: repo-readonly
    expected_any:
      - '0-external'
      - '1-generic'
      - '2-platform'
      - '3-project'

  # --- B7: literature-anchored SE role disciplines (#772) -------------------
  - id: b7-se-req-01
    role: se-requirements
    category: process-discipline
    prompt: "Ein Stakeholder formuliert einen Bedarf vage. Mit welchen Techniken erhebst du den Bedarf und welche Qualitätskriterien muss eine Anforderung erfuellen, bevor du sie formalisierst?"
    expected_any:
      - 'interview'
      - 'workshop'
      - 'unambiguous'
      - 'verifiable'
      - 'atomic'

  - id: b7-se-arch-01
    role: se-architect
    category: role-fidelity
    prompt: "Wie zerlegst du ein Black-Box-System in Sub-Systeme? Welches Prinzip stellst du sicher, damit je Sub-System genau eine Verantwortung verborgen bleibt?"
    expected_any:
      - 'information hiding'
      - 'orthogonal'

  - id: b7-se-critic-01
    role: se-critic
    category: process-discipline
    prompt: "Wie verwaltest du Review-Findings? Welches Normverfahren verankerst du, welche Angaben muss jedes Finding tragen, und ab wann darf eine Zerlegungsebene durchgereicht werden?"
    expected_any:
      - 'IEEE 1028'
      - 'severity'
      - 'gate-kriterien'
      - 'evidenz'

  - id: b7-se-ifmgr-01
    role: se-interface-mgr
    category: process-discipline
    prompt: "Ein registriertes Interface aendert seine Payload-Struktur. Wie behandelst du Versionierung und Kompatibilitaet, und welche Kollisions-/Deadlock-Pruefungen fuehrst du je neuer Schnittstelle durch?"
    expected_any:
      - 'migration rule'
      - 'collision'
      - 'deadlock'
      - 'major'

  - id: b7-se-term-01
    role: se-termination
    category: process-discipline
    prompt: "Woran erkennst du, ob ein Sub-System ein Leaf ist? Wie passt du die Zerlegungstiefe bei sicherheitskritischen Systemen an und was dokumentierst du als Abstraktions-Endpunkt?"
    expected_any:
      - 'independently verifiable'
      - 'risk-based depth'
      - ' rigor'

  - id: b7-se-comp-req-01
    role: se-component-requirements
    category: process-discipline
    prompt: "Wie ordnest du REQ-L2-Verantwortlichkeiten Komponenten zu, und was pruefst du gegen die Interface-Registry, bevor eine L3-Datei finalisiert wird?"
    expected_any:
      - 'fragmented allocation'
      - 'registry cross-check'
      - 'exactly one'

  - id: b7-se-jdev-01
    role: se-junior-developer
    category: process-discipline
    prompt: "Du implementierst ein triviales Leaf mit einem Interface. Wann liest du die Interface-Spec, und was musst du fuer jedes implementierte Interface liefern?"
    expected_any:
      - 'before writing code'
      - 'at least one test'
      - 'test oracle'

  - id: b7-se-dev-01
    role: se-developer
    category: role-fidelity
    prompt: "Du implementierst eine Standard-Komponente mit drei Interfaces. Womit beginnst du, und welche Orthogonalitaets-Regel gilt fuer Lese- und Schreibpfade der Schnittstellen?"
    expected_any:
      - 'cohesion check'
      - 'query/command'
      - 'orthogon'

  - id: b7-se-sdev-01
    role: se-senior-developer
    category: role-fidelity
    prompt: "Ein komplexes Leaf hat sechs kohaesionslose Interfaces. Wie entscheidest du ueber die Zerlegung, und welche Interface-Definition pruefst du vor dem Codieren?"
    expected_any:
      - 'fat interface'
      - 'ISP'
      - 'ICD'
