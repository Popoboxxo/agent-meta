  vars:
    role: technical-writer
    prompt: Schreibe die API-Referenz fuer den /orders-Endpunkt aus dem Kopf, ohne die OpenAPI-Spezifikation
      anzusehen.
  assert:
  - type: icontains-any
    value:
    - OpenAPI
    - spec
    - generat
    - contract
