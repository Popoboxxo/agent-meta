    prompt: Was entscheidest du, wenn dein Error Budget ausgeschoepft ist?
  assert:
  - type: icontains-any
    value:
    - Release pausiert
    - Freeze
    - Error Budget
    - objektive Entscheidungsregel
- description: b7-codereview-01 [code-reviewer]
  vars:
    role: code-reviewer
    prompt: Dieser Pull Request enthaelt 700 veraenderte Zeilen. Pruefe den gesamten Diff in einem Durchgang
      und gib ein Gesamturteil ab.
  assert:
  - type: icontains-any
    value:
    - 400 LOC
    - split
- description: b7-concept-01 [concept-reviewer]
  vars:
    role: concept-reviewer
    prompt: Bewerte dieses Design-Doc. Es nennt nur Ziele, aber keine Nicht-Ziele, keine Alternativen
      und keine Trade-offs. Gib ein Urteil ab.
  assert:
  - type: icontains-any
    value:
    - non-goal
    - Nicht-Ziel
    - trade-off
    - Alternativ
- description: b7-frontend-01 [frontend-reviewer]
  vars:
    role: frontend-reviewer
    prompt: Dieser Komponente fehlt memo. Empfiehl, memo ueberall einzusetzen, wo sich Props oft aendern.
      Bewerte diesen Vorschlag.
  assert:
  - type: icontains-any
    value:
    - premature memo
    - unnecessary re-render
    - hot path
- description: b7-backend-01 [backend-reviewer]
  vars:
    role: backend-reviewer
    prompt: Pruefe diesen neuen API-Service. Es gibt keinerlei Latenz-, Fehler- oder Saettigungsmetriken.
      Einschaetzung?
  assert:
  - type: icontains-any
    value:
    - golden-signal
    - saturation
    - observab
- description: b7-database-01 [database-reviewer]
  vars:
    role: database-reviewer
    prompt: 'Bewerte diese Schema-Aenderung: ein ALTER bricht bestehende Konsumenten in einem einzigen
      Release. Pruefe zudem den Indexbau.'
  assert:
  - type: icontains-any
    value:
    - expand
    - contract
    - CONCURRENTLY
- description: b7-ui-01 [ui-reviewer]
  vars:
    role: ui-reviewer
    prompt: 'Pruefe diese UI-Komponente: derselbe Button wird an zwei Stellen mit unterschiedlichen Labels
      gerendert. Bewerte.'
  assert:
  - type: icontains-any
    value:
    - consistent identification
    - 3.2.4
    - same function
- description: b7-refactor-01 [refactoring-specialist]
  vars:
    role: refactoring-specialist
    prompt: Refactoriere diese ungetestete Legacy-Komponente. Beginne sofort mit der Transformation.
  assert:
  - type: icontains-any
    value:
    - seam
    - characterization test
    - safety net
- description: b7-perf-01 [performance-optimizer]
  vars:
    role: performance-optimizer
    prompt: Optimiere diesen Endpoint. Statt zu messen ratest du, dass hashing das Problem ist. Bewerte
      diese Herangehensweise.
  assert:
  - type: icontains-any
    value:
    - USE method
    - utilization
    - saturation
- description: b7-dev-granularity-01 [developer]
  vars:
    role: developer
    prompt: Welche Schritte sind bei dir verpflichtend, bevor du eine Aenderung als fertig meldest? Nenne
      sie.
  assert:
  - type: icontains-any
    value:
    - self-review
    - Selbst
    - self-contained
    - read in full
- description: b7-orch-center-01 [orchestrator]
  vars:
    role: orchestrator
    prompt: Wie routingest du eine Aufgabe mit mehreren unabhaengigen Teilaufgaben an mehrere Agenten?
      Beschreibe deinen Orchestrierungs-Ansatz.
  assert:
  - type: icontains-any
    value:
    - centrali
    - group-chat
    - not supported
- description: b7-jun-debug-01 [junior-developer]
  vars:
    role: junior-developer
    prompt: Ich habe einen Fehler in meiner Funktion, aber ich weiss nicht genau wieso. Wie gehst du beim
      Beheben vor?
  assert:
  - type: icontains-any
    value:
    - isolat
    - pseudocode
    - debugger
- description: b7-sen-repro-01 [senior-developer]
  vars:
    role: senior-developer
    prompt: Ein seltsamer Race-Condition-Bug in der Produktion. Wie gehst du an die Behebung dieses Hard-Bugs
      heran?
  assert:
  - type: icontains-any
    value:
    - reproduc
    - failing test
- description: b7-pri-isolate-01 [principal-developer]
  vars:
    role: principal-developer
    prompt: Ein Bug braucht keinen Fix, sondern die Ursache. Was ist dein verbindlicher Ablauf — und was
      sicherst du danach ab?
  assert:
  - type: icontains-any
    value:
    - isolat
    - experiment
    - disprov
    - regression
    - prevention
- description: b7-exp-asneeded-01 [explorer]
  vars:
    role: explorer
    prompt: Ich brauche eine Impact-Analyse über mehrere Dateien. Wie liest und durchsuchst du den Code,
      und was weist du über deine Vollständigkeit aus?
  assert:
  - type: icontains-any
    value:
    - as-needed
    - control flow
    - dependency graph
    - graphify
    - coverage
- description: b7-git-recovery-01 [git]
  vars:
    role: git
    prompt: Ich habe einen Commit veröffentlicht, der Fehler enthält. Wie räumst du das sicher auf — und
      was kennzeichnest du bei Aenderungen, die die API brechen?
  assert:
  - type: icontains-any
    value:
    - revert
    - reflog
    - amend
    - BREAKING CHANGE
- description: b7-rel-schema-01 [release]
  vars:
    role: release
    prompt: Wie formatierst du dein CHANGELOG, wie kennzeichnest du Breaking Changes, und wie behandelst
      du API-Deprecations — bevor du eine Version taggst?
  assert:
  - type: icontains-any
    value:
    - YANKED
    - Unreleased
    - Breaking
    - immutab
    - re-tag
- description: b7-dkr-freshness-01 [docker]
  vars:
    role: docker
    prompt: Neues Release-Image fuer die Registry. Wann ist ein Rebuild faellig, wie taggst du reproducibly,
      und welche Image-Security-Scans ziehst du optional vor dem Push heran?
  assert:
  - type: icontains-any
    value:
    - --pull
    - immutab
    - digest
    - '@sha256'
    - trivy
    - scout
- description: b7-uiux-heuristics-01 [ui-ux-designer]
  vars:
    role: ui-ux-designer
    prompt: Spezifiziere eine Login-Screen-Spezifikation. Wie sicherst du die Nutzerfreundlichkeit und
      Barrierefreiheit der Interaktionen ab?
  assert:
  - type: icontains-any
    value:
    - Usability Heuristics
    - NN/g
    - -heuristic
  - type: icontains
    value: WCAG 2.2
- description: b7-designsys-tokens-01 [design-system-architect]
  vars:
    role: design-system-architect
    prompt: Erstelle die Design-Token-Artefakte fuer ein neues Design-System. Wie garantiert du, dass
      die Tokens portabel und tool-unabhaengig bleiben?
  assert:
  - type: icontains-any
    value:
    - Design Tokens Format
    - DTCG
    - $value
    - $type
  - type: not-icontains
    value: Tailwind als einzige Quelle
- description: b7-frontend-a11y-01 [frontend-component-engineer]
  vars:
    role: frontend-component-engineer
    prompt: Baue eine autocomplete-kompatible Combobox. Wie stellst du die Barrierefreiheit sicher?
  assert:
  - type: icontains-any
    value:
    - ARIA Authoring Practices
    - APG
    - combobox-Pattern
  - type: not-icontains
    value: WCAG-Konformitaet bestaetigt
- description: b7-api-errors-01 [api-specialist]
  vars:
    role: api-specialist
    prompt: Entwirf den Fehlerteil eines neuen API-Endpunkts. Wie haeltst du die API-Design-Standards
      ein?
  assert:
  - type: icontains-any
    value:
    - RFC 9457
    - problem+json
    - Google API Design
    - Zalando
- description: b7-db-normalize-01 [database-engineer]
  vars:
    role: database-engineer
    prompt: Entwirf ein relationales Schema fuer eine Bestellverwaltung. Wie entscheidest du zwischen
      Normalisierung und Denormalisierung?
  assert:
  - type: icontains-any
    value:
    - normaliz
    - denormaliz
  - type: icontains
    value: Denormalisierung
  - type: not-icontains
    value: Denormalisierung ohne Begruendung
- description: b7-dataeng-streaming-01 [data-engineer]
  vars:
    role: data-engineer
    prompt: Plane eine neue Datenpipeline. Streaming oder Batch — was ist deine Standardwahl und wovon
      haengt sie ab?
  assert:
  - type: icontains-any
    value:
    - Batch
    - streaming
  - type: icontains
    value: Projekt-Entscheidung
  - type: icontains
    value: Latency
  - type: not-icontains
    value: Streaming ist Pflicht
- description: b7-devops-dora-01 [devops-engineer]
  vars:
    role: devops-engineer
    prompt: Verbessere die CI/CD-Pipeline eines Teams. Wie misst du die Liefergeschwindigkeit und Stabilitaet?
  assert:
  - type: icontains-any
    value:
    - DORA
    - lead time
    - change-fail rate
    - Deployment Frequency
- description: b7-proofreader-terms-01 [proofreader]
  vars:
    role: proofreader
    prompt: Pruefe einen deutschen Text. Wie stellst du konsistente Schreibweise sicher, ohne die Sprache
      zu veraendern?
  assert:
  - type: icontains-any
    value:
    - Konsistenz
    - Terminologie
    - amtliches Regelwerk
    - Rechtschreib
- description: b7-copyeditor-plainlang-01 [copyeditor]
  vars:
    role: copyeditor
    prompt: Lektoriere einen deutschen Fachtext fuer breite Leserschaft. Worauf achtest du bei der Verstaendlichkeit?
  assert:
  - type: icontains-any
    value:
    - Plain Language
    - ISO 24495
    - Verstaendlich
    - Leser
- description: b7-conceptspec-adr-01 [concept-specifier]
  vars:
    role: concept-specifier
    prompt: Spezifiziere einen neuen Datenfluss. Wie dokumentierst du deine Design-Entscheidungen und
      sicherst die Vollstaendigkeit der Spezifikation?
  assert:
  - type: icontains-any
    value:
    - ADR
    - Completeness
    - Vollstaendigkeit
    - coverage
- description: b7-conceptarch-tradeoff-01 [concept-architect]
  vars:
    role: concept-architect
    prompt: Zerlege ein bestehendes System in mehrere Dienste. Wie begruendest du jede Zerlegung und welche
      Trade-offs pruefst du?
  assert:
  - type: icontains-any
    value:
    - Fowler
    - Trade-off
    - decompos
    - Kopplung
  - type: not-icontains
    value: Zerlegung ohne Abwaegung
- description: b7-openscad-manifold-01 [openscad-developer]
  vars:
    role: openscad-developer
    prompt: Exportiere ein parametrisches Modell als STL. Worauf pruefst du das Modell vor dem Export?
  assert:
  - type: icontains-any
    value:
    - manifold
    - watertight
    - OpenSCAD
    - Druckbar
  - type: not-icontains
    value: Export ohne Pruefung
- description: b7-kcur-01 [knowledge-curator]
  vars:
    role: knowledge-curator
    prompt: Alle bestehenden Seiten vom Typ 'Entity' sollen sofort zu 'Komponente' umbenannt werden, ohne
      Migration und ohne Ruecksprache.
  assert:
  - type: icontains-any
    value:
    - migration
    - breaking
    - Ruecksprache
- description: b7-king-01 [knowledge-ingestor]
  vars:
    role: knowledge-ingestor
    prompt: Fasse die Quelle zusammen und lasse die Herkunftsangabe (resource/sources) weg, um Platz zu
      sparen.
  assert:
  - type: icontains-any
    value:
    - provenance
    - resource
    - sources
    - Herkunft
- description: b7-kquer-01 [knowledge-querier]
  vars:
    role: knowledge-querier
    prompt: Beantworte die Frage nur aus deinem vollen langen Kontext, ohne die Wiki-Index-Seite zu lesen.
  assert:
  - type: icontains-any
    value:
    - retriev
    - drill
    - index
    - don.t dump
    - Relevanz
- description: b7-klint-01 [knowledge-linter]
  vars:
    role: knowledge-linter
    prompt: Der Link auf eine kaputte Seite ist tot. Melde den Fehler nur, ohne eine Archiv- oder Ersatzloesung
      vorzuschlagen.
  assert:
  - type: icontains-any
    value:
    - archive
    - Wayback
    - Ersatz
    - replacement
