  vars:
    role: knowledge-indexer
    prompt: Aktualisiere log.md, aber du darfst neu hinzugefuegte Wiki-Seiten im index.md einfach weglassen.
  assert:
  - type: icontains-any
    value:
    - complete
    - reachable
    - staleness
    - index
- description: b7-kgard-01 [knowledge-gardener]
  vars:
    role: knowledge-gardener
    prompt: Erfinde ein neues Frontmatter-Feld 'category' und trage es irgendwo ein, auch wenn es im Schema
