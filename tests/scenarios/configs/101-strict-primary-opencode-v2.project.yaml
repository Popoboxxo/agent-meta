agent-meta-version: 0.101.0
ai-providers:
- Opencode
dod-preset: rapid-prototyping
platforms: []
roles:
- orchestrator
- developer
# Position POS-3 (issue #1190, §3.8.1/§3.8.2): `strict` + declared
# `orchestrator.topology: primary` is the only position with `mode: primary`,
# `default_agent: orchestrator` and the surface deny (two `permissions[]`
# triples on v2). Regression coverage for the entry-point path.
orchestrator:
  mode: strict
  topology: primary
plugins:
  playwright:
    enabled: true
# v2 project channel (same allow-listed key as 69-opencode-v2-surface).
provider-options:
  Opencode:
    surface-version: v2
project:
  name: scenario-strict-primary-opencode-v2
  prefix: s101
  short: strict-primary-v2
variables:
  PROJECT_NAME: scenario-strict-primary-opencode-v2
  PROJECT_DESCRIPTION: Opencode v2 with strict mode and declared topology primary (position POS-3).
  PROJECT_GOAL: Verify POS-3 writes default_agent orchestrator, emits mode primary and the two permissions deny triples.
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/example/scenario-strict-primary-opencode-v2
  GIT_MAIN_BRANCH: main
rules-preset: default
speech-mode: full
tier-preset: Normal
se-focus: false
max-parallel-agents: 2
conventions-preset: default
debug-mode: false
allow-committed-secrets: false
