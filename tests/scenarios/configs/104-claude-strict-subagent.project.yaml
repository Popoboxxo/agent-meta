agent-meta-version: 0.101.0
ai-providers:
- Claude
dod-preset: rapid-prototyping
platforms: []
roles:
- orchestrator
- developer
# Position POS-2 on Claude (issue #1190, §12.4): `strict` + declared
# `orchestrator.topology: subagent`. Claude has no `mode: primary` concept and
# no entry-point surface, so the gate must be enforced by the `hook` tier — the
# rendered `use-orchestrator` rule carries the enforced strict gate text.
orchestrator:
  mode: strict
  topology: subagent
project:
  name: scenario-claude-strict-subagent
  prefix: s104
  short: claude-strict-sub
variables:
  PROJECT_NAME: scenario-claude-strict-subagent
  PROJECT_DESCRIPTION: Claude with strict mode and declared topology subagent (position POS-2, hook tier).
  PROJECT_GOAL: Verify POS-2 on Claude emits no orchestrator entry point, the hook-tier gate text and no orphan placeholders.
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/example/scenario-claude-strict-subagent
  GIT_MAIN_BRANCH: main
  # `PIPELINE_DETAIL_BLOCKS` is normally inlined by the pipeline aggregator. This
  # two-role project drops every pipeline (missing pipeline roles), so the marker
  # in agents/1-generic/orchestrator.md would survive as an orphan placeholder
  # (pre-existing D3(a) grace, unrelated to topology). Pin it to an empty block so
  # the scenario can assert the AC-29 promise "no orphan placeholders" literally.
  PIPELINE_DETAIL_BLOCKS: ""
rules-preset: default
speech-mode: full
tier-preset: Normal
se-focus: false
max-parallel-agents: 2
conventions-preset: default
debug-mode: false
allow-committed-secrets: false
