agent-meta-version: 0.101.0
ai-providers:
- Claude
dod-preset: standard
platforms: []
roles:
- orchestrator
- developer
- git
orchestrator:
  mode: strict
project:
  name: scenario-orchestrator-strict
  prefix: s15
  short: scenario-orch-strict
variables:
  PROJECT_NAME: scenario-orchestrator-strict
  PROJECT_DESCRIPTION: Orchestrator STRICT mode (dedicated orchestrator subagent, mandatory, no user override).
  PROJECT_GOAL: Verify a dedicated orchestrator.md subagent is generated and rules/use-orchestrator.md reflects strict-mode gating.
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/example/scenario-orch-strict
  GIT_MAIN_BRANCH: main
rules-preset: default
speech-mode: full
tier-preset: Normal
se-focus: false
max-parallel-agents: 2
conventions-preset: default
debug-mode: false
allow-committed-secrets: false
