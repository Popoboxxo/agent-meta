agent-meta-version: 0.101.0
ai-providers:
- Codex
dod-preset: rapid-prototyping
platforms: []
roles:
- orchestrator
- developer
- git
project:
  name: scenario-codex-toml-validity
  prefix: s64
  short: codex-toml-validity
variables:
  PROJECT_NAME: scenario-codex-toml-validity
  PROJECT_DESCRIPTION: Every generated Codex agent TOML parses with tomllib; the singleton constraint survives serialization.
  PROJECT_GOAL: Guard AC-1 — Codex TOML validity and singleton text inside developer_instructions.
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/example/scenario-codex-toml-validity
  GIT_MAIN_BRANCH: main
rules-preset: default
speech-mode: full
tier-preset: Normal
se-focus: false
max-parallel-agents: 2
conventions-preset: default
debug-mode: true
viz:
  enabled: true
  mode: full
critical-rules-footer:
  enabled: true
pathRules:
- path: '*.py'
  rule: dod-criteria
xml-section-wrapping:
  enabled: true
allow-committed-secrets: false
