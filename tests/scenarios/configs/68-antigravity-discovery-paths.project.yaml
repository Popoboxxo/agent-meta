agent-meta-version: 0.101.0
ai-providers:
- Gemini
dod-preset: rapid-prototyping
platforms: []
roles:
- orchestrator
- developer
# OQ-1/AC-9 opt-in gate. NOTE: the shipped default in config/ai-providers.yaml is
# `agent-discovery: false`; the flag is currently registry-level data only — no
# project.yaml key consumes it (see asserts/68-*.sh for the gating proof).
agent-discovery: true
project:
  name: scenario-antigravity-discovery-paths
  prefix: s68
  short: antigravity-discovery-paths
variables:
  PROJECT_NAME: scenario-antigravity-discovery-paths
  PROJECT_DESCRIPTION: Antigravity .agents/* discovery surface behind the agent-discovery flag.
  PROJECT_GOAL: Verify the .agents/agents|rules|skills surface plus .agents/mcp_config.json serverUrl when the flag is on.
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/example/scenario-antigravity-discovery-paths
  GIT_MAIN_BRANCH: main
rules-preset: default
speech-mode: full
tier-preset: Normal
se-focus: false
max-parallel-agents: 2
conventions-preset: default
debug-mode: false
allow-committed-secrets: false
