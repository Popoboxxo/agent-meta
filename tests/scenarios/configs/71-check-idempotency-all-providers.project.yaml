agent-meta-version: 0.101.0
ai-providers:
- Claude
- Gemini
- Opencode
- Continue
- Copilot
- Mammouth
- Codex
- ZCode
- KimiCode
dod-preset: rapid-prototyping
platforms: []
roles:
- orchestrator
- developer
- git
project:
  name: scenario-check-idempotency-all-providers
  prefix: s71
  short: check-idempotency-all-providers
variables:
  PROJECT_NAME: scenario-check-idempotency-all-providers
  PROJECT_DESCRIPTION: Idempotency of a full 9-provider sync.
  PROJECT_GOAL: Verify the generated tree is byte-identical across two syncs and that --check reports a clean tree (rc 0).
