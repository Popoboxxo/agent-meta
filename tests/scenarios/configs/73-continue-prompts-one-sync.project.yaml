agent-meta-version: 0.101.0
ai-providers:
- Continue
provider-options:
  Continue:
    generate-prompts: true
    prompt-mode: full
dod-preset: rapid-prototyping
platforms: []
roles:
- orchestrator
- developer
- git
project:
  name: scenario-continue-prompts-one-sync
  prefix: s73
  short: continue-prompts-one-sync
variables:
  PROJECT_NAME: scenario-continue-prompts-one-sync
  PROJECT_DESCRIPTION: One-sync convergence of Continue generate-prompts.
  PROJECT_GOAL: Verify sync.py --check exits rc 0 after exactly ONE sync with Continue generate-prompts enabled.
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/example/scenario-continue-prompts-one-sync
  GIT_MAIN_BRANCH: main
rules-preset: default
speech-mode: full
tier-preset: Normal
se-focus: false
max-parallel-agents: 2
conventions-preset: default
debug-mode: false
allow-committed-secrets: false
