agent-meta-version: 0.101.0
ai-providers:
- Opencode
dod-preset: rapid-prototyping
platforms: []
orchestrator:
  mode: strict
roles:
- orchestrator
- developer
# Read-only role: the scenario asserts that its v2 `permissions[]` keeps
# `edit: deny` (closed-world, no inherited write rights).
- explorer
plugins:
  playwright:
    enabled: true
# SPEC-OPENCODE-V2-SUPPORT-2026-10-22 (AC-T1, Amendment B1): the full v2 surface
# is opted into through the project channel only. `small-model` and the
# `theme`/`autoupdate` CLI keys are explicitly out of scope — `plugins` is the
# single documented `cli` key.
provider-options:
  Opencode:
    surface-version: v2
    experimental-todo: true
    model-variants:
      developer: high
    cli:
      plugins:
      - opencode-acme-cli
project:
  name: scenario-opencode-v2-full-surface
  prefix: s79
  short: opencode-v2-full-surface
variables:
  PROJECT_NAME: scenario-opencode-v2-full-surface
  PROJECT_DESCRIPTION: Opencode v2 full surface — experimental keys, native permissions, model variants, cli.json and the runtime-gate plugin.
  PROJECT_GOAL: Verify the complete opencode v2 option surface in one project without touching the framework registry.
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/example/scenario-opencode-v2-full-surface
  GIT_MAIN_BRANCH: main
rules-preset: default
speech-mode: full
tier-preset: Normal
se-focus: false
max-parallel-agents: 2
conventions-preset: default
debug-mode: false
allow-committed-secrets: false
