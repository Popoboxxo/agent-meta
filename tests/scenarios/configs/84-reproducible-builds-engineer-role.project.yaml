agent-meta-version: "2.0.0-beta.2"
ai-providers:
- Claude
- Opencode
dod-preset: standard
platforms: []
orchestrator:
  mode: main-chat
roles:
- orchestrator
- agent-meta-manager
- developer
- reproducible-builds-engineer
repo_containment:
  tmp-sink:
    enabled: true
    path: scratch/out
project:
  name: scenario-reproducible-builds-engineer
  prefix: s84
  short: scenario-reproducible-builds-engineer
variables:
  PROJECT_NAME: scenario-reproducible-builds-engineer
  PROJECT_DESCRIPTION: Verify the reproducible-builds-engineer role generation.
  PROJECT_GOAL: Confirm the new review role is generated, read-only and name-only addressable.
  PROJECT_LANGUAGES: Python
  COMMUNICATION_LANGUAGE: Deutsch
  USER_INPUT_LANGUAGE: Deutsch
  DOCS_LANGUAGE: Englisch
  INTERNAL_DOCS_LANGUAGE: Deutsch
  CODE_LANGUAGE: Englisch
  CODE_CONVENTIONS: '- Python PEP8'
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/example/scenario-reproducible-builds-engineer
  GIT_MAIN_BRANCH: main
rules-preset: default
speech-mode: full
tier-preset: Normal
se-focus: false
max-parallel-agents: 2
conventions-preset: default
debug-mode: false
allow-committed-secrets: false
