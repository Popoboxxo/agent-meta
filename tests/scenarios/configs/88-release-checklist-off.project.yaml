agent-meta-version: "2.0.0-beta.6"
ai-providers:
- Claude
dod-preset: rapid-prototyping
platforms: []
roles:
- orchestrator
- developer
- git
- release
project:
  name: scenario-release-checklist-off
  prefix: s88
  short: release-checklist-off
  description: Release checklist mode off keeps every generated byte identical (SPEC-RELEASE-CHECKLIST-2026-10-31, AC-REL-1).
# AC-REL-1: mode off (explicit, quoted) must render exactly like an absent
# block -- no CHECKLIST_MODE, no RELEASE_CHECKLIST_* residue in release.md.
release-checklist:
  mode: "off"
variables:
  PROJECT_GOAL: Verify mode off emits no checklist block and stays byte-identical to a config without the block.
  PROJECT_LANGUAGES: Python
  TEST_COMMAND: python3 -m pytest
  BUILD_COMMANDS: python3 -m build
  DOCS_LANGUAGE: Englisch
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/example/scenario-release-checklist-off
  GIT_MAIN_BRANCH: main
rules-preset: default
speech-mode: full
tier-preset: Normal
se-focus: false
max-parallel-agents: 2
conventions-preset: default
debug-mode: false
allow-committed-secrets: false
