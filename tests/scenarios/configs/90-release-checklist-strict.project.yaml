agent-meta-version: "2.0.0-beta.6"
ai-providers:
- Claude
dod-preset: rapid-prototyping
platforms: []
roles:
- orchestrator
- developer
- git
- release
project:
  name: scenario-release-checklist-strict
  prefix: s90
  short: release-checklist-strict
  description: Release checklist mode strict renders the boundary wording and fails on required items (SPEC-RELEASE-CHECKLIST-2026-10-31, AC-REL-7/8/24/25).
# AC-REL-7/24: strict renders the Prompt-/Konventions-Boundary wording and the
# required_failed -> STATUS failed mapping; the project item must be listed.
release-checklist:
  mode: "strict"
  items:
  - id: docker-image-pushed
    task: A tagged docker image is pushed to the registry.
    verification: The registry shows the tag for this version.
    phase: step
    required: false
    applies-when: the project ships a docker image
variables:
  PROJECT_GOAL: Verify strict mode renders the boundary wording, required_failed and the project item.
  PROJECT_LANGUAGES: Python
  TEST_COMMAND: python3 -m pytest
  BUILD_COMMANDS: python3 -m build
  DOCS_LANGUAGE: Englisch
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/example/scenario-release-checklist-strict
  GIT_MAIN_BRANCH: main
rules-preset: default
speech-mode: full
tier-preset: Normal
se-focus: false
max-parallel-agents: 2
conventions-preset: default
debug-mode: false
allow-committed-secrets: false
