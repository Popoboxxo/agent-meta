agent-meta-version: "2.0.0-beta.6"
ai-providers:
- Claude
dod-preset: rapid-prototyping
platforms:
- homeassistant
roles:
- tester
- e2e-tester
- developer
- docker
- devops-engineer
- test-executor
project:
  name: scenario-test-env-unset
  prefix: s93
  short: test-env-unset
  description: An unconfigured test environment stays byte-clean - no block, no placeholder residue, no approval protocol (SPEC-TEST-ENVIRONMENTS-2026-10-31, AC-ENV-16).
variables:
  PROJECT_GOAL: Verify an unconfigured test environment leaves no block, placeholder or approval residue.
  PROJECT_LANGUAGES: Python
  DOCS_LANGUAGE: Englisch
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/example/scenario-test-env-unset
  GIT_MAIN_BRANCH: main
rules-preset: default
speech-mode: full
tier-preset: Normal
se-focus: false
max-parallel-agents: 2
conventions-preset: default
debug-mode: false
allow-committed-secrets: false
