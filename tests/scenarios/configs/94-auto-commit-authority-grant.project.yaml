agent-meta-version: 0.101.0
ai-providers:
- Claude
- Opencode
dod-preset: standard
platforms: []
roles:
- orchestrator
- developer
- tester
- git
- documenter
- planner
auto_commit:
  mode: auto
  triggers: [task-boundary]
  authority_overrides:
    documenter:
      authority: direct
      acknowledge_full_shell: true
project:
  name: scenario-auto-commit-authority-grant
  prefix: s94
  short: scenario-authority-grant
variables:
  PROJECT_NAME: scenario-auto-commit-authority-grant
  PROJECT_DESCRIPTION: Authority grant test (issue #1181).
  PROJECT_GOAL: Verify the opt-in commit authority grant renders Bash plus the grant line on hook-capable providers, warns on hookless providers, and shrinks cleanly on withdrawal.
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/example/scenario-authority-grant
  GIT_MAIN_BRANCH: main
rules-preset: default
speech-mode: full
tier-preset: Normal
se-focus: false
max-parallel-agents: 2
conventions-preset: default
debug-mode: false
allow-committed-secrets: false
