agent-meta-version: 0.101.0
ai-providers:
- Opencode
dod-preset: rapid-prototyping
platforms: []
roles:
- orchestrator
- developer
# Position POS-2 with `mode: advisory` (issue #1190, §12.3 row `advisory x
# subagent`) — BLOCKED by #1182: a `context-profile: compact` project breaks the
# advisory mode, so this configuration is documented but NEVER executed.
#
# The scenario name deliberately does NOT start with `10`, so the `10`-prefix
# filter of tests/scenarios/run.sh never selects it (AC-29/AC-37; `run.sh` has
# no SKIP concept and none is introduced). The paired assert
# `asserts/blocked-103-advisory-subagent.sh` verifies the BLOCKED
# preconditions and is therefore never reached by the harness either.
orchestrator:
  mode: advisory
  topology: subagent
context-profile: compact
plugins:
  playwright:
    enabled: true
# v2 project channel (the `advisory x subagent` row of §12.3).
provider-options:
  Opencode:
    surface-version: v2
project:
  name: scenario-advisory-subagent
  prefix: s103
  short: advisory-subagent
variables:
  PROJECT_NAME: scenario-advisory-subagent
  PROJECT_DESCRIPTION: Opencode v2 with advisory mode and declared topology subagent (position POS-2).
  PROJECT_GOAL: Blocked by issue #1182 - advisory mode breaks with context-profile compact; not executed.
  GIT_PLATFORM: GitHub
  GIT_REMOTE_URL: https://github.com/example/scenario-advisory-subagent
  GIT_MAIN_BRANCH: main
rules-preset: default
speech-mode: full
tier-preset: Normal
se-focus: false
max-parallel-agents: 2
conventions-preset: default
debug-mode: false
allow-committed-secrets: false
